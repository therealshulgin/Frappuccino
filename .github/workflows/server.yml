name: Relay server (pytest)

# The V2 signature-domain contract (tags 0x01-0x08) is mirrored across two trees:
# the Rust source of truth (crypto-rs) and the Python relay (server). The
# cross-language KATs pin the SAME bytes on both sides —
#   crypto-rs/core/tests/auth_sig_kat.rs   <-> server/tests/test_auth_sig_kat.py   (0x01/0x02/0x03)
#   crypto-rs/core/src/report.rs (KAT)     <-> server/tests/test_report_sig_kat.py (0x07/0x08)
# so a one-sided drift in a domain tag, a signed-message layout, or a key
# derivation is only caught when both suites run (WP-E2).
#
# That is what the `paths:` filter below is for. This job runs the Python
# verifier side; it triggers on `crypto-rs/**` too, so a Rust-side crypto change
# that re-pins the vectors re-runs the relay's verification against them. The
# Rust producer side runs in rust.yml (which now also triggers on `server/**`).
# Narrowing either trigger to keep things tidy reopens the drift in silence,
# without breaking anything visible.
#
# Dormant until the repo gains a git remote at publication (8.2.5); authored and
# validated locally (`pytest server/tests -q` green) so it runs the moment CI is
# enabled.

on:
  push:
    paths:
      - 'server/**'
      - 'crypto-rs/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'crypto-rs/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: server

jobs:
  pytest:
    name: pytest (relay + cross-language KATs)
    runs-on: ubuntu-latest
    env:
      # The tests self-configure env (each KAT sets its own JWT_SECRET / temp
      # state paths), but set safe defaults so a clean runner never trips an
      # import-time config read. No secret here is real.
      JWT_SECRET: ci-test-secret-not-real
      MINIO_ACCESS_KEY: dummy
      MINIO_SECRET_KEY: dummy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        # Runtime deps + the test-only tooling (pytest, and httpx for FastAPI's
        # TestClient). Kept out of requirements.txt so the shipped image stays lean.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.3.4 httpx==0.28.1

      - name: pytest
        run: python -m pytest tests -q
