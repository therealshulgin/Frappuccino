# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
android.useAndroidX=true
android.enableJetifier=true
# There is deliberately no org.gradle.java.home here. The build needs a JDK 17
# daemon -- Android Studio ships a JBR 21, and KAPT stub generation dies under it
# with NoSuchMethodError on com.sun.tools.javac.tree.JCTree$JCImport -- but the
# path to that JDK is a property of the machine, not of the project. Hardcoding
# one made the repo unbuildable anywhere else, CI included: a Linux runner reads
# a C:/ path and stops before the first task.
#
# Where the pin lives now:
#   - CI             -> JAVA_HOME, set by actions/setup-java (see android.yml).
#   - command line   -> GRADLE_USER_HOME/gradle.properties (~/.gradle) on each dev
#                       machine whose default JAVA_HOME is not a JDK 17.
#   - Android Studio -> Settings > Build Tools > Gradle > Gradle JDK. The .idea
#                       value #GRADLE_LOCAL_JAVA_HOME defers to the property
#                       above; if the IDE falls back to its own JBR 21 instead,
#                       the KAPT error returns and this setting is the fix.
# KAPT stub generation under JDK 17+ requires these JDK internals to be exported
# (the compiler uses com.sun.tools.javac.* which is not exposed by default since
# JEP 261 / JDK 9 modules). See KT-50518, kotlinpoet#1236. Without these flags
# kaptGenerateStubs*Kotlin fails with IllegalAccessError.
org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
kotlin.daemon.jvmargs=-Xmx2048m --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
org.gradle.workers.max=1
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.experimentalR8.rewriteThrowableCauseChain=false
android.aapt2.noCompress=true
android.buildFeatures.viewBinding=false
android.aaptOptions.cruncherEnabled = false
android.aaptOptions.useNewCruncher = false
android.useResourceShrinker=false
android.enableR8.fullMode=false

