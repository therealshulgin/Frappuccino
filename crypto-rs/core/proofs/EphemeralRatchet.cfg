\* TLC configuration for EphemeralRatchet.tla (ROADMAP 8.4 item 4).
\* Small bounds keep the check exhaustive in well under a second; the invariants
\* are structural, so they hold for the real BatchSize = 50 as well.
CONSTANTS
  BatchSize = 3
  MaxBatch  = 3

SPECIFICATION Spec

\* The bounded model's terminal state (batch = MaxBatch with every slot consumed)
\* has no enabled action — that is the finite cap, not a liveness bug, so do not
\* treat it as a deadlock. The real ratchet would just advance_batch again.
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT AntiReplay
INVARIANT NoRollback
INVARIANT ConsumedWiped
INVARIANT BoundedBatch
INVARIANT RotationAlwaysPossible

PROPERTY MonotoneBatch
