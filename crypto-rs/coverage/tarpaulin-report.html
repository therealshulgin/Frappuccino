archive.identity().clone();\n    let mut blob = encrypt_single(b\"hello\", \u0026author).unwrap();\n    // Header ends at HEADER_SIZE_NO_GRANTS (= 119 for grant_count=0). The\n    // next byte is the mode — flip it to something invalid.\n    blob[HEADER_SIZE_NO_GRANTS] = 0x7f;\n    let err = decrypt(\u0026blob, \u0026archive).unwrap_err();\n    assert!(\n        format!(\"{err:?}\").contains(\"unknown mode byte\"),\n        \"expected 'unknown mode byte', got {err:?}\"\n    );\n}\n\n#[test]\nfn decrypt_single_rejects_body_too_short() {\n    let archive = archive();\n    let author = archive.identity().clone();\n    let mut blob = encrypt_single(b\"hello\", \u0026author).unwrap();\n    // Chop the body down to fewer than NONCE_BYTES + AEAD_TAG_BYTES\n    // (= 40 bytes) while keeping the header + mode byte intact.\n    let mode_off = HEADER_SIZE_NO_GRANTS; // 119\n    blob.truncate(mode_off + 1 + 10); // 10-byte body ≪ 40\n    let err = decrypt(\u0026blob, \u0026archive).unwrap_err();\n    assert!(\n        format!(\"{err:?}\").contains(\"SINGLE body too short\"),\n        \"expected 'SINGLE body too short', got {err:?}\"\n    );\n}\n\n#[test]\nfn decrypt_single_rejects_tampered_ciphertext() {\n    let archive = archive();\n    let author = archive.identity().clone();\n    let mut blob = encrypt_single(b\"the quick brown fox\", \u0026author).unwrap();\n    // Flip one byte in the ciphertext (past the mode + nonce).\n    let ct_start = HEADER_SIZE_NO_GRANTS + 1 + 24;\n    let ct_byte = ct_start + 3;\n    blob[ct_byte] ^= 0x01;\n    let err = decrypt(\u0026blob, \u0026archive).unwrap_err();\n    // AEAD failure surfaces as `CryptoError::WrongPin` (by design — the\n    // caller must not distinguish \"wrong recipient\" from \"tampered blob\").\n    assert!(\n        format!(\"{err:?}\").contains(\"WrongPin\"),\n        \"expected WrongPin after AEAD tag failure, got {err:?}\"\n    );\n}\n\n#[test]\nfn decrypt_chunked_rejects_body_too_short() {\n    let archive = archive();\n    let author = archive.identity().clone();\n    let plaintext = vec![0u8; 2 * 1024 * 1024 + 1]; // 3 chunks\n    let mut blob = encrypt_chunked(\u0026plaintext, \u0026author).unwrap();\n    // Truncate right after the mode byte — body now \u003c NONCE_PREFIX_BYTES + 4.\n    let mode_off = HEADER_SIZE_NO_GRANTS;\n    blob.truncate(mode_off + 1 + 5);\n    let err = decrypt(\u0026blob, \u0026archive).unwrap_err();\n    assert!(\n        format!(\"{err:?}\").contains(\"CHUNKED body too short\"),\n        \"expected 'CHUNKED body too short', got {err:?}\"\n    );\n}\n\n#[test]\nfn decrypt_chunked_rejects_chunk_count_over_cap() {\n    let archive = archive();\n    let author = archive.identity().clone();\n    let plaintext = vec![0u8; 2 * 1024 * 1024 + 1];\n    let mut blob = encrypt_chunked(\u0026plaintext, \u0026author).unwrap();\n    // chunk_count lives at body[NONCE_PREFIX_BYTES..+4] = blob[header+1+20..+4].\n    let cc_off = HEADER_SIZE_NO_GRANTS + 1 + NONCE_PREFIX_BYTES;\n    let bogus: u32 = 2_000_000; // \u003e MAX_CHUNK_COUNT = 1_000_000\n    blob[cc_off..cc_off + 4].copy_from_slice(\u0026bogus.to_be_bytes());\n    let err = decrypt(\u0026blob, \u0026archive).unwrap_err();\n    assert!(\n        format!(\"{err:?}\").contains(\"exceeds cap\"),\n        \"expected 'exceeds cap', got {err:?}\"\n    );\n}\n\n#[test]\nfn decrypt_chunked_rejects_missing_chunk_len() {\n    let archive = archive();\n    let author = archive.identity().clone();\n    let plaintext = vec![0u8; 2 * 1024 * 1024 + 1];\n    let mut blob = encrypt_chunked(\u0026plaintext, \u0026author).unwrap();\n    // Keep the prefix + chunk_count = 3 intact, but drop everything\n    // after. Decoder loops 0..3 and fails reading the first chunk_len.\n    let cc_off = HEADER_SIZE_NO_GRANTS + 1 + NONCE_PREFIX_BYTES;\n    blob.truncate(cc_off + 4 + 2); // only 2 stray bytes where u32 len sits\n    let err = decrypt(\u0026blob, \u0026archive).unwrap_err();\n    assert!(\n        format!(\"{err:?}\").contains(\"chunk 0: missing len\"),\n        \"expected 'chunk 0: missing len', got {err:?}\"\n    );\n}\n\n#[test]\nfn decrypt_chunked_rejects_chunk_len_over_cap() {\n    let archive = archive();\n    let author = archive.identity().clone();\n    let plaintext = vec![0u8; 2 * 1024 * 1024 + 1];\n    let mut blob = encrypt_chunked(\u0026plaintext, \u0026author).unwrap();\n    // Patch the first chunk's total_len to 0xffff_ffff (\u003e MAX_CHUNK_LEN).\n    let first_chunk_len_off = HEADER_SIZE_NO_GRANTS + 1 + NONCE_PREFIX_BYTES + 4;\n    blob[first_chunk_len_off..first_chunk_len_off + 4].copy_from_slice(\u0026u32::MAX.to_be_bytes());\n    let err = decrypt(\u0026blob, \u0026archive).unwrap_err();\n    assert!(\n        format!(\"{err:?}\").contains(\"out of range\"),\n        \"expected 'out of range', got {err:?}\"\n    );\n}\n\n#[test]\nfn decrypt_chunked_rejects_truncated_chunk_body() {\n    let archive = archive();\n    let author = archive.identity().clone();\n    let plaintext = vec![0u8; 2 * 1024 * 1024 + 1];\n    let mut blob = encrypt_chunked(\u0026plaintext, \u0026author).unwrap();\n    // Cut the blob mid-ciphertext inside the first chunk (past the\n    // first chunk's total_len + nonce but before the ct ends).\n    let first_chunk_data_off = HEADER_SIZE_NO_GRANTS + 1 + NONCE_PREFIX_BYTES + 4;\n    // Leave only 50 bytes of the first chunk body (\u003c declared total_len).\n    blob.truncate(first_chunk_data_off + 4 + 50);\n    let err = decrypt(\u0026blob, \u0026archive).unwrap_err();\n    assert!(\n        format!(\"{err:?}\").contains(\"truncated body\"),\n        \"expected 'truncated body', got {err:?}\"\n    );\n}\n","traces":[{"line":17,"address":[1519760],"length":1,"stats":{"Line":1}},{"line":18,"address":[1519774],"length":1,"stats":{"Line":1}}],"covered":2,"coverable":2},{"path":["/","work","stream","tests","e2e_protocol.rs"],"content":"//! End-to-end tests against the live V2 relay (`https://136.244.101.236:8443`).\n//!\n//! All tests are `#[ignore]` by default — run with:\n//! ```sh\n//! cargo test -p frappuccino-crypto-stream --test e2e_protocol --release -- --ignored\n//! ```\n//!\n//! Requires network connectivity to the Vultr relay. Each run generates a\n//! fresh BIP-39 mnemonic so there are no identity collisions between runs.\n//!\n//! Mirrors `stream-crypto/src/androidTest/java/.../StreamServerClientTest.kt`.\n\nuse frappuccino_crypto_core::bip39;\nuse frappuccino_crypto_core::identity::EnrollmentKit;\nuse frappuccino_crypto_core::ratchet::{EphemeralRatchet, RatchetSignature, BATCH_SIZE};\nuse frappuccino_crypto_stream::pin::PinnedCertVerifier;\nuse frappuccino_crypto_stream::{EnrollResult, StreamServerClient};\nuse rustls::ClientConfig;\nuse std::sync::Arc;\nuse std::time::Duration;\n\nconst BASE_URL: \u0026str = \"https://136.244.101.236:8443\";\nconst CHAIN_KEY_BYTES: usize = 32;\n\n// ============================================================================\n// Helpers — fresh identity + initialized ratchet\n// ============================================================================\n\nstruct FreshIdentity {\n    kit: EnrollmentKit,\n    ratchet: EphemeralRatchet,\n    batch0_pks: [[u8; 32]; BATCH_SIZE],\n    enroll_sig: [u8; 64],\n    pk_hex: String,\n}\n\nfn fresh_identity() -\u003e FreshIdentity {\n    let mnemonic = bip39::generate_fr();\n    let mut kit = EnrollmentKit::from_mnemonic(\u0026mnemonic, \"\").expect(\"kit from mnemonic\");\n\n    let mut ratchet = EphemeralRatchet::new();\n    let chain = kit.take_chain_zero().expect(\"chain_0\");\n    let mut chain_bytes = [0u8; CHAIN_KEY_BYTES];\n    chain.with_bytes(|b| chain_bytes.copy_from_slice(b));\n    ratchet.initialize(\u0026mut chain_bytes).expect(\"ratchet init\");\n\n    let batch0_pks = ratchet.batch_public_keys().expect(\"batch_0 pks\");\n    let mut concat = Vec::with_capacity(BATCH_SIZE * 32);\n    for pk in \u0026batch0_pks {\n        concat.extend_from_slice(pk);\n    }\n    let enroll_sig = kit.sign_once(\u0026concat).expect(\"sign batch_0\");\n    let pk_hex = hex::encode(kit.identity().ed25519_pk());\n\n    FreshIdentity {\n        kit,\n        ratchet,\n        batch0_pks,\n        enroll_sig,\n        pk_hex,\n    }\n}\n\n// ============================================================================\n// Flow tests\n// ============================================================================\n\n#[test]\n#[ignore = \"E2E test: requires live Vultr relay + network\"]\nfn e2e_enroll_authenticate_rotate_against_live_server() {\n    let mut ident = fresh_identity();\n    let client = StreamServerClient::new(BASE_URL).expect(\"client build\");\n\n    // 1. Enroll\n    let r = client\n        .enroll(\u0026ident.pk_hex, \u0026ident.batch0_pks, \u0026ident.enroll_sig)\n        .expect(\"enroll call\");\n    assert_eq!(r, EnrollResult::Success, \"first enroll must succeed\");\n\n    // 2. Challenge + verify on batch_0 slot 0\n    let challenge = client.challenge().expect(\"challenge\");\n    let message = challenge.message_bytes();\n    let sig0: RatchetSignature = ident\n        .ratchet\n        .sign_and_advance(\u0026message)\n        .expect(\"sign slot 0\");\n    assert_eq!(sig0.batch_number, 0);\n    assert_eq!(sig0.key_index, 0);\n\n    let nonce_hex = hex::encode(challenge.nonce);\n    let jwt = client\n        .verify(ident.kit.identity(), \u0026sig0, \u0026nonce_hex, challenge.timestamp)\n        .expect(\"verify call\");\n    let jwt = jwt.expect(\"server issued a JWT\");\n    assert!(jwt.starts_with(\"Bearer \"), \"jwt prefix: {jwt}\");\n\n    // 3. Status reflects 1 consumed slot\n    let status = client\n        .get_status(\u0026ident.pk_hex)\n        .expect(\"status call\")\n        .expect(\"status present\");\n    assert_eq!(status.batch_number, 0);\n    assert_eq!(status.consumed_count, 1);\n    assert_eq!(status.remaining_count, 49);\n    assert!(!status.revoked);\n\n    // 4. Rotate (consume slot 1 for the rotation signature)\n    let proof = ident.ratchet.advance_batch().expect(\"advance batch\");\n    assert_eq!(proof.new_batch_number, 1);\n    assert_eq!(proof.signer_batch_number, 0);\n    let rot_ok = client\n        .rotate_batch(\u0026ident.pk_hex, \u0026proof)\n        .expect(\"rotate call\");\n    assert!(rot_ok, \"rotation must succeed\");\n\n    // 5. Verify on batch_1 slot 0\n    let challenge2 = client.challenge().expect(\"challenge #2\");\n    let msg2 = challenge2.message_bytes();\n    let sig2 = ident\n        .ratchet\n        .sign_and_advance(\u0026msg2)\n        .expect(\"sign slot 0 of batch 1\");\n    assert_eq!(sig2.batch_number, 1);\n    assert_eq!(sig2.key_index, 0);\n    let jwt2 = client\n        .verify(\n            ident.kit.identity(),\n            \u0026sig2,\n            \u0026hex::encode(challenge2.nonce),\n            challenge2.timestamp,\n        )\n        .expect(\"verify batch_1\");\n    assert!(jwt2.is_some(), \"batch_1 JWT expected\");\n\n    // 6. Replay attack: stale sig from batch_0 must be refused after rotation.\n    let challenge3 = client.challenge().expect(\"challenge #3\");\n    let fake_old = RatchetSignature {\n        signature: sig0.signature,\n        ephemeral_public_key: sig0.ephemeral_public_key,\n        batch_number: 0,\n        key_index: 0,\n    };\n    let rejected = client\n        .verify(\n            ident.kit.identity(),\n            \u0026fake_old,\n            \u0026hex::encode(challenge3.nonce),\n            challenge3.timestamp,\n        )\n        .expect(\"verify should return Ok(None), not Err\");\n    assert!(rejected.is_none(), \"stale batch_0 sig must be refused\");\n\n    ident.ratchet.wipe();\n}\n\n#[test]\n#[ignore = \"E2E test: requires live Vultr relay + network\"]\nfn e2e_enroll_twice_returns_already_enrolled() {\n    let ident = fresh_identity();\n    let client = StreamServerClient::new(BASE_URL).expect(\"client\");\n\n    let r1 = client\n        .enroll(\u0026ident.pk_hex, \u0026ident.batch0_pks, \u0026ident.enroll_sig)\n        .unwrap();\n    assert_eq!(r1, EnrollResult::Success);\n\n    let r2 = client\n        .enroll(\u0026ident.pk_hex, \u0026ident.batch0_pks, \u0026ident.enroll_sig)\n        .unwrap();\n    assert_eq!(r2, EnrollResult::AlreadyEnrolled);\n}\n\n// ============================================================================\n// Defense-in-depth negative test (CRIT-01) — a wrong pin must break the\n// handshake regardless of what cert the peer presents.\n// ============================================================================\n\n#[test]\n#[ignore = \"E2E test: requires live Vultr relay + network\"]\nfn e2e_wrong_spki_pin_rejects_handshake() {\n    // Obvious 32-byte zero pin — should never match any real cert.\n    let wrong_pin_b64 = \"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\";\n    let verifier = PinnedCertVerifier::with_pin_b64(wrong_pin_b64).expect(\"wrong verifier\");\n\n    let config =\n        ClientConfig::builder_with_provider(Arc::new(rustls::crypto::ring::default_provider()))\n            .with_protocol_versions(\u0026[\u0026rustls::version::TLS13, \u0026rustls::version::TLS12])\n            .unwrap()\n            .dangerous()\n            .with_custom_certificate_verifier(Arc::new(verifier))\n            .with_no_client_auth();\n\n    let http = reqwest::blocking::Client::builder()\n        .use_preconfigured_tls(config)\n        .connect_timeout(Duration::from_secs(10))\n        .timeout(Duration::from_secs(15))\n        .build()\n        .unwrap();\n\n    // The handshake MUST fail — that's the defense-in-depth property we're\n    // asserting (wrong SPKI pin = connection refused). reqwest's error\n    // message wording varies between versions (sometimes \"tls\", sometimes\n    // just \"error sending request\"), so we only assert the failure itself.\n    let err = http\n        .get(format!(\"{BASE_URL}/auth/challenge\"))\n        .send()\n        .expect_err(\"wrong SPKI pin MUST fail\");\n    // Sanity: the error must mention the URL we tried (proves reqwest did\n    // attempt the connection, not some earlier config failure).\n    let msg = err.to_string().to_lowercase();\n    assert!(\n        msg.contains(BASE_URL.trim_start_matches(\"https://\"))\n            || msg.contains(\"tls\")\n            || msg.contains(\"certificate\")\n            || msg.contains(\"handshake\")\n            || msg.contains(\"invalid\")\n            || msg.contains(\"sending request\"),\n        \"wrong SPKI pin should surface a connection error, got: {err}\"\n    );\n}\n","traces":[{"line":37,"address":[1539322,1537600,1539272],"length":1,"stats":{"Line":1}},{"line":38,"address":[1537668],"length":1,"stats":{"Line":1}},{"line":39,"address":[1537717,1537784],"length":1,"stats":{"Line":2}},{"line":41,"address":[1537890],"length":1,"stats":{"Line":1}},{"line":42,"address":[1537950,1538023],"length":1,"stats":{"Line":2}},{"line":43,"address":[1538093],"length":1,"stats":{"Line":1}},{"line":44,"address":[1538128],"length":1,"stats":{"Line":3}},{"line":45,"address":[1538179],"length":1,"stats":{"Line":1}},{"line":47,"address":[1538248],"length":1,"stats":{"Line":1}},{"line":48,"address":[1538317],"length":1,"stats":{"Line":1}},{"line":49,"address":[1538470,1538399],"length":1,"stats":{"Line":2}},{"line":50,"address":[1538570,1539267],"length":1,"stats":{"Line":2}},{"line":52,"address":[1538604],"length":1,"stats":{"Line":1}},{"line":53,"address":[1538712],"length":1,"stats":{"Line":1}}],"covered":14,"coverable":14},{"path":["/","work","stream","tests","parity_protocol.rs"],"content":"//! Byte-exact parity tests for the V2 relay protocol request bodies against\n//! Kotlin-captured fixtures in `crypto-rs/parity-vectors/protocol/*.json`.\n//!\n//! We re-hydrate each fixture's payload into the matching Rust body type and\n//! confirm the serialized JSON is semantically equivalent (same keys, same\n//! values, same ordering within arrays). The server treats JSON as\n//! unordered at the object level, so `serde_json::Value` equality is the\n//! right granularity for interop parity.\n\nuse serde::Serialize;\nuse std::fs;\nuse std::path::PathBuf;\n\nfn fixture_dir() -\u003e PathBuf {\n    let mut p = PathBuf::from(env!(\"CARGO_MANIFEST_DIR\"));\n    p.pop();\n    p.push(\"parity-vectors\");\n    p.push(\"protocol\");\n    p\n}\n\nfn load_fixture_body(name: \u0026str) -\u003e serde_json::Value {\n    let raw =\n        fs::read_to_string(fixture_dir().join(name)).unwrap_or_else(|e| panic!(\"read {name}: {e}\"));\n    let file: serde_json::Value = serde_json::from_str(\u0026raw).unwrap();\n    file[\"body\"].clone()\n}\n\nfn serialize_to_value\u003cT: Serialize\u003e(v: \u0026T) -\u003e serde_json::Value {\n    serde_json::to_value(v).unwrap()\n}\n\n// ============================================================================\n// These helpers mirror the private wire types in `protocol.rs`. Duplicated on\n// purpose so the integration tests exercise the public hex/encode path rather\n// than rely on a testing-only re-export.\n// ============================================================================\n\n#[derive(Serialize)]\nstruct EnrollBody {\n    ed25519_pk: String,\n    batch_0_public_keys: Vec\u003cString\u003e,\n    batch_0_signature: String,\n}\n\n#[derive(Serialize)]\nstruct VerifyBody {\n    ed25519_pk: String,\n    ephemeral_pk: String,\n    batch_number: u32,\n    key_index: u32,\n    nonce: String,\n    signature: String,\n}\n\n#[derive(Serialize)]\nstruct RotateBody {\n    ed25519_pk: String,\n    signer_batch_number: u32,\n    signer_key_index: u32,\n    signer_public_key: String,\n    new_batch_public_keys: Vec\u003cString\u003e,\n    new_batch_signature: String,\n}\n\n// ============================================================================\n// Parity tests\n// ============================================================================\n\n#[test]\nfn enroll_body_byte_exact_vs_kotlin() {\n    let fixture = load_fixture_body(\"enroll_req.json\");\n\n    let pks: Vec\u003cString\u003e = fixture[\"batch_0_public_keys\"]\n        .as_array()\n        .unwrap()\n        .iter()\n        .map(|v| v.as_str().unwrap().to_string())\n        .collect();\n    assert_eq!(pks.len(), 50, \"fixture must have 50 batch_0 keys\");\n\n    let rust_body = EnrollBody {\n        ed25519_pk: fixture[\"ed25519_pk\"].as_str().unwrap().to_string(),\n        batch_0_public_keys: pks,\n        batch_0_signature: fixture[\"batch_0_signature\"].as_str().unwrap().to_string(),\n    };\n\n    assert_eq!(serialize_to_value(\u0026rust_body), fixture);\n}\n\n#[test]\nfn verify_body_byte_exact_vs_kotlin() {\n    let fixture = load_fixture_body(\"verify_req.json\");\n\n    let rust_body = VerifyBody {\n        ed25519_pk: fixture[\"ed25519_pk\"].as_str().unwrap().to_string(),\n        ephemeral_pk: fixture[\"ephemeral_pk\"].as_str().unwrap().to_string(),\n        batch_number: u32::try_from(fixture[\"batch_number\"].as_u64().unwrap()).unwrap(),\n        key_index: u32::try_from(fixture[\"key_index\"].as_u64().unwrap()).unwrap(),\n        nonce: fixture[\"nonce\"].as_str().unwrap().to_string(),\n        signature: fixture[\"signature\"].as_str().unwrap().to_string(),\n    };\n\n    assert_eq!(serialize_to_value(\u0026rust_body), fixture);\n}\n\n#[test]\nfn rotate_body_byte_exact_vs_kotlin() {\n    let fixture = load_fixture_body(\"rotate_req.json\");\n\n    let new_pks: Vec\u003cString\u003e = fixture[\"new_batch_public_keys\"]\n        .as_array()\n        .unwrap()\n        .iter()\n        .map(|v| v.as_str().unwrap().to_string())\n        .collect();\n    assert_eq!(new_pks.len(), 50, \"fixture must have 50 new_batch keys\");\n\n    let rust_body = RotateBody {\n        ed25519_pk: fixture[\"ed25519_pk\"].as_str().unwrap().to_string(),\n        signer_batch_number: u32::try_from(fixture[\"signer_batch_number\"].as_u64().unwrap())\n            .unwrap(),\n        signer_key_index: u32::try_from(fixture[\"signer_key_index\"].as_u64().unwrap()).unwrap(),\n        signer_public_key: fixture[\"signer_public_key\"].as_str().unwrap().to_string(),\n        new_batch_public_keys: new_pks,\n        new_batch_signature: fixture[\"new_batch_signature\"].as_str().unwrap().to_string(),\n    };\n\n    assert_eq!(serialize_to_value(\u0026rust_body), fixture);\n}\n\n// ============================================================================\n// Structural check: the Rust protocol module must export the 5 types the\n// public API contract promises. If any of these vanish, this breaks first.\n// ============================================================================\n\n#[test]\nfn public_types_are_exported() {\n    // These compile-only references fail to resolve if the re-exports drift.\n    fn _enroll_result_is_type() {\n        let _ = frappuccino_crypto_stream::EnrollResult::AlreadyEnrolled;\n    }\n    fn _identity_status_is_type(s: \u0026frappuccino_crypto_stream::IdentityStatus) -\u003e u32 {\n        s.batch_number\n    }\n    fn _protocol_error_is_type(_e: \u0026frappuccino_crypto_stream::ProtocolError) {}\n    fn _client_is_type(_c: \u0026frappuccino_crypto_stream::StreamServerClient) {}\n}\n","traces":[{"line":14,"address":[1526416,1526594,1526600],"length":1,"stats":{"Line":1}},{"line":15,"address":[1526430],"length":1,"stats":{"Line":1}},{"line":16,"address":[1526462],"length":1,"stats":{"Line":1}},{"line":17,"address":[1526505],"length":1,"stats":{"Line":1}},{"line":18,"address":[1526529],"length":1,"stats":{"Line":1}},{"line":19,"address":[1526563],"length":1,"stats":{"Line":1}},{"line":22,"address":[1527109,1527103,1526624],"length":1,"stats":{"Line":1}},{"line":23,"address":[1520944,1520960],"length":1,"stats":{"Line":1}},{"line":25,"address":[1526884],"length":1,"stats":{"Line":1}},{"line":26,"address":[1526960,1527053],"length":1,"stats":{"Line":2}},{"line":29,"address":[],"length":0,"stats":{"Line":3}},{"line":30,"address":[],"length":0,"stats":{"Line":3}}],"covered":12,"coverable":12},{"path":["/","work","stream","tests","parity_strm.rs"],"content":"//! Byte-exact parity tests for STRM blob decryption against the Kotlin reference.\n//!\n//! Loads fixtures from `crypto-rs/parity-vectors/strm_blobs/*.strm` produced\n//! on an Android device by `ParityVectorsDumper`, and asserts that our Rust\n//! `decrypt` recovers the original plaintext.\n//!\n//! STRM blobs contain random session keys + random nonces, so we cannot check\n//! blob bytes against Kotlin — only the decrypted plaintext. Byte-exact checks\n//! on the encrypted side are covered by the `encrypt → decrypt` internal\n//! round-trip tests below.\n\nuse frappuccino_crypto_core::identity::ArchiveIdentity;\nuse frappuccino_crypto_stream::header::{HEADER_SIZE_NO_GRANTS, NONCE_PREFIX_BYTES};\nuse frappuccino_crypto_stream::{decrypt, encrypt_chunked, encrypt_single};\nuse serde::Deserialize;\nuse sha2::{Digest, Sha256};\nuse std::fs;\nuse std::path::{Path, PathBuf};\n\nfn vectors_dir() -\u003e PathBuf {\n    // tests/ are run with CARGO_MANIFEST_DIR = crypto-rs/stream.\n    let mut p = PathBuf::from(env!(\"CARGO_MANIFEST_DIR\"));\n    p.pop();\n    p.push(\"parity-vectors\");\n    p\n}\n\n#[derive(Deserialize)]\nstruct StrmFile {\n    mnemonic: String,\n    passphrase: String,\n    cases: Vec\u003cCase\u003e,\n}\n\n#[derive(Deserialize)]\n#[allow(dead_code)] // fields kept for fixture introspection / error messages\nstruct Case {\n    filename: String,\n    mode: String,\n    plaintext_size: usize,\n    plaintext_sha256: String,\n    plaintext_hex: Option\u003cString\u003e,\n    plaintext_filename: Option\u003cString\u003e,\n    description: String,\n    blob_size: usize,\n}\n\n/// Decode the expected plaintext either from `plaintext_hex` (inline for small\n/// cases) or from a sibling `.bin` file (large cases).\nfn load_plaintext(case: \u0026Case, dir: \u0026Path) -\u003e Vec\u003cu8\u003e {\n    if let Some(hex) = \u0026case.plaintext_hex {\n        hex::decode(hex).expect(\"plaintext_hex decode\")\n    } else if let Some(name) = \u0026case.plaintext_filename {\n        fs::read(dir.join(name)).expect(\"plaintext_filename read\")\n    } else {\n        Vec::new()\n    }\n}\n\n#[test]\nfn strm_blobs_decrypt_to_expected_plaintext() {\n    let dir = vectors_dir().join(\"strm_blobs\");\n    let raw = fs::read_to_string(dir.join(\"vectors.json\")).unwrap();\n    let file: StrmFile = serde_json::from_str(\u0026raw).unwrap();\n\n    let archive = ArchiveIdentity::from_mnemonic(\u0026file.mnemonic, \u0026file.passphrase)\n        .expect(\"ArchiveIdentity from mnemonic\");\n\n    for case in \u0026file.cases {\n        // chunked_3mb.strm is .gitignored (3 MB) — skip if missing.\n        let blob_path = dir.join(\u0026case.filename);\n        if !blob_path.exists() {\n            eprintln!(\"skip missing fixture: {}\", case.filename);\n            continue;\n        }\n        let blob = fs::read(\u0026blob_path).unwrap_or_else(|e| panic!(\"read {}: {e}\", case.filename));\n        let expected = load_plaintext(case, \u0026dir);\n        assert_eq!(expected.len(), case.plaintext_size);\n\n        let (plaintext, meta) =\n            decrypt(\u0026blob, \u0026archive).unwrap_or_else(|e| panic!(\"{}: decrypt {e:?}\", case.filename));\n        assert_eq!(\n            \u0026plaintext[..],\n            expected.as_slice(),\n            \"{}: decrypted plaintext diverges from fixture\",\n            case.filename\n        );\n\n        // Note: the dumper's \"mode\" label is the caller's *intent*, not what\n        // the encoder actually picked — e.g. `single_small.strm` was produced\n        // with fileSize=-1 which falls outside `0..CHUNK_THRESHOLD` and so\n        // the encoder selected CHUNKED. The authoritative value is the mode\n        // byte inside the blob (== meta.mode) — we only sanity-check it's\n        // one of the two valid modes.\n        assert!(\n            matches!(meta.mode, 1 | 2),\n            \"{}: mode byte must be 1 or 2, got {}\",\n            case.filename,\n            meta.mode\n        );\n        // The Kotlin dumper always wrote VERSION_V1 — this is our retro-compat\n        // regression guard. If this ever fails, the legacy read path is\n        // broken and any device still holding v1 blobs will go silent.\n        assert_eq!(\n            meta.version, 1,\n            \"{}: fixture is Kotlin-produced VERSION_V1\",\n            case.filename\n        );\n\n        // SHA-256 sanity vs the fixture (redundant with byte-eq but reads better\n        // in the error message for large plaintexts).\n        let sha = hex::encode(Sha256::digest(\u0026plaintext[..]));\n        assert_eq!(sha, case.plaintext_sha256, \"{}: SHA-256\", case.filename);\n    }\n}\n\n#[test]\nfn rust_encrypt_then_rust_decrypt_roundtrip_single() {\n    let dir = vectors_dir().join(\"strm_blobs\");\n    let raw = fs::read_to_string(dir.join(\"vectors.json\")).unwrap();\n    let file: StrmFile = serde_json::from_str(\u0026raw).unwrap();\n\n    // Reuse the fixture's mnemonic to avoid bringing in EnrollmentKit here.\n    let archive = ArchiveIdentity::from_mnemonic(\u0026file.mnemonic, \u0026file.passphrase).unwrap();\n\n    // Build a StreamIdentity from the archive's public keys (both views share them).\n    let author = archive.identity().clone();\n\n    let plaintext = b\"The quick brown fox jumps over the lazy dog.\";\n    let blob = encrypt_single(plaintext, \u0026author).unwrap();\n    let (out, meta) = decrypt(\u0026blob, \u0026archive).unwrap();\n    assert_eq!(\u0026out[..], plaintext);\n    assert_eq!(meta.mode, 1);\n    assert_eq!(meta.version, 2, \"encoder must emit VERSION_V2\");\n    assert_eq!(meta.author_ed25519_pk, *author.ed25519_pk());\n}\n\n#[test]\nfn rust_encrypt_then_rust_decrypt_roundtrip_chunked() {\n    let dir = vectors_dir().join(\"strm_blobs\");\n    let raw = fs::read_to_string(dir.join(\"vectors.json\")).unwrap();\n    let file: StrmFile = serde_json::from_str(\u0026raw).unwrap();\n\n    let archive = ArchiveIdentity::from_mnemonic(\u0026file.mnemonic, \u0026file.passphrase).unwrap();\n    let author = archive.identity().clone();\n\n    // 3 chunks of 1 MiB minus a few bytes → triggers mid-chunk boundaries.\n    let plaintext: Vec\u003cu8\u003e = (0..(3 * 1024 * 1024 - 7))\n        .map(|i: usize| u8::try_from((i * 7919) \u0026 0xFF).unwrap_or(0))\n        .collect();\n    let blob = encrypt_chunked(\u0026plaintext, \u0026author).unwrap();\n    let (out, meta) = decrypt(\u0026blob, \u0026archive).unwrap();\n    assert_eq!(\u0026out[..], plaintext.as_slice());\n    assert_eq!(meta.mode, 2);\n    assert_eq!(meta.version, 2, \"encoder must emit VERSION_V2\");\n    assert_eq!(meta.plaintext_len, plaintext.len());\n}\n\n/// Truncation attack: take a well-formed v2 chunked blob, drop the last chunk\n/// from the body, and patch `chunk_count` in the body to match. In V1, this\n/// would have decrypted silently (AAD = header only, unchanged). In V2, the\n/// AAD binds the claimed `chunk_count` → the first chunk's AEAD tag fails\n/// because the authenticated `chunk_count` no longer matches the one the\n/// encoder used.\n#[test]\nfn decrypt_v2_rejects_chunk_count_truncation() {\n    let dir = vectors_dir().join(\"strm_blobs\");\n    let raw = fs::read_to_string(dir.join(\"vectors.json\")).unwrap();\n    let file: StrmFile = serde_json::from_str(\u0026raw).unwrap();\n    let archive = ArchiveIdentity::from_mnemonic(\u0026file.mnemonic, \u0026file.passphrase).unwrap();\n    let author = archive.identity().clone();\n\n    // Exactly 2 full chunks + 1 byte → 3 chunks, easy to truncate the tail.\n    let plaintext: Vec\u003cu8\u003e = vec![0x42; 2 * 1024 * 1024 + 1];\n    let blob = encrypt_chunked(\u0026plaintext, \u0026author).unwrap();\n    let (_, meta) = decrypt(\u0026blob, \u0026archive).expect(\"original blob must decrypt\");\n    assert_eq!(meta.version, 2);\n\n    // Layout (v2 chunked, 0 grants):\n    //   [0..119]        header\n    //   [119]           MODE_CHUNKED = 0x02\n    //   [120..140]      nonce_prefix (20)\n    //   [140..144]      chunk_count = 3 (BE u32)\n    //   [144..]         chunks: total_len(4) ‖ nonce(24) ‖ ct(...)\n    let header_end = HEADER_SIZE_NO_GRANTS;\n    let chunk_count_off = header_end + 1 + NONCE_PREFIX_BYTES;\n\n    // Walk past the first 2 chunks to find where chunk #3 starts.\n    let mut cursor = chunk_count_off + 4;\n    for _ in 0..2 {\n        let total_len = u32::from_be_bytes(blob[cursor..cursor + 4].try_into().unwrap()) as usize;\n        cursor += 4 + total_len;\n    }\n    // Drop chunk #3, patch chunk_count to 2.\n    let mut truncated = blob[..cursor].to_vec();\n    truncated[chunk_count_off..chunk_count_off + 4].copy_from_slice(\u00262u32.to_be_bytes());\n\n    let result = decrypt(\u0026truncated, \u0026archive);\n    assert!(\n        result.is_err(),\n        \"truncated v2 blob must fail AEAD (chunk_count bound in AAD)\"\n    );\n}\n\n#[test]\nfn decrypt_rejects_tampered_magic() {\n    let dir = vectors_dir().join(\"strm_blobs\");\n    let blob_path = dir.join(\"single_small.strm\");\n    if !blob_path.exists() {\n        return; // fixture absent (skipped)\n    }\n    let raw = fs::read_to_string(dir.join(\"vectors.json\")).unwrap();\n    let file: StrmFile = serde_json::from_str(\u0026raw).unwrap();\n    let archive = ArchiveIdentity::from_mnemonic(\u0026file.mnemonic, \u0026file.passphrase).unwrap();\n\n    let mut blob = fs::read(\u0026blob_path).unwrap();\n    blob[0] = b'X'; // corrupt magic\n    assert!(decrypt(\u0026blob, \u0026archive).is_err());\n}\n\n#[test]\nfn decrypt_rejects_wrong_recipient() {\n    let dir = vectors_dir().join(\"strm_blobs\");\n    let blob_path = dir.join(\"single_small.strm\");\n    if !blob_path.exists() {\n        return;\n    }\n    let _raw = fs::read_to_string(dir.join(\"vectors.json\")).unwrap();\n\n    // Different mnemonic → different archive identity → sealed envelope\n    // won't unseal.\n    let attacker_mn = \"bambin bambou banane bandeau banlieue banque banquise bassin bastion bataille bateau batterie\";\n    // Guard: test only runs if the decoy is actually a valid wordlist phrase.\n    let Ok(attacker_archive) = ArchiveIdentity::from_mnemonic(attacker_mn, \"\") else {\n        eprintln!(\"skip: decoy mnemonic contains unknown words\");\n        return;\n    };\n\n    let blob = fs::read(\u0026blob_path).unwrap();\n    assert!(decrypt(\u0026blob, \u0026attacker_archive).is_err());\n}\n","traces":[{"line":20,"address":[1561216,1561376,1561370],"length":1,"stats":{"Line":1}},{"line":22,"address":[1561230],"length":1,"stats":{"Line":1}},{"line":23,"address":[1561262],"length":1,"stats":{"Line":1}},{"line":24,"address":[1561305],"length":1,"stats":{"Line":1}},{"line":25,"address":[1561339],"length":1,"stats":{"Line":1}},{"line":50,"address":[1561392],"length":1,"stats":{"Line":1}},{"line":51,"address":[1561448],"length":1,"stats":{"Line":1}},{"line":52,"address":[1561506],"length":1,"stats":{"Line":1}},{"line":53,"address":[1561558,1561631],"length":1,"stats":{"Line":0}},{"line":54,"address":[1561639],"length":1,"stats":{"Line":0}},{"line":56,"address":[1561705],"length":1,"stats":{"Line":0}}],"covered":8,"coverable":11}]};

    <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: {
        covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
        coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
      },
    };
  });

  return [...folders, ...files.filter(file => file.path.length === 1)];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
    };
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener('hashchange', () => this.updateStateFromLocation(), false);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.slice(1).split('/');
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(
      ({current}) => {
        return {current: [...current, file.path[0]]};
      },
      () => this.updateHash(),
    );
  }

  back(file) {
    this.setState(
      ({current}) => {
        return {current: current.slice(0, current.length - 1)};
      },
      () => this.updateHash(),
    );
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.join('/');
    }
  }
}

function FilesList({folder, onSelectFile, onBack}) {
  let files = folder.children;
  return e(
    'div',
    {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack}),
    e(
      'table',
      {className: 'files-list'},
      e('thead', {className: 'files-list__head'}, e('tr', null, e('th', null, 'Path'), e('th', null, 'Coverage'))),
      e(
        'tbody',
        {className: 'files-list__body'},
        files.map(file => e(File, {file, onClick: onSelectFile})),
      ),
    ),
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? (file.covered / file.coverable) * 100 : -1;
  const coverageDelta =
    file.prevRun && (file.covered / file.coverable) * 100 - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'tr',
    {
      className:
        'files-list__file' +
        (coverage >= 0 && coverage < 50 ? ' files-list__file_low' : '') +
        (coverage >= 50 && coverage < 80 ? ' files-list__file_medium' : '') +
        (coverage >= 80 ? ' files-list__file_high' : '') +
        (file.is_folder ? ' files-list__file_folder' : ''),
      onClick: () => onClick(file),
    },
    e('td', null, e('a', null, pathToString(file.path))),
    e(
      'td',
      null,
      file.covered + ' / ' + file.coverable + (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
    ),
  );
}

function DisplayFile({file, onBack}) {
  return e('div', {className: 'display-file'}, e(FileHeader, {file, onBack}), e(FileContent, {file}));
}

function FileHeader({file, onBack}) {
  const coverage = (file.covered / file.coverable) * 100;
  const coverageDelta = file.prevRun && coverage - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'div',
    {className: 'file-header'},
    onBack ? e('a', {className: 'file-header__back', onClick: onBack}, 'Back') : null,
    e('div', {className: 'file-header__name'}, pathToString([...file.parent, ...file.path])),
    e(
      'div',
      {className: 'file-header__stat'},
      'Covered: ' + file.covered + ' of ' + file.coverable + (file.coverable ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
      e('input', {id: 'theme-toggle', type: 'checkbox', hidden: true}),
      e('label', {for: 'theme-toggle', id: 'theme-toggle-label'}, '🌙'),
    ),
  );
}

function FileContent({file}) {
  return e(
    'pre',
    {className: 'file-content'},
    file.content.split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const covered = trace && trace.stats.Line;
      const uncovered = trace && !trace.stats.Line;
      return e(
        'code',
        {
          className: 'code-line' + (covered ? ' code-line_covered' : '') + (uncovered ? ' code-line_uncovered' : ''),
          title: trace ? JSON.stringify(trace.stats, null, 2) : null,
        },
        line,
      );
    }),
  );
}

(function () {
  const commonPath = findCommonPath(data.files);
  const prevFilesMap = new Map();

  previousData &&
    previousData.files.forEach(file => {
      const path = file.path.slice(commonPath.length).join('/');
      prevFilesMap.set(path, file);
    });

  const files = data.files.map(file => {
    const path = file.path.slice(commonPath.length);
    const {covered = 0, coverable = 0} = prevFilesMap.get(path.join('/')) || {};
    return {
      ...file,
      path,
      parent: commonPath,
      prevRun: {covered, coverable},
    };
  });

  const children = findFolders(files);

  const root = {
    is_folder: true,
    children,
    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: {
      covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
    },
  };

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));

  const toggle = document.getElementById('theme-toggle');
  const label = document.getElementById('theme-toggle-label');
  label.textContent = '🌙';

  toggle.addEventListener('change', () => {
    if (toggle.checked) {
      document.documentElement.setAttribute('data-theme', 'dark');
      label.textContent = '☀️';
    } else {
      document.documentElement.removeAttribute('data-theme');
      label.textContent = '🌙';
    }
  });
})();
