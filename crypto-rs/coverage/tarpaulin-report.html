y_into()\n            .expect(\"nonce slice\");\n\n        // --- 1. Encrypt path: Rust reseals the same plaintext with the captured\n        //         salt + nonce and must land on the exact same bytes.\n        let blob_actual = seal_deterministic(\u0026case.pin, \u0026plaintext, \u0026salt, \u0026nonce)\n            .unwrap_or_else(|e| panic!(\"case {i}: seal_deterministic failed: {e:?}\"));\n        assert_eq!(\n            blob_actual,\n            blob_expected,\n            \"case {i}: seal_deterministic produced a different blob than Kotlin\\n\\\n             pin={:?} plaintext_len={}\",\n            case.pin,\n            plaintext.len()\n        );\n\n        // --- 2. Decrypt path: open the Kotlin-captured blob with Rust.\n        let recovered = open(\u0026case.pin, \u0026blob_expected)\n            .unwrap_or_else(|e| panic!(\"case {i}: open failed: {e:?}\"));\n        assert_eq!(\n            \u0026recovered[..],\n            plaintext.as_slice(),\n            \"case {i}: open recovered wrong plaintext\"\n        );\n    }\n}\n","traces":[{"line":24,"address":[366256,366406,366412],"length":1,"stats":{"Line":1}},{"line":25,"address":[366270],"length":1,"stats":{"Line":1}},{"line":26,"address":[366302],"length":1,"stats":{"Line":1}},{"line":27,"address":[366341],"length":1,"stats":{"Line":1}},{"line":28,"address":[366375],"length":1,"stats":{"Line":1}}],"covered":5,"coverable":5},{"path":["/","work","core","tests","parity_ratchet.rs"],"content":"//! Byte-exact parity tests for `EphemeralRatchet` against the Kotlin reference.\n//!\n//! Covers four fixture families produced by the Android dumper:\n//!\n//! 1. `ratchet/init.json`          → `batch_0` public keys + `chain_1`\n//! 2. `ratchet/sign.json`          → 2 signatures from slot 0 and 1\n//! 3. `ratchet/rotate.json`        → `RotationProof` after one `advance_batch`\n//! 4. `ratchet/blob_v2.bin`        → full V2 blob after 2 signs\n//! 5. `ratchet/blob_v1_legacy.bin` → V1 blob → must migrate to `blob_v2.bin` on re-serialize\n//!\n//! Any of these diverging = a protocol-breaking bug. All enrolled identities\n//! on the production server would become unreachable.\n\nuse frappuccino_crypto_core::ratchet::{\n    EphemeralRatchet, BATCH_SIZE, CHAIN_KEY_BYTES, OFF_CHAIN, SERIALIZED_PAYLOAD_SIZE,\n    SERIALIZED_SIZE, SERIALIZED_SIZE_V1,\n};\nuse serde::Deserialize;\nuse std::fs;\nuse std::path::PathBuf;\n\nfn vectors_dir() -\u003e PathBuf {\n    let mut p = PathBuf::from(env!(\"CARGO_MANIFEST_DIR\"));\n    p.pop();\n    p.push(\"parity-vectors\");\n    p\n}\n\nfn chain_0() -\u003e [u8; 32] {\n    // 0x00..0x1f — identical to the dumper's hardcoded value.\n    let mut c = [0u8; 32];\n    for (i, b) in c.iter_mut().enumerate() {\n        *b = u8::try_from(i).expect(\"i \u003c 32 fits in u8\");\n    }\n    c\n}\n\nfn hex_encode(bytes: \u0026[u8]) -\u003e String {\n    use std::fmt::Write;\n    let mut s = String::with_capacity(bytes.len() * 2);\n    for b in bytes {\n        let _ = write!(s, \"{b:02x}\");\n    }\n    s\n}\n\n// ============================================================================\n// init.json\n// ============================================================================\n\n#[derive(Deserialize)]\nstruct InitFile {\n    hkdf_ctx_batch_seeds: String,\n    hkdf_ctx_next_chain: String,\n    chain_0_hex: String,\n    chain_1_hex: String,\n    batch_0_public_keys_hex: Vec\u003cString\u003e,\n}\n\n#[test]\nfn ratchet_init_matches_kotlin_fixture() {\n    let raw = fs::read_to_string(vectors_dir().join(\"ratchet\").join(\"init.json\")).unwrap();\n    let v: InitFile = serde_json::from_str(\u0026raw).unwrap();\n\n    // Guard the invariants so a silent context-string drift shows up here first.\n    assert_eq!(v.hkdf_ctx_batch_seeds, \"frappuccino-v2-ratchet-batch-seeds\");\n    assert_eq!(v.hkdf_ctx_next_chain, \"frappuccino-v2-ratchet-next-chain\");\n\n    let chain0_fixture = hex::decode(\u0026v.chain_0_hex).unwrap();\n    assert_eq!(chain0_fixture, \u0026chain_0()[..]);\n    assert_eq!(v.batch_0_public_keys_hex.len(), BATCH_SIZE);\n\n    let mut r = EphemeralRatchet::new();\n    let mut c = chain_0();\n    r.initialize(\u0026mut c).unwrap();\n\n    let pks = r.batch_public_keys().unwrap();\n    for (i, expected_hex) in v.batch_0_public_keys_hex.iter().enumerate() {\n        assert_eq!(\n            hex_encode(\u0026pks[i]),\n            *expected_hex,\n            \"batch_0 public key {i} divergence\"\n        );\n    }\n\n    // chain_1 is embedded inside the next serialized blob at offset OFF_CHAIN.\n    let blob = r.serialize().unwrap();\n    let chain_1_actual = \u0026blob[OFF_CHAIN..OFF_CHAIN + CHAIN_KEY_BYTES];\n    assert_eq!(\n        hex_encode(chain_1_actual),\n        v.chain_1_hex,\n        \"chain_1 divergence\"\n    );\n}\n\n// ============================================================================\n// sign.json\n// ============================================================================\n\n#[derive(Deserialize)]\nstruct SignFile {\n    chain_0_hex: String,\n    signs: Vec\u003cSignCase\u003e,\n}\n\n#[derive(Deserialize)]\nstruct SignCase {\n    message_hex: String,\n    key_index: u32,\n    batch_number: u32,\n    ephemeral_pk_hex: String,\n    signature_hex: String,\n}\n\n#[test]\nfn ratchet_sign_matches_kotlin_fixture() {\n    let raw = fs::read_to_string(vectors_dir().join(\"ratchet\").join(\"sign.json\")).unwrap();\n    let v: SignFile = serde_json::from_str(\u0026raw).unwrap();\n\n    assert_eq!(hex::decode(\u0026v.chain_0_hex).unwrap(), \u0026chain_0()[..]);\n\n    let mut r = EphemeralRatchet::new();\n    let mut c = chain_0();\n    r.initialize(\u0026mut c).unwrap();\n\n    for (i, case) in v.signs.iter().enumerate() {\n        let msg = hex::decode(\u0026case.message_hex).unwrap();\n        let sig = r.sign_and_advance(\u0026msg).unwrap();\n        assert_eq!(\n            sig.batch_number, case.batch_number,\n            \"case {i}: batch_number\"\n        );\n        assert_eq!(sig.key_index, case.key_index, \"case {i}: key_index\");\n        assert_eq!(\n            hex_encode(\u0026sig.ephemeral_public_key),\n            case.ephemeral_pk_hex,\n            \"case {i}: ephemeral_pk\"\n        );\n        assert_eq!(\n            hex_encode(\u0026sig.signature),\n            case.signature_hex,\n            \"case {i}: signature bytes differ from libsodium (Ed25519 must be deterministic)\"\n        );\n    }\n}\n\n// ============================================================================\n// rotate.json\n// ============================================================================\n\n#[derive(Deserialize)]\nstruct RotateFile {\n    chain_0_hex: String,\n    signer_batch_number: u32,\n    signer_key_index: u32,\n    signer_pk_hex: String,\n    new_batch_number: u32,\n    new_batch_signature_hex: String,\n    new_batch_public_keys_hex: Vec\u003cString\u003e,\n}\n\n#[test]\nfn ratchet_rotate_matches_kotlin_fixture() {\n    let raw = fs::read_to_string(vectors_dir().join(\"ratchet\").join(\"rotate.json\")).unwrap();\n    let v: RotateFile = serde_json::from_str(\u0026raw).unwrap();\n\n    assert_eq!(hex::decode(\u0026v.chain_0_hex).unwrap(), \u0026chain_0()[..]);\n\n    let mut r = EphemeralRatchet::new();\n    let mut c = chain_0();\n    r.initialize(\u0026mut c).unwrap();\n    let proof = r.advance_batch().unwrap();\n\n    assert_eq!(proof.signer_batch_number, v.signer_batch_number);\n    assert_eq!(proof.signer_key_index, v.signer_key_index);\n    assert_eq!(hex_encode(\u0026proof.signer_public_key), v.signer_pk_hex);\n    assert_eq!(proof.new_batch_number, v.new_batch_number);\n\n    assert_eq!(v.new_batch_public_keys_hex.len(), BATCH_SIZE);\n    for (i, expected) in v.new_batch_public_keys_hex.iter().enumerate() {\n        assert_eq!(\n            hex_encode(\u0026proof.new_batch_public_keys[i]),\n            *expected,\n            \"new_batch_public_keys[{i}] divergence\"\n        );\n    }\n\n    // Signature over concat(new_batch_public_keys) must also be byte-identical.\n    assert_eq!(\n        hex_encode(\u0026proof.signature),\n        v.new_batch_signature_hex,\n        \"rotation signature byte-exact check failed\"\n    );\n\n    // After a single slot consumed for rotation, the ratchet is on batch 1\n    // with 50 fresh slots available.\n    assert_eq!(r.batch_number(), 1);\n    assert_eq!(r.remaining_in_batch(), BATCH_SIZE);\n}\n\n// ============================================================================\n// blob_v2.bin + blob_v1_legacy.bin\n// ============================================================================\n\n#[test]\nfn ratchet_blob_v2_matches_kotlin_fixture() {\n    // The Kotlin dumper produced blob_v2 after initialize(chain_0) + 2 signs.\n    let expected = fs::read(vectors_dir().join(\"ratchet\").join(\"blob_v2.bin\")).unwrap();\n    assert_eq!(\n        expected.len(),\n        SERIALIZED_SIZE,\n        \"fixture must be 4876 bytes\"\n    );\n\n    let mut r = EphemeralRatchet::new();\n    let mut c = chain_0();\n    r.initialize(\u0026mut c).unwrap();\n    r.sign_and_advance(b\"first\").unwrap();\n    r.sign_and_advance(b\"second\").unwrap();\n    let actual = r.serialize().unwrap();\n\n    assert_eq!(actual.len(), SERIALIZED_SIZE);\n    // Compare payload and MAC separately for a better error message if they diverge.\n    assert_eq!(\n        \u0026actual[..SERIALIZED_PAYLOAD_SIZE],\n        \u0026expected[..SERIALIZED_PAYLOAD_SIZE],\n        \"V2 payload (version, batch_num, mask, chain, 50 slots) divergence\"\n    );\n    assert_eq!(\n        \u0026actual[SERIALIZED_PAYLOAD_SIZE..],\n        \u0026expected[SERIALIZED_PAYLOAD_SIZE..],\n        \"V2 MAC divergence (HKDF or HMAC path differs from Kotlin)\"\n    );\n}\n\n#[test]\nfn ratchet_blob_v1_legacy_migrates_to_v2() {\n    let v1 = fs::read(vectors_dir().join(\"ratchet\").join(\"blob_v1_legacy.bin\")).unwrap();\n    assert_eq!(v1.len(), SERIALIZED_SIZE_V1);\n    assert_eq!(v1[0], 1, \"V1 blob must carry version byte 0x01\");\n\n    let v2_expected = fs::read(vectors_dir().join(\"ratchet\").join(\"blob_v2.bin\")).unwrap();\n\n    let r = EphemeralRatchet::deserialize(\u0026v1).unwrap();\n    let migrated = r.serialize().unwrap();\n    assert_eq!(\n        migrated, v2_expected,\n        \"V1 → V2 migration must produce byte-identical V2 blob\"\n    );\n}\n","traces":[{"line":22,"address":[432924,432768,432918],"length":1,"stats":{"Line":1}},{"line":23,"address":[432782],"length":1,"stats":{"Line":1}},{"line":24,"address":[432814],"length":1,"stats":{"Line":1}},{"line":25,"address":[432853],"length":1,"stats":{"Line":1}},{"line":26,"address":[432887],"length":1,"stats":{"Line":1}},{"line":29,"address":[432944],"length":1,"stats":{"Line":1}},{"line":31,"address":[432961],"length":1,"stats":{"Line":1}},{"line":32,"address":[433201,432978],"length":1,"stats":{"Line":2}},{"line":33,"address":[433150],"length":1,"stats":{"Line":1}},{"line":35,"address":[433216],"length":1,"stats":{"Line":1}},{"line":38,"address":[433264,433693,433699],"length":1,"stats":{"Line":1}},{"line":40,"address":[433310,433374],"length":1,"stats":{"Line":1}},{"line":41,"address":[433353,433438],"length":1,"stats":{"Line":2}},{"line":42,"address":[433585,433517],"length":1,"stats":{"Line":2}},{"line":44,"address":[433551],"length":1,"stats":{"Line":1}}],"covered":15,"coverable":15},{"path":["/","work","core","tests","pin_store_errors.rs"],"content":"//! Error-path coverage for `pin_store::open_extended` and `seal_with_key`.\n//!\n//! The happy-path tests in `pin_store.rs` already cover `open` and `seal`\n//! fully; the fast-reseal API (`open_extended` + `seal_with_key`) had\n//! identical guard clauses that weren't exercised.\n\nuse frappuccino_crypto_core::pin_store;\n\n#[test]\nfn open_extended_rejects_empty_pin() {\n    let err = pin_store::open_extended(\"\", \u0026[0u8; 100]).unwrap_err();\n    assert!(format!(\"{err:?}\").contains(\"EmptyInput\"));\n}\n\n#[test]\nfn open_extended_rejects_short_blob() {\n    let err = pin_store::open_extended(\"123456\", \u0026[0u8; 10]).unwrap_err();\n    assert!(format!(\"{err:?}\").contains(\"blob too short\"), \"got {err:?}\");\n}\n\n#[test]\nfn open_extended_rejects_wrong_version_byte() {\n    // Valid shape (header + tag-sized ciphertext), wrong version byte.\n    let mut blob = vec![0u8; 1 + 16 + 24 + 16]; // version + salt + nonce + tag\n    blob[0] = 0xFE; // not VERSION = 0x01\n    let err = pin_store::open_extended(\"123456\", \u0026blob).unwrap_err();\n    assert!(\n        format!(\"{err:?}\").contains(\"unsupported version byte\"),\n        \"got {err:?}\"\n    );\n}\n\n#[test]\nfn open_extended_rejects_wrong_pin() {\n    // Seal with one pin, try to open with another.\n    let sealed = pin_store::seal(\"111111\", b\"payload\").unwrap();\n    let err = pin_store::open_extended(\"999999\", \u0026sealed).unwrap_err();\n    assert!(format!(\"{err:?}\").contains(\"WrongPin\"));\n}\n\n#[test]\nfn open_extended_roundtrip_then_seal_with_key() {\n    // Happy path so the `Ok` branch (lines around 271) is covered: seal,\n    // open_extended, re-seal using the derived key (no new Argon2id).\n    let sealed = pin_store::seal(\"424242\", b\"state\").unwrap();\n    let (plaintext, derived_key, salt) = pin_store::open_extended(\"424242\", \u0026sealed).unwrap();\n    assert_eq!(\u0026plaintext[..], b\"state\");\n\n    // Re-seal with the same key/salt — no PIN re-derivation.\n    let resealed = pin_store::seal_with_key(\u0026derived_key, \u0026salt, b\"new state\").unwrap();\n    // The new blob opens with the same PIN because the derived key/salt match.\n    let plaintext2 = pin_store::open(\"424242\", \u0026resealed).unwrap();\n    assert_eq!(\u0026plaintext2[..], b\"new state\");\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","work","core","tests","ratchet_errors.rs"],"content":"//! Error-path coverage for `EphemeralRatchet`.\n//!\n//! Complements the happy-path tests in `ratchet.rs` and the `fuzz_ratchet_deserialize`\n//! harness. Targets the explicit `return Err(…)` branches so `cargo tarpaulin`\n//! visits every guard.\n\nuse frappuccino_crypto_core::identity::EnrollmentKit;\nuse frappuccino_crypto_core::ratchet::{EphemeralRatchet, BATCH_SIZE, CHAIN_KEY_BYTES};\nuse frappuccino_crypto_core::CryptoError;\n\nconst MN: \u0026str = \"abaisser abandon abdiquer abeille abolir aborder aboutir aboyer abrasif abreuver abriter abroger\";\n\nfn fresh_ratchet() -\u003e EphemeralRatchet {\n    let mut kit = EnrollmentKit::from_mnemonic(MN, \"\").unwrap();\n    let chain = kit.take_chain_zero().unwrap();\n    let mut chain_bytes = [0u8; CHAIN_KEY_BYTES];\n    chain.with_bytes(|b| chain_bytes.copy_from_slice(b));\n    let mut r = EphemeralRatchet::new();\n    r.initialize(\u0026mut chain_bytes).unwrap();\n    r\n}\n\n// ---------- init / state guards ------------------------------------------\n\n#[test]\nfn initialize_rejects_double_init() {\n    let mut r = fresh_ratchet();\n    let mut chain = [0u8; CHAIN_KEY_BYTES];\n    let err = r.initialize(\u0026mut chain).unwrap_err();\n    assert!(\n        matches!(err, CryptoError::DerivationFailed(_)),\n        \"expected DerivationFailed, got {err:?}\"\n    );\n}\n\n#[test]\nfn sign_before_initialize_rejected() {\n    let mut r = EphemeralRatchet::new();\n    let err = r.sign_and_advance(b\"x\").unwrap_err();\n    assert!(\n        matches!(err, CryptoError::DerivationFailed(_)),\n        \"expected DerivationFailed, got {err:?}\"\n    );\n}\n\n#[test]\nfn advance_batch_before_initialize_rejected() {\n    let mut r = EphemeralRatchet::new();\n    let err = r.advance_batch().unwrap_err();\n    assert!(\n        matches!(err, CryptoError::DerivationFailed(_)),\n        \"expected DerivationFailed, got {err:?}\"\n    );\n}\n\n#[test]\nfn serialize_before_initialize_rejected() {\n    let r = EphemeralRatchet::new();\n    let err = r.serialize().unwrap_err();\n    assert!(\n        matches!(err, CryptoError::DerivationFailed(_)),\n        \"expected DerivationFailed, got {err:?}\"\n    );\n}\n\n#[test]\nfn batch_public_keys_before_initialize_rejected() {\n    let r = EphemeralRatchet::new();\n    assert!(r.batch_public_keys().is_err());\n}\n\n#[test]\nfn public_key_at_out_of_range_rejected() {\n    let r = fresh_ratchet();\n    let err = r.public_key_at(BATCH_SIZE).unwrap_err();\n    assert!(matches!(err, CryptoError::DerivationFailed(_)));\n    let err2 = r.public_key_at(1000).unwrap_err();\n    assert!(matches!(err2, CryptoError::DerivationFailed(_)));\n}\n\n#[test]\nfn is_consumed_out_of_range_rejected() {\n    let r = fresh_ratchet();\n    let err = r.is_consumed(BATCH_SIZE).unwrap_err();\n    assert!(matches!(err, CryptoError::DerivationFailed(_)));\n}\n\n#[test]\nfn batch_exhausted_returns_error() {\n    let mut r = fresh_ratchet();\n    // Consume every slot (exhausts batch, no rotation).\n    for _ in 0..BATCH_SIZE {\n        r.sign_and_advance(b\"msg\").unwrap();\n    }\n    let err = r.sign_and_advance(b\"msg\").unwrap_err();\n    assert!(matches!(err, CryptoError::DerivationFailed(_)));\n}\n\n// ---------- deserialize error paths --------------------------------------\n\n#[test]\nfn deserialize_empty_blob_rejected() {\n    let err = EphemeralRatchet::deserialize(\u0026[]).unwrap_err();\n    assert!(matches!(err, CryptoError::InvalidBlob(_)));\n}\n\n#[test]\nfn deserialize_unknown_version_byte_rejected() {\n    let mut blob = vec![0xFFu8; 4876];\n    blob[0] = 0x99; // neither V1 nor V2\n    let err = EphemeralRatchet::deserialize(\u0026blob).unwrap_err();\n    let s = format!(\"{err:?}\");\n    assert!(\n        s.contains(\"unsupported version\"),\n        \"expected 'unsupported version', got {s}\"\n    );\n}\n\n#[test]\nfn deserialize_v2_wrong_size_rejected() {\n    let mut blob = vec![0u8; 100]; // way too short\n    blob[0] = 0x02; // V2\n    let err = EphemeralRatchet::deserialize(\u0026blob).unwrap_err();\n    let s = format!(\"{err:?}\");\n    assert!(s.contains(\"V2 size mismatch\"), \"got {s}\");\n}\n\n#[test]\nfn deserialize_v1_wrong_size_rejected() {\n    let mut blob = vec![0u8; 100]; // too short for V1\n    blob[0] = 0x01; // V1\n    let err = EphemeralRatchet::deserialize(\u0026blob).unwrap_err();\n    let s = format!(\"{err:?}\");\n    assert!(s.contains(\"V1 size mismatch\"), \"got {s}\");\n}\n\n#[test]\nfn deserialize_v2_mac_mismatch_rejected() {\n    let r = fresh_ratchet();\n    let mut blob = r.serialize().unwrap();\n    // Flip a byte inside the payload — the MAC no longer covers it.\n    blob[50] ^= 0x01;\n    let err = EphemeralRatchet::deserialize(\u0026blob).unwrap_err();\n    assert!(matches!(\n        err,\n        CryptoError::InvalidBlob(_) | CryptoError::InvalidSignature\n    ));\n}\n","traces":[{"line":13,"address":[301777,301783,301280],"length":1,"stats":{"Line":1}},{"line":14,"address":[301312],"length":1,"stats":{"Line":1}},{"line":15,"address":[301388,301448],"length":1,"stats":{"Line":2}},{"line":16,"address":[301504],"length":1,"stats":{"Line":1}},{"line":17,"address":[298704,298728],"length":1,"stats":{"Line":3}},{"line":18,"address":[301590],"length":1,"stats":{"Line":1}},{"line":19,"address":[301609,301685],"length":1,"stats":{"Line":2}},{"line":20,"address":[301732],"length":1,"stats":{"Line":1}}],"covered":8,"coverable":8},{"path":["/","work","ffi","build.rs"],"content":"//! Generate `UniFFI` scaffolding from the UDL file at build time.\n//! The resulting Rust code is injected into `lib.rs` via `uniffi::include_scaffolding!`.\n\nfn main() {\n    uniffi::generate_scaffolding(\"src/frappuccino.udl\")\n        .expect(\"UniFFI scaffolding generation failed\");\n    println!(\"cargo:rerun-if-changed=src/frappuccino.udl\");\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","work","ffi","src","bin","uniffi-bindgen.rs"],"content":"//! `uniffi-bindgen` CLI — generates Kotlin (and later Swift, Python) bindings\n//! from the `frappuccino.udl` file or from the compiled library.\n//!\n//! Usage (from crypto-rs/):\n//!   cargo run --bin uniffi-bindgen -- \\\n//!       generate --library ../target/aarch64-linux-android/release/libfrappuccino_crypto_ffi.so \\\n//!       --language kotlin \\\n//!       --out-dir ../../mobile/build/generated/source/uniffi\n//!\n//! Or from the UDL file directly (host dev, no .so needed):\n//!   cargo run --bin uniffi-bindgen -- \\\n//!       generate src/frappuccino.udl --language kotlin --out-dir \u003cdir\u003e\n\nfn main() {\n    uniffi::uniffi_bindgen_main();\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","work","ffi","src","lib.rs"],"content":"//! `frappuccino-crypto-ffi` — `UniFFI` surface exposing the Rust crypto core\n//! to Android Kotlin (and later iOS Swift, Python via CLI).\n//!\n//! S8a scope: full BIP-39 + `PinStore` + Identity + Ratchet surface for the\n//! core crate.\n//! S8b scope: STRM `encrypt` / `decrypt` and V2 relay client\n//! (`StreamServerClient`).\n//!\n//! # Design notes\n//!\n//! * All secret material stays *inside* Rust. FFI calls that surface session\n//!   keys (e.g. [`ArchiveIdentity::decrypt_session_key`]) return `Vec\u003cu8\u003e`\n//!   copies — Kotlin is expected to zeroize its own `ByteArray` after use. We\n//!   did the same in the Kotlin original, so no regression.\n//! * `EnrollmentKit` is wrapped in `Mutex\u003cOption\u003c_\u003e\u003e` so the one-shot semantics\n//!   (`take_chain_into_ratchet`, `close()`) can be enforced across FFI —\n//!   `Arc\u003cSelf\u003e` is `Send + Sync` without giving up `\u0026mut self` semantics.\n//! * `EphemeralRatchet` similarly wraps in `Mutex\u003c_\u003e` for the same reason —\n//!   `sign_and_advance` + `advance_batch` need `\u0026mut self`.\n//!\n//! Note on lint overrides: the `UniFFI`-generated scaffolding emits\n//! `#[no_mangle]` functions and statics with the Rust ABI so the Kotlin\n//! bindings can link against them. We silence the related lints crate-wide\n//! rather than scattering `#[allow]` around generated code we don't control.\n#![allow(clippy::no_mangle_with_rust_abi)]\n#![allow(clippy::empty_line_after_doc_comments)]\n#![allow(unsafe_code)]\n\nuse std::sync::{Arc, Mutex};\n\nuse frappuccino_crypto_core::bip39::{self as core_bip39, Language};\nuse frappuccino_crypto_core::identity as core_identity;\nuse frappuccino_crypto_core::pin_store as core_pin_store;\nuse frappuccino_crypto_core::ratchet as core_ratchet;\nuse frappuccino_crypto_core::CryptoError as CoreCryptoError;\nuse frappuccino_crypto_stream::decrypt::decrypt as strm_core_decrypt;\nuse frappuccino_crypto_stream::encrypt::encrypt as strm_core_encrypt;\nuse frappuccino_crypto_stream::{\n    DecryptError as StreamDecryptError, EncryptError as StreamEncryptError,\n    ProtocolError as StreamProtocolError,\n};\n\nuniffi::include_scaffolding!(\"frappuccino\");\n\nconst CHAIN_KEY_BYTES: usize = 32;\n\n// ============================================================================\n// Errors\n// ============================================================================\n\n/// Error mapped across the `UniFFI` boundary. Mirrors `CryptoError` variants\n/// that Kotlin needs to distinguish, plus an `Internal` catch-all for FFI-only\n/// failure modes (poisoned mutex, slice→array length mismatch).\n#[derive(Debug, thiserror::Error)]\npub enum FfiError {\n    #[error(\"unknown BIP-39 word: '{word}' (language={language})\")]\n    InvalidMnemonicWord { word: String, language: String },\n    #[error(\"invalid mnemonic: {detail}\")]\n    InvalidMnemonic { detail: String },\n    #[error(\"derivation failed: {detail}\")]\n    DerivationFailed { detail: String },\n    #[error(\"empty input\")]\n    EmptyInput,\n    #[error(\"resource '{resource}' already consumed\")]\n    AlreadyConsumed { resource: String },\n    #[error(\"ed25519 signature verification failed\")]\n    InvalidSignature,\n    #[error(\"PIN verification failed\")]\n    WrongPin,\n    #[error(\"invalid blob: {detail}\")]\n    InvalidBlob { detail: String },\n    #[error(\"network error: {detail}\")]\n    Network { detail: String },\n    #[error(\"internal FFI error: {detail}\")]\n    Internal { detail: String },\n}\n\nimpl From\u003cCoreCryptoError\u003e for FfiError {\n    fn from(e: CoreCryptoError) -\u003e Self {\n        match e {\n            CoreCryptoError::InvalidMnemonicWord { word, language } =\u003e Self::InvalidMnemonicWord {\n                word,\n                language: language.to_string(),\n            },\n            CoreCryptoError::InvalidMnemonic(m) =\u003e Self::InvalidMnemonic { detail: m },\n            CoreCryptoError::DerivationFailed(m) =\u003e Self::DerivationFailed { detail: m },\n            CoreCryptoError::EmptyInput =\u003e Self::EmptyInput,\n            CoreCryptoError::AlreadyConsumed(r) =\u003e Self::AlreadyConsumed {\n                resource: r.to_string(),\n            },\n            CoreCryptoError::InvalidSignature =\u003e Self::InvalidSignature,\n            CoreCryptoError::WrongPin =\u003e Self::WrongPin,\n            CoreCryptoError::InvalidBlob(m) =\u003e Self::InvalidBlob { detail: m },\n        }\n    }\n}\n\nimpl From\u003cStreamDecryptError\u003e for FfiError {\n    fn from(e: StreamDecryptError) -\u003e Self {\n        match e {\n            StreamDecryptError::Core(c) =\u003e Self::from(c),\n            StreamDecryptError::Malformed(m) =\u003e Self::InvalidBlob { detail: m },\n        }\n    }\n}\n\nimpl From\u003cStreamEncryptError\u003e for FfiError {\n    fn from(e: StreamEncryptError) -\u003e Self {\n        match e {\n            StreamEncryptError::Core(c) =\u003e Self::from(c),\n            // XChaCha20-Poly1305 encrypt failures are bounded-RAM only;\n            // surfacing as Internal keeps Kotlin callers from needing to\n            // special-case a never-in-practice branch.\n            StreamEncryptError::Aead(m) =\u003e Self::Internal {\n                detail: format!(\"AEAD encrypt: {m}\"),\n            },\n            // MAX_CHUNK_COUNT × CHUNK_SIZE ≈ 1 TiB — hitting this means\n            // the caller is streaming something pathological; surface as\n            // Internal so the upload pipeline logs and drops the job.\n            StreamEncryptError::TooLarge { chunks, max } =\u003e Self::Internal {\n                detail: format!(\"plaintext {chunks} chunks exceeds cap {max}\"),\n            },\n        }\n    }\n}\n\nimpl From\u003cStreamProtocolError\u003e for FfiError {\n    fn from(e: StreamProtocolError) -\u003e Self {\n        match e {\n            StreamProtocolError::Http(h) =\u003e Self::Network {\n                detail: h.to_string(),\n            },\n            StreamProtocolError::Json(j) =\u003e Self::Network {\n                detail: format!(\"json: {j}\"),\n            },\n            StreamProtocolError::Tls(t) =\u003e Self::Network {\n                detail: format!(\"tls: {t}\"),\n            },\n            StreamProtocolError::Invalid(m) =\u003e Self::InvalidBlob { detail: m },\n        }\n    }\n}\n\nfn lock_poisoned() -\u003e FfiError {\n    FfiError::Internal {\n        detail: \"mutex poisoned\".to_string(),\n    }\n}\n\n// ============================================================================\n// Smoke-test API (stable for S0 RustSmokeTest.kt)\n// ============================================================================\n\n/// Smoke-test API: returns a fixed string. Kotlin side asserts this value\n/// in `mobile/src/androidTestRust/.../rust/RustSmokeTest.kt`.\n#[must_use]\npub fn hello_world() -\u003e String {\n    \"hello from rust via uniffi (S0)\".to_string()\n}\n\n/// Delegates to the core crate so the smoke test proves cross-crate linking\n/// inside the workspace works end-to-end.\n#[must_use]\npub fn core_version() -\u003e String {\n    frappuccino_crypto_core::version().to_string()\n}\n\n// ============================================================================\n// BIP-39\n// ============================================================================\n\n/// Fresh 12-word FR mnemonic using OS entropy. Kotlin gets an owned String;\n/// the Rust-side `Zeroizing` wipes the backing memory when the FFI scaffolding\n/// copies it out.\n#[must_use]\npub fn bip39_generate_fr() -\u003e String {\n    (*core_bip39::generate_fr()).clone()\n}\n\n/// Normalize a single word against the FR wordlist.\n///\n/// # Errors\n/// [`FfiError::InvalidMnemonicWord`] if the input (after NFD + trim +\n/// lowercase + canonical-prefix) doesn't resolve to a known word.\npub fn bip39_normalize_word_fr(input: \u0026str) -\u003e Result\u003cString, FfiError\u003e {\n    core_bip39::normalize_word(input, Language::French).map_err(FfiError::from)\n}\n\n/// Validate a full 12-word FR mnemonic (structure + checksum + known words).\n///\n/// # Errors\n/// Any variant of [`FfiError`] matching the underlying [`CoreCryptoError`].\npub fn bip39_validate_fr(mnemonic: \u0026str) -\u003e Result\u003c(), FfiError\u003e {\n    core_bip39::validate(mnemonic, Language::French).map_err(FfiError::from)\n}\n\n// ============================================================================\n// Pin store\n// ============================================================================\n\n/// Encrypt `plaintext` under a PIN — Argon2id m=256 MiB / t=4 + XChaCha20-Poly1305.\n///\n/// # Errors\n/// [`FfiError::EmptyInput`] on empty PIN, [`FfiError::DerivationFailed`] on\n/// Argon2 failure (OOM).\npub fn pin_store_seal(pin: \u0026str, plaintext: \u0026[u8]) -\u003e Result\u003cVec\u003cu8\u003e, FfiError\u003e {\n    core_pin_store::seal(pin, plaintext).map_err(FfiError::from)\n}\n\n/// Decrypt a blob produced by [`pin_store_seal`]. Returns the plaintext.\n///\n/// Kotlin is expected to zero the returned `ByteArray` as soon as it's done.\n///\n/// # Errors\n/// [`FfiError::WrongPin`] for bad PIN / tampered blob (deliberately\n/// ambiguous — feed the lockout tracker), [`FfiError::InvalidBlob`] for\n/// structural problems (wrong version byte, too short).\npub fn pin_store_open(pin: \u0026str, blob: \u0026[u8]) -\u003e Result\u003cVec\u003cu8\u003e, FfiError\u003e {\n    core_pin_store::open(pin, blob)\n        .map(|z| z.to_vec())\n        .map_err(FfiError::from)\n}\n\n/// Plain-data record returned by [`pin_store_open_extended`]. Kotlin dict\n/// with the same field names — `derived_key` is 32 bytes of SECRET material,\n/// callers must zero the `ByteArray` once resealing sessions end.\n#[derive(Debug, Clone)]\npub struct UnsealedBlob {\n    pub plaintext: Vec\u003cu8\u003e,\n    pub derived_key: Vec\u003cu8\u003e,\n    pub salt: Vec\u003cu8\u003e,\n}\n\n/// Fast-reseal companion to [`pin_store_open`]. Returns the plaintext along\n/// with the Argon2id-derived key + salt so subsequent reseals (e.g. ratchet\n/// after each sign) can run via [`pin_store_seal_with_key`] in ~µs.\n///\n/// # Errors\n/// Same as [`pin_store_open`].\npub fn pin_store_open_extended(pin: \u0026str, blob: \u0026[u8]) -\u003e Result\u003cUnsealedBlob, FfiError\u003e {\n    let (plaintext, derived_key, salt) =\n        core_pin_store::open_extended(pin, blob).map_err(FfiError::from)?;\n    Ok(UnsealedBlob {\n        plaintext: plaintext.to_vec(),\n        derived_key: derived_key.to_vec(),\n        salt: salt.to_vec(),\n    })\n}\n\n/// Fast reseal using a previously-obtained Argon2id derived key + salt.\n///\n/// # Errors\n/// [`FfiError::InvalidBlob`] if `derived_key` is not 32 bytes or `salt` is\n/// not 16 bytes.\npub fn pin_store_seal_with_key(\n    derived_key: \u0026[u8],\n    salt: \u0026[u8],\n    plaintext: \u0026[u8],\n) -\u003e Result\u003cVec\u003cu8\u003e, FfiError\u003e {\n    let key: [u8; 32] = derived_key.try_into().map_err(|_| FfiError::InvalidBlob {\n        detail: format!(\"derived_key must be 32 bytes, got {}\", derived_key.len()),\n    })?;\n    let salt_arr: [u8; 16] = salt.try_into().map_err(|_| FfiError::InvalidBlob {\n        detail: format!(\"salt must be 16 bytes, got {}\", salt.len()),\n    })?;\n    core_pin_store::seal_with_key(\u0026key, \u0026salt_arr, plaintext).map_err(FfiError::from)\n}\n\n// ============================================================================\n// StreamIdentity\n// ============================================================================\n\n/// FFI wrapper holding a `core::identity::StreamIdentity`. Immutable after\n/// construction, so no lock needed.\n#[derive(Debug)]\npub struct StreamIdentity {\n    inner: core_identity::StreamIdentity,\n}\n\nimpl StreamIdentity {\n    /// Rebuild an identity from persisted public keys.\n    ///\n    /// # Errors\n    /// [`FfiError::InvalidBlob`] if either key isn't 32 bytes.\n    pub fn from_public_keys(ed25519_pk: \u0026[u8], x25519_pk: \u0026[u8]) -\u003e Result\u003cSelf, FfiError\u003e {\n        let ed_arr: [u8; 32] = ed25519_pk.try_into().map_err(|_| FfiError::InvalidBlob {\n            detail: format!(\"ed25519_pk must be 32 bytes, got {}\", ed25519_pk.len()),\n        })?;\n        let x_arr: [u8; 32] = x25519_pk.try_into().map_err(|_| FfiError::InvalidBlob {\n            detail: format!(\"x25519_pk must be 32 bytes, got {}\", x25519_pk.len()),\n        })?;\n        Ok(Self {\n            inner: core_identity::StreamIdentity::from_public_keys(ed_arr, x_arr),\n        })\n    }\n\n    #[must_use]\n    pub fn ed25519_pk(\u0026self) -\u003e Vec\u003cu8\u003e {\n        self.inner.ed25519_pk().to_vec()\n    }\n\n    #[must_use]\n    pub fn x25519_pk(\u0026self) -\u003e Vec\u003cu8\u003e {\n        self.inner.x25519_pk().to_vec()\n    }\n\n    #[must_use]\n    pub fn ed25519_pk_hex(\u0026self) -\u003e String {\n        self.inner.ed25519_pk_hex()\n    }\n\n    #[must_use]\n    pub fn readable_fingerprint(\u0026self) -\u003e String {\n        self.inner.readable_fingerprint()\n    }\n\n    /// # Errors\n    /// [`FfiError::InvalidSignature`] on bad length or verify failure.\n    pub fn verify(\u0026self, message: \u0026[u8], signature: \u0026[u8]) -\u003e Result\u003c(), FfiError\u003e {\n        let sig: [u8; 64] = signature\n            .try_into()\n            .map_err(|_| FfiError::InvalidSignature)?;\n        self.inner.verify(message, \u0026sig).map_err(FfiError::from)\n    }\n}\n\n// ============================================================================\n// EnrollmentKit\n// ============================================================================\n\n/// FFI wrapper enforcing the one-shot contract across the language boundary.\n/// The inner `Option` is consumed by `take_chain_into_ratchet` (for `chain_0`)\n/// and `close()` (for the whole kit including the Ed25519 secret).\npub struct EnrollmentKit {\n    inner: Mutex\u003cOption\u003ccore_identity::EnrollmentKit\u003e\u003e,\n}\n\nimpl std::fmt::Debug for EnrollmentKit {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        // Never format the secret material — just report presence.\n        let state = match self.inner.lock() {\n            Ok(g) =\u003e {\n                if g.is_some() {\n                    \"live\"\n                } else {\n                    \"closed\"\n                }\n            }\n            Err(_) =\u003e \"poisoned\",\n        };\n        write!(f, \"EnrollmentKit({state})\")\n    }\n}\n\nimpl EnrollmentKit {\n    /// # Errors\n    /// Any derivation / BIP-39 error wrapped as [`FfiError`].\n    pub fn from_mnemonic(mnemonic: \u0026str, passphrase: \u0026str) -\u003e Result\u003cSelf, FfiError\u003e {\n        let kit = core_identity::EnrollmentKit::from_mnemonic(mnemonic, passphrase)\n            .map_err(FfiError::from)?;\n        Ok(Self {\n            inner: Mutex::new(Some(kit)),\n        })\n    }\n\n    /// # Errors\n    /// [`FfiError::AlreadyConsumed`] if the kit was `close()`d first.\n    pub fn identity(\u0026self) -\u003e Result\u003cArc\u003cStreamIdentity\u003e, FfiError\u003e {\n        let guard = self.inner.lock().map_err(|_| lock_poisoned())?;\n        let kit = guard.as_ref().ok_or(FfiError::AlreadyConsumed {\n            resource: \"enrollment_kit\".to_string(),\n        })?;\n        Ok(Arc::new(StreamIdentity {\n            inner: kit.identity().clone(),\n        }))\n    }\n\n    /// # Errors\n    /// [`FfiError::AlreadyConsumed`] after `close()`.\n    pub fn sign_once(\u0026self, message: \u0026[u8]) -\u003e Result\u003cVec\u003cu8\u003e, FfiError\u003e {\n        let guard = self.inner.lock().map_err(|_| lock_poisoned())?;\n        let kit = guard.as_ref().ok_or(FfiError::AlreadyConsumed {\n            resource: \"enrollment_kit\".to_string(),\n        })?;\n        kit.sign_once(message)\n            .map(|arr| arr.to_vec())\n            .map_err(FfiError::from)\n    }\n\n    /// Proactive wipe — on return the kit can no longer sign or hand out\n    /// `chain_0`. Safe to call multiple times.\n    ///\n    /// Named `wipe` (not `close`) so the generated Kotlin class doesn't clash\n    /// with `AutoCloseable.close()`'s inherited signature — that clash\n    /// produces `Conflicting overloads` errors at the Kotlin compile step.\n    pub fn wipe(\u0026self) {\n        if let Ok(mut guard) = self.inner.lock() {\n            *guard = None;\n        }\n    }\n}\n\n// ============================================================================\n// ArchiveIdentity\n// ============================================================================\n\n/// FFI wrapper for `core::identity::ArchiveIdentity`. Immutable after\n/// construction (the inner X25519 secret stays put) → no lock.\n#[derive(Debug)]\npub struct ArchiveIdentity {\n    inner: core_identity::ArchiveIdentity,\n}\n\nimpl ArchiveIdentity {\n    /// # Errors\n    /// Any derivation / BIP-39 error wrapped as [`FfiError`].\n    pub fn from_mnemonic(mnemonic: \u0026str, passphrase: \u0026str) -\u003e Result\u003cSelf, FfiError\u003e {\n        core_identity::ArchiveIdentity::from_mnemonic(mnemonic, passphrase)\n            .map(|a| Self { inner: a })\n            .map_err(FfiError::from)\n    }\n\n    #[must_use]\n    pub fn identity(\u0026self) -\u003e Arc\u003cStreamIdentity\u003e {\n        Arc::new(StreamIdentity {\n            inner: self.inner.identity().clone(),\n        })\n    }\n\n    /// # Errors\n    /// [`FfiError::InvalidBlob`] on wrong envelope size, [`FfiError::WrongPin`]\n    /// if the envelope wasn't sealed for this identity.\n    pub fn decrypt_session_key(\u0026self, sealed_envelope: \u0026[u8]) -\u003e Result\u003cVec\u003cu8\u003e, FfiError\u003e {\n        self.inner\n            .decrypt_session_key(sealed_envelope)\n            .map(|z| z.to_vec())\n            .map_err(FfiError::from)\n    }\n}\n\n// ============================================================================\n// RatchetSignature / RotationProof (FFI projections)\n// ============================================================================\n\n/// Plain-data record mirroring `core::ratchet::RatchetSignature` with\n/// `Vec\u003cu8\u003e` instead of fixed arrays so `UniFFI` can ferry it across.\n#[derive(Debug, Clone)]\npub struct RatchetSignature {\n    pub signature: Vec\u003cu8\u003e,\n    pub ephemeral_public_key: Vec\u003cu8\u003e,\n    pub batch_number: u32,\n    pub key_index: u32,\n}\n\nimpl From\u003ccore_ratchet::RatchetSignature\u003e for RatchetSignature {\n    fn from(s: core_ratchet::RatchetSignature) -\u003e Self {\n        Self {\n            signature: s.signature.to_vec(),\n            ephemeral_public_key: s.ephemeral_public_key.to_vec(),\n            batch_number: s.batch_number,\n            key_index: s.key_index,\n        }\n    }\n}\n\n/// Plain-data record mirroring `core::ratchet::RotationProof`.\n#[derive(Debug, Clone)]\npub struct RotationProof {\n    pub new_batch_number: u32,\n    pub new_batch_public_keys: Vec\u003cVec\u003cu8\u003e\u003e,\n    pub signer_public_key: Vec\u003cu8\u003e,\n    pub signer_batch_number: u32,\n    pub signer_key_index: u32,\n    pub signature: Vec\u003cu8\u003e,\n}\n\nimpl From\u003ccore_ratchet::RotationProof\u003e for RotationProof {\n    fn from(p: core_ratchet::RotationProof) -\u003e Self {\n        Self {\n            new_batch_number: p.new_batch_number,\n            new_batch_public_keys: p.new_batch_public_keys.iter().map(|k| k.to_vec()).collect(),\n            signer_public_key: p.signer_public_key.to_vec(),\n            signer_batch_number: p.signer_batch_number,\n            signer_key_index: p.signer_key_index,\n            signature: p.signature.to_vec(),\n        }\n    }\n}\n\n// ============================================================================\n// EphemeralRatchet\n// ============================================================================\n\n/// FFI wrapper for `core::ratchet::EphemeralRatchet`. Wraps in Mutex so\n/// \u0026mut-self methods (`sign_and_advance`, `advance_batch`) are reachable\n/// through the FFI-shared \u0026self handle.\npub struct EphemeralRatchet {\n    inner: Mutex\u003ccore_ratchet::EphemeralRatchet\u003e,\n}\n\nimpl std::fmt::Debug for EphemeralRatchet {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        write!(f, \"EphemeralRatchet(\u003copaque\u003e)\")\n    }\n}\n\nimpl EphemeralRatchet {\n    /// Drain `chain_0` from `kit` and initialize a fresh ratchet.\n    /// After this call, `kit.take_chain_into_ratchet` would return\n    /// `AlreadyConsumed`.\n    ///\n    /// # Errors\n    /// [`FfiError::AlreadyConsumed`] if the kit's chain was already drained.\n    // Clippy wants `\u0026Arc\u003cEnrollmentKit\u003e`, but UniFFI's generated scaffolding\n    // calls this function with an owned `Arc`. Overriding here keeps the\n    // signature UDL-compatible without loosening pedantic lints workspace-wide.\n    #[allow(clippy::needless_pass_by_value)]\n    pub fn from_kit(kit: Arc\u003cEnrollmentKit\u003e) -\u003e Result\u003cSelf, FfiError\u003e {\n        let chain_locked = {\n            let mut guard = kit.inner.lock().map_err(|_| lock_poisoned())?;\n            let kit_inner = guard.as_mut().ok_or(FfiError::AlreadyConsumed {\n                resource: \"enrollment_kit\".to_string(),\n            })?;\n            kit_inner.take_chain_zero().map_err(FfiError::from)?\n        };\n        let mut chain_bytes = [0u8; CHAIN_KEY_BYTES];\n        chain_locked.with_bytes(|b| chain_bytes.copy_from_slice(b));\n        // `chain_locked` drops here → mlock'd page zeroed.\n        drop(chain_locked);\n        let mut ratchet = core_ratchet::EphemeralRatchet::new();\n        ratchet\n            .initialize(\u0026mut chain_bytes)\n            .map_err(FfiError::from)?;\n        // `chain_bytes` also zeroed by `initialize` on success.\n        Ok(Self {\n            inner: Mutex::new(ratchet),\n        })\n    }\n\n    /// Resume a ratchet from a previously-serialized blob (V1 or V2).\n    ///\n    /// # Errors\n    /// [`FfiError::InvalidBlob`] on malformed input, [`FfiError::WrongPin`] on\n    /// V2 MAC failure.\n    pub fn deserialize(blob: \u0026[u8]) -\u003e Result\u003cSelf, FfiError\u003e {\n        core_ratchet::EphemeralRatchet::deserialize(blob)\n            .map(|r| Self {\n                inner: Mutex::new(r),\n            })\n            .map_err(FfiError::from)\n    }\n\n    /// Serialize to a V2 blob (4876 bytes).\n    ///\n    /// # Errors\n    /// [`FfiError::AlreadyConsumed`] if the ratchet was wiped.\n    pub fn serialize(\u0026self) -\u003e Result\u003cVec\u003cu8\u003e, FfiError\u003e {\n        let guard = self.inner.lock().map_err(|_| lock_poisoned())?;\n        guard.serialize().map_err(FfiError::from)\n    }\n\n    /// 50 × 32-byte public keys of the active batch.\n    ///\n    /// # Errors\n    /// [`FfiError::AlreadyConsumed`] if wiped.\n    pub fn batch_public_keys(\u0026self) -\u003e Result\u003cVec\u003cVec\u003cu8\u003e\u003e, FfiError\u003e {\n        let guard = self.inner.lock().map_err(|_| lock_poisoned())?;\n        let pks = guard.batch_public_keys().map_err(FfiError::from)?;\n        Ok(pks.iter().map(|k| k.to_vec()).collect())\n    }\n\n    /// Sign `message` with the next unused slot, mark it consumed.\n    ///\n    /// # Errors\n    /// [`FfiError::AlreadyConsumed`] on wiped state or no slot left.\n    pub fn sign_and_advance(\u0026self, message: \u0026[u8]) -\u003e Result\u003cRatchetSignature, FfiError\u003e {\n        let mut guard = self.inner.lock().map_err(|_| lock_poisoned())?;\n        guard\n            .sign_and_advance(message)\n            .map(RatchetSignature::from)\n            .map_err(FfiError::from)\n    }\n\n    /// Roll forward to batch N+1, signing the 50 new pubs with one of the\n    /// current batch's slots.\n    ///\n    /// # Errors\n    /// [`FfiError::AlreadyConsumed`] on wiped state.\n    pub fn advance_batch(\u0026self) -\u003e Result\u003cRotationProof, FfiError\u003e {\n        let mut guard = self.inner.lock().map_err(|_| lock_poisoned())?;\n        guard\n            .advance_batch()\n            .map(RotationProof::from)\n            .map_err(FfiError::from)\n    }\n\n    /// Proactive wipe — all 50 private keys + chain key zeroed.\n    pub fn wipe(\u0026self) {\n        if let Ok(mut guard) = self.inner.lock() {\n            guard.wipe();\n        }\n    }\n}\n\n// ============================================================================\n// STRM (stream blob encrypt/decrypt)\n// ============================================================================\n\n/// Non-secret metadata accompanying a decrypted STRM blob. Kotlin dictionary\n/// — fields match `BlobMetadata` in the UDL 1-to-1.\n#[derive(Debug, Clone)]\npub struct BlobMetadata {\n    pub version: u8,\n    pub mode: u8,\n    pub author_ed25519_pk: Vec\u003cu8\u003e,\n    pub grant_count: u16,\n    pub plaintext_len: u64,\n}\n\n/// Plaintext + metadata bundle returned by [`strm_decrypt`]. Kotlin callers\n/// should zero `plaintext` as soon as they're done.\n#[derive(Debug, Clone)]\npub struct StrmPlaintext {\n    pub plaintext: Vec\u003cu8\u003e,\n    pub metadata: BlobMetadata,\n}\n\n/// Encrypt `plaintext` as a self-sealed STRM blob. Picks SINGLE or CHUNKED\n/// automatically based on size (`\u003e 10 MiB` = CHUNKED).\n///\n/// # Errors\n/// Forwards [`StreamEncryptError`] via [`FfiError`].\n#[allow(clippy::needless_pass_by_value)]\npub fn strm_encrypt(plaintext: \u0026[u8], author: Arc\u003cStreamIdentity\u003e) -\u003e Result\u003cVec\u003cu8\u003e, FfiError\u003e {\n    strm_core_encrypt(plaintext, \u0026author.inner).map_err(FfiError::from)\n}\n\n/// Decrypt a STRM blob under `archive`. Returns plaintext + metadata.\n///\n/// # Errors\n/// [`FfiError::InvalidBlob`] for structural problems, [`FfiError::WrongPin`]\n/// if the envelope wasn't sealed for `archive`.\n#[allow(clippy::needless_pass_by_value)]\npub fn strm_decrypt(blob: \u0026[u8], archive: Arc\u003cArchiveIdentity\u003e) -\u003e Result\u003cStrmPlaintext, FfiError\u003e {\n    let (plaintext_z, meta) = strm_core_decrypt(blob, \u0026archive.inner).map_err(FfiError::from)?;\n    let plen = u64::try_from(meta.plaintext_len).map_err(|_| FfiError::Internal {\n        detail: \"plaintext_len overflows u64 (impossible)\".to_string(),\n    })?;\n    Ok(StrmPlaintext {\n        plaintext: plaintext_z.to_vec(),\n        metadata: BlobMetadata {\n            version: meta.version,\n            mode: meta.mode,\n            author_ed25519_pk: meta.author_ed25519_pk.to_vec(),\n            grant_count: meta.grant_count,\n            plaintext_len: plen,\n        },\n    })\n}\n\n// ============================================================================\n// V2 relay client (enroll / challenge / verify / rotate / status)\n// ============================================================================\n\n/// Outcome of an enrollment call — UDL `[Enum] interface`, maps to a Kotlin\n/// sealed class (`EnrollResult.Success`, `EnrollResult.AlreadyEnrolled`,\n/// `EnrollResult.Failed`).\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum EnrollResult {\n    Success,\n    AlreadyEnrolled,\n    Failed { code: u16, body: String },\n}\n\nimpl From\u003cfrappuccino_crypto_stream::EnrollResult\u003e for EnrollResult {\n    fn from(e: frappuccino_crypto_stream::EnrollResult) -\u003e Self {\n        match e {\n            frappuccino_crypto_stream::EnrollResult::Success =\u003e Self::Success,\n            frappuccino_crypto_stream::EnrollResult::AlreadyEnrolled =\u003e Self::AlreadyEnrolled,\n            frappuccino_crypto_stream::EnrollResult::Failed { code, body } =\u003e {\n                Self::Failed { code, body }\n            }\n        }\n    }\n}\n\n/// Kotlin view of `stream::IdentityStatus` — same fields, renamed to i64 for\n/// `enrolled_at` so the UDL type matches across platforms.\n#[derive(Debug, Clone)]\npub struct IdentityStatus {\n    pub batch_number: u32,\n    pub consumed_count: u32,\n    pub remaining_count: u32,\n    pub enrolled_at: i64,\n    pub revoked: bool,\n}\n\n/// Kotlin view of `stream::ChallengeValue` — `nonce` is a 32-byte `Vec\u003cu8\u003e`\n/// so the UDL `bytes` type carries it across without extra conversions.\n#[derive(Debug, Clone)]\npub struct ChallengeValue {\n    pub nonce: Vec\u003cu8\u003e,\n    pub timestamp: u64,\n}\n\nimpl From\u003cfrappuccino_crypto_stream::IdentityStatus\u003e for IdentityStatus {\n    fn from(s: frappuccino_crypto_stream::IdentityStatus) -\u003e Self {\n        Self {\n            batch_number: s.batch_number,\n            consumed_count: s.consumed_count,\n            remaining_count: s.remaining_count,\n            enrolled_at: s.enrolled_at,\n            revoked: s.revoked,\n        }\n    }\n}\n\n/// FFI wrapper around `frappuccino_crypto_stream::StreamServerClient`. The\n/// inner client is cheap to clone (`Arc` internal state) so we keep it by\n/// value — no lock needed.\npub struct StreamServerClient {\n    inner: frappuccino_crypto_stream::StreamServerClient,\n}\n\nimpl std::fmt::Debug for StreamServerClient {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        write!(f, \"StreamServerClient(\u003copaque\u003e)\")\n    }\n}\n\nimpl StreamServerClient {\n    /// # Errors\n    /// [`FfiError::Network`] if rustls can't build (missing crypto provider,\n    /// pin parse).\n    pub fn new(base_url: \u0026str) -\u003e Result\u003cSelf, FfiError\u003e {\n        frappuccino_crypto_stream::StreamServerClient::new(base_url)\n            .map(|c| Self { inner: c })\n            .map_err(FfiError::from)\n    }\n\n    /// # Errors\n    /// [`FfiError::Network`] on connect / TLS / framing failure.\n    pub fn enroll(\n        \u0026self,\n        identity_pk_hex: \u0026str,\n        batch0_public_keys: \u0026[Vec\u003cu8\u003e],\n        batch0_signature: \u0026[u8],\n    ) -\u003e Result\u003cEnrollResult, FfiError\u003e {\n        if batch0_public_keys.len() != core_ratchet::BATCH_SIZE {\n            return Err(FfiError::InvalidBlob {\n                detail: format!(\n                    \"batch_0 must have exactly {} keys, got {}\",\n                    core_ratchet::BATCH_SIZE,\n                    batch0_public_keys.len()\n                ),\n            });\n        }\n        let mut keys_fixed = [[0u8; 32]; core_ratchet::BATCH_SIZE];\n        for (i, k) in batch0_public_keys.iter().enumerate() {\n            let arr: [u8; 32] = k.as_slice().try_into().map_err(|_| FfiError::InvalidBlob {\n                detail: format!(\"batch_0[{i}] must be 32 bytes, got {}\", k.len()),\n            })?;\n            keys_fixed[i] = arr;\n        }\n        let sig_fixed: [u8; 64] = batch0_signature\n            .try_into()\n            .map_err(|_| FfiError::InvalidSignature)?;\n        self.inner\n            .enroll(identity_pk_hex, \u0026keys_fixed, \u0026sig_fixed)\n            .map(EnrollResult::from)\n            .map_err(FfiError::from)\n    }\n\n    /// # Errors\n    /// [`FfiError::Network`] on HTTP / TLS failure, [`FfiError::InvalidBlob`]\n    /// if the server's nonce isn't 32 bytes of hex or the timestamp is\n    /// missing from the response.\n    pub fn challenge(\u0026self) -\u003e Result\u003cChallengeValue, FfiError\u003e {\n        self.inner\n            .challenge()\n            .map(|cv| ChallengeValue {\n                nonce: cv.nonce.to_vec(),\n                timestamp: cv.timestamp,\n            })\n            .map_err(FfiError::from)\n    }\n\n    /// # Errors\n    /// Only the network layer — rejected signatures return `Ok(None)`.\n    #[allow(clippy::needless_pass_by_value)]\n    pub fn verify(\n        \u0026self,\n        identity: Arc\u003cStreamIdentity\u003e,\n        sig: RatchetSignature,\n        nonce_hex: \u0026str,\n        timestamp: u64,\n    ) -\u003e Result\u003cOption\u003cString\u003e, FfiError\u003e {\n        let core_sig = core_ratchet::RatchetSignature {\n            signature: sig\n                .signature\n                .as_slice()\n                .try_into()\n                .map_err(|_| FfiError::InvalidSignature)?,\n            ephemeral_public_key: sig\n                .ephemeral_public_key\n                .as_slice()\n                .try_into()\n                .map_err(|_| FfiError::InvalidSignature)?,\n            batch_number: sig.batch_number,\n            key_index: sig.key_index,\n        };\n        self.inner\n            .verify(\u0026identity.inner, \u0026core_sig, nonce_hex, timestamp)\n            .map_err(FfiError::from)\n    }\n\n    /// # Errors\n    /// Network-layer failures. Server refusals return `Ok(false)`.\n    #[allow(clippy::needless_pass_by_value)]\n    pub fn rotate_batch(\n        \u0026self,\n        identity_pk_hex: \u0026str,\n        proof: RotationProof,\n    ) -\u003e Result\u003cbool, FfiError\u003e {\n        if proof.new_batch_public_keys.len() != core_ratchet::BATCH_SIZE {\n            return Err(FfiError::InvalidBlob {\n                detail: format!(\n                    \"new_batch must have exactly {} keys\",\n                    core_ratchet::BATCH_SIZE\n                ),\n            });\n        }\n        let mut new_pks = [[0u8; 32]; core_ratchet::BATCH_SIZE];\n        for (i, k) in proof.new_batch_public_keys.iter().enumerate() {\n            new_pks[i] = k.as_slice().try_into().map_err(|_| FfiError::InvalidBlob {\n                detail: format!(\"new_batch[{i}] must be 32 bytes\"),\n            })?;\n        }\n        let core_proof = core_ratchet::RotationProof {\n            new_batch_number: proof.new_batch_number,\n            new_batch_public_keys: new_pks,\n            signer_public_key: proof.signer_public_key.as_slice().try_into().map_err(|_| {\n                FfiError::InvalidBlob {\n                    detail: \"signer_public_key must be 32 bytes\".to_string(),\n                }\n            })?,\n            signer_batch_number: proof.signer_batch_number,\n            signer_key_index: proof.signer_key_index,\n            signature: proof\n                .signature\n                .as_slice()\n                .try_into()\n                .map_err(|_| FfiError::InvalidSignature)?,\n        };\n        self.inner\n            .rotate_batch(identity_pk_hex, \u0026core_proof)\n            .map_err(FfiError::from)\n    }\n\n    /// # Errors\n    /// Network-layer failures. 404 = `Ok(None)`.\n    pub fn get_status(\u0026self, identity_pk_hex: \u0026str) -\u003e Result\u003cOption\u003cIdentityStatus\u003e, FfiError\u003e {\n        self.inner\n            .get_status(identity_pk_hex)\n            .map(|opt| opt.map(IdentityStatus::from))\n            .map_err(FfiError::from)\n    }\n}\n\n// ============================================================================\n// Tests\n// ============================================================================\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    const MN_FIXED: \u0026str = \"abaisser abandon abdiquer abeille abolir aborder aboutir aboyer abrasif abreuver abriter abroger\";\n\n    #[test]\n    fn hello_world_is_expected() {\n        assert_eq!(hello_world(), \"hello from rust via uniffi (S0)\");\n    }\n\n    #[test]\n    fn core_version_non_empty() {\n        let v = core_version();\n        assert!(!v.is_empty());\n        assert!(v.contains('.'));\n    }\n\n    #[test]\n    fn bip39_generate_produces_12_words() {\n        let mn = bip39_generate_fr();\n        assert_eq!(mn.split_whitespace().count(), 12);\n    }\n\n    #[test]\n    fn bip39_validate_accepts_freshly_generated() {\n        // MN_FIXED has no checksum (it's used by identity tests that skip\n        // validate()), so we round-trip through generate→validate instead.\n        let mn = bip39_generate_fr();\n        bip39_validate_fr(\u0026mn).expect(\"freshly-generated mnemonic must validate\");\n    }\n\n    #[test]\n    fn bip39_validate_rejects_garbage() {\n        let err = bip39_validate_fr(\"xyzzy plugh wibble wobble\").unwrap_err();\n        // Any non-None error is fine — we only care it didn't silently pass.\n        assert!(!matches!(err, FfiError::Internal { .. }));\n    }\n\n    #[test]\n    fn bip39_normalize_round_trips() {\n        let w = bip39_normalize_word_fr(\"abaisser\").unwrap();\n        assert_eq!(w, \"abaisser\");\n    }\n\n    #[test]\n    fn pin_store_roundtrip() {\n        let plaintext = b\"top secret\";\n        let blob = pin_store_seal(\"123456\", plaintext).unwrap();\n        let out = pin_store_open(\"123456\", \u0026blob).unwrap();\n        assert_eq!(\u0026out[..], plaintext);\n    }\n\n    #[test]\n    fn pin_store_wrong_pin() {\n        let blob = pin_store_seal(\"123456\", b\"x\").unwrap();\n        let err = pin_store_open(\"999999\", \u0026blob).unwrap_err();\n        assert!(matches!(err, FfiError::WrongPin));\n    }\n\n    #[test]\n    fn pin_store_empty_pin_rejects() {\n        let err = pin_store_seal(\"\", b\"x\").unwrap_err();\n        assert!(matches!(err, FfiError::EmptyInput));\n    }\n\n    #[test]\n    fn enrollment_kit_sign_verify_roundtrip() {\n        let kit = EnrollmentKit::from_mnemonic(MN_FIXED, \"\").unwrap();\n        let identity = kit.identity().unwrap();\n        let msg = b\"hello\";\n        let sig = kit.sign_once(msg).unwrap();\n        identity.verify(msg, \u0026sig).unwrap();\n    }\n\n    #[test]\n    fn enrollment_kit_matches_archive_identity() {\n        let kit = EnrollmentKit::from_mnemonic(MN_FIXED, \"\").unwrap();\n        let archive = ArchiveIdentity::from_mnemonic(MN_FIXED, \"\").unwrap();\n        assert_eq!(\n            kit.identity().unwrap().ed25519_pk(),\n            archive.identity().ed25519_pk()\n        );\n        assert_eq!(\n            kit.identity().unwrap().x25519_pk(),\n            archive.identity().x25519_pk()\n        );\n    }\n\n    #[test]\n    fn enrollment_kit_close_invalidates() {\n        let kit = EnrollmentKit::from_mnemonic(MN_FIXED, \"\").unwrap();\n        kit.wipe();\n        let err = kit.sign_once(b\"x\").unwrap_err();\n        assert!(matches!(err, FfiError::AlreadyConsumed { .. }));\n    }\n\n    #[test]\n    fn ratchet_from_kit_sign_and_advance() {\n        let kit = Arc::new(EnrollmentKit::from_mnemonic(MN_FIXED, \"\").unwrap());\n        let identity = kit.identity().unwrap();\n        let ratchet = EphemeralRatchet::from_kit(kit).unwrap();\n\n        let pks = ratchet.batch_public_keys().unwrap();\n        assert_eq!(pks.len(), 50);\n        assert_eq!(pks[0].len(), 32);\n\n        let sig = ratchet.sign_and_advance(b\"challenge-1\").unwrap();\n        assert_eq!(sig.batch_number, 0);\n        assert_eq!(sig.key_index, 0);\n        assert_eq!(sig.signature.len(), 64);\n        assert_eq!(sig.ephemeral_public_key, pks[0]);\n        // Sanity: the identity's public key is NOT equal to the ephemeral one\n        // (different derivation tree).\n        assert_ne!(identity.ed25519_pk(), sig.ephemeral_public_key);\n    }\n\n    #[test]\n    fn ratchet_serialize_deserialize_roundtrip() {\n        let kit = Arc::new(EnrollmentKit::from_mnemonic(MN_FIXED, \"\").unwrap());\n        let ratchet = EphemeralRatchet::from_kit(kit).unwrap();\n        let _ = ratchet.sign_and_advance(b\"msg\").unwrap();\n        let blob = ratchet.serialize().unwrap();\n\n        let resumed = EphemeralRatchet::deserialize(\u0026blob).unwrap();\n        let pks_a = ratchet.batch_public_keys().unwrap();\n        let pks_b = resumed.batch_public_keys().unwrap();\n        assert_eq!(pks_a, pks_b, \"batch pub keys must survive round-trip\");\n    }\n\n    #[test]\n    fn ratchet_advance_batch_emits_proof_with_50_keys() {\n        let kit = Arc::new(EnrollmentKit::from_mnemonic(MN_FIXED, \"\").unwrap());\n        let ratchet = EphemeralRatchet::from_kit(kit).unwrap();\n        let proof = ratchet.advance_batch().unwrap();\n        assert_eq!(proof.new_batch_number, 1);\n        assert_eq!(proof.new_batch_public_keys.len(), 50);\n        assert!(proof.new_batch_public_keys.iter().all(|k| k.len() == 32));\n        assert_eq!(proof.signature.len(), 64);\n    }\n\n    #[test]\n    fn ratchet_from_wiped_kit_fails() {\n        let kit = Arc::new(EnrollmentKit::from_mnemonic(MN_FIXED, \"\").unwrap());\n        kit.wipe();\n        let err = EphemeralRatchet::from_kit(kit).unwrap_err();\n        assert!(matches!(err, FfiError::AlreadyConsumed { .. }));\n    }\n\n    // =========================================================================\n    // S8b: STRM + StreamServerClient\n    // =========================================================================\n\n    #[test]\n    fn strm_encrypt_decrypt_roundtrip() {\n        let kit = EnrollmentKit::from_mnemonic(MN_FIXED, \"\").unwrap();\n        let author = kit.identity().unwrap();\n        let archive = Arc::new(ArchiveIdentity::from_mnemonic(MN_FIXED, \"\").unwrap());\n\n        let plaintext = b\"S8b FFI roundtrip payload\".to_vec();\n        let blob = strm_encrypt(\u0026plaintext, author).unwrap();\n        let out = strm_decrypt(\u0026blob, archive).unwrap();\n\n        assert_eq!(out.plaintext, plaintext);\n        assert_eq!(out.metadata.version, 2, \"encoder emits VERSION_V2 post-S9\");\n        assert!(matches!(out.metadata.mode, 1 | 2));\n        assert_eq!(out.metadata.grant_count, 0);\n        assert_eq!(out.metadata.plaintext_len, plaintext.len() as u64);\n        assert_eq!(out.metadata.author_ed25519_pk.len(), 32);\n    }\n\n    #[test]\n    fn strm_decrypt_rejects_wrong_recipient() {\n        let attacker_mn = \"bambin bambou banane bandeau banlieue banque banquise bassin bastion bataille bateau batterie\";\n        // Guard: the decoy mnemonic must at least parse — if Kotlin's wordlist\n        // rejects it the test becomes trivially green on parse fail.\n        let Ok(archive) = ArchiveIdentity::from_mnemonic(attacker_mn, \"\") else {\n            eprintln!(\"skip: decoy mnemonic unknown-words on this wordlist\");\n            return;\n        };\n        let kit = EnrollmentKit::from_mnemonic(MN_FIXED, \"\").unwrap();\n        let author = kit.identity().unwrap();\n        let blob = strm_encrypt(b\"secret\", author).unwrap();\n        let err = strm_decrypt(\u0026blob, Arc::new(archive)).unwrap_err();\n        // decrypt_session_key → WrongPin when the sealed envelope can't unseal.\n        assert!(matches!(err, FfiError::WrongPin));\n    }\n\n    #[test]\n    fn strm_encrypt_rejects_malformed_author() {\n        // Sanity: the author must match the archive for the roundtrip to work.\n        // This test just covers the public API — a wrong pubkey produces a\n        // blob that the *right* archive still can't decrypt.\n        let author_kit = EnrollmentKit::from_mnemonic(MN_FIXED, \"\").unwrap();\n        let author = author_kit.identity().unwrap();\n        let other_mn = bip39_generate_fr();\n        let other_archive = Arc::new(ArchiveIdentity::from_mnemonic(\u0026other_mn, \"\").unwrap());\n\n        let blob = strm_encrypt(b\"x\", author).unwrap();\n        let err = strm_decrypt(\u0026blob, other_archive).unwrap_err();\n        assert!(matches!(err, FfiError::WrongPin));\n    }\n\n    #[test]\n    fn stream_server_client_build_succeeds() {\n        // Just build — no network. Failure would indicate TLS wiring broke.\n        let c = StreamServerClient::new(\"https://136.244.101.236:8443\").expect(\"client build\");\n        // Debug print shouldn't leak internals.\n        let dbg = format!(\"{c:?}\");\n        assert!(dbg.contains(\"\u003copaque\u003e\"));\n    }\n\n    #[test]\n    fn enroll_result_conversion_roundtrips() {\n        use frappuccino_crypto_stream::EnrollResult as CoreER;\n        assert_eq!(EnrollResult::from(CoreER::Success), EnrollResult::Success);\n        assert_eq!(\n            EnrollResult::from(CoreER::AlreadyEnrolled),\n            EnrollResult::AlreadyEnrolled\n        );\n        let f = EnrollResult::from(CoreER::Failed {\n            code: 500,\n            body: \"oops\".into(),\n        });\n        assert!(matches!(f, EnrollResult::Failed { code: 500, .. }));\n    }\n\n    #[test]\n    fn identity_status_conversion() {\n        let core_s = frappuccino_crypto_stream::IdentityStatus {\n            batch_number: 7,\n            consumed_count: 3,\n            remaining_count: 47,\n            enrolled_at: 1_744_567_890,\n            revoked: false,\n        };\n        let ffi: IdentityStatus = core_s.into();\n        assert_eq!(ffi.batch_number, 7);\n        assert_eq!(ffi.consumed_count, 3);\n        assert_eq!(ffi.remaining_count, 47);\n        assert_eq!(ffi.enrolled_at, 1_744_567_890);\n        assert!(!ffi.revoked);\n    }\n\n    #[test]\n    fn stream_server_client_enroll_rejects_wrong_batch_size() {\n        let c = StreamServerClient::new(\"https://136.244.101.236:8443\").unwrap();\n        // 3 keys instead of 50 → InvalidBlob before any network call.\n        let bad_keys = vec![vec![0u8; 32]; 3];\n        let err = c\n            .enroll(\"f3\".repeat(32).as_str(), \u0026bad_keys, \u0026[0u8; 64])\n            .unwrap_err();\n        assert!(matches!(err, FfiError::InvalidBlob { .. }));\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","work","fuzz","fuzz_targets","fuzz_decrypt_blob.rs"],"content":"//! Fuzz target: `stream::decrypt::decrypt(blob, \u0026archive)`.\n//!\n//! Goal: no panic for any `blob: \u0026[u8]`, regardless of length or contents.\n//! The archive is a fixed valid identity so the fuzzer only exercises the\n//! blob parser / AEAD path — not the `ArchiveIdentity::from_mnemonic` path\n//! (covered by `fuzz_pin_store_open` via a cousin code path).\n//!\n//! Entry points reached:\n//!   * header bounds check\n//!   * magic / version validation\n//!   * grant_count arithmetic\n//!   * sealed-envelope unsealing (wrong pin) → `WrongPin`\n//!   * SINGLE + CHUNKED body parsing (cursor arithmetic, MAX_CHUNK_* caps)\n//!   * XChaCha20-Poly1305 tag verification\n//!\n//! `WrongPin` / `Malformed` / `Core(AlreadyConsumed)` are expected failure\n//! modes — only an actual panic from inside the decoder is a bug.\n\n#![no_main]\n\nuse std::sync::OnceLock;\n\nuse frappuccino_crypto_core::identity::ArchiveIdentity;\nuse frappuccino_crypto_stream::decrypt::decrypt;\nuse libfuzzer_sys::fuzz_target;\n\n// Rebuilding the ArchiveIdentity once per call would waste BIP-39 +\n// HKDF work on every iteration — we'd fuzz the mnemonic pipeline, not\n// the decoder. Initialise once and reuse.\nstatic ARCHIVE: OnceLock\u003cArchiveIdentity\u003e = OnceLock::new();\n\nfn archive() -\u003e \u0026'static ArchiveIdentity {\n    ARCHIVE.get_or_init(|| {\n        // Canonical fixture mnemonic used across parity-vectors/*.json.\n        let mn = \"abaisser abandon abdiquer abeille abolir aborder aboutir aboyer abrasif abreuver abriter abroger\";\n        ArchiveIdentity::from_mnemonic(mn, \"\").expect(\"fixture archive identity\")\n    })\n}\n\nfuzz_target!(|data: \u0026[u8]| {\n    // We don't care about Ok vs Err: the invariant is \"no panic\". A small\n    // percentage of random bytes may happen to parse as a structurally\n    // valid blob that still fuzzer_sys::fuzz_target;\n\n// A fixed 6-digit PIN the attacker's blob has never been sealed against.\n// Using a non-trivial value reduces the odds of accidentally pinning a\n// weak-check path (e.g. an all-zero blob that happens to unseal under\n// \"000000\").\nconst FIXED_PIN: \u0026str = \"284193\";\n\nfuzz_target!(|data: \u0026[u8]| {\n    // The `Ok` branch is unreachable in practice: `FIXED_PIN` isn't the\n    // password any crafted blob can be sealed against without brute-force.\n    // A panic, however, would be a bug.\n    let _ = pin_store::open(FIXED_PIN, data);\n});\n","traces":[],"covered":0,"coverable":0},{"path":["/","work","fuzz","fuzz_targets","fuzz_ratchet_deserialize.rs"],"content":"//! Fuzz target: `core::ratchet::EphemeralRatchet::deserialize(blob)`.\n//!\n//! Goal: no panic on any `blob: \u0026[u8]`. The ratchet blob format has two\n//! versions (V1 legacy, 4844 bytes no MAC; V2 current, 4876 bytes with\n//! HMAC-SHA256). Corner cases we want libfuzzer to reach:\n//!\n//!   * version byte validation\n//!   * `consumed_mask` LSB/MSB alignment\n//!   * 50 × (pk || sk) section boundaries\n//!   * MAC tag position + length arithmetic\n//!   * constant-time MAC equality\n//!\n//! All four failure modes (`WrongVersion`, `InvalidBlob`, `InvalidSignature`,\n//! `Core(AlreadyConsumed)`) are expected — only a panic is a bug.\n\n#![no_main]\n\nuse frappuccino_crypto_core::ratchet::EphemeralRatchet;\nuse libfuzzer_sys::fuzz_target;\n\nfuzz_target!(|data: \u0026[u8]| {\n    let _ = EphemeralRatchet::deserialize(data);\n});\n","traces":[],"covered":0,"coverable":0},{"path":["/","work","stream","src","decrypt.rs"],"content":"//! STRM blob decryption — the archive-mode entry point.\n//!\n//! Accepts a blob produced by either our [`crate::encrypt`] or the Kotlin\n//! `SovereignEncryptor`, and recovers the plaintext after authenticating\n//! every byte of the header via the AEAD tag.\n\nuse crate::encrypt::build_chunked_aad_v2;\nuse crate::header::{\n    self, AEAD_TAG_BYTES, ED25519_PK_BYTES, MAX_CHUNK_COUNT, MAX_CHUNK_LEN, MODE_CHUNKED,\n    MODE_SINGLE, NONCE_BYTES, NONCE_PREFIX_BYTES, OFF_SEALED, SEALED_ENVELOPE_SIZE, VERSION_V1,\n    VERSION_V2,\n};\n// VERSION_V1/V2 are re-exported by `parse_header`; keeping them imported here\n// makes the `decrypt_chunked` dispatch on `version` self-documenting.\nuse chacha20poly1305::aead::{Aead, KeyInit, Payload};\nuse chacha20poly1305::{XChaCha20Poly1305, XNonce};\nuse frappuccino_crypto_core::identity::ArchiveIdentity;\nuse frappuccino_crypto_core::CryptoError;\nuse zeroize::Zeroizing;\n\n/// Error type specific to STRM decoding paths. Mostly a thin wrapper over\n/// [`CryptoError`] so the caller can pattern-match on structural problems\n/// without parsing error strings.\n#[derive(Debug, thiserror::Error)]\npub enum DecryptError {\n    /// Wraps any error bubbling up from the crypto core.\n    #[error(transparent)]\n    Core(#[from] CryptoError),\n    /// The blob was not well-formed (bad magic, wrong version, truncated, …).\n    #[error(\"malformed STRM blob: {0}\")]\n    Malformed(String),\n}\n\n/// Non-secret metadata about a decrypted blob, useful for the caller's UI /\n/// audit log. Returned alongside the plaintext.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct BlobMetadata {\n    /// STRM format version — `VERSION_V1` (legacy Kotlin) or `VERSION_V2`\n    /// (current Rust encoder, adds `chunk_count` to the CHUNKED AAD).\n    pub version: u8,\n    /// `MODE_SINGLE` or `MODE_CHUNKED`.\n    pub mode: u8,\n    /// The Ed25519 public key of the author who produced the blob.\n    pub author_ed25519_pk: [u8; ED25519_PK_BYTES],\n    /// Number of additional grants in the header (always 0 in V2).\n    pub grant_count: u16,\n    /// Total plaintext bytes recovered.\n    pub plaintext_len: usize,\n}\n\n/// Decrypt `blob` under `archive` and return `(plaintext, metadata)`.\n///\n/// The plaintext is wrapped in `Zeroizing` so it wipes on drop when the\n/// caller's binding goes out of scope.\n///\n/// # Errors\n/// * [`DecryptError::Malformed`] for structural errors (wrong magic, wrong\n///   version, truncated blob, invalid chunk count).\n/// * [`DecryptError::Core`] wrapping [`CryptoError::WrongPin`] if the sealed\n///   envelope wasn't for this archive identity, or any AEAD tag fails.\npub fn decrypt(\n    blob: \u0026[u8],\n    archive: \u0026ArchiveIdentity,\n) -\u003e Result\u003c(Zeroizing\u003cVec\u003cu8\u003e\u003e, BlobMetadata), DecryptError\u003e {\n    let parsed = header::parse_header(blob).map_err(|e| DecryptError::Malformed(e.to_string()))?;\n    let version = parsed.version;\n    let mode = parsed.mode;\n    let author_pk = parsed.author_ed25519_pk;\n    let grant_count = parsed.grant_count;\n\n    let sealed = \u0026blob[OFF_SEALED..OFF_SEALED + SEALED_ENVELOPE_SIZE];\n\n    // AAD is the literal header bytes (including grants), matching the Kotlin\n    // `SovereignEncryptor.writeBoth` semantics.\n    let header_aad: \u0026[u8] = \u0026blob[..parsed.header_end];\n\n    // Unseal session key. The 32-byte `K_s` wipes on drop of this Zeroizing.\n    let session_key = archive.decrypt_session_key(sealed)?;\n    if session_key.len() != 32 {\n        return Err(DecryptError::Malformed(\"session key wrong size\".into()));\n    }\n    let key_arr: [u8; 32] = session_key[..]\n        .try_into()\n        .map_err(|_| DecryptError::Malformed(\"session key slice\".into()))?;\n\n    let body = \u0026blob[parsed.body_start..];\n    let (plaintext, _sessionkey_lives_until_here) = match mode {\n        MODE_SINGLE =\u003e decrypt_single(body, \u0026key_arr, header_aad)?,\n        MODE_CHUNKED =\u003e decrypt_chunked(body, \u0026key_arr, header_aad, version)?,\n        other =\u003e {\n            return Err(DecryptError::Malformed(format!(\n                \"unknown mode byte {other:#x}\"\n            )))\n        }\n    };\n\n    let plen = plaintext.len();\n    Ok((\n        plaintext,\n        BlobMetadata {\n            version,\n            mode,\n            author_ed25519_pk: author_pk,\n            grant_count,\n            plaintext_len: plen,\n        },\n    ))\n}\n\n// ============================================================================\n// Mode SINGLE\n// ============================================================================\n\nfn decrypt_single(\n    body: \u0026[u8],\n    key: \u0026[u8; 32],\n    aad: \u0026[u8],\n) -\u003e Result\u003c(Zeroizing\u003cVec\u003cu8\u003e\u003e, ()), DecryptError\u003e {\n    if body.len() \u003c NONCE_BYTES + AEAD_TAG_BYTES {\n        return Err(DecryptError::Malformed(format!(\n            \"SINGLE body too short: {}\",\n            body.len()\n        )));\n    }\n    let nonce = \u0026body[..NONCE_BYTES];\n    let ct = \u0026body[NONCE_BYTES..];\n    let cipher = XChaCha20Poly1305::new(key.as_slice().into());\n    let plaintext = cipher\n        .decrypt(XNonce::from_slice(nonce), Payload { msg: ct, aad })\n        .map_err(|_| DecryptError::Core(CryptoError::WrongPin))?;\n    Ok((Zeroizing::new(plaintext), ()))\n}\n\n// ============================================================================\n// Mode CHUNKED\n// ============================================================================\n\nfn decrypt_chunked(\n    body: \u0026[u8],\n    key: \u0026[u8; 32],\n    header_aad: \u0026[u8],\n    version: u8,\n) -\u003e Result\u003c(Zeroizing\u003cVec\u003cu8\u003e\u003e, ()), DecryptError\u003e {\n    if body.len() \u003c NONCE_PREFIX_BYTES + 4 {\n        return Err(DecryptError::Malformed(\"CHUNKED body too short\".into()));\n    }\n    let mut nonce_prefix = [0u8; NONCE_PREFIX_BYTES];\n    nonce_prefix.copy_from_slice(\u0026body[..NONCE_PREFIX_BYTES]);\n    let chunk_count_bytes: [u8; 4] = body[NONCE_PREFIX_BYTES..NONCE_PREFIX_BYTES + 4]\n        .try_into()\n        .map_err(|_| DecryptError::Malformed(\"chunk_count slice\".into()))?;\n    let chunk_count = u32::from_be_bytes(chunk_count_bytes);\n    if chunk_count \u003e MAX_CHUNK_COUNT {\n        return Err(DecryptError::Malformed(format!(\n            \"chunk_count {chunk_count} exceeds cap {MAX_CHUNK_COUNT}\"\n        )));\n    }\n\n    // V1 = AAD is the header bytes only (Kotlin legacy). V2 = AAD binds\n    // MODE ‖ nonce_prefix ‖ chunk_count → truncation attack rejected.\n    let owned_aad_v2: Vec\u003cu8\u003e;\n    let aad: \u0026[u8] = match version {\n        VERSION_V1 =\u003e header_aad,\n        VERSION_V2 =\u003e {\n            owned_aad_v2 = build_chunked_aad_v2(header_aad, \u0026nonce_prefix, chunk_count);\n            \u0026owned_aad_v2\n        }\n        _ =\u003e {\n            return Err(DecryptError::Malformed(format!(\n                \"unsupported version {version:#x} for CHUNKED\"\n            )))\n        }\n    };\n\n    let cipher = XChaCha20Poly1305::new(key.as_slice().into());\n    let mut out = Vec::new();\n    let mut cursor = NONCE_PREFIX_BYTES + 4;\n\n    for i in 0..chunk_count {\n        if body.len() \u003c cursor + 4 {\n            return Err(DecryptError::Malformed(format!(\"chunk {i}: missing len\")));\n        }\n        let chunk_len_bytes: [u8; 4] = body[cursor..cursor + 4]\n            .try_into()\n            .map_err(|_| DecryptError::Malformed(\"chunk_len slice\".into()))?;\n        let chunk_len = u32::from_be_bytes(chunk_len_bytes);\n        cursor += 4;\n        let nonce_plus_tag =\n            u32::try_from(NONCE_BYTES + AEAD_TAG_BYTES).expect(\"24 + 16 = 40 fits in u32\");\n        if !(nonce_plus_tag..=MAX_CHUNK_LEN).contains(\u0026chunk_len) {\n            return Err(DecryptError::Malformed(format!(\n                \"chunk {i}: total_len {chunk_len} out of range\"\n            )));\n        }\n        let total = chunk_len as usize;\n        if body.len() \u003c cursor + total {\n            return Err(DecryptError::Malformed(format!(\n                \"chunk {i}: truncated body\"\n            )));\n        }\n        let chunk_nonce = \u0026body[cursor..cursor + NONCE_BYTES];\n        let chunk_ct = \u0026body[cursor + NONCE_BYTES..cursor + total];\n        cursor += total;\n\n        let plain = cipher\n            .decrypt(\n                XNonce::from_slice(chunk_nonce),\n                Payload { msg: chunk_ct, aad },\n            )\n            .map_err(|_| DecryptError::Core(CryptoError::WrongPin))?;\n        out.extend_from_slice(\u0026plain);\n    }\n    Ok((Zeroizing::new(out), ()))\n}\n","traces":[{"line":61,"address":[1960377,1960766,1957920],"length":1,"stats":{"Line":2}},{"line":65,"address":[1658727],"length":1,"stats":{"Line":4}},{"line":66,"address":[1958157],"length":1,"stats":{"Line":2}},{"line":67,"address":[1958178],"length":1,"stats":{"Line":2}},{"line":68,"address":[1958199],"length":1,"stats":{"Line":2}},{"line":69,"address":[1836407],"length":1,"stats":{"Line":2}},{"line":71,"address":[1667122,1666863],"length":1,"stats":{"Line":2}},{"line":75,"address":[1958397],"length":1,"stats":{"Line":2}},{"line":78,"address":[1667135,1667047],"length":1,"stats":{"Line":2}},{"line":79,"address":[1958756,1958683],"length":1,"stats":{"Line":4}},{"line":80,"address":[1958807,1960652],"length":1,"stats":{"Line":0}},{"line":82,"address":[1667633,1667429,1669215,1667359],"length":1,"stats":{"Line":4}},{"line":84,"address":[1947822,1947808],"length":1,"stats":{"Line":0}},{"line":86,"address":[1949134],"length":1,"stats":{"Line":2}},{"line":87,"address":[1927029,1926611],"length":1,"stats":{"Line":3}},{"line":88,"address":[1660072,1660159,1660439],"length":1,"stats":{"Line":5}},{"line":89,"address":[1949717,1950351,1949358],"length":1,"stats":{"Line":6}},{"line":90,"address":[1659996],"length":1,"stats":{"Line":1}},{"line":91,"address":[1926644,1927748],"length":1,"stats":{"Line":2}},{"line":97,"address":[1660412,1660751],"length":1,"stats":{"Line":2}},{"line":98,"address":[1660946],"length":1,"stats":{"Line":1}},{"line":99,"address":[1660803],"length":1,"stats":{"Line":1}},{"line":100,"address":[1668724],"length":1,"stats":{"Line":
