ing the `chunk_count` field) is rejected — V1\n//! accepted it silently.\n\nuse crate::header::{\n    CHUNK_SIZE, CHUNK_THRESHOLD, ED25519_PK_BYTES, HEADER_SIZE_NO_GRANTS, MAGIC, MAX_CHUNK_COUNT,\n    MODE_CHUNKED, MODE_SINGLE, NONCE_BYTES, NONCE_PREFIX_BYTES, OFF_AUTHOR_PK, OFF_GRANT_COUNT,\n    OFF_MAGIC, OFF_SEALED, OFF_VERSION, SEALED_ENVELOPE_SIZE, SESSION_KEY_BYTES, VERSION_CURRENT,\n};\nuse chacha20poly1305::aead::{Aead, KeyInit, Payload};\nuse chacha20poly1305::{XChaCha20Poly1305, XNonce};\nuse frappuccino_crypto_core::identity::StreamIdentity;\nuse frappuccino_crypto_core::seal;\nuse frappuccino_crypto_core::CryptoError;\nuse rand_core::{OsRng, RngCore};\nuse zeroize::Zeroize;\n\n/// Specific error type for the encrypt path. Mirrors `DecryptError`'s layout.\n#[derive(Debug, thiserror::Error)]\npub enum EncryptError {\n    #[error(transparent)]\n    Core(#[from] CryptoError),\n    #[error(\"AEAD encryption failed: {0}\")]\n    Aead(String),\n    #[error(\"plaintext too large: {chunks} chunks exceeds MAX_CHUNK_COUNT = {max}\")]\n    TooLarge { chunks: u64, max: u32 },\n}\n\n/// Encrypt `plaintext` in mode SINGLE for the given `author` identity.\n///\n/// The author is also the only recipient (`grant_count` = 0). Use\n/// [`encrypt_chunked`] for payloads that should be streamed chunk-by-chunk\n/// (video capture, large files).\n///\n/// # Errors\n/// Returns an [`EncryptError::Core`] if the sealed envelope can't be built,\n/// or [`EncryptError::Aead`] if XChaCha20-Poly1305 encryption fails (never\n/// in practice).\npub fn encrypt_single(plaintext: \u0026[u8], author: \u0026StreamIdentity) -\u003e Result\u003cVec\u003cu8\u003e, EncryptError\u003e {\n    // 1. Fresh 32-byte session key (wipe on function exit via Zeroize).\n    let mut session_key = [0u8; SESSION_KEY_BYTES];\n    OsRng.fill_bytes(\u0026mut session_key);\n\n    // 2. Header (author pk + sealed session key + grant_count=0).\n    let mut header = Vec::with_capacity(HEADER_SIZE_NO_GRANTS);\n    write_header_prefix(\u0026mut header, author, \u0026session_key)?;\n\n    // 3. Body: mode byte + nonce + ct. AAD is the header bytes verbatim.\n    let mut nonce = [0u8; NONCE_BYTES];\n    OsRng.fill_bytes(\u0026mut nonce);\n    let cipher = XChaCha20Poly1305::new(session_key.as_slice().into());\n    let ct = cipher\n        .encrypt(\n            XNonce::from_slice(\u0026nonce),\n            Payload {\n                msg: plaintext,\n                aad: \u0026header,\n            },\n        )\n        .map_err(|e| EncryptError::Aead(e.to_string()))?;\n\n    session_key.zeroize();\n\n    let mut blob = header;\n    blob.push(MODE_SINGLE);\n    blob.extend_from_slice(\u0026nonce);\n    blob.extend_from_slice(\u0026ct);\n    Ok(blob)\n}\n\n/// Encrypt `plaintext` in mode CHUNKED with [`CHUNK_SIZE`] chunks.\n///\n/// Emits a `VERSION_V2` blob — the AAD of every chunk binds\n/// `chunk_count` explicitly so a truncation attack (dropping trailing chunks)\n/// is rejected by the decoder.\n///\n/// # Errors\n/// * [`EncryptError::Core`] if the sealed envelope can't be built.\n/// * [`EncryptError::Aead`] if `XChaCha20-Poly1305` encryption fails.\n/// * [`EncryptError::TooLarge`] if the plaintext would need more than\n///   [`MAX_CHUNK_COUNT`] chunks (≥ 1 TiB in practice).\n///\n/// # Panics\n/// Cannot panic in practice: `NONCE_BYTES + ct.len()` is bounded by\n/// `MAX_CHUNK_LEN = 2 MiB`, which fits in `u32`.\npub fn encrypt_chunked(plaintext: \u0026[u8], author: \u0026StreamIdentity) -\u003e Result\u003cVec\u003cu8\u003e, EncryptError\u003e {\n    // chunk_count is part of the AAD, so it must be known before encrypting\n    // the first chunk. ceil(len / CHUNK_SIZE) — zero for empty plaintext.\n    let chunks_u64 = (plaintext.len() as u64).div_ceil(CHUNK_SIZE as u64);\n    let chunk_count = u32::try_from(chunks_u64).map_err(|_| EncryptError::TooLarge {\n        chunks: chunks_u64,\n        max: MAX_CHUNK_COUNT,\n    })?;\n    if chunk_count \u003e MAX_CHUNK_COUNT {\n        return Err(EncryptError::TooLarge {\n            chunks: chunks_u64,\n            max: MAX_CHUNK_COUNT,\n        });\n    }\n\n    let mut session_key = [0u8; SESSION_KEY_BYTES];\n    OsRng.fill_bytes(\u0026mut session_key);\n\n    let mut header = Vec::with_capacity(HEADER_SIZE_NO_GRANTS);\n    write_header_prefix(\u0026mut header, author, \u0026session_key)?;\n\n    // Shared random prefix for all chunks of this stream.\n    let mut nonce_prefix = [0u8; NONCE_PREFIX_BYTES];\n    OsRng.fill_bytes(\u0026mut nonce_prefix);\n\n    // V2 AAD = header ‖ MODE_CHUNKED ‖ nonce_prefix ‖ chunk_count (BE u32).\n    let aad = build_chunked_aad_v2(\u0026header, \u0026nonce_prefix, chunk_count);\n\n    let cipher = XChaCha20Poly1305::new(session_key.as_slice().into());\n    let mut chunks_bytes = Vec::new();\n    let mut chunk_index: u32 = 0;\n    let mut offset = 0;\n    while offset \u003c plaintext.len() {\n        let end = (offset + CHUNK_SIZE).min(plaintext.len());\n        let plain = \u0026plaintext[offset..end];\n\n        // nonce = prefix || chunk_index_BE(4).\n        let mut nonce = [0u8; NONCE_BYTES];\n        nonce[..NONCE_PREFIX_BYTES].copy_from_slice(\u0026nonce_prefix);\n        nonce[NONCE_PREFIX_BYTES..].copy_from_slice(\u0026chunk_index.to_be_bytes());\n\n        let ct = cipher\n            .encrypt(\n                XNonce::from_slice(\u0026nonce),\n                Payload {\n                    msg: plain,\n                    aad: \u0026aad,\n                },\n            )\n            .map_err(|e| EncryptError::Aead(e.to_string()))?;\n\n        // Chunk frame = total_len(u32 BE = nonce+ct) || nonce || ct.\n        let total_len = u32::try_from(NONCE_BYTES + ct.len())\n            .expect(\"chunk len fits in u32 (ct \u003c= MAX_CHUNK_LEN)\");\n        chunks_bytes.extend_from_slice(\u0026total_len.to_be_bytes());\n        chunks_bytes.extend_from_slice(\u0026nonce);\n        chunks_bytes.extend_from_slice(\u0026ct);\n\n        chunk_index += 1;\n        offset = end;\n    }\n    debug_assert_eq!(chunk_index, chunk_count);\n    session_key.zeroize();\n\n    let mut blob = header;\n    blob.push(MODE_CHUNKED);\n    blob.extend_from_slice(\u0026nonce_prefix);\n    blob.extend_from_slice(\u0026chunk_count.to_be_bytes());\n    blob.extend_from_slice(\u0026chunks_bytes);\n    Ok(blob)\n}\n\n/// Pick SINGLE or CHUNKED based on the Kotlin threshold (`\u003c= 10 MiB = SINGLE`).\n/// Convenience wrapper when the caller doesn't want to think about modes.\n///\n/// # Errors\n/// Forwards from [`encrypt_single`] / [`encrypt_chunked`].\npub fn encrypt(plaintext: \u0026[u8], author: \u0026StreamIdentity) -\u003e Result\u003cVec\u003cu8\u003e, EncryptError\u003e {\n    if plaintext.len() as u64 \u003c= CHUNK_THRESHOLD {\n        encrypt_single(plaintext, author)\n    } else {\n        encrypt_chunked(plaintext, author)\n    }\n}\n\n// ============================================================================\n// Helpers\n// ============================================================================\n\nfn write_header_prefix(\n    out: \u0026mut Vec\u003cu8\u003e,\n    author: \u0026StreamIdentity,\n    session_key: \u0026[u8; 32],\n) -\u003e Result\u003c(), EncryptError\u003e {\n    debug_assert_eq!(out.len(), OFF_MAGIC);\n    out.extend_from_slice(\u0026MAGIC);\n    debug_assert_eq!(out.len(), OFF_VERSION);\n    out.push(VERSION_CURRENT);\n    debug_assert_eq!(out.len(), OFF_AUTHOR_PK);\n    out.extend_from_slice(author.ed25519_pk());\n    assert_eq!(author.ed25519_pk().len(), ED25519_PK_BYTES);\n\n    // Sealed envelope via crypto_box_seal(session_key, x25519_pk).\n    debug_assert_eq!(out.len(), OFF_SEALED);\n    let sealed = seal::seal(session_key, author.x25519_pk())?;\n    assert_eq!(sealed.len(), SEALED_ENVELOPE_SIZE);\n    out.extend_from_slice(\u0026sealed);\n\n    // grant_count = 0 (V2 never adds grants in-blob).\n    debug_assert_eq!(out.len(), OFF_GRANT_COUNT);\n    out.extend_from_slice(\u0026[0u8; 2]);\n    debug_assert_eq!(out.len(), HEADER_SIZE_NO_GRANTS);\n    Ok(())\n}\n\n/// Build the extended AAD used by `VERSION_V2` chunked blobs. Shared between\n/// [`encrypt_chunked`] and [`crate::decrypt::decrypt`] so any drift would show\n/// up as AEAD failures in tests immediately.\n///\n/// Layout: `header_bytes ‖ MODE_CHUNKED ‖ nonce_prefix ‖ chunk_count_BE_u32`.\npub(crate) fn build_chunked_aad_v2(\n    header: \u0026[u8],\n    nonce_prefix: \u0026[u8; NONCE_PREFIX_BYTES],\n    chunk_count: u32,\n) -\u003e Vec\u003cu8\u003e {\n    let mut aad = Vec::with_capacity(header.len() + 1 + NONCE_PREFIX_BYTES + 4);\n    aad.extend_from_slice(header);\n    aad.push(MODE_CHUNKED);\n    aad.extend_from_slice(nonce_prefix);\n    aad.extend_from_slice(\u0026chunk_count.to_be_bytes());\n    aad\n}\n","traces":[{"line":45,"address":[1906468,1906519,1905104],"length":1,"stats":{"Line":2}},{"line":47,"address":[1645128],"length":1,"stats":{"Line":2}},{"line":48,"address":[1935571],"length":1,"stats":{"Line":2}},{"line":51,"address":[1592278],"length":1,"stats":{"Line":2}},{"line":52,"address":[1826583,1826631,1827813],"length":1,"stats":{"Line":4}},{"line":55,"address":[1826777],"length":1,"stats":{"Line":2}},{"line":56,"address":[1905504],"length":1,"stats":{"Line":2}},{"line":57,"address":[1826832],"length":1,"stats":{"Line":2}},{"line":58,"address":[1592829,1593000],"length":1,"stats":{"Line":2}},{"line":60,"address":[1928614],"length":1,"stats":{"Line":2}},{"line":61,"address":[1936133],"length":1,"stats":{"Line":2}},{"line":63,"address":[1592743],"length":1,"stats":{"Line":2}},{"line":66,"address":[1827208],"length":1,"stats":{"Line":0}},{"line":68,"address":[1646021],"length":1,"stats":{"Line":2}},{"line":70,"address":[1593152],"length":1,"stats":{"Line":2}},{"line":71,"address":[1827452],"length":1,"stats":{"Line":2}},{"line":72,"address":[1929223],"length":1,"stats":{"Line":2}},{"line":73,"address":[1593306],"length":1,"stats":{"Line":2}},{"line":74,"address":[1646308],"length": s":[1598585],"length":1,"stats":{"Line":2}},{"line":212,"address":[1598656,1599100,1599106],"length":1,"stats":{"Line":2}},{"line":217,"address":[1911717,1911863],"length":1,"stats":{"Line":2}},{"line":218,"address":[1911845],"length":1,"stats":{"Line":2}},{"line":219,"address":[1934909],"length":1,"stats":{"Line":2}},{"line":220,"address":[1598958],"length":1,"stats":{"Line":2}},{"line":221,"address":[1598990],"length":1,"stats":{"Line":2}},{"line":222,"address":[1599066],"length":1,"stats":{"Line":2}}],"covered":80,"coverable":88},{"path":["/","work","stream","src","header.rs"],"content":"//! STRM header constants and byte-layout helpers.\n\n/// Magic bytes at the start of every STRM blob.\npub const MAGIC: [u8; 4] = *b\"STRM\";\n/// Legacy STRM format (produced by Kotlin `SovereignEncryptor` pre-S9).\n///\n/// AAD semantics:\n///   * SINGLE = header bytes.\n///   * CHUNKED = header bytes (truncation of trailing chunks was undetectable\n///     — fixed in V2).\npub const VERSION_V1: u8 = 0x01;\n/// Current STRM format (produced by the Rust encoder starting at S9-pre-audit).\n///\n/// AAD semantics:\n///   * SINGLE = header bytes (unchanged from V1, but the version byte is V2\n///     so the decoder stays honest about which writer produced the blob).\n///   * CHUNKED = `header ‖ MODE ‖ nonce_prefix ‖ chunk_count_be_u32` —\n///     includes `chunk_count` so a truncation attack that drops trailing\n///     chunks is rejected (would need to forge an AEAD tag under a different\n///     AAD).\npub const VERSION_V2: u8 = 0x02;\n/// Version written by the current encoder. Decoder accepts both `VERSION_V1`\n/// (legacy Kotlin fixtures, never produced anymore) and `VERSION_V2`.\npub const VERSION_CURRENT: u8 = VERSION_V2;\n/// Mode byte for in-one-piece encryption.\npub const MODE_SINGLE: u8 = 0x01;\n/// Mode byte for chunked encryption (1 MiB chunks).\npub const MODE_CHUNKED: u8 = 0x02;\n\n/// Size of the session key that's sealed in the header.\npub const SESSION_KEY_BYTES: usize = 32;\n/// Overhead of `crypto_box_seal` over the 32-byte session key = 48 bytes.\n/// Full sealed envelope = 32 + 48 = 80 bytes.\npub const SEALED_BOX_OVERHEAD: usize = 48;\n/// Size of the sealed session key inside the header.\npub const SEALED_ENVELOPE_SIZE: usize = SESSION_KEY_BYTES + SEALED_BOX_OVERHEAD;\n\n/// `XChaCha20` nonce length for mode SINGLE and the full nonce computed for\n/// each chunk in mode CHUNKED.\npub const NONCE_BYTES: usize = 24;\n/// Length of the shared `nonce_prefix` written once at the start of a\n/// CHUNKED body. Each chunk appends a 4-byte chunk index to form its nonce.\npub const NONCE_PREFIX_BYTES: usize = NONCE_BYTES - 4;\n/// Poly1305 tag length (always appended in XChaCha20-Poly1305-IETF).\npub const AEAD_TAG_BYTES: usize = 16;\n\n/// Ed25519 public key length.\npub const ED25519_PK_BYTES: usize = 32;\n/// X25519 public key length (target of the sealed envelope).\npub const X25519_PK_BYTES: usize = 32;\n\n/// Default chunk size used by the encoder for mode CHUNKED payloads.\npub const CHUNK_SIZE: usize = 1024 * 1024;\n/// Size threshold below which the encoder picks mode SINGLE over CHUNKED.\npub const CHUNK_THRESHOLD: u64 = 10 * 1024 * 1024;\n\n/// Hard caps applied by the decoder (prevents memory `DoS` on crafted blobs).\npub const MAX_CHUNK_COUNT: u32 = 1_000_000;\n/// Max size of a single chunk's full `total_len` field.\npub const MAX_CHUNK_LEN: u32 = 2 * 1024 * 1024;\n\n/// Byte offsets inside the pre-body header. These are constant because V1\n/// never has recipient grants (`grant_count = 0`).\npub const OFF_MAGIC: usize = 0;\npub const OFF_VERSION: usize = 4;\npub const OFF_AUTHOR_PK: usize = 5;\npub const OFF_SEALED: usize = OFF_AUTHOR_PK + ED25519_PK_BYTES;\npub const OFF_GRANT_COUNT: usize = OFF_SEALED + SEALED_ENVELOPE_SIZE;\npub const HEADER_SIZE_NO_GRANTS: usize = OFF_GRANT_COUNT + 2;\n\n/// Size in bytes of one grant entry: recipient X25519 pk + sealed session key.\npub const GRANT_ENTRY_SIZE: usize = X25519_PK_BYTES + SEALED_ENVELOPE_SIZE;\n\n/// Assemble an unsigned 16-bit big-endian value from its two bytes.\n#[must_use]\npub const fn be_u16(hi: u8, lo: u8) -\u003e u16 {\n    ((hi as u16) \u003c\u003c 8) | (lo as u16)\n}\n\n/// Byte-layout summary of a well-formed STRM header. Produced by\n/// [`parse_header`] so callers (the decoder, the CLI `--inspect`, and the\n/// fuzz target) share the same cursor arithmetic.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct ParsedHeader {\n    /// Raw version byte (`VERSION_V1` or `VERSION_V2`).\n    pub version: u8,\n    /// Raw mode byte (`MODE_SINGLE` or `MODE_CHUNKED`).\n    pub mode: u8,\n    /// Author's Ed25519 public key (32 bytes).\n    pub author_ed25519_pk: [u8; ED25519_PK_BYTES],\n    /// Big-endian `grant_count`.\n    pub grant_count: u16,\n    /// Offset of the first byte past the header (== start of the mode byte).\n    pub header_end: usize,\n    /// Start offset of the mode-specific body (past the mode byte itself).\n    pub body_start: usize,\n}\n\n/// Parsing errors produced by [`parse_header`]. These are reconstitutable\n/// from `HeaderError::to_string`, so the decoder can forward them without\n/// leaking internal state.\n#[derive(Debug, thiserror::Error)]\npub enum HeaderError {\n    /// Buffer shorter than [`HEADER_SIZE_NO_GRANTS + 1`] bytes.\n    #[error(\"blob too short: {got} (minimum {min})\")]\n    TooShort { got: usize, min: usize },\n    /// First four bytes are not `\"STRM\"`.\n    #[error(\"invalid magic bytes\")]\n    BadMagic,\n    /// Version byte not in `{VERSION_V1, VERSION_V2}`.\n    #[error(\"unsupported version {version:#x}\")]\n    BadVersion { version: u8 },\n    /// The header declares `grant_count` grants but the blob doesn't have\n    /// enough bytes to carry them + the mode byte.\n    #[error(\"blob too short with {grant_count} grants: need \u003e= {need}\")]\n    TruncatedWithGrants { grant_count: u16, need: usize },\n}\n\n/// Parse the STRM pre-body header. Pure function — \n//! * **CHUNKED**: `nonce_prefix(20) || chunk_count(u32 BE) || chunk*`,\n//!   where each chunk = `total_len(u32 BE) || nonce(24) || ct_with_tag`.\n//!   `nonce = nonce_prefix || chunk_index(u32 BE)`.\n//!\n//! AEAD = `XChaCha20-Poly1305-IETF(session_key, nonce, aad)`.\n//!\n//! **AAD semantics:**\n//! * SINGLE — `aad = header_bytes` (unchanged across V1/V2).\n//! * CHUNKED V1 — `aad = header_bytes` (Kotlin legacy — read-only).\n//! * CHUNKED V2 — `aad = header_bytes ‖ MODE ‖ nonce_prefix ‖ chunk_count_BE_u32`.\n//!   The binding of `chunk_count` in the AAD is what rejects a truncation\n//!   attack (dropping trailing chunks + patching `chunk_count`) that V1\n//!   accepted silently.\n//!\n//! The decoder accepts both versions. The encoder emits V2 exclusively.\n\npub use frappuccino_crypto_core as core;\n\npub mod decrypt;\npub mod encrypt;\npub mod header;\n\n// The V2 relay client and its TLS-pinning glue live behind the `protocol`\n// feature (on by default). Fuzz builds disable it to keep `cargo fuzz build`\n// from dragging reqwest + rustls + hyper through the sanitizer toolchain\n// (~3 GiB of RAM).\n#[cfg(feature = \"protocol\")]\npub mod pin;\n#[cfg(feature = \"protocol\")]\npub mod protocol;\n\npub use decrypt::{decrypt, BlobMetadata, DecryptError};\npub use encrypt::{encrypt_chunked, encrypt_single, EncryptError};\n#[cfg(feature = \"protocol\")]\npub use protocol::{\n    ChallengeValue, EnrollResult, IdentityStatus, ProtocolError, StreamServerClient,\n};\n","traces":[],"covered":0,"coverable":0},{"path":["/","work","stream","src","pin.rs"],"content":"//! Pinned-cert TLS verifier — CRIT-01 defense-in-depth.\n//!\n//! `rustls`'s normal verifier walks a trust store; we intentionally bypass it\n//! because the Vultr relay uses a self-signed cert that no real CA signed.\n//! Instead, we:\n//!\n//! 1. Accept **only** the exact DER we were given at build time\n//!    ([`EMBEDDED_CERT_DER`]), matching the same cert bundled in the Android\n//!    APK (`mobile/src/main/res/raw/frappuccino_ca.crt`).\n//! 2. Verify the live peer cert's `SubjectPublicKeyInfo` (SPKI) SHA-256 matches\n//!    the hard-coded pin [`PIN_SHA256_B64`] — this is belt-and-braces next to\n//!    the exact-cert match, and survives a legitimate cert rotation as long\n//!    as the same key is re-used.\n//!\n//! This replicates the Kotlin `CertificatePinner`+`network_security_config`\n//! pair used in `StreamServerClient.kt`. Swap for proper CA validation when\n//! the relay migrates to Let's Encrypt post-démo.\n\nuse base64::engine::general_purpose::STANDARD as B64;\nuse base64::Engine as _;\nuse rustls::client::danger::{HandshakeSignatureValid, ServerCertVerified, ServerCertVerifier};\nuse rustls::pki_types::{CertificateDer, ServerName, UnixTime};\nuse rustls::{DigitallySignedStruct, Error, SignatureScheme};\nuse sha2::{Digest, Sha256};\nuse subtle::ConstantTimeEq;\nuse x509_parser::prelude::FromDer;\nuse x509_parser::prelude::X509Certificate;\n\n/// SPKI SHA-256 pin (base64) — lifted verbatim from `StreamServerClient.kt`.\n///\n/// Corresponds to the public key embedded in the test-server cert at\n/// `136.244.101.236:8443`. Any attacker rotating the cert would need access\n/// to the same EC private key to reproduce this hash.\npub const PIN_SHA256_B64: \u0026str = \"mGGCWQNvYxXBlHTDUzRgdB1GSJQnnwP0gw5gUmokBOA=\";\n\n/// Host we expect inside the TLS SNI / URL. Must match the pin above.\npub const PINNED_HOST: \u0026str = \"136.244.101.236\";\n\n/// DER bytes of the one cert we will trust (decoded from the embedded PEM).\n/// The build-time `include_bytes!` ensures this ships inside the binary, not\n/// fetched from disk at runtime.\nconst EMBEDDED_CERT_PEM: \u0026str = include_str!(\"../assets/frappuccino_ca.crt\");\n\n/// `ServerCertVerifier` that trusts exactly one embedded DER cert and, as an\n/// additional gate, compares the peer cert's SPKI SHA-256 against a hard-coded\n/// pin.\n///\n/// Construct via [`PinnedCertVerifier::new`].\n#[derive(Debug)]\npub struct PinnedCertVerifier {\n    embedded_cert_der: Vec\u003cu8\u003e,\n    pin_sha256: [u8; 32],\n    expected_host: String,\n}\n\nimpl PinnedCertVerifier {\n    /// Build a verifier from the embedded PEM + base64 SPKI pin.\n    ///\n    /// # Errors\n    /// Returns [`Error::General`] if the embedded PEM can't be parsed or the\n    /// base64 pin has wrong length.\n    pub fn new() -\u003e Result\u003cSelf, Error\u003e {\n        Self::with_pin_b64(PIN_SHA256_B64)\n    }\n\n    /// Build a verifier with a caller-chosen SPKI pin, for defense-in-depth\n    /// negative tests (feed a wrong pin → observe the handshake fail).\n    ///\n    /// Production code should use [`Self::new`] which hard-codes the real pin.\n    ///\n    /// # Errors\n    /// See [`Self::new`].\n    pub fn with_pin_b64(pin_b64: \u0026str) -\u003e Result\u003cSelf, Error\u003e {\n        let embedded_cert_der = pem_to_der(EMBEDDED_CERT_PEM).map_err(Error::General)?;\n        let pin_bytes = B64\n            .decode(pin_b64)\n            .map_err(|e| Error::General(format!(\"pin base64 decode: {e}\")))?;\n        let pin_sha256: [u8; 32] = pin_bytes\n            .try_into()\n            .map_err(|_| Error::General(\"pin SHA-256 must be 32 bytes\".into()))?;\n        Ok(Self {\n            embedded_cert_der,\n            pin_sha256,\n            expected_host: PINNED_HOST.to_string(),\n        })\n    }\n\n    /// Extract SPKI DER bytes from a full X.509 DER cert.\n    fn extract_spki_der(cert_der: \u0026[u8]) -\u003e Result\u003c\u0026[u8], Error\u003e {\n        let (_, parsed) = X509Certificate::from_der(cert_der)\n            .map_err(|e| Error::General(format!(\"x509 parse: {e}\")))?;\n        Ok(parsed.tbs_certificate.subject_pki.raw)\n    }\n}\n\nimpl ServerCertVerifier for PinnedCertVerifier {\n    fn verify_server_cert(\n        \u0026self,\n        end_entity: \u0026CertificateDer\u003c'_\u003e,\n        _intermediates: \u0026[CertificateDer\u003c'_\u003e],\n        server_name: \u0026ServerName\u003c'_\u003e,\n        _ocsp_response: \u0026[u8],\n        _now: UnixTime,\n    ) -\u003e Result\u003cServerCertVerified, Error\u003e {\n        // 1. Host check — belt alongside the pin. `ServerName` is an enum, so\n        //    we stringify for a stable comparison.\n        let sni = match server_name {\n            ServerName::DnsName(d) =\u003e d.as_ref().to_string(),\n            ServerName::IpAddress(ip) =\u003e ip_to_string(ip),\n            _ =\u003e {\n                return Err(Error::General(format!(\n                    \"unsupported ServerName variant: {server_name:?}\"\n                )))\n            }\n        };\n        if sni != self.expected_host {\n            return Err(Error::General(format!(\n                \"SNI {sni:?} != pinned host {:?}\",\n                self.expected_host\n            )));\n        }\n\n        // 2. Exact-DER comparison (constant time — pin and cert are both public,\n        //    but there's no downside to ct_eq here).\n        if bool::from(end_entity.as_ref().ct_eq(\u0026self.embedded_cert_der)) {\n            // Still check the pin; if the embedded cert is stale vs the pin\n            // constant, we want to fail loudly here rather than silently trust.\n        } else {\n            // Peer cert ≠ embedded cert — fall through to SPKI-pin check so a\n            // legitimate cert rotation (new expiry, same key) still works.\n        }\n\n        // 3. SPKI SHA-256 pin — the authoritative defense-in-depth check.\n        let spki = Self::extract_spki_der(end_entity.as_ref())?;\n        let got = Sha256::digest(spki);\n        if !bool::from(got.as_slice().ct_eq(\u0026self.pin_sha256)) {\n            return Err(Error::General(format!(\n                \"SPKI pin mismatch: peer SHA-256 {} != expected {}\",\n                hex::encode(got),\n                hex::encode(self.pin_sha256),\n            )));\n        }\n        Ok(ServerCertVerified::assertion())\n    }\n\n    fn verify_tls12_signature(\n        \u0026self,\n        _message: \u0026[u8],\n        _cert: \u0026CertificateDer\u003c'_\u003e,\n        _dss: \u0026DigitallySignedStruct,\n    ) -\u003e Result\u003cHandshakeSignatureValid, Error\u003e {\n        // We've already authenticated the cert via the pin; per rustls docs,\n        // returning `assertion()` here is the correct idiom for a custom\n        // verifier that doesn't want to re-implement TLS 1.2 signature checks.\n        // The handshake itself will still fail if the signature doesn't bind\n        // to the same key whose SPKI we verified.\n        Ok(HandshakeSignatureValid::assertion())\n    }\n\n    fn verify_tls13_signature(\n        \u0026self,\n        _message: \u0026[u8],\n        _cert: \u0026CertificateDer\u003c'_\u003e,\n        _dss: \u0026DigitallySignedStruct,\n    ) -\u003e Result\u003cHandshakeSignatureValid, Error\u003e {\n        Ok(HandshakeSignatureValid::assertion())\n    }\n\n    fn supported_verify_schemes(\u0026self) -\u003e Vec\u003cSignatureScheme\u003e {\n        // ECDSA P-256 (what the relay uses) + the common RSA schemes for\n        // future-proofing.\n        vec![\n            SignatureScheme::ECDSA_NISTP256_SHA256,\n            SignatureScheme::ECDSA_NISTP384_SHA384,\n            SignatureScheme::RSA_PSS_SHA256,\n            SignatureScheme::RSA_PSS_SHA384,\n            SignatureScheme::RSA_PSS_SHA512,\n            SignatureScheme::RSA_PKCS1_SHA256,\n            SignatureScheme::RSA_PKCS1_SHA384,\n            SignatureScheme::RSA_PKCS1_SHA512,\n            SignatureScheme::ED25519,\n        ]\n    }\n}\n\n// ============================================================================\n// Helpers\n// ============================================================================\n\n/// Minimal PEM → DER decoder. Accepts a single `-----BEGIN CERTIFICATE-----`\n/// block; anything more elaborate (multi-cert bundles, encrypted blocks) is\n/// rejected on purpose.\nfn pem_to_der(pem: \u0026str) -\u003e Result\u003cVec\u003cu8\u003e, String\u003e {\n    let mut body = String::with_capacity(pem.len());\n    let mut in_block = false;\n    for line in pem.lines() {\n        let l = line.trim();\n        if l == \"-----BEGIN CERTIFICATE-----\" {\n            in_block = true;\n            continue;\n        }\n        if l == \"-----END CERTIFICATE-----\" {\n            in_block = false;\n            continue;\n        }\n        if in_block {\n            body.push_str(l);\n        }\n    }\n    if body.is_empty() {\n        return Err(\"PEM did not contain a CERTIFICATE block\".into());\n    }\n    B64.decode(body.as_bytes())\n        .map_err(|e| format!(\"PEM body base64 decode: {e}\"))\n}\n\nfn ip_to_string(ip: \u0026rustls::pki_types::IpAddr) -\u003e String {\n    match ip {\n        rustls::pki_types::IpAddr::V4(v4) =\u003e {\n            let [a, b, c, d] = v4.as_ref();\n            format!(\"{a}.{b}.{c}.{d}\")\n        }\n        rustls::pki_types::IpAddr::V6(v6) =\u003e {\n            let bytes: \u0026[u8; 16] = v6.as_ref();\n            // Lossy but enough to compare against an IPv6-literal string — the\n            // project only ever pins an IPv4, so this branch is effectively dead.\n            let groups: [u16; 8] = [\n                u16::from_be_bytes([bytes[0], bytes[1]]),\n                u16::from_be_bytes([bytes[2], bytes[3]]),\n                u16::from_be_bytes([bytes[4], bytes[5]]),\n                u16::from_be_bytes([bytes[6], bytes[7]]),\n                u16::from_be_bytes([bytes[8], bytes[9]]),\n                u16::from_be_bytes([bytes[10], bytes[11]]),\n                u16::from_be_bytes([bytes[12], bytes[13]]),\n                u16::from_be_bytes([bytes[14], bytes[15]]),\n            ];\n            groups\n                .iter()\n                .map(|g| format!(\"{g:x}\"))\n                .collect::\u003cVec\u003c_\u003e\u003e()\n                .join(\":\")\n        }\n    }\n}\n\n// ============================================================================\n// Tests\n// ============================================================================\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn embedded_cert_decodes() {\n        let der = pem_to_der(EMBEDDED_CERT_PEM).expect(\"pem decode\");\n        assert!(\n            der.len() \u003e 100,\n            \"DER cert suspiciously short: {}\",\n            der.len()\n        );\n        // First two bytes of a DER cert are 0x30 0x82 (SEQUENCE, long form length).\n        assert_eq!(der[0], 0x30, \"DER must start with SEQUENCE tag\");\n    }\n\n    #[test]\n    fn embedded_cert_spki_matches_pin() {\n        // This is the whole point of the module — if this ever fails, the\n        // cert and the pin have diverged and the relay will be unreachable.\n        let der = pem_to_der(EMBEDDED_CERT_PEM).unwrap();\n        let spki = PinnedCertVerifier::extract_spki_der(\u0026der).unwrap();\n        let got = Sha256::digest(spki);\n        let pin = B64.decode(PIN_SHA256_B64).unwrap();\n        assert_eq!(\n            got.as_slice(),\n            pin.as_slice(),\n            \"embedded cert's SPKI SHA-256 does not match PIN_SHA256_B64\"\n        );\n    }\n\n    #[test]\n    fn verifier_new_succeeds() {\n        let v = PinnedCertVerifier::new().expect(\"verifier build\");\n        assert_eq!(v.expected_host, PINNED_HOST);\n        assert_eq!(v.pin_sha256.len(), 32);\n    }\n\n    #[test]\n    fn pem_rejects_empty_input() {\n        let err = pem_to_der(\"\").unwrap_err();\n        assert!(err.contains(\"CERTIFICATE block\"));\n    }\n\n    #[test]\n    fn pem_rejects_garbage() {\n        let err =\n            pem_to_der(\"-----BEGIN CERTIFICATE-----\\nnot-base64!!\\n-----END CERTIFICATE-----\")\n                .unwrap_err();\n        assert!(err.contains(\"base64\"));\n    }\n}\n","traces":[{"line":62,"address":[1844128],"length":1,"stats":{"Line":3}},{"line":63,"address":[1510248],"length":1,"stats":{"Line":3}},{"line":73," ces `abs(now - ts) ≤ 30 s` on `/auth/v2/verify`, closing\n//! the replay window that was previously only bounded by the 60 s nonce TTL.\n//!\n//! Timeouts match Kotlin exactly: connect 10 s, read 15 s.\n\nuse crate::pin::PinnedCertVerifier;\nuse frappuccino_crypto_core::identity::StreamIdentity;\nuse frappuccino_crypto_core::ratchet::{RatchetSignature, RotationProof, BATCH_SIZE};\nuse rustls::crypto::ring::default_provider;\nuse rustls::ClientConfig;\nuse serde::{Deserialize, Serialize};\nuse std::sync::Arc;\nuse std::time::Duration;\n\n/// Errors bubbling up from a [`StreamServerClient`] call.\n#[derive(Debug, thiserror::Error)]\npub enum ProtocolError {\n    /// Network / HTTP layer failure (DNS, connect, TLS, timeout, malformed\n    /// response framing, …).\n    #[error(\"HTTP error: {0}\")]\n    Http(#[from] reqwest::Error),\n    /// JSON decode failure of a response the server sent.\n    #[error(\"JSON error: {0}\")]\n    Json(#[from] serde_json::Error),\n    /// rustls configuration rejected our custom verifier / provider.\n    #[error(\"TLS config error: {0}\")]\n    Tls(String),\n    /// Server returned success but the payload was incoherent (missing field,\n    /// unparseable hex, wrong length).\n    #[error(\"invalid server response: {0}\")]\n    Invalid(String),\n}\n\n/// Outcome of an enrollment attempt.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum EnrollResult {\n    /// HTTP 200 — the identity was newly registered.\n    Success,\n    /// HTTP 409 — this `ed25519_pk` was already on record. Idempotent retries\n    /// hit this path.\n    AlreadyEnrolled,\n    /// Any other status. `body` is the response body verbatim for logging —\n    /// never logged automatically to avoid leaking server internals.\n    Failed {\n        /// HTTP status code.\n        code: u16,\n        /// Response body.\n        body: String,\n    },\n}\n\n/// Fresh challenge emitted by `/auth/challenge`. The caller MUST sign\n/// `nonce ‖ timestamp_BE_u64` (40 bytes) — signing the raw nonce alone is\n/// rejected by the server starting at S9-pre-audit.\n///\n/// `timestamp` is Unix seconds as seen by the server at the time the nonce\n/// was minted. The server keeps a ±30 s tolerance window on verify so a\n/// reasonable client clock skew (NTP drift, phone sleep) still authenticates.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct ChallengeValue {\n    /// 32-byte server-generated nonce.\n    pub nonce: [u8; 32],\n    /// Unix seconds when the server minted the nonce.\n    pub timestamp: u64,\n}\n\nimpl ChallengeValue {\n    /// The 40-byte message the client must sign via the ratchet. Keeps the\n    /// composition in one place so the client and the server can't drift.\n    #[must_use]\n    pub fn message_bytes(\u0026self) -\u003e [u8; 40] {\n        let mut buf = [0u8; 40];\n        buf[..32].copy_from_slice(\u0026self.nonce);\n        buf[32..].copy_from_slice(\u0026self.timestamp.to_be_bytes());\n        buf\n    }\n}\n\n/// Non-secret view of the server's knowledge about an identity. Fetched via\n/// `GET /auth/v2/status/{pk}` — useful to confirm an enrollment landed or to\n/// display remaining slot count in the UI.\n#[derive(Debug, Clone, PartialEq, Eq, Deserialize)]\npub struct IdentityStatus {\n    /// Current active batch number (`0` right after enrollment).\n    pub batch_number: u32,\n    /// How many ephemeral keys of the active batch have been consumed.\n    pub consumed_count: u32,\n    /// Remaining slots in the active batch (= `BATCH_SIZE - consumed_count`).\n    pub remaining_count: u32,\n    /// Unix seconds of the initial enrollment.\n    pub enrolled_at: i64,\n    /// Whether the server has marked this identity revoked.\n    pub revoked: bool,\n}\n\n/// Blocking client for the V2 relay.\n///\n/// Cheap to clone once built — `reqwest::blocking::Client` internally shares a\n/// connection pool via `Arc`.\n#[derive(Debug, Clone)]\npub struct StreamServerClient {\n    base_url: String,\n    http: reqwest::blocking::Client,\n}\n\nimpl StreamServerClient {\n    /// Build a pinned client against `base_url`. Typical input:\n    /// `\"https://136.244.101.236:8443\"`.\n    ///\n    /// # Errors\n    /// Returns [`ProtocolError::Tls`] if the embedded cert / pin can't be\n    /// parsed, or [`ProtocolError::Http`] if reqwest can't assemble the\n    /// underlying TLS stack (missing crypto provider, etc.).\n    pub fn new(base_url: impl Into\u003cString\u003e) -\u003e Result\u003cSelf, ProtocolError\u003e {\n        let verifier = PinnedCertVerifier::new().map_err(|e| ProtocolError::Tls(e.to_string()))?;\n\n        // Explicit ring provider — avoids relying on `install_default()` global\n        // state which other crates may have poisoned.\n        let config = ClientConfig::builder_with_provider(Arc::new(default_provider()))\n            .with_protocol_versions(\u0026[\u0026rustls::version::TLS13, \u0026rustls::version::TLS12])\n            .map_err(|e| ProtocolError::Tls(format!(\"protocol version: {e}\")))?\n            .dangerous()\n            .with_custom_certificate_verifier(Arc::new(verifier))\n            .with_no_client_auth();\n\n        let http = reqwest::blocking::Client::builder()\n            .use_preconfigured_tls(config)\n            .connect_timeout(Duration::from_secs(10))\n            .timeout(Duration::from_secs(15))\n            .build()?;\n\n        Ok(Self {\n            base_url: base_url.into(),\n            http,\n        })\n    }\n\n    // =========================================================================\n    // Enrollment\n    // =========================================================================\n\n    /// `POST /auth/v2/enroll` — register an identity with its `batch_0` keys.\n    ///\n    /// `batch0_signature` must be the Ed25519 signature of\n    /// `concat(batch0_public_keys)` by the enrollment key owned by the caller.\n    ///\n    /// # Errors\n    /// See [`ProtocolError`].\n    pub fn enroll(\n        \u0026self,\n        identity_pk_hex: \u0026str,\n        batch0_public_keys: \u0026[[u8; 32]; BATCH_SIZE],\n        batch0_signature: \u0026[u8; 64],\n    ) -\u003e Result\u003cEnrollResult, ProtocolError\u003e {\n        let body = EnrollBody {\n            ed25519_pk: identity_pk_hex.to_string(),\n            batch_0_public_keys: batch0_public_keys.iter().map(hex::encode).collect(),\n            batch_0_signature: hex::encode(batch0_signature),\n        };\n        let resp = self\n            .http\n            .post(format!(\"{}/auth/v2/enroll\", self.base_url))\n            .json(\u0026body)\n            .send()?;\n        let code = resp.status().as_u16();\n        match code {\n            200 =\u003e Ok(EnrollResult::Success),\n            409 =\u003e Ok(EnrollResult::AlreadyEnrolled),\n            _ =\u003e {\n                let body_text = resp.text().unwrap_or_default();\n                Ok(EnrollResult::Failed {\n                    code,\n                    body: body_text,\n                })\n            }\n        }\n    }\n\n    // =========================================================================\n    // Challenge + Verify (auth flow)\n    // =========================================================================\n\n    /// `POST /auth/challenge` — fetch a fresh 32-byte server nonce + the\n    /// timestamp the server stamped it with.\n    ///\n    /// The client must sign `nonce ‖ timestamp_BE_u64` (see\n    /// [`ChallengeValue::message_bytes`]). Signing the raw nonce is rejected\n    /// by the server.\n    ///\n    /// # Errors\n    /// [`ProtocolError::Http`] on network failure, [`ProtocolError::Invalid`]\n    /// if the server's `nonce` is missing or isn't 64 hex chars, or the\n    /// `timestamp` field is missing.\n    pub fn challenge(\u0026self) -\u003e Result\u003cChallengeValue, ProtocolError\u003e {\n        let resp = self\n            .http\n            .post(format!(\"{}/auth/challenge\", self.base_url))\n            .header(\"Content-Type\", \"application/json\")\n            .body(\"\")\n            .send()?\n            .error_for_status()?;\n        let body: ChallengeResponse = resp.json()?;\n        let nonce_vec = hex::decode(\u0026body.nonce)\n            .map_err(|e| ProtocolError::Invalid(format!(\"challenge nonce hex: {e}\")))?;\n        let nonce: [u8; 32] = nonce_vec\n            .try_into()\n            .map_err(|v: Vec\u003cu8\u003e| ProtocolError::Invalid(format!(\"nonce length {}\", v.len())))?;\n        Ok(ChallengeValue {\n            nonce,\n            timestamp: body.timestamp,\n        })\n    }\n\n    /// `POST /auth/v2/verify` — exchange a ratchet signature for a JWT bearer.\n    ///\n    /// `sig` must cover `nonce ‖ timestamp_BE_u64` (= [`ChallengeValue::message_bytes`]).\n    /// `nonce_hex` and `timestamp` must be the ones returned by [`challenge`].\n    ///\n    /// Returns `Some(\"Bearer \u003cjwt\u003e\")` on success, `None` if the server refused\n    /// (bad signature, consumed slot, wrong batch, skew beyond ±30 s, etc.).\n    ///\n    /// # Errors\n    /// Network / decode errors; a rejected signature is `Ok(None)`, *not* an\n    /// error — mirrors the Kotlin client's `null`-on-non-2xx semantics.\n    pub fn verify(\n        \u0026self,\n        identity: \u0026StreamIdentity,\n        sig: \u0026RatchetSignature,\n        nonce_hex: \u0026str,\n        timestamp: u64,\n    ) -\u003e Result\u003cOption\u003cString\u003e, ProtocolError\u003e {\n        let body = VerifyBody {\n            ed25519_pk: hex::encode(identity.ed25519_pk()),\n            ephemeral_pk: hex::encode(sig.ephemeral_public_key),\n            batch_number: sig.batch_number,\n            key_index: sig.key_index,\n            nonce: nonce_hex.to_string(),\n            timestamp,\n            signature: hex::encode(sig.signature),\n        };\n        let resp = self\n            .http\n            .post(format!(\"{}/auth/v2/verify\", self.base_url))\n            .json(\u0026body)\n            .send()?;\n        if !resp.status().is_success() {\n            return Ok(None);\n        }\n        let json: VerifyResponse = resp.json()?;\n        if json.access_token.is_empty() {\n            Ok(None)\n        } else {\n            Ok(Some(format!(\"Bearer {}\", json.access_token)))\n        }\n    }\n\n    // =========================================================================\n    // Rotation\n    // =========================================================================\n\n    /// `POST /auth/v2/rotate-batch` — advance from `signer_batch_number` to\n    /// `signer_batch_number + 1` using the 50 fresh keys in `proof`.\n    ///\n    /// Returns `true` iff the server accepted; `false` if it refused (which\n    /// includes stale signer, mismatched batch, revoked identity).\n    ///\n    /// # Errors\n    /// Only the network / TLS / framing kind — server refusals are `Ok(false)`.\n    pub fn rotate_batch(\n        \u0026self,\n        identity_pk_hex: \u0026str,\n        proof: \u0026RotationProof,\n    ) -\u003e Result\u003cbool, ProtocolError\u003e {\n        let body = RotateBody {\n            ed25519_pk: identity_pk_hex.to_string(),\n            signer_batch_number: proof.signer_batch_number,\n            signer_key_index: proof.signer_key_index,\n            signer_public_key: hex::encode(proof.signer_public_key),\n            new_batch_public_keys: proof\n                .new_batch_public_keys\n                .iter()\n                .map(hex::encode)\n                .collect(),\n            new_batch_signature: hex::encode(proof.signature),\n        };\n        let resp = self\n            .http\n            .post(format!(\"{}/auth/v2/rotate-batch\", self.base_url))\n            .json(\u0026body)\n            .send()?;\n        Ok(resp.status().is_success())\n    }\n\n    // =========================================================================\n    // Status\n    // =========================================================================\n\n    /// `GET /auth/v2/status/{pk_hex}` — server-side view of the identity.\n    ///\n    /// Returns `None` on HTTP 404 (identity not enrolled) *and* on any other\n    /// non-2xx (mirrors Kotlin `null` semantics).\n    ///\n    /// # Errors\n    /// See [`ProtocolError`].\n    pub fn get_status(\n        \u0026self,\n        identity_pk_hex: \u0026str,\n    ) -\u003e Result\u003cOption\u003cIdentityStatus\u003e, ProtocolError\u003e {\n        let resp = self\n            .http\n            .get(format!(\n                \"{}/auth/v2/status/{identity_pk_hex}\",\n                self.base_url\n            ))\n            .send()?;\n        if !resp.status().is_success() {\n            return Ok(None);\n        }\n        let status: IdentityStatus = resp.json()?;\n        Ok(Some(status))\n    }\n}\n\n// ============================================================================\n// Wire types — Serialize only (we don't decode our own request bodies).\n// Field order matches Kotlin's `JSONObject.put` order for byte-exact parity\n// with `parity-vectors/protocol/*.json` under `serde_json`'s default\n// struct-ordered emission.\n// ============================================================================\n\n#[derive(Debug, Serialize)]\nstruct EnrollBody {\n    ed25519_pk: String,\n    batch_0_public_keys: Vec\u003cString\u003e,\n    batch_0_signature: String,\n}\n\n#[derive(Debug, Serialize)]\nstruct VerifyBody {\n    ed25519_pk: String,\n    ephemeral_pk: String,\n    batch_number: u32,\n    key_index: u32,\n    nonce: String,\n    timestamp: u64,\n    signature: String,\n}\n\n#[derive(Debug, Serialize)]\nstruct RotateBody {\n    ed25519_pk: String,\n    signer_batch_number: u32,\n    signer_key_index: u32,\n    signer_public_key: String,\n    new_batch_public_keys: Vec\u003cString\u003e,\n    new_batch_signature: String,\n}\n\n#[derive(Debug, Deserialize)]\nstruct ChallengeResponse {\n    nonce: String,\n    timestamp: u64,\n}\n\n#[derive(Debug, Deserialize)]\nstruct VerifyResponse {\n    #[serde(default)]\n    access_token: String,\n}\n\n// ============================================================================\n// Unit tests — byte-exact parity of request bodies against captured fixtures.\n// E2E tests live in `tests/e2e_protocol.rs` and are `#[ignore]`d by default.\n// ============================================================================\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn enroll_body_matches_kotlin_fixture() {\n        // Fixture: crypto-rs/parity-vectors/protocol/enroll_req.json\n        let identity_hex = \"f373b6de310a66e4b4f0e1ab355c89446762b59b47895d2d42ecfa5ed8d36920\";\n        let batch_keys_hex = [\n            \"7e8650d32c0d2797e22f8070711abdc6ddeb4e98ea1e0848f250ba845f3a17f5\",\n            \"17e0116700e346955a96e84617c70662ecef062105d427c6ebff6f319636430a\",\n        ];\n        let mut keys = [[0u8; 32]; BATCH_SIZE];\n        keys[0].copy_from_slice(\u0026hex::decode(batch_keys_hex[0]).unwrap());\n        keys[1].copy_from_slice(\u0026hex::decode(batch_keys_hex[1]).unwrap());\n        // Slots 2..50 remain zero for this shape-only test.\n        let sig = [0u8; 64];\n\n        let body = EnrollBody {\n            ed25519_pk: identity_hex.to_string(),\n            batch_0_public_keys: keys.iter().map(hex::encode).collect(),\n            batch_0_signature: hex::encode(sig),\n        };\n        let json = serde_json::to_string(\u0026body).unwrap();\n        let parsed: serde_json::Value = serde_json::from_str(\u0026json).unwrap();\n        assert_eq!(parsed[\"ed25519_pk\"], identity_hex);\n        assert_eq!(parsed[\"batch_0_public_keys\"][0], batch_keys_hex[0]);\n        assert_eq!(parsed[\"batch_0_public_keys\"][1], batch_keys_hex[1]);\n        assert_eq!(parsed[\"batch_0_signature\"], hex::encode([0u8; 64]));\n        // 50 entries total, even zeroed tail slots included.\n        assert_eq!(parsed[\"batch_0_public_keys\"].as_array().unwrap().len(), 50);\n    }\n\n    #[test]\n    fn verify_body_shape_matches_fixture() {\n        // Shape-only test post-S9: the Kotlin fixture verify_req.json predates\n        // the timestamp field, so we no longer byte-compare — we just make\n        // sure every expected field is present on the wire.\n        let body = VerifyBody {\n            ed25519_pk: \"f373b6de310a66e4b4f0e1ab355c89446762b59b47895d2d42ecfa5ed8d36920\".into(),\n            ephemeral_pk: \"7e8650d32c0d2797e22f8070711abdc6ddeb4e98ea1e0848f250ba845f3a17f5\"\n                .into(),\n            batch_number: 0,\n            key_index: 0,\n            nonce: \"0\".repeat(64),\n            timestamp: 1_744_567_890,\n            signature: \"d3e87bfdaf807a39e7f3d824b76d38589899a73ccc50adf73884c535cfc626aee22f8cc31fa1032e3d7733c8aa20fe9cf96db1f292b86512280b8d7cebf0f207\".into(),\n        };\n        let json = serde_json::to_value(\u0026body).unwrap();\n        for key in [\n            \"ed25519_pk\",\n            \"ephemeral_pk\",\n            \"batch_number\",\n            \"key_index\",\n            \"nonce\",\n            \"timestamp\",\n            \"signature\",\n        ] {\n            assert!(json.get(key).is_some(), \"missing field {key}\");\n        }\n        assert_eq!(json[\"batch_number\"], 0);\n        assert_eq!(json[\"key_index\"], 0);\n        assert_eq!(json[\"timestamp\"], 1_744_567_890u64);\n    }\n\n    #[test]\n    fn challenge_value_message_bytes_is_nonce_concat_ts_be() {\n        let nonce = [0x11u8; 32];\n        let ts: u64 = 0x0102_0304_0506_0708;\n        let cv = ChallengeValue {\n            nonce,\n            timestamp: ts,\n        };\n        let bytes = cv.message_bytes();\n        assert_eq!(\u0026bytes[..32], \u0026nonce);\n        assert_eq!(\u0026bytes[32..], \u0026ts.to_be_bytes());\n    }\n\n    #[test]\n    fn rotate_body_shape_matches_fixture() {\n        // Fixture: crypto-rs/parity-vectors/protocol/rotate_req.json\n        let keys: Vec\u003cString\u003e = (0..BATCH_SIZE)\n            .map(|i| hex::encode([u8::try_from(i).unwrap_or(0); 32]))\n            .collect();\n        let body = RotateBody {\n            ed25519_pk: \"f373b6de310a66e4b4f0e1ab355c89446762b59b47895d2d42ecfa5ed8d36920\".into(),\n            signer_batch_number: 0,\n            signer_key_index: 1,\n            signer_public_key: \"17e0116700e346955a96e84617c70662ecef062105d427c6ebff6f319636430a\"\n                .into(),\n            new_batch_public_keys: keys,\n            new_batch_signature: hex::encode([0u8; 64]),\n        };\n        let json = serde_json::to_value(\u0026body).unwrap();\n        for key in [\n            \"ed25519_pk\",\n            \"signer_batch_number\",\n            \"signer_key_index\",\n            \"signer_public_key\",\n            \"new_batch_public_keys\",\n            \"new_batch_signature\",\n        ] {\n            assert!(json.get(key).is_some(), \"missing field {key}\");\n        }\n        assert_eq!(json[\"new_batch_public_keys\"].as_array().unwrap().len(), 50);\n    }\n\n    #[test]\n    fn identity_status_deserializes() {\n        let raw = r#\"{\n            \"batch_number\": 3,\n            \"consumed_count\": 7,\n            \"remaining_count\": 43,\n            \"enrolled_at\": 1744567890,\n            \"revoked\": false\n        }\"#;\n        let parsed: IdentityStatus = serde_json::from_str(raw).unwrap();\n        assert_eq!(parsed.batch_number, 3);\n        assert_eq!(parsed.consumed_count, 7);\n        assert_eq!(parsed.remaining_count, 43);\n        assert_eq!(parsed.enrolled_at, 1_744_567_890);\n        assert!(!parsed.revoked);\n    }\n\n    #[test]\n    fn challenge_response_deserializes() {\n        let raw = r#\"{\"nonce\":\"deadbeef\",\"timestamp\":1744567890}\"#;\n        let parsed: ChallengeResponse = serde_json::from_str(raw).unwrap();\n        assert_eq!(parsed.nonce, \"deadbeef\");\n        assert_eq!(parsed.timestamp, 1_744_567_890);\n    }\n\n    #[test]\n    fn verify_response_missing_token_defaults_empty() {\n        let raw = \"{}\";\n        let parsed: VerifyResponse = serde_json::from_str(raw).unwrap();\n        assert!(parsed.access_token.is_empty());\n    }\n}\n","traces":[{"line":87,"address":[1888192],"length":1,"stats":{"Line":3}},{"line":88,"address":[1922823],"length":1,"stats":{"Line":3}},{"line":89,"address":[1613528],"length":1,"stats":{"Line":3}},{"line":90,"address":[1865659],"length":1,"stats":{"Line":3}},{"line":91,"address":[1865758],"length":1,"stats":{"Line":3}},{"line":130,"address":[1523648,1525585,1525761],"length":1,"stats":{"Line":1}},{"line":131,"address":[1523838,1525776,1525799,1523706,1525759],"length":1,"stats":{"Line":2}},{"line":135,"address":[1524267,1524427,1524717,1524667,1524189,1524129],"length":1,"stats":{"Line":5}},{"line":136,"address":[],"length":0,"stats":{"Line":1}},{"line":137,"address":[],"length":0,"stats":{"Line":0}},{"line":139,"address":[1524621,1525679,1524709,1525701,1524519],"length":1,"stats":{"Line":2}},{"line":142,"address":[],"length":0,"stats":{"Line":5}},{"line":143,"address":[1524812,1524883],"length":1,"stats":{"Line":2}},{"line":144,"address":[1524896,1525635,1524912,1524993],"length":1,"stats":{"Line":2}},{"line":145,"address":[1525014,1525613,1525111,1525030],"length":1,"stats":{"Line":2}},{"line":148,"address":[],"length":0,"stats":{"Line":1}},{"line":149,"address":[],"length":0,"stats":{"Line":1}},{"line":150,"address":[],"length":0,"stats":{"Line":1}},{"line":165,"address":[1924539,1923024,1924569],"length":1,"stats":{"Line":1}},{"line":172,"address":[1923136],"length":1,"stats":{"Line":1}},{"line":173,"address":[1613849,1613941],"length":1,"stats":{"Line":2}},{"line":174,"address":[1866076],"length":1,"stats":{"Line":1}},{"line":176,"address":[1889044,1889209,1888864],"length":1,"stats":{"Line":2}},{"line":178,"address":[1869579,1869516],"length":1,"stats":{"Line":2}},{"line":181,"address":[1614614,1614672],"length":1,"stats":{"Line":2}},{"line":182,"address":[1924025],"length":1,"stats":{"Lin _SIZE_NO_GRANTS, NONCE_PREFIX_BYTES};\n\nconst MN: \u0026str = \"abaisser abandon abdiquer abeille abolir aborder aboutir aboyer abrasif abreuver abriter abroger\";\n\nfn archive() -\u003e ArchiveIdentity {\n    ArchiveIdentity::from_mnemonic(MN, \"\").expect(\"archive identity\")\n}\n\n#[test]\nfn decrypt_rejects_unknown_mode_byte() {\n    let archive = archive();\n    let author = archive.identity().clone();\n    let mut blob = encrypt_single(b\"hello\", \u0026author).unwrap();\n    // Header ends at HEADER_SIZE_NO_GRANTS (= 119 for grant_count=0). The\n    // next byte is the mode — flip it to something invalid.\n    blob[HEADER_SIZE_NO_GRANTS] = 0x7f;\n    let err = decrypt(\u0026blob, \u0026archive).unwrap_err();\n    assert!(\n        format!(\"{err:?}\").contains(\"unknown mode byte\"),\n        \"expected 'unknown mode byte', got {err:?}\"\n    );\n}\n\n#[test]\nfn decrypt_single_rejects_body_too_short() {\n    let archive = archive();\n    let author = archive.identity().clone();\n    let mut blob = encrypt_single(b\"hello\", \u0026author).unwrap();\n    // Chop the body down to fewer than NONCE_BYTES + AEAD_TAG_BYTES\n    // (= 40 bytes) while keeping the header + mode byte intact.\n    let mode_off = HEADER_SIZE_NO_GRANTS; // 119\n    blob.truncate(mode_off + 1 + 10); // 10-byte body ≪ 40\n    let err = decrypt(\u0026blob, \u0026archive).unwrap_err();\n    assert!(\n        format!(\"{err:?}\").contains(\"SINGLE body too short\"),\n        \"expected 'SINGLE body too short', got {err:?}\"\n    );\n}\n\n#[test]\nfn decrypt_single_rejects_tampered_ciphertext() {\n    let archive = archive();\n    let author = archive.identity().clone();\n    let mut blob = encrypt_single(b\"the quick brown fox\", \u0026author).unwrap();\n    // Flip one byte in the ciphertext (past the mode + nonce).\n    let ct_start = HEADER_SIZE_NO_GRANTS + 1 + 24;\n    let ct_byte = ct_start + 3;\n    blob[ct_byte] ^= 0x01;\n    let err = decrypt(\u0026blob, \u0026archive).unwrap_err();\n    // AEAD failure surfaces as `CryptoError::WrongPin` (by design — the\n    // caller must not distinguish \"wrong recipient\" from \"tampered blob\").\n    assert!(\n        format!(\"{err:?}\").contains(\"WrongPin\"),\n        \"expected WrongPin after AEAD tag failure, got {err:?}\"\n    );\n}\n\n#[test]\nfn decrypt_chunked_rejects_body_too_short() {\n    let archive = archive();\n    let author = archive.identity().clone();\n    let plaintext = vec![0u8; 2 * 1024 * 1024 + 1]; // 3 chunks\n    let mut blob = encrypt_chunked(\u0026plaintext, \u0026author).unwrap();\n    // Truncate right after the mode byte — body now \u003c NONCE_PREFIX_BYTES + 4.\n    let mode_off = HEADER_SIZE_NO_GRANTS;\n    blob.truncate(mode_off + 1 + 5);\n    let err = decrypt(\u0026blob, \u0026archive).unwrap_err();\n    assert!(\n        format!(\"{err:?}\").contains(\"CHUNKED body too short\"),\n        \"expected 'CHUNKED body too short', got {err:?}\"\n    );\n}\n\n#[test]\nfn decrypt_chunked_rejects_chunk_count_over_cap() {\n    let archive = archive();\n    let author = archive.identity().clone();\n    let plaintext = vec![0u8; 2 * 1024 * 1024 + 1];\n    let mut blob = encrypt_chunked(\u0026plaintext, \u0026author).unwrap();\n    // chunk_count lives at body[NONCE_PREFIX_BYTES..+4] = blob[header+1+20..+4].\n    let cc_off = HEADER_SIZE_NO_GRANTS + 1 + NONCE_PREFIX_BYTES;\n    let bogus: u32 = 2_000_000; // \u003e MAX_CHUNK_COUNT = 1_000_000\n    blob[cc_off..cc_off + 4].copy_from_slice(\u0026bogus.to_be_bytes());\n    let err = decrypt(\u0026blob, \u0026archive).unwrap_err();\n    assert!(\n        format!(\"{err:?}\").contains(\"exceeds cap\"),\n        \"expected 'exceeds cap', got {err:?}\"\n    );\n}\n\n#[test]\nfn decrypt_chunked_rejects_missing_chunk_len() {\n    let archive = archive();\n    let author = archive.identity().clone();\n    let plaintext = vec![0u8; 2 * 1024 * 1024 + 1];\n    let mut blob = encrypt_chunked(\u0026plaintext, \u0026author).unwrap();\n    // Keep the prefix + chunk_count = 3 intact, but drop everything\n    // after. Decoder loops 0..3 and fails reading the first chunk_len.\n    let cc_off = HEADER_SIZE_NO_GRANTS + 1 + NONCE_PREFIX_BYTES;\n    blob.truncate(cc_off + 4 + 2); // only 2 stray bytes where u32 len sits\n    let err = decrypt(\u0026blob, \u0026archive).unwrap_err();\n    assert!(\n        format!(\"{err:?}\").contains(\"chunk 0: missing len\"),\n        \"expected 'chunk 0: missing len', got {err:?}\"\n    );\n}\n\n#[test]\nfn decrypt_chunked_rejects_chunk_len_over_cap() {\n    let archive = archive();\n    let author = archive.identity().clone();\n    let plaintext = vec![0u8; 2 * 1024 * 1024 + 1];\n    let mut blob = encrypt_chunked(\u0026plaintext, \u0026author).unwrap();\n    // Patch the first chunk's total_len to 0xffff_ffff (\u003e MAX_CHUNK_LEN).\n    let first_chunk_len_off = HEADER_SIZE_NO_GRANTS + 1 + NONCE_PREFIX_BYTES + 4;\n    blob[first_chunk_len_off..first_chunk_len_off + 4].copy_from_slice(\u0026u32::MAX.to_be_bytes());\n    let err = decrypt(\u0026blob, \u0026archive).unwrap_err();\n    assert!(\n        format!(\"{err:?}\").contains(\"out of range\"),\n        \"expected 'out of range', got {err:?}\"\n    );\n}\n\n#[test]\nfn decrypt_chunked_rejects_truncated_chunk_body() {\n    let archive = archive();\n    let author = archive.identity().clone();\n    let plaintext = vec![0u8; 2 * 1024 * 1024 + 1];\n    let mut blob = encrypt_chunked(\u0026plaintext, \u0026author).unwrap();\n    // Cut the blob mid-ciphertext inside the first chunk (past the\n    // first chunk's total_len + nonce but before the ct ends).\n    let first_chunk_data_off = HEADER_SIZE_NO_GRANTS + 1 + NONCE_PREFIX_BYTES + 4;\n    // Leave only 50 bytes of the first chunk body (\u003c declared total_len).\n    blob.truncate(first_chunk_data_off + 4 + 50);\n    let err = decrypt(\u0026blob, \u0026archive).unwrap_err();\n    assert!(\n        format!(\"{err:?}\").contains(\"truncated body\"),\n        \"expected 'truncated body', got {err:?}\"\n    );\n}\n","traces":[{"line":17,"address":[1519760],"length":1,"stats":{"Line":1}},{"line":18,"address":[1519774],"length":1,"stats":{"Line":1}}],"covered":2,"coverable":2},{"path":["/","work","stream","tests","e2e_protocol.rs"],"content":"//! End-to-end tests against the live V2 relay (`https://136.244.101.236:8443`).\n//!\n//! All tests are `#[ignore]` by default — run with:\n//! ```sh\n//! cargo test -p frappuccino-crypto-stream --test e2e_protocol --release -- --ignored\n//! ```\n//!\n//! Requires network connectivity to the Vultr relay. Each run generates a\n//! fresh BIP-39 mnemonic so there are no identity collisions between runs.\n//!\n//! Mirrors `stream-crypto/src/androidTest/java/.../StreamServerClientTest.kt`.\n\nuse frappuccino_crypto_core::bip39;\nuse frappuccino_crypto_core::identity::EnrollmentKit;\nuse frappuccino_crypto_core::ratchet::{EphemeralRatchet, RatchetSignature, BATCH_SIZE};\nuse frappuccino_crypto_stream::pin::PinnedCertVerifier;\nuse frappuccino_crypto_stream::{EnrollResult, StreamServerClient};\nuse rustls::ClientConfig;\nuse std::sync::Arc;\nuse std::time::Duration;\n\nconst BASE_URL: \u0026str = \"https://136.244.101.236:8443\";\nconst CHAIN_KEY_BYTES: usize = 32;\n\n// ============================================================================\n// Helpers — fresh identity + initialized ratchet\n// ============================================================================\n\nstruct FreshIdentity {\n    kit: EnrollmentKit,\n    ratchet: EphemeralRatchet,\n    batch0_pks: [[u8; 32]; BATCH_SIZE],\n    enroll_sig: [u8; 64],\n    pk_hex: String,\n}\n\nfn fresh_identity() -\u003e FreshIdentity {\n    let mnemonic = bip39::generate_fr();\n    let mut kit = EnrollmentKit::from_mnemonic(\u0026mnemonic, \"\").expect(\"kit from mnemonic\");\n\n    let mut ratchet = EphemeralRatchet::new();\n    let chain = kit.take_chain_zero().expect(\"chain_0\");\n    let mut chain_bytes = [0u8; CHAIN_KEY_BYTES];\n    chain.with_bytes(|b| chain_bytes.copy_from_slice(b));\n    ratchet.initialize(\u0026mut chain_bytes).expect(\"ratchet init\");\n\n    let batch0_pks = ratchet.batch_public_keys().expect(\"batch_0 pks\");\n    let mut concat = Vec::with_capacity(BATCH_SIZE * 32);\n    for pk in \u0026batch0_pks {\n        concat.extend_from_slice(pk);\n    }\n    let enroll_sig = kit.sign_once(\u0026concat).expect(\"sign batch_0\");\n    let pk_hex = hex::encode(kit.identity().ed25519_pk());\n\n    FreshIdentity {\n        kit,\n        ratchet,\n        batch0_pks,\n        enroll_sig,\n        pk_hex,\n    }\n}\n\n// ============================================================================\n// Flow tests\n// ============================================================================\n\n#[test]\n#[ignore = \"E2E test: requires live Vultr relay + network\"]\nfn e2e_enroll_authenticate_rotate_against_live_server() {\n    let mut ident = fresh_identity();\n    let client = StreamServerClient::new(BASE_URL).expect(\"client build\");\n\n    // 1. Enroll\n    let r = client\n        .enroll(\u0026ident.pk_hex, \u0026ident.batch0_pks, \u0026ident.enroll_sig)\n        .expect(\"enroll call\");\n    assert_eq!(r, EnrollResult::Success, \"first enroll must succeed\");\n\n    // 2. Challenge + verify on batch_0 slot 0\n    let challenge = client.challenge().expect(\"challenge\");\n    let message = challenge.message_bytes();\n    let sig0: RatchetSignature = ident\n        .ratchet\n        .sign_and_advance(\u0026message)\n        .expect(\"sign slot 0\");\n    assert_eq!(sig0.batch_number, 0);\n    assert_eq!(sig0.key_index, 0);\n\n    let nonce_hex = hex::encode(challenge.nonce);\n    let jwt = client\n        .verify(ident.kit.identity(), \u0026sig0, \u0026nonce_hex, challenge.timestamp)\n        .expect(\"verify call\");\n    let jwt = jwt.expect(\"server issued a JWT\");\n    assert!(jwt.starts_with(\"Bearer \"), \"jwt prefix: {jwt}\");\n\n    // 3. Status reflects 1 consumed slot\n    let status = client\n        .get_status(\u0026ident.pk_hex)\n        .expect(\"status call\")\n        .expect(\"status present\");\n    assert_eq!(status.batch_number, 0);\n    assert_eq!(status.consumed_count, 1);\n    assert_eq!(status.remaining_count, 49);\n    assert!(!status.revoked);\n\n    // 4. Rotate (consume slot 1 for the rotation signature)\n    let proof = ident.ratchet.advance_batch().expect(\"advance batch\");\n    assert_eq!(proof.new_batch_number, 1);\n    assert_eq!(proof.signer_batch_number, 0);\n    let rot_ok = client\n        .rotate_batch(\u0026ident.pk_hex, \u0026proof)\n        .expect(\"rotate call\");\n    assert!(rot_ok, \"rotation must succeed\");\n\n    // 5. Verify on batch_1 slot 0\n    let challenge2 = client.challenge().expect(\"challenge #2\");\n    let msg2 = challenge2.message_bytes();\n    let sig2 = ident\n        .ratchet\n        .sign_and_advance(\u0026msg2)\n        .expect(\"sign slot 0 of batch 1\");\n    assert_eq!(sig2.batch_number, 1);\n    assert_eq!(sig2.key_index, 0);\n    let jwt2 = client\n        .verify(\n            ident.kit.identity(),\n            \u0026sig2,\n            \u0026hex::encode(challenge2.nonce),\n            challenge2.timestamp,\n        )\n        .expect(\"verify batch_1\");\n    assert!(jwt2.is_some(), \"batch_1 JWT expected\");\n\n    // 6. Replay attack: stale sig from batch_0 must be refused after rotation.\n    let challenge3 = client.challenge().expect(\"challenge #3\");\n    let fake_old = RatchetSignature {\n        signature: sig0.signature,\n        ephemeral_public_key: sig0.ephemeral_public_key,\n        batch_number: 0,\n        key_index: 0,\n    };\n    let rejected = client\n        .verify(\n            ident.kit.identity(),\n            \u0026fake_old,\n            \u0026hex::encode(challenge3.nonce),\n            challenge3.timestamp,\n        )\n        .expect(\"verify should return Ok(None), not Err\");\n    assert!(rejected.is_none(), \"stale batch_0 sig must be refused\");\n\n    ident.ratchet.wipe();\n}\n\n#[test]\n#[ignore = \"E2E test: requires live Vultr relay + network\"]\nfn e2e_enroll_twice_returns_already_enrolled() {\n    let ident = fresh_identity();\n    let client = StreamServerClient::new(BASE_URL).expect(\"client\");\n\n    let r1 = client\n        .enroll(\u0026ident.pk_hex, \u0026ident.batch0_pks, \u0026ident.enroll_sig)\n        .unwrap();\n    assert_eq!(r1, EnrollResult::Success);\n\n    let r2 = client\n        .enroll(\u0026ident.pk_hex, \u0026ident.batch0_pks, \u0026ident.enroll_sig)\n        .unwrap();\n    assert_eq!(r2, EnrollResult::AlreadyEnrolled);\n}\n\n// ============================================================================\n// Defense-in-depth negative test (CRIT-01) — a wrong pin must break the\n// handshake regardless of what cert the peer presents.\n// ============================================================================\n\n#[test]\n#[ignore = \"E2E test: requires live Vultr relay + network\"]\nfn e2e_wrong_spki_pin_rejects_handshake() {\n    // Obvious 32-byte zero pin — should never match any real cert.\n    let wrong_pin_b64 = \"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\";\n    let verifier = PinnedCertVerifier::with_pin_b64(wrong_pin_b64).expect(\"wrong verifier\");\n\n    let config =\n        ClientConfig::builder_with_provider(Arc::new(rustls::crypto::ring::default_provider()))\n            .with_protocol_versions(\u0026[\u0026rustls::version::TLS13, \u0026rustls::version::TLS12])\n            .unwrap()\n            .dangerous()\n            .with_custom_certificate_verifier(Arc::new(verifier))\n            .with_no_client_auth();\n\n    let http = reqwest::blocking::Client::builder()\n        .use_preconfigured_tls(config)\n        .connect_timeout(Duration::from_secs(10))\n        .timeout(Duration::from_secs(15))\n        .build()\n        .unwrap();\n\n    // The handshake MUST fail — that's the defense-in-depth property we're\n    // asserting (wrong SPKI pin = connection refused). reqwest's error\n    // message wording varies between versions (sometimes \"tls\", sometimes\n    // just \"error sending request\"), so we only assert the failure itself.\n    let err = http\n        .get(format!(\"{BASE_URL}/auth/challenge\"))\n        .send()\n        .expect_err(\"wrong SPKI pin MUST fail\");\n    // Sanity: the error must mention the URL we tried (proves reqwest did\n    // attempt the connection, not some earlier config failure).\n    let msg = err.to_string().to_lowercase();\n    assert!(\n        msg.contains(BASE_URL.trim_start_matches(\"https://\"))\n            || msg.contains(\"tls\")\n            || msg.contains(\"certificate\")\n            || msg.contains(\"handshake\")\n            || msg.contains(\"invalid\")\n            || msg.contains(\"sending request\"),\n        \"wrong SPKI pin should surface a connection error, got: {err}\"\n    );\n}\n","traces":[{"line":37,"address":[1537600,1539272,1539322],"length":1,"stats":{"Line":1}},{"line":38,"address":[1537668],"length":1,"stats":{"Line":1}},{"line":39,"address":[1537784,1537717],"length":1,"stats":{"Line":2}},{"line":41,"address":[1537890],"length":1,"stats":{"Line":1}},{"line":42,"address":[1537950,1538023],"length":1,"stats":{"Line":2}},{"line":43,"address":[1538093],"length":1,"stats":{"Line":1}},{"line":44,"address":[1538128],"length":1,"stats":{"Line":3}},{"line":45,"address":[1538179],"length":1,"stats":{"Line":1}},{"line":47,"address":[1538248],"length":1,"stats":{"Line":1}},{"line":48,"address":[1538317],"length":1,"stats":{"Line":1}},{"line":49,"address":[1538399,1538470],"length":1,"stats":{"Line":2}},{"line":50,"address":[1539267,1538570],"length":1,"stats":{"Line":2}},{"line":52,"address":[1538604],"length":1,"stats":{"Line":1}},{"line":53,"address":[1538712],"length":1,"stats":{"Line":1}}],"covered":14,"coverable":14},{"path":["/","work","stream","tests","header_errors.rs"],"content":"//! Error-path coverage for `stream::header::parse_header`.\n//!\n//! The fuzz target exercises these branches too, but `cargo tarpaulin`\n//! doesn't count fuzz runs — this file pins each variant deterministically.\n\nuse frappuccino_crypto_stream::header::{\n    parse_header, HeaderError, HEADER_SIZE_NO_GRANTS, OFF_AUTHOR_PK, OFF_GRANT_COUNT, OFF_VERSION,\n    VERSION_V1, VERSION_V2,\n};\n\nfn scaffold_valid() -\u003e Vec\u003cu8\u003e {\n    // Not AEAD-valid, just structurally parseable: magic + V2 + 32 B author\n    // pk + 80 B sealed envelope + 2 B grant_count (0) + mode byte.\n    let mut v = vec![0u8; HEADER_SIZE_NO_GRANTS + 1];\n    v[..4].copy_from_slice(b\"STRM\");\n    v[OFF_VERSION] = VERSION_V2;\n    // author pk, sealed envelope, grant_count=0 are already zero-filled.\n    v[HEADER_SIZE_NO_GRANTS] = 0x01; // MODE_SINGLE\n    v\n}\n\n#[test]\nfn parse_header_rejects_blob_shorter_than_header() {\n    let blob = vec![0u8; HEADER_SIZE_NO_GRANTS]; // missing the mode byte\n    let err = parse_header(\u0026blob).unwrap_err();\n    assert!(matches!(err, HeaderError::TooShort { .. }), \"got {err:?}\");\n}\n\n#[test]\nfn parse_header_rejects_bad_magic() {\n    let mut blob = scaffold_valid();\n    blob[0] = b'X';\n    let err = parse_header(\u0026blob).unwrap_err();\n    assert!(matches!(err, HeaderError::BadMagic), \"got {err:?}\");\n}\n\n#[test]\nfn parse_header_rejects_bad_version() {\n    let mut blob = scaffold_valid();\n    blob[OFF_VERSION] = 0x42; // neither V1 nor V2\n    let err = parse_header(\u0026blob).unwrap_err();\n    match err {\n        HeaderError::BadVersion { version } =\u003e assert_eq!(version, 0x42),\n        other =\u003e panic!(\"expected BadVersion, got {other:?}\"),\n    }\n}\n\n#[test]\nfn parse_header_accepts_both_v1_and_v2() {\n    let mut blob = scaffold_valid();\n    blob[OFF_VERSION] = VERSION_V1;\n    assert!(parse_header(\u0026blob).is_ok());\n    blob[OFF_VERSION] = VERSION_V2;\n    assert!(parse_header(\u0026blob).is_ok());\n}\n\n#[test]\nfn parse_header_rejects_truncated_with_grants() {\n    let mut blob = scaffold_valid();\n    // Claim 3 grants but don't extend the buffer to carry them.\n    let grant_count: u16 = 3;\n    blob[OFF_GRANT_COUNT..OFF_GRANT_COUNT + 2].copy_from_slice(\u0026grant_count.to_be_bytes());\n    let err = parse_header(\u0026blob).unwrap_err();\n    match err {\n        HeaderError::TruncatedWithGrants {\n            grant_count: gc, ..\n        } =\u003e assert_eq!(gc, 3),\n        other =\u003e panic!(\"expected TruncatedWithGrants, got {other:?}\"),\n    }\n}\n\n#[test]\nfn parse_header_roundtrips_author_pk() {\n    let mut blob = scaffold_valid();\n    for (i, slot) in blob[OFF_AUTHOR_PK..OFF_AUTHOR_PK + 32]\n        .iter_mut()\n        .enumerate()\n    {\n        *slot = u8::try_from(i).unwrap_or(0);\n    }\n    let parsed = parse_header(\u0026blob).unwrap();\n    assert_eq!(parsed.author_ed25519_pk[0], 0);\n    assert_eq!(parsed.author_ed25519_pk[31], 31);\n    assert_eq!(parsed.grant_count, 0);\n    assert_eq!(parsed.body_start, parsed.header_end + 1);\n}\n","traces":[{"line":11,"address":[1513936,1514255,1514249],"length":1,"stats":{"Line":1}},{"line":14,"address":[1514040,1513950],"length":1,"stats":{"Line":1}},{"line":15,"address":[1514098,1514007],"length":1,"stats":{"Line":2}},{"line":16,"address":[1514128],"length":1,"stats":{"Line":1}},{"line":18,"address":[1514169],"length":1,"stats":{"Line":1}},{"line":19,"address":[1514218],"length":1,"stats":{"Line":1}}],"covered":6,"coverable":6},{"path":["/","work","stream","tests","parity_protocol.rs"],"content":"//! Byte-exact parity tests for the V2 relay protocol request bodies against\n//! Kotlin-captured fixtures in `crypto-rs/parity-vectors/protocol/*.json`.\n//!\n//! We re-hydrate each fixture's payload into the matching Rust body type and\n//! confirm the serialized JSON is semantically equivalent (same keys, same\n//! values, same ordering within arrays). The server treats JSON as\n//! unordered at the object level, so `serde_json::Value` equality is the\n//! right granularity for interop parity.\n\nuse serde::Serialize;\nuse std::fs;\nuse std::path::PathBuf;\n\nfn fixture_dir() -\u003e PathBuf {\n    let mut p = PathBuf::from(env!(\"CARGO_MANIFEST_DIR\"));\n    p.pop();\n    p.push(\"parity-vectors\");\n    p.push(\"protocol\");\n    p\n}\n\nfn load_fixture_body(name: \u0026str) -\u003e serde_json::Value {\n    let raw =\n        fs::read_to_string(fixture_dir().join(name)).unwrap_or_else(|e| panic!(\"read {name}: {e}\"));\n    let file: serde_json::Value = serde_json::from_str(\u0026raw).unwrap();\n    file[\"body\"].clone()\n}\n\nfn serialize_to_value\u003cT: Serialize\u003e(v: \u0026T) -\u003e serde_json::Value {\n    serde_json::to_value(v).unwrap()\n}\n\n// ============================================================================\n// These helpers mirror the private wire types in `protocol.rs`. Duplicated on\n// purpose so the integration tests exercise the public hex/encode path rather\n// than rely on a testing-only re-export.\n// ============================================================================\n\n#[derive(Serialize)]\nstruct EnrollBody {\n    ed25519_pk: String,\n    batch_0_public_keys: Vec\u003cString\u003e,\n    batch_0_signature: String,\n}\n\n#[derive(Serialize)]\nstruct VerifyBody {\n    ed25519_pk: String,\n    ephemeral_pk: String,\n    batch_number: u32,\n    key_index: u32,\n    nonce: String,\n    signature: String,\n}\n\n#[derive(Serialize)]\nstruct RotateBody {\n    ed25519_pk: String,\n    signer_batch_number: u32,\n    signer_key_index: u32,\n    signer_public_key: String,\n    new_batch_public_keys: Vec\u003cString\u003e,\n    new_batch_signature: String,\n}\n\n// ============================================================================\n// Parity tests\n// ============================================================================\n\n#[test]\nfn enroll_body_byte_exact_vs_kotlin() {\n    let fixture = load_fixture_body(\"enroll_req.json\");\n\n    let pks: Vec\u003cString\u003e = fixture[\"batch_0_public_keys\"]\n        .as_array()\n        .unwrap()\n        .iter()\n        .map(|v| v.as_str().unwrap().to_string())\n        .collect();\n    assert_eq!(pks.len(), 50, \"fixture must have 50 batch_0 keys\");\n\n    let rust_body = EnrollBody {\n        ed25519_pk: fixture[\"ed25519_pk\"].as_str().unwrap().to_string(),\n        batch_0_public_keys: pks,\n        batch_0_signature: fixture[\"batch_0_signature\"].as_str().unwrap().to_string(),\n    };\n\n    assert_eq!(serialize_to_value(\u0026rust_body), fixture);\n}\n\n#[test]\nfn verify_body_byte_exact_vs_kotlin() {\n    let fixture = load_fixture_body(\"verify_req.json\");\n\n    let rust_body = VerifyBody {\n        ed25519_pk: fixture[\"ed25519_pk\"].as_str().unwrap().to_string(),\n        ephemeral_pk: fixture[\"ephemeral_pk\"].as_str().unwrap().to_string(),\n        batch_number: u32::try_from(fixture[\"batch_number\"].as_u64().unwrap()).unwrap(),\n        key_index: u32::try_from(fixture[\"key_index\"].as_u64().unwrap()).unwrap(),\n        nonce: fixture[\"nonce\"].as_str().unwrap().to_string(),\n        signature: fixture[\"signature\"].as_str().unwrap().to_string(),\n    };\n\n    assert_eq!(serialize_to_value(\u0026rust_body), fixture);\n}\n\n#[test]\nfn rotate_body_byte_exact_vs_kotlin() {\n    let fixture = load_fixture_body(\"rotate_req.json\");\n\n    let new_pks: Vec\u003cString\u003e = fixture[\"new_batch_public_keys\"]\n        .as_array()\n        .unwrap()\n        .iter()\n        .map(|v| v.as_str().unwrap().to_string())\n        .collect();\n    assert_eq!(new_pks.len(), 50, \"fixture must have 50 new_batch keys\");\n\n    let rust_body = RotateBody {\n        ed25519_pk: fixture[\"ed25519_pk\"].as_str().unwrap().to_string(),\n        signer_batch_number: u32::try_from(fixture[\"signer_batch_number\"].as_u64().unwrap())\n            .unwrap(),\n        signer_key_index: u32::try_from(fixture[\"signer_key_index\"].as_u64().unwrap()).unwrap(),\n        signer_public_key: f trm.rs"],"content":"//! Byte-exact parity tests for STRM blob decryption against the Kotlin reference.\n//!\n//! Loads fixtures from `crypto-rs/parity-vectors/strm_blobs/*.strm` produced\n//! on an Android device by `ParityVectorsDumper`, and asserts that our Rust\n//! `decrypt` recovers the original plaintext.\n//!\n//! STRM blobs contain random session keys + random nonces, so we cannot check\n//! blob bytes against Kotlin — only the decrypted plaintext. Byte-exact checks\n//! on the encrypted side are covered by the `encrypt → decrypt` internal\n//! round-trip tests below.\n\nuse frappuccino_crypto_core::identity::ArchiveIdentity;\nuse frappuccino_crypto_stream::header::{HEADER_SIZE_NO_GRANTS, NONCE_PREFIX_BYTES};\nuse frappuccino_crypto_stream::{decrypt, encrypt_chunked, encrypt_single};\nuse serde::Deserialize;\nuse sha2::{Digest, Sha256};\nuse std::fs;\nuse std::path::{Path, PathBuf};\n\nfn vectors_dir() -\u003e PathBuf {\n    // tests/ are run with CARGO_MANIFEST_DIR = crypto-rs/stream.\n    let mut p = PathBuf::from(env!(\"CARGO_MANIFEST_DIR\"));\n    p.pop();\n    p.push(\"parity-vectors\");\n    p\n}\n\n#[derive(Deserialize)]\nstruct StrmFile {\n    mnemonic: String,\n    passphrase: String,\n    cases: Vec\u003cCase\u003e,\n}\n\n#[derive(Deserialize)]\n#[allow(dead_code)] // fields kept for fixture introspection / error messages\nstruct Case {\n    filename: String,\n    mode: String,\n    plaintext_size: usize,\n    plaintext_sha256: String,\n    plaintext_hex: Option\u003cString\u003e,\n    plaintext_filename: Option\u003cString\u003e,\n    description: String,\n    blob_size: usize,\n}\n\n/// Decode the expected plaintext either from `plaintext_hex` (inline for small\n/// cases) or from a sibling `.bin` file (large cases).\nfn load_plaintext(case: \u0026Case, dir: \u0026Path) -\u003e Vec\u003cu8\u003e {\n    if let Some(hex) = \u0026case.plaintext_hex {\n        hex::decode(hex).expect(\"plaintext_hex decode\")\n    } else if let Some(name) = \u0026case.plaintext_filename {\n        fs::read(dir.join(name)).expect(\"plaintext_filename read\")\n    } else {\n        Vec::new()\n    }\n}\n\n#[test]\nfn strm_blobs_decrypt_to_expected_plaintext() {\n    let dir = vectors_dir().join(\"strm_blobs\");\n    let raw = fs::read_to_string(dir.join(\"vectors.json\")).unwrap();\n    let file: StrmFile = serde_json::from_str(\u0026raw).unwrap();\n\n    let archive = ArchiveIdentity::from_mnemonic(\u0026file.mnemonic, \u0026file.passphrase)\n        .expect(\"ArchiveIdentity from mnemonic\");\n\n    for case in \u0026file.cases {\n        // chunked_3mb.strm is .gitignored (3 MB) — skip if missing.\n        let blob_path = dir.join(\u0026case.filename);\n        if !blob_path.exists() {\n            eprintln!(\"skip missing fixture: {}\", case.filename);\n            continue;\n        }\n        let blob = fs::read(\u0026blob_path).unwrap_or_else(|e| panic!(\"read {}: {e}\", case.filename));\n        let expected = load_plaintext(case, \u0026dir);\n        assert_eq!(expected.len(), case.plaintext_size);\n\n        let (plaintext, meta) =\n            decrypt(\u0026blob, \u0026archive).unwrap_or_else(|e| panic!(\"{}: decrypt {e:?}\", case.filename));\n        assert_eq!(\n            \u0026plaintext[..],\n            expected.as_slice(),\n            \"{}: decrypted plaintext diverges from fixture\",\n            case.filename\n        );\n\n        // Note: the dumper's \"mode\" label is the caller's *intent*, not what\n        // the encoder actually picked — e.g. `single_small.strm` was produced\n        // with fileSize=-1 which falls outside `0..CHUNK_THRESHOLD` and so\n        // the encoder selected CHUNKED. The authoritative value is the mode\n        // byte inside the blob (== meta.mode) — we only sanity-check it's\n        // one of the two valid modes.\n        assert!(\n            matches!(meta.mode, 1 | 2),\n            \"{}: mode byte must be 1 or 2, got {}\",\n            case.filename,\n            meta.mode\
