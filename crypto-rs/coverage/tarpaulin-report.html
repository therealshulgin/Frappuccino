en 1 (Solana Seeker), making\n//! brute-force of a 6-digit PIN impractical without dedicated GPU hardware.\n//!\n//! ## Format (41-byte header + AEAD)\n//!\n//! ```text\n//! blob = [0]     version  = 0x01              (1 byte)\n//!        [1..]   salt     (16 bytes, random per seal)\n//!        [17..]  nonce    (24 bytes, random per seal)\n//!        [41..]  ciphertext || poly1305_tag   (plaintext.len + 16 bytes)\n//! ```\n//!\n//! ## Invariants (`PLAN_RUST_EXEC.md` §1.5 — must NEVER drift from Kotlin)\n//!\n//! * Argon2id params: `m = 256 MiB, t = 4, p = 1, tag_len = 32`\n//! * AEAD: `XChaCha20-Poly1305-IETF`\n//! * AAD: the fixed byte string `\"frappuccino-v2-pin-store-v1\"`\n//! * Version byte: `0x01`\n//! * Salt = 16 bytes, nonce = 24 bytes, tag = 16 bytes\n//!\n//! ## Wrong-PIN vs tampered-blob\n//!\n//! A failed AEAD authentication returns [`CryptoError::WrongPin`] regardless\n//! of the reason (wrong PIN, tampered ciphertext, wrong salt, …). The caller\n//! must count this toward the lockout budget — the Kotlin-side\n//! `PinAttemptTracker` stays in charge of that policy since it lives in\n//! `SharedPreferences`.\n\nuse crate::error::CryptoError;\nuse argon2::{Algorithm, Argon2, Params, Version};\nuse chacha20poly1305::{\n    aead::{Aead, KeyInit, Payload},\n    XChaCha20Poly1305, XNonce,\n};\nuse rand_core::{OsRng, RngCore};\nuse zeroize::Zeroizing;\n\n// ============================================================================\n// Format constants — MUST match Kotlin verbatim.\n// ============================================================================\n\n/// Blob format version byte.\npub const VERSION: u8 = 1;\n\n/// Return type of [`open_extended`]: unwrapped plaintext, the Argon2id-derived\n/// key (so the caller can fast-reseal via [`seal_with_key`] without paying the\n/// KDF a second time), and the salt bound to this blob.\npub type OpenExtended = (\n    Zeroizing\u003cVec\u003cu8\u003e\u003e,\n    Zeroizing\u003c[u8; KEY_BYTES]\u003e,\n    [u8; SALT_BYTES],\n);\n/// Argon2id salt length.\npub const SALT_BYTES: usize = 16;\n/// `XChaCha20` nonce length.\npub const NONCE_BYTES: usize = 24;\n/// AEAD key length (= Argon2id output length).\npub const KEY_BYTES: usize = 32;\n/// Poly1305 tag length (appended to the ciphertext).\npub const TAG_BYTES: usize = 16;\n/// Offset where the salt ends (= nonce starts) in the blob.\nconst SALT_END: usize = 1 + SALT_BYTES;\n/// Size of the framed header: `version || salt || nonce`.\npub const HEADER_SIZE: usize = 1 + SALT_BYTES + NONCE_BYTES;\n\n/// Argon2id `t_cost` — iteration count.\npub const ARGON2_OPS: u32 = 4;\n/// Argon2id `m_cost` — memory in KiB (256 MiB = 262 144 KiB).\npub const ARGON2_MEM_KIB: u32 = 256 * 1024;\n/// Argon2id `p_cost` — parallelism.\npub const ARGON2_PARALLELISM: u32 = 1;\n\n/// Domain-separation AAD. The exact bytes are part of the contract — changing\n/// them invalidates every sealed blob already on disk.\npub const AAD: \u0026[u8] = b\"frappuccino-v2-pin-store-v1\";\n\n// ============================================================================\n// Public API\n// ============================================================================\n\n/// Seal `plaintext` under a user-chosen `pin`. The OS `CSPRNG` picks a fresh\n/// salt and nonce, so two calls with identical inputs produce different blobs.\n///\n/// # Errors\n/// * [`CryptoError::EmptyInput`] if `pin` is empty.\n/// * [`CryptoError::DerivationFailed`] on Argon2id / AEAD construction errors\n///   (never in practice with valid inputs).\npub fn seal(pin: \u0026str, plaintext: \u0026[u8]) -\u003e Result\u003cVec\u003cu8\u003e, CryptoError\u003e {\n    let mut salt = [0u8; SALT_BYTES];\n    let mut nonce = [0u8; NONCE_BYTES];\n    OsRng.fill_bytes(\u0026mut salt);\n    OsRng.fill_bytes(\u0026mut nonce);\n    seal_deterministic(pin, plaintext, \u0026salt, \u0026nonce)\n}\n\n/// Seal with caller-supplied salt + nonce. **Test-only** — never reuse a\n/// (salt, nonce) pair in production: doing so leaks plaintext XOR under\n/// `XChaCha20` and lets an attacker forge valid ciphertexts.\n///\n/// The Kotlin parity fixture uses this path so we can verify byte-exact\n/// reproduction of a known blob.\n///\n/// # Errors\n/// Same as [`seal`] plus nothing extra.\npub fn seal_deterministic(\n    pin: \u0026str,\n    plaintext: \u0026[u8],\n    salt: \u0026[u8; SALT_BYTES],\n    nonce: \u0026[u8; NONCE_BYTES],\n) -\u003e Result\u003cVec\u003cu8\u003e, CryptoError\u003e {\n    if pin.is_empty() {\n        return Err(CryptoError::EmptyInput);\n    }\n\n    let key = derive_key(pin, salt)?;\n    let cipher = XChaCha20Poly1305::new(key.as_slice().into());\n    let ciphertext = cipher\n        .encrypt(\n            XNonce::from_slice(nonce),\n            Payload {\n                msg: plaintext,\n                aad: AAD,\n            },\n        )\n        .map_err(|e| CryptoError::DerivationFailed(format!(\"AEAD encrypt: {e}\")))?;\n\n    let mut blob = Vec::with_capacity(HEADER_SIZE + ciphertext.len());\n    blob.push(VERSION);\n    blob.extend_from_slice(salt);\n    blob.extend_from_slice(nonce);\n    blob.extend_from_slice(\u0026ciphertext);\n    Ok(blob)\n}\n\n/// Open a previously-sealed blob. Returns the plaintext in a\n/// [`Zeroizing\u003cVec\u003cu8\u003e\u003e`] so it wipes on drop.\n///\n/// # Errors\n/// * [`CryptoError::EmptyInput`] if `pin` is empty.\n/// * [`CryptoError::InvalidBlob`] if the blob is too short or has an\n///   unsupported version byte.\n/// * [`CryptoError::WrongPin`] if the AEAD tag does not authenticate — the\n///   caller cannot tell \"wrong PIN\" from \"tampered blob\" by design.\npub fn open(pin: \u0026str, blob: \u0026[u8]) -\u003e Result\u003cZeroizing\u003cVec\u003cu8\u003e\u003e, CryptoError\u003e {\n    if pin.is_empty() {\n        return Err(CryptoError::EmptyInput);\n    }\n    if blob.len() \u003c HEADER_SIZE + TAG_BYTES {\n        return Err(CryptoError::InvalidBlob(format!(\n            \"blob too short: {} (minimum {})\",\n            blob.len(),\n            HEADER_SIZE + TAG_BYTES\n        )));\n    }\n    if blob[0] != VERSION {\n        return Err(CryptoError::InvalidBlob(format!(\n            \"unsupported version byte {:#x} (expected {:#x})\",\n            blob[0], VERSION\n        )));\n    }\n\n    // Safe slices — bounds checked above.\n    let salt: [u8; SALT_BYTES] = blob[1..SALT_END]\n        .try_into()\n        .map_err(|_| CryptoError::InvalidBlob(\"salt slice\".into()))?;\n    let nonce: [u8; NONCE_BYTES] = blob[SALT_END..HEADER_SIZE]\n        .try_into()\n        .map_err(|_| CryptoError::InvalidBlob(\"nonce slice\".into()))?;\n    let ciphertext = \u0026blob[HEADER_SIZE..];\n\n    let key = derive_key(pin, \u0026salt)?;\n    let cipher = XChaCha20Poly1305::new(key.as_slice().into());\n    let plaintext = cipher\n        .decrypt(\n            XNonce::from_slice(\u0026nonce),\n            Payload {\n                msg: ciphertext,\n                aad: AAD,\n            },\n        )\n        .map_err(|_| CryptoError::WrongPin)?;\n\n    Ok(Zeroizing::new(plaintext))\n}\n\n/// Fast reseal companion to [`open`]: returns the derived Argon2id key and\n/// salt alongside the plaintext so the caller can later produce a new blob\n/// via [`seal_with_key`] **without re-running Argon2id** (~1-2 s on Seeker).\n///\n/// Used for the ratchet persistence path, where the blob is rewritten after\n/// every signature. The caller MUST zero `derived_key` as soon as the resealing\n/// session ends (e.g. on lock / app exit) — the key alone is enough to decrypt\n/// any blob sealed under the same pin+salt pair.\n///\n/// # Errors\n/// Same as [`open`].\npub fn open_extended(pin: \u0026str, blob: \u0026[u8]) -\u003e Result\u003cOpenExtended, CryptoError\u003e {\n    if pin.is_empty() {\n        return Err(CryptoError::EmptyInput);\n    }\n    if blob.len() \u003c HEADER_SIZE + TAG_BYTES {\n        return Err(CryptoError::InvalidBlob(format!(\n            \"blob too short: {} (minimum {})\",\n            blob.len(),\n            HEADER_SIZE + TAG_BYTES\n        )));\n    }\n    if blob[0] != VERSION {\n        return Err(CryptoError::InvalidBlob(format!(\n            \"unsupported version byte {:#x} (expected {:#x})\",\n            blob[0], VERSION\n        )));\n    }\n\n    let salt: [u8; SALT_BYTES] = blob[1..SALT_END]\n        .try_into()\n        .map_err(|_| CryptoError::InvalidBlob(\"salt slice\".into()))?;\n    let nonce: [u8; NONCE_BYTES] = blob[SALT_END..HEADER_SIZE]\n        .try_into()\n        .map_err(|_| CryptoError::InvalidBlob(\"nonce slice\".into()))?;\n    let ciphertext = \u0026blob[HEADER_SIZE..];\n\n    let key = derive_key(pin, \u0026salt)?;\n    let cipher = XChaCha20Poly1305::new(key.as_slice().into());\n    let plaintext = cipher\n        .decrypt(\n            XNonce::from_slice(\u0026nonce),\n            Payload {\n                msg: ciphertext,\n                aad: AAD,\n            },\n        )\n        .map_err(|_| CryptoError::WrongPin)?;\n\n    Ok((Zeroizing::new(plaintext), key, salt))\n}\n\n/// Fast reseal: build a new blob using a previously-derived Argon2id key and\n/// the original salt. Generates a fresh random nonce.\n///\n/// Pair with [`open_extended`] to avoid re-running the ~1 s Argon2id round\n/// on every re-encrypt. The `derived_key` is treated as a secret and\n/// **must** be zeroed once resealing sessions end.\n///\n/// # Errors\n/// * [`CryptoError::DerivationFailed`] if the AEAD construction fails\n///   (never in practice).\npub fn seal_with_key(\n    derived_key: \u0026[u8; KEY_BYTES],\n    salt: \u0026[u8; SALT_BYTES],\n    plaintext: \u0026[u8],\n) -\u003e Result\u003cVec\u003cu8\u003e, CryptoError\u003e {\n    let mut nonce = [0u8; NONCE_BYTES];\n    OsRng.fill_bytes(\u0026mut nonce);\n\n    let cipher = XChaCha20Poly1305::new(derived_key.as_slice().into());\n    let ciphertext = cipher\n        .encrypt(\n            XNonce::from_slice(\u0026nonce),\n            Payload {\n                msg: plaintext,\n                aad: AAD,\n            },\n        )\n        .map_err(|e| CryptoError::DerivationFailed(format!(\"AEAD encrypt: {e}\")))?;\n\n    let mut blob = Vec::with_capacity(HEADER_SIZE + ciphertext.len());\n    blob.push(VERSION);\n    blob.extend_from_slice(salt);\n    blob.extend_from_slice(\u0026nonce);\n    blob.extend_from_slice(\u0026ciphertext);\n    Ok(blob)\n}\n\n// ============================================================================\n// Internal — KDF\n// ============================================================================\n\n/// Derive a 32-byte AEAD key from `pin` + `salt` via Argon2id(256 MiB, t=4).\n///\n/// The returned key is wrapped in [`Zeroizing`] so the caller cannot leak\n/// it past the end of the enclosing scope.\nfn derive_key(\n    pin: \u0026str,\n    salt: \u0026[u8; SALT_BYTES],\n) -\u003e Result\u003cZeroizing\u003c[u8; KEY_BYTES]\u003e, CryptoError\u003e {\n    let params = Params::new(\n        ARGON2_MEM_KIB,\n        ARGON2_OPS,\n        ARGON2_PARALLELISM,\n        Some(KEY_BYTES),\n    )\n    .map_err(|e| CryptoError::DerivationFailed(format!(\"argon2 params: {e}\")))?;\n    let argon2 = Argon2::new(Algorithm::Argon2id, Version::V0x13, params);\n\n    let mut key = Zeroizing::new([0u8; KEY_BYTES]);\n    argon2\n        .hash_password_into(pin.as_bytes(), salt, \u0026mut key[..])\n        .map_err(|e| CryptoError::DerivationFailed(format!(\"argon2: {e}\")))?;\n    Ok(key)\n}\n\n// ============================================================================\n// Tests\n// ============================================================================\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    // Argon2id at 256 MiB × 4 ops ≈ 1.2 s per call. Each test does a seal +\n    // an open = 2 calls = ~2.5 s. Keep the suite small — RFC-style test\n    // vectors live in the `argon2` crate itself; we only need round-trips\n    // here to catch integration mistakes.\n\n    #[test]\n    fn seal_open_roundtrip_short_plaintext() {\n        let blob = seal(\"123456\", b\"hello\").unwrap();\n        let out = open(\"123456\", \u0026blob).unwrap();\n        assert_eq!(\u0026out[..], b\"hello\");\n    }\n\n    #[test]\n    fn seal_open_roundtrip_empty_plaintext() {\n        let blob = seal(\"998877\", \u0026[]).unwrap();\n        let out = open(\"998877\", \u0026blob).unwrap();\n        assert_eq!(\u0026out[..], b\"\");\n    }\n\n    #[test]\n    fn open_with_wrong_pin_rejected() {\n        let blob = seal(\"correct\", b\"payload\").unwrap();\n        let err = open(\"wrong\", \u0026blob).unwrap_err();\n        assert!(matches!(err, CryptoError::WrongPin), \"got {err:?}\");\n    }\n\n    #[test]\n    fn open_with_tampered_ciphertext_rejected() {\n        let mut blob = seal(\"pin\", b\"payload\").unwrap();\n        // Flip a bit in the ciphertext section.\n        let ct_idx = HEADER_SIZE + 1;\n        blob[ct_idx] ^= 0x01;\n        let err = open(\"pin\", \u0026blob).unwrap_err();\n        // Deliberately indistinguishable from WrongPin — see module doc.\n        assert!(matches!(err, CryptoError::WrongPin), \"got {err:?}\");\n    }\n\n    #[test]\n    fn open_with_truncated_blob_rejected() {\n        let err = open(\"pin\", \u0026[0u8; HEADER_SIZE]).unwrap_err();\n        assert!(matches!(err, CryptoError::InvalidBlob(_)), \"got {err:?}\");\n    }\n\n    #[test]\n    fn open_with_wrong_version_rejected() {\n        let mut blob = seal(\"pin\", b\"payload\").unwrap();\n        blob[0] = 0xFF;\n        let err = open(\"pin\", \u0026blob).unwrap_err();\n        assert!(matches!(err, CryptoError::InvalidBlob(_)), \"got {err:?}\");\n    }\n\n    #[test]\n    fn empty_pin_rejected() {\n        assert!(matches!(seal(\"\", b\"x\"), Err(CryptoError::EmptyInput)));\n        let blob = seal(\"pin\", b\"x\").unwrap();\n        assert!(matches!(open(\"\", \u0026blob), Err(CryptoError::EmptyInput)));\n    }\n\n    #[test]\n    fn seal_deterministic_is_reproducible() {\n        let salt = [1u8; SALT_BYTES];\n        let nonce = [2u8; NONCE_BYTES];\n        let a = seal_deterministic(\"pin\", b\"data\", \u0026salt, \u0026nonce).unwrap();\n        let b = seal_deterministic(\"pin\", b\"data\", \u0026salt, \u0026nonce).unwrap();\n        assert_eq!(a, b, \"same inputs must produce byte-identical blobs\");\n    }\n\n    #[test]\n    fn open_extended_then_seal_with_key_roundtrip() {\n        // Simulate the fast-reseal path used by the ratchet persistence:\n        //   1. initial seal with PIN                (~1.2 s Argon2id)\n        //   2. open_extended → plaintext + key + salt (~1.2 s Argon2id once)\n        //   3. seal_with_key → new blob            (~µs — no Argon2id)\n        //   4. open the new blob with the same PIN succeeds\n        let initial = seal(\"123456\", b\"ratchet-state-v1\").unwrap();\n        let (plaintext, key, salt) = open_extended(\"123456\", \u0026initial).unwrap();\n        assert_eq!(\u0026plaintext[..], b\"ratchet-state-v1\");\n\n        let new_blob = seal_with_key(\u0026key, \u0026salt, b\"ratchet-state-v2\").unwrap();\n        // Same salt → new nonce → different blob bytes\n        assert_ne!(initial, new_blob);\n\n        // Opening the fast-resealed blob with the original PIN must work.\n        let round = open(\"123456\", \u0026new_blob).unwrap();\n        assert_eq!(\u0026round[..], b\"ratchet-state-v2\");\n    }\n\n    #[test]\n    fn open_extended_wrong_pin_rejected() {\n        let blob = seal(\"correct\", b\"payload\").unwrap();\n        let err = open_extended(\"wrong\", \u0026blob).unwrap_err();\n        assert!(matches!(err, CryptoError::WrongPin), \"got {err:?}\");\n    }\n}\n","traces":[{"line":94,"address":[489200],"length":1,"stats":{"Line":3}},{"line":95,"address":[489260],"length":1,"stats":{"Line":3}},{"line":96,"address":[609037],"length":1,"stats":{"Line":3}},{"line":97,"address":[489294],"length":1,"stats":{"Line":3}},{"line":98,"address":[489315],"length":1,"stats":{"L umed ephemeral key and immediately wipes the private half.\n//! Forward secrecy: if an attacker extracts the device state at time T they\n//! can only forge signatures for the *remaining* slots in the current batch,\n//! never for past uploads.\n//!\n//! ## Derivation\n//!\n//! ```text\n//! chain_N\n//!   ├─▶ HKDF(CTX_BATCH_SEEDS, 50·32)  ──▶ seeds[50]  ──▶ 50 × (pk, sk) via ed25519\n//!   └─▶ HKDF(CTX_NEXT_CHAIN,  32)     ──▶ chain_{N+1}\n//! ```\n//!\n//! ## Serialized format (V2, 4876 bytes)\n//!\n//! ```text\n//! payload (4844 bytes):\n//!   [0]         version byte            = 0x02\n//!   [1..5]      batch_number            (u32 big-endian)\n//!   [5..12]     consumed_mask           (7 bytes, bit i = consumed[i])\n//!   [12..44]    next_chain_key          (32 bytes)\n//!   [44..4844]  50 × (pk 32B || sk 64B) = 4800 bytes\n//! mac (32 bytes):\n//!   [4844..4876] HMAC-SHA256(HKDF(next_chain_key, CTX_BLOB_MAC, 32), payload[0..4844])\n//! ```\n//!\n//! ## Legacy V1 (4844 bytes)\n//!\n//! Identical layout but **no MAC** and version byte = `0x01`. We accept V1\n//! on read (no integrity check) and migrate automatically: the next\n//! `serialize()` produces a V2 blob, after which the old V1 file should be\n//! overwritten. Post-S5 the Kotlin impl has also migrated, so V1 exists only\n//! in historical backups.\n//!\n//! ## Invariants (`PLAN_RUST_EXEC.md` §1.3 — drift = lose all enrolled identities)\n//!\n//! * `BATCH_SIZE = 50`\n//! * HKDF contexts (exact bytes): `\"frappuccino-v2-ratchet-batch-seeds\"`,\n//!   `\"frappuccino-v2-ratchet-next-chain\"`, `\"frappuccino-v2-ratchet-blob-mac\"`\n//! * Blob is big-endian for `batch_number`; `consumed_mask` LSB = slot 0.\n\nuse crate::error::CryptoError;\nuse crate::hkdf;\nuse ed25519_dalek::{Signer, SigningKey};\nuse hmac::{Hmac, Mac};\nuse sha2::Sha256;\nuse subtle::ConstantTimeEq;\nuse zeroize::Zeroize;\n\n// ============================================================================\n// Constants\n// ============================================================================\n\n/// Number of keys per batch.\npub const BATCH_SIZE: usize = 50;\n/// Ed25519 public key length.\npub const ED25519_PK_BYTES: usize = 32;\n/// Ed25519 private key length (libsodium layout: seed || pk).\npub const ED25519_SK_BYTES: usize = 64;\n/// Ed25519 seed length (RFC 8032 \"secret key\").\npub const ED25519_SEED_BYTES: usize = 32;\n/// Chain key length.\npub const CHAIN_KEY_BYTES: usize = 32;\n/// Ed25519 signature length.\npub const SIGNATURE_BYTES: usize = 64;\n/// Consumed-mask length (7 bytes × 8 = 56 bits, 50 used).\npub const MASK_BYTES: usize = 7;\n\n/// Legacy blob version (no MAC).\npub const VERSION_V1: u8 = 1;\n/// Current blob version (MAC-authenticated).\npub const VERSION_V2: u8 = 2;\n/// Version written by [`EphemeralRatchet::serialize`].\npub const VERSION: u8 = VERSION_V2;\n\n/// Header = version(1) + `batch_number`(4) + mask(7) + chain(32) = 44 bytes.\npub const SERIALIZED_HEADER_SIZE: usize = 1 + 4 + MASK_BYTES + CHAIN_KEY_BYTES;\n/// Per-slot size = pk(32) + sk(64) = 96 bytes.\npub const SERIALIZED_PER_SLOT_SIZE: usize = ED25519_PK_BYTES + ED25519_SK_BYTES;\n/// Payload size (V1 blob size, V2 payload-without-MAC size).\npub const SERIALIZED_PAYLOAD_SIZE: usize =\n    SERIALIZED_HEADER_SIZE + BATCH_SIZE * SERIALIZED_PER_SLOT_SIZE;\n/// Legacy V1 blob size.\npub const SERIALIZED_SIZE_V1: usize = SERIALIZED_PAYLOAD_SIZE;\n/// V2 MAC length.\npub const MAC_BYTES: usize = 32;\n/// Current V2 blob size = payload + MAC.\npub const SERIALIZED_SIZE: usize = SERIALIZED_PAYLOAD_SIZE + MAC_BYTES;\n\n// Domain-separation for HKDF derivations.\nconst CTX_BATCH_SEEDS: \u0026[u8] = b\"frappuccino-v2-ratchet-batch-seeds\";\nconst CTX_NEXT_CHAIN: \u0026[u8] = b\"frappuccino-v2-ratchet-next-chain\";\nconst CTX_BLOB_MAC: \u0026[u8] = b\"frappuccino-v2-ratchet-blob-mac\";\n\n// Byte offsets inside the serialized payload. Exposed so parity tests (and\n// higher-level inspectors) can read sub-fields without magic numbers.\npub const OFF_BATCH_NUMBER: usize = 1;\npub const OFF_MASK: usize = 5;\npub const OFF_CHAIN: usize = 12;\npub const OFF_SLOTS: usize = SERIALIZED_HEADER_SIZE;\n\n// ============================================================================\n// Value types\n// ============================================================================\n\n/// One ephemeral signature bundle emitted by [`EphemeralRatchet::sign_and_advance`].\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct RatchetSignature {\n    /// 64-byte Ed25519 signature over the caller-supplied message.\n    pub signature: [u8; SIGNATURE_BYTES],\n    /// The ephemeral public key corresponding to the consumed slot.\n    pub ephemeral_public_key: [u8; ED25519_PK_BYTES],\n    /// Batch number that was active when the signature was produced.\n    pub batch_number: u32,\n    /// 0-based index of the consumed slot within the batch.\n    pub key_index: u32,\n}\n\n/// Proof of a batch rotation. The server verifies\n/// `signature == Ed25519(signer_sk, concat(new_batch_public_keys))` against\n/// the known `signer_public_key` from the previous batch.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct RotationProof {\n    /// Post-rotation batch number.\n    pub new_batch_number: u32,\n    /// 50 fresh public keys derived from the next chain.\n    pub new_batch_public_keys: [[u8; ED25519_PK_BYTES]; BATCH_SIZE],\n    /// The key that signed `signature` — must match a slot known to the server.\n    pub signer_public_key: [u8; ED25519_PK_BYTES],\n    /// Batch number the signer belongs to (= `new_batch_number - 1`).\n    pub signer_batch_number: u32,\n    /// Slot the signer consumed in that batch.\n    pub signer_key_index: u32,\n    /// 64-byte Ed25519 signature of `concat(new_batch_public_keys)`.\n    pub signature: [u8; SIGNATURE_BYTES],\n}\n\n// ============================================================================\n// EphemeralRatchet\n// ============================================================================\n\n/// Stateful batched Ed25519 ratchet.\n///\n/// Not thread-safe — pin to a single thread. Zeroes all private material and\n/// the chain key on `Drop`.\n#[must_use]\npub struct EphemeralRatchet {\n    batch_number: u32,\n    consumed: [bool; BATCH_SIZE],\n    public_keys: [[u8; ED25519_PK_BYTES]; BATCH_SIZE],\n    // 64-byte libsodium-layout sk (seed || pk). When a slot is consumed the\n    // whole buffer is filled with zeros, so serialized blobs of consumed\n    // slots contain `pk || zeros(64)` — matching Kotlin exactly.\n    private_keys: [[u8; ED25519_SK_BYTES]; BATCH_SIZE],\n    next_chain_key: Option\u003c[u8; CHAIN_KEY_BYTES]\u003e,\n    initialized: bool,\n}\n\nimpl EphemeralRatchet {\n    /// Create an empty ratchet. Call [`Self::initialize`] or\n    /// [`Self::deserialize`] before any sign / rotate operation.\n    ///\n    /// (the struct is already `#[must_use]` so no attribute here.)\n    pub fn new() -\u003e Self {\n        Self {\n            batch_number: 0,\n            consumed: [false; BATCH_SIZE],\n            public_keys: [[0u8; ED25519_PK_BYTES]; BATCH_SIZE],\n            private_keys: [[0u8; ED25519_SK_BYTES]; BATCH_SIZE],\n            next_chain_key: None,\n            initialized: false,\n        }\n    }\n\n    /// Bootstrap batch 0 from `master_chain_key` (the `chain_0` produced by\n    /// [`crate::identity::EnrollmentKit::take_chain_zero`]).\n    ///\n    /// Derives the 50 slot keypairs and `chain_1`, then wipes the input.\n    ///\n    /// # Errors\n    /// * [`CryptoError::DerivationFailed`] if already initialized or HKDF fails.\n    pub fn initialize(\n        \u0026mut self,\n        master_chain_key: \u0026mut [u8; CHAIN_KEY_BYTES],\n    ) -\u003e Result\u003c(), CryptoError\u003e {\n        if self.initialized {\n            return Err(CryptoError::DerivationFailed(\n                \"ratchet already initialized\".into(),\n            ));\n        }\n        self.derive_batch(master_chain_key, 0)?;\n        master_chain_key.zeroize();\n        self.initialized = true;\n        Ok(())\n    }\n\n    /// Current batch number (0 at fresh init, incremented by each rotation).\n    #[must_use]\n    pub fn batch_number(\u0026self) -\u003e u32 {\n        self.batch_number\n    }\n\n    /// Number of unconsumed slots remaining in the current batch.\n    #[must_use]\n    pub fn remaining_in_batch(\u0026self) -\u003e usize {\n        self.consumed.iter().filter(|c| !**c).count()\n    }\n\n    /// True if the slot at `index` has already been consumed.\n    ///\n    /// # Errors\n    /// [`CryptoError::DerivationFailed`] if `index \u003e= BATCH_SIZE`.\n    pub fn is_consumed(\u0026self, index: usize) -\u003e Result\u003cbool, CryptoError\u003e {\n        if index \u003e= BATCH_SIZE {\n            return Err(CryptoError::DerivationFailed(format!(\n                \"index {index} out of range\"\n            )));\n        }\n        Ok(self.consumed[index])\n    }\n\n    /// Copy of the public key at `index` (consumed or not).\n    ///\n    /// # Errors\n    /// [`CryptoError::DerivationFailed`] if `index \u003e= BATCH_SIZE` or not initialized.\n    pub fn public_key_at(\u0026self, index: usize) -\u003e Result\u003c[u8; ED25519_PK_BYTES], CryptoError\u003e {\n        self.check_initialized()?;\n        if index \u003e= BATCH_SIZE {\n            return Err(CryptoError::DerivationFailed(format!(\n                \"index {index} out of range\"\n            )));\n        }\n        Ok(self.public_keys[index])\n    }\n\n    /// Snapshot of all 50 public keys in the current batch.\n    ///\n    /// # Errors\n    /// [`CryptoError::DerivationFailed`] if not initialized.\n    pub fn batch_public_keys(\u0026self) -\u003e Result\u003c[[u8; ED25519_PK_BYTES]; BATCH_SIZE], CryptoError\u003e {\n        self.check_initialized()?;\n        Ok(self.public_keys)\n    }\n\n    /// Sign `message` with the first unconsumed slot, then wipe that slot.\n    ///\n    /// # Errors\n    /// * [`CryptoError::DerivationFailed`] if batch is exhausted, not\n    ///   initialized, or the signing key is malformed (shouldn't happen).\n    ///\n    /// # Panics\n    /// The `u32::try_from(idx)` can never fail: `idx \u003c BATCH_SIZE = 50` always\n    /// fits in `u32`. The `expect` is kept to make the intent explicit and\n    /// because clippy pedantic demands the docstring entry.\n    pub fn sign_and_advance(\u0026mut self, message: \u0026[u8]) -\u003e Result\u003cRatchetSignature, CryptoError\u003e {\n        self.check_initialized()?;\n        let idx = self.first_available_index()?;\n        let seed: [u8; ED25519_SEED_BYTES] = self.private_keys[idx][..ED25519_SEED_BYTES]\n            .try_into()\n            .map_err(|_| CryptoError::DerivationFailed(\"sk seed slice\".into()))?;\n        let signing = SigningKey::from_bytes(\u0026seed);\n        let sig = signing.sign(message).to_bytes();\n        let pk = self.public_keys[idx];\n        let batch = self.batch_number;\n\n        // Wipe the consumed slot's private material.\n        self.private_keys[idx].zeroize();\n        self.consumed[idx] = true;\n\n        Ok(RatchetSignature {\n            signature: sig,\n            ephemeral_public_key: pk,\n            batch_number: batch,\n            key_index: u32::try_from(idx).expect(\"idx \u003c BATCH_SIZE = 50 fits in u32\"),\n        })\n    }\n\n    /// Consume one slot to sign `concat(new_batch_public_keys)`, rotate to\n    /// batch `N+1`, and return a server-verifiable [`RotationProof`].\n    ///\n    /// # Errors\n    /// [`CryptoError::DerivationFailed`] if not initialized, batch exhausted,\n    /// or no `next_chain_key` is present.\n    ///\n    /// # Panics\n    /// Can't panic in practice: the `u32::try_from(signer_idx)` call is\n    /// bounded by `signer_idx \u003c BATCH_SIZE = 50` which always fits `u32`.\n    pub fn advance_batch(\u0026mut self) -\u003e Result\u003cRotationProof, CryptoError\u003e {\n        self.check_initialized()?;\n        let signer_idx = self.first_available_index()?;\n        let signer_pk = self.public_keys[signer_idx];\n        let signer_batch = self.batch_number;\n        let signer_seed: [u8; ED25519_SEED_BYTES] = self.private_keys[signer_idx]\n            [..ED25519_SEED_BYTES]\n            .try_into()\n            .map_err(|_| CryptoError::DerivationFailed(\"signer seed slice\".into()))?;\n\n        let mut old_chain = self\n            .next_chain_key\n            .take()\n            .ok_or_else(|| CryptoError::DerivationFailed(\"missing next_chain_key\".into()))?;\n\n        // Derive new batch material into scratch arrays (don't touch self's batch\n        // yet — we need the signer's sk to still be alive for the signature step).\n        let mut new_public_keys = [[0u8; ED25519_PK_BYTES]; BATCH_SIZE];\n        let mut new_private_keys = [[0u8; ED25519_SK_BYTES]; BATCH_SIZE];\n        derive_batch_into(\u0026old_chain, \u0026mut new_public_keys, \u0026mut new_private_keys)?;\n\n        let next_chain_bytes = hkdf::sha256(\u0026old_chain, None, CTX_NEXT_CHAIN, CHAIN_KEY_BYTES)?;\n        let mut new_next_chain = [0u8; CHAIN_KEY_BYTES];\n        new_next_chain.copy_from_slice(\u0026next_chain_bytes[..]);\n\n        // Sign the concatenation of the 50 new public keys.\n        let mut concat = [0u8; BATCH_SIZE * ED25519_PK_BYTES];\n        for (i, pk) in new_public_keys.iter().enumerate() {\n            concat[i * ED25519_PK_BYTES..(i + 1) * ED25519_PK_BYTES].copy_from_slice(pk);\n        }\n        let signing = SigningKey::from_bytes(\u0026signer_seed);\n        let signature = signing.sign(\u0026concat).to_bytes();\n\n        // Wipe the old batch + old chain.\n        for sk in \u0026mut self.private_keys {\n            sk.zeroize();\n        }\n        for pk in \u0026mut self.public_keys {\n            pk.zeroize();\n        }\n        for c in \u0026mut self.consumed {\n            *c = false;\n        }\n        old_chain.zeroize();\n\n        // Install the new batch.\n        self.public_keys = new_public_keys;\n        self.private_keys = new_private_keys;\n        self.next_chain_key = Some(new_next_chain);\n        self.batch_number = signer_batch + 1;\n\n        Ok(RotationProof {\n            new_batch_number: self.batch_number,\n            new_batch_public_keys: self.public_keys,\n            signer_public_key: signer_pk,\n            signer_batch_number: signer_batch,\n            signer_key_index: u32::try_from(signer_idx)\n                .expect(\"signer_idx \u003c BATCH_SIZE = 50 fits in u32\"),\n            signature,\n        })\n    }\n\n    // ------------------------------------------------------------------------\n    // Serialization\n    // ------------------------------------------------------------------------\n\n    /// Produce the V2 serialized blob ([`SERIALIZED_SIZE`] = 4876 bytes).\n    ///\n    /// # Errors\n    /// [`CryptoError::DerivationFailed`] if not initialized or `next_chain_key`\n    /// is missing, or HKDF/HMAC fails (never in practice).\n    pub fn serialize(\u0026self) -\u003e Result\u003cVec\u003cu8\u003e, CryptoError\u003e {\n        self.check_initialized()?;\n        let chain = self\n            .next_chain_key\n            .as_ref()\n            .ok_or_else(|| CryptoError::DerivationFailed(\"missing next_chain_key\".into()))?;\n\n        let mut blob = vec![0u8; SERIALIZED_SIZE];\n        blob[0] = VERSION;\n        blob[OFF_BATCH_NUMBER..OFF_MASK].copy_from_slice(\u0026self.batch_number.to_be_bytes());\n        for (i, \u0026c) in self.consumed.iter().enumerate() {\n            if c {\n                blob[OFF_MASK + i / 8] |= 1 \u003c\u003c (i % 8);\n            }\n        }\n        blob[OFF_CHAIN..OFF_CHAIN + CHAIN_KEY_BYTES].copy_from_slice(chain);\n\n        let mut offset = OFF_SLOTS;\n        for i in 0..BATCH_SIZE {\n            blob[offset..offset + ED25519_PK_BYTES].copy_from_slice(\u0026self.public_keys[i]);\n            offset += ED25519_PK_BYTES;\n            blob[offset..offset + ED25519_SK_BYTES].copy_from_slice(\u0026self.private_keys[i]);\n            offset += ED25519_SK_BYTES;\n        }\n\n        // Compute + append the MAC.\n        let mac_key = hkdf::sha256(chain, None, CTX_BLOB_MAC, MAC_BYTES)?;\n        let mac = hmac_sha256(\u0026mac_key, \u0026blob[..SERIALIZED_PAYLOAD_SIZE])?;\n        blob[SERIALIZED_PAYLOAD_SIZE..SERIALIZED_SIZE].copy_from_slice(\u0026mac);\n        Ok(blob)\n    }\n\n    /// Reconstruct a ratchet from [`Self::serialize`] output.\n    ///\n    /// Accepts V2 (4876 bytes, MAC-verified) and legacy V1 (4844 bytes, no\n    /// MAC — next `serialize()` will migrate to V2).\n    ///\n    /// # Errors\n    /// * [`CryptoError::InvalidBlob`] for unsupported version byte, wrong size,\n    ///   or V2 MAC verification failure.\n    pub fn deserialize(blob: \u0026[u8]) -\u003e Result\u003cSelf, CryptoError\u003e {\n        if blob.is_empty() {\n            return Err(CryptoError::InvalidBlob(\"empty blob\".into()));\n        }\n        match blob[0] {\n            VERSION_V2 =\u003e {\n                if blob.len() != SERIALIZED_SIZE {\n                    return Err(CryptoError::InvalidBlob(format!(\n                        \"V2 size mismatch: expected {SERIALIZED_SIZE}, got {}\",\n                        blob.len()\n                    )));\n                }\n                verify_mac(blob)?;\n                Self::read_payload(\u0026blob[..SERIALIZED_PAYLOAD_SIZE])\n            }\n            VERSION_V1 =\u003e {\n                if blob.len() != SERIALIZED_SIZE_V1 {\n                    return Err(CryptoError::InvalidBlob(format!(\n                        \"V1 size mismatch: expected {SERIALIZED_SIZE_V1}, got {}\",\n                        blob.len()\n                    )));\n                }\n                // No MAC in V1 — accept and migrate on next serialize().\n                Self::read_payload(blob)\n            }\n            other =\u003e Err(CryptoError::InvalidBlob(format!(\n                \"unsupported version byte {other:#x} (expected {VERSION_V1:#x} or {VERSION_V2:#x})\"\n            ))),\n        }\n    }\n\n    /// Explicit zero-out of all in-memory state, reusable for a fresh\n    /// [`Self::initialize`] call afterwards.\n    pub fn wipe(\u0026mut self) {\n        for sk in \u0026mut self.private_keys {\n            sk.zeroize();\n        }\n        for pk in \u0026mut self.public_keys {\n            pk.zeroize();\n        }\n        for c in \u0026mut self.consumed {\n            *c = false;\n        }\n        if let Some(ref mut chain) = self.next_chain_key {\n            chain.zeroize();\n        }\n        self.next_chain_key = None;\n        self.batch_number = 0;\n        self.initialized = false;\n    }\n\n    // ------------------------------------------------------------------------\n    // Internal helpers\n    // ------------------------------------------------------------------------\n\n    fn check_initialized(\u0026self) -\u003e Result\u003c(), CryptoError\u003e {\n        if !self.initialized {\n            return Err(CryptoError::DerivationFailed(\n                \"ratchet not initialized\".into(),\n            ));\n        }\n        Ok(())\n    }\n\n    fn first_available_index(\u0026self) -\u003e Result\u003cusize, CryptoError\u003e {\n        self.consumed.iter().position(|\u0026c| !c).ok_or_else(|| {\n            CryptoError::DerivationFailed(format!(\n                \"batch {} exhausted — call advance_batch()\",\n                self.batch_number\n            ))\n        })\n    }\n\n    fn derive_batch(\n        \u0026mut self,\n        chain: \u0026[u8; CHAIN_KEY_BYTES],\n        target_batch_number: u32,\n    ) -\u003e Result\u003c(), CryptoError\u003e {\n        derive_batch_into(chain, \u0026mut self.public_keys, \u0026mut self.private_keys)?;\n        for c in \u0026mut self.consumed {\n            *c = false;\n        }\n        let next_chain = hkdf::sha256(chain, None, CTX_NEXT_CHAIN, CHAIN_KEY_BYTES)?;\n        let mut new_next = [0u8; CHAIN_KEY_BYTES];\n        new_next.copy_from_slice(\u0026next_chain[..]);\n        if let Some(ref mut old) = self.next_chain_key {\n            old.zeroize();\n        }\n        self.next_chain_key = Some(new_next);\n        self.batch_number = target_batch_number;\n        Ok(())\n    }\n\n    fn read_payload(payload: \u0026[u8]) -\u003e Result\u003cSelf, CryptoError\u003e {\n        debug_assert_eq!(payload.len(), SERIALIZED_PAYLOAD_SIZE);\n        let mut ratchet = Self::new();\n        let batch_bytes: [u8; 4] = payload[OFF_BATCH_NUMBER..OFF_MASK]\n            .try_into()\n            .map_err(|_| CryptoError::InvalidBlob(\"batch_number slice\".into()))?;\n        ratchet.batch_number = u32::from_be_bytes(batch_bytes);\n\n        for i in 0..BATCH_SIZE {\n            let byte = payload[OFF_MASK + i / 8];\n            ratchet.consumed[i] = (byte \u003e\u003e (i % 8)) \u0026 1 == 1;\n        }\n\n        let mut chain = [0u8; CHAIN_KEY_BYTES];\n        chain.copy_from_slice(\u0026payload[OFF_CHAIN..OFF_CHAIN + CHAIN_KEY_BYTES]);\n        ratchet.next_chain_key = Some(chain);\n\n        let mut offset = OFF_SLOTS;\n        for i in 0..BATCH_SIZE {\n            ratchet.public_keys[i].copy_from_slice(\u0026payload[offset..offset + ED25519_PK_BYTES]);\n            offset += ED25519_PK_BYTES;\n            ratchet.private_keys[i].copy_from_slice(\u0026payload[offset..offset + ED25519_SK_BYTES]);\n            offset += ED25519_SK_BYTES;\n        }\n        ratchet.initialized = true;\n        Ok(ratchet)\n    }\n}\n\nimpl Default for EphemeralRatchet {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\nimpl Drop for EphemeralRatchet {\n    fn drop(\u0026mut self) {\n        // Zeroize all secret material. Public keys and the consumed mask are\n        // non-secret but zeroed for consistency.\n        for sk in \u0026mut self.private_keys {\n            sk.zeroize();\n        }\n        if let Some(ref mut chain) = self.next_chain_key {\n            chain.zeroize();\n        }\n    }\n}\n\nimpl std::fmt::Debug for EphemeralRatchet {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        write!(\n            f,\n            \"EphemeralRatchet(initialized={}, batch={}, remaining={}, private_keys=\u003credacted\u003e)\",\n            self.initialized,\n            self.batch_number,\n            self.remaining_in_batch()\n        )\n    }\n}\n\n// ============================================================================\n// Free helpers\n// ============================================================================\n\n/// Derive the 50 slot keypairs from a chain key into the caller-provided arrays.\nfn derive_batch_into(\n    chain: \u0026[u8; CHAIN_KEY_BYTES],\n    public_keys: \u0026mut [[u8; ED25519_PK_BYTES]; BATCH_SIZE],\n    private_keys: \u0026mut [[u8; ED25519_SK_BYTES]; BATCH_SIZE],\n) -\u003e Result\u003c(), CryptoError\u003e {\n    let seeds = hkdf::sha256(\n        chain,\n        None,\n        CTX_BATCH_SEEDS,\n        BATCH_SIZE * ED25519_SEED_BYTES,\n    )?;\n    for i in 0..BATCH_SIZE {\n        let seed_start = i * ED25519_SEED_BYTES;\n        let seed_end = seed_start + ED25519_SEED_BYTES;\n        let seed: [u8; ED25519_SEED_BYTES] = seeds[seed_start..seed_end]\n            .try_into()\n            .map_err(|_| CryptoError::DerivationFailed(\"seed slice\".into()))?;\n        let signing = SigningKey::from_bytes(\u0026seed);\n        public_keys[i] = signing.verifying_key().to_bytes();\n        // libsodium layout: seed(32) || pk(32).\n        private_keys[i][..ED25519_SEED_BYTES].copy_from_slice(\u0026seed);\n        private_keys[i][ED25519_SEED_BYTES..].copy_from_slice(\u0026public_keys[i]);\n    }\n    Ok(())\n}\n\nfn hmac_sha256(key: \u0026[u8], data: \u0026[u8]) -\u003e Result\u003c[u8; MAC_BYTES], CryptoError\u003e {\n    let mut mac = Hmac::\u003cSha256\u003e::new_from_slice(key)\n        .map_err(|e| CryptoError::DerivationFailed(e.to_string()))?;\n    mac.update(data);\n    let result = mac.finalize().into_bytes();\n    let mut out = [0u8; MAC_BYTES];\n    out.copy_from_slice(\u0026result);\n    Ok(out)\n}\n\n/// Verify the V2 MAC in constant time. Caller has already checked size + version byte.\nfn verify_mac(blob: \u0026[u8]) -\u003e Result\u003c(), CryptoError\u003e {\n    let chain_bytes: [u8; CHAIN_KEY_BYTES] = blob[OFF_CHAIN..OFF_CHAIN + CHAIN_KEY_BYTES]\n        .try_into()\n        .map_err(|_| CryptoError::InvalidBlob(\"chain slice\".into()))?;\n    let mac_key = hkdf::sha256(\u0026chain_bytes, None, CTX_BLOB_MAC, MAC_BYTES)?;\n    let expected = hmac_sha256(\u0026mac_key, \u0026blob[..SERIALIZED_PAYLOAD_SIZE])?;\n    let actual = \u0026blob[SERIALIZED_PAYLOAD_SIZE..SERIALIZED_SIZE];\n    if expected.as_slice().ct_eq(actual).unwrap_u8() == 1 {\n        Ok(())\n    } else {\n        Err(CryptoError::InvalidBlob(\n            \"MAC verification failed — tampered or corrupted\".into(),\n        ))\n    }\n}\n\n// ============================================================================\n// Tests\n// ============================================================================\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    fn fresh(chain0: [u8; 32]) -\u003e EphemeralRatchet {\n        let mut r = EphemeralRatchet::new();\n        let mut c = chain0;\n        r.initialize(\u0026mut c).unwrap();\n        assert_eq!(c, [0u8; 32], \"initialize must wipe master chain key\");\n        r\n    }\n\n    #[test]\n    fn fresh_batch_has_50_unique_pks_and_remaining_50() {\n        let r = fresh([1u8; 32]);\n        assert_eq!(r.batch_number(), 0);\n        assert_eq!(r.remaining_in_batch(), 50);\n        let pks = r.batch_public_keys().unwrap();\n        // Loose uniqueness check — HKDF + Ed25519 ensures it with overwhelming prob.\n        for i in 0..BATCH_SIZE {\n            for j in i + 1..BATCH_SIZE {\n                assert_ne!(pks[i], pks[j]);\n            }\n        }\n    }\n\n    #[test]\n    fn sign_and_advance_consumes_slot_zero_then_one() {\n        let mut r = fresh([2u8; 32]);\n        let sig0 = r.sign_and_advance(b\"hello\").unwrap();\n        assert_eq!(sig0.key_index, 0);\n        assert_eq!(sig0.batch_number, 0);\n        assert!(r.is_consumed(0).unwrap());\n        assert_eq!(r.remaining_in_batch(), 49);\n\n        let sig1 = r.sign_and_advance(b\"again\").unwrap();\n        assert_eq!(sig1.key_index, 1);\n        assert!(r.is_consumed(1).unwrap());\n    }\n\n    #[test]\n    fn sign_without_initialize_returns_error() {\n        let mut r = EphemeralRatchet::new();\n        assert!(matches!(\n            r.sign_and_advance(b\"x\"),\n            Err(CryptoError::DerivationFailed(_))\n        ));\n    }\n\n    #[test]\n    fn batch_exhaustion_returns_error() {\n        let mut r = fresh([3u8; 32]);\n        for _ in 0..BATCH_SIZE {\n            r.sign_and_advance(b\"x\").unwrap();\n        }\n        assert!(matches!(\n            r.sign_and_advance(b\"x\"),\n            Err(CryptoError::DerivationFailed(_))\n        ));\n    }\n\n    #[test]\n    fn advance_batch_increments_and_signs() {\n        let mut r = fresh([4u8; 32]);\n        let old_pks = r.batch_public_keys().unwrap();\n        let proof = r.advance_batch().unwrap();\n        assert_eq!(proof.signer_batch_number, 0);\n        assert_eq!(proof.signer_key_index, 0);\n        assert_eq!(proof.new_batch_number, 1);\n        assert_eq!(r.batch_number(), 1);\n        // New batch keys differ from old ones.\n        let new_pks = r.batch_public_keys().unwrap();\n        for i in 0..BATCH_SIZE {\n            assert_ne!(old_pks[i], new_pks[i]);\n        }\n        assert_eq!(proof.new_batch_public_keys, new_pks);\n    }\n\n    #[test]\n    fn serialize_size_is_4876_and_version_2() {\n        let r = fresh([5u8; 32]);\n        let blob = r.serialize().unwrap();\n        assert_eq!(blob.len(), SERIALIZED_SIZE);\n        assert_eq!(blob[0], VERSION_V2);\n    }\n\n    #[test]\n    fn serialize_then_deserialize_is_noop() {\n        let mut r = fresh([6u8; 32]);\n        r.sign_and_advance(b\"abc\").unwrap();\n        r.sign_and_advance(b\"def\").unwrap();\n        let blob = r.serialize().unwrap();\n        let r2 = EphemeralRatchet::deserialize(\u0026blob).unwrap();\n        let blob2 = r2.serialize().unwrap();\n        assert_eq!(\n            blob, blob2,\n            \"serialize → deserialize → serialize must be idempotent\"\n        );\n        assert_eq!(r2.batch_number(), r.batch_number());\n        assert_eq!(r2.remaining_in_batch(), r.remaining_in_batch());\n    }\n\n    #[test]\n    fn deserialize_v1_legacy_then_serialize_produces_v2() {\n        let r = fresh([7u8; 32]);\n        let v2 = r.serialize().unwrap();\n        // Construct a legacy V1 blob by stripping MAC + flipping byte 0.\n        let mut v1 = v2[..SERIALIZED_PAYLOAD_SIZE].to_vec();\n        v1[0] = VERSION_V1;\n        let r_from_v1 = EphemeralRatchet::deserialize(\u0026v1).unwrap();\n        let migrated = r_from_v1.serialize().unwrap();\n        assert_eq!(\n            migrated, v2,\n            \"V1 → V2 migration must be byte-identical to original V2\"\n        );\n    }\n\n    #[test]\n    fn deserialize_v2_rejects_tampered_payload() {\n        let r = fresh([8u8; 32]);\n        let mut blob = r.serialize().unwrap();\n        // Flip a byte inside the payload (not in the MAC region).\n        blob[100] ^= 0x01;\n        let err = EphemeralRatchet::deserialize(\u0026blob).unwrap_err();\n        assert!(matches!(err, CryptoError::InvalidBlob(_)), \"got {err:?}\");\n    }\n\n    #[test]\n    fn deserialize_v2_rejects_tampered_mac() {\n        let r = fresh([9u8; 32]);\n        let mut blob = r.serialize().unwrap();\n        let mac_idx = SERIALIZED_PAYLOAD_SIZE + 5;\n        blob[mac_idx] ^= 0x01;\n        assert!(matches!(\n            EphemeralRatchet::deserialize(\u0026blob),\n            Err(CryptoError::InvalidBlob(_))\n        ));\n    }\n\n    #[test]\n    fn deserialize_wrong_version_rejected() {\n        let mut blob = vec![0u8; SERIALIZED_SIZE];\n        blob[0] = 99;\n        assert!(matches!(\n            EphemeralRatchet::deserialize(\u0026blob),\n            Err(CryptoError::InvalidBlob(_))\n        ));\n    }\n\n    #[test]\n    fn deserialize_empty_rejected() {\n        assert!(matches!(\n            EphemeralRatchet::deserialize(\u0026[]),\n            Err(CryptoError::InvalidBlob(_))\n        ));\n    }\n\n    #[test]\n    fn wipe_zeroes_state_and_allows_reinitialize() {\n        let mut r = fresh([10u8; 32]);\n        r.sign_and_advance(b\"x\").unwrap();\n        r.wipe();\n        assert_eq!(r.batch_number(), 0);\n        assert!(!r.is_consumed(0).unwrap_or(true));\n        let mut chain = [42u8; 32];\n        r.initialize(\u0026mut chain).unwrap();\n        assert_eq!(r.remaining_in_batch(), 50);\n    }\n}\n","traces":[{"line":171,"address":[1565584],"length":1,"stats":{"Line":5}},{"line":174,"address":[1570528],"length":1,"stats":{"Line":5}},{"line":175,"address":[1621537],"length":1,"stats":{"Line":5}},{"line":176,"address":[15616634],"length":1,"stats":{"Line":5}},{"line":189,"address":[1566000],"length":1,"stats":{"Line":5}},{"line":193,"address":[15412939],"length":1,"stats":{"Line":5}},{"line":194,"address":[407048],"length":1,"stats":{"Line":1}},{"line":195,"address":[407014],"length":1,"stats":{"Line":1}},{"line":198,"address":[15607534,15607704],"length":1,"stats":{"Line":5}},{"line":199,"address":[15558096],"length":1,"stats":{"Line":5}},{"line":200,"address":[1622208],"length":1,"stats":{"Line":5}},{"line":201,"address":[15607783],"length":1,"stats":{"Line":5}},{"line":206,"address":[15413248],"length":1,"stats":{"Line":3}},{"line":207,"address":[1622261],"length":1,"stats":{"Line":3}},{"line":212,"address":[1485056],"length":1,"stats":{"Line":3}},{"line":213,"address":[745706,745696],"length":1,"stats":{"Line":9}},{"line":220,"address":[1622336],"length":1,"stats":{ ndard NaCl naming; clippy's\n// `similar_names` would otherwise ding every seal/box function in the crate.\n// Kept as a module-level allow rather than a per-fn attribute.\n#![allow(clippy::similar_names)]\n\nuse crate::error::CryptoError;\nuse blake2::digest::{Update, VariableOutput};\nuse blake2::Blake2bVar;\nuse crypto_box::aead::Aead;\nuse crypto_box::{Nonce, PublicKey, SalsaBox, SecretKey};\nuse rand_core::OsRng;\nuse zeroize::Zeroizing;\n\n/// Length of the ephemeral public key prepended to the sealed envelope.\npub const EPHEMERAL_PK_BYTES: usize = 32;\n/// Length of the Poly1305 authentication tag.\npub const SEAL_TAG_BYTES: usize = 16;\n/// Overhead of a sealed envelope over the plaintext = epk + tag = 48 bytes.\npub const SEAL_OVERHEAD: usize = EPHEMERAL_PK_BYTES + SEAL_TAG_BYTES;\n\n/// Seal `plaintext` for the recipient with X25519 public key `recipient_pk`.\n///\n/// Returns `epk || ciphertext_with_tag` = `32 + 16 + plaintext.len()` bytes.\n///\n/// # Errors\n/// Returns [`CryptoError::DerivationFailed`] if the AEAD encryption fails\n/// (never in practice with valid inputs).\npub fn seal(plaintext: \u0026[u8], recipient_pk: \u0026[u8; 32]) -\u003e Result\u003cVec\u003cu8\u003e, CryptoError\u003e {\n    // 1. Generate an ephemeral X25519 keypair. OsRng is wired through the\n    //    crypto_box crate's PublicKey/SecretKey constructors.\n    let eph_secret = SecretKey::generate(\u0026mut OsRng);\n    let eph_public = eph_secret.public_key();\n    let recipient = PublicKey::from(*recipient_pk);\n\n    // 2. Derive the NaCl-style nonce from Blake2b(epk || recipient_pk, 24 B).\n    let nonce_bytes = seal_nonce(eph_public.as_bytes(), recipient_pk);\n\n    // 3. Encrypt with XSalsa20-Poly1305 (NaCl \"box_easy\" = tag-prepended).\n    let salsabox = SalsaBox::new(\u0026recipient, \u0026eph_secret);\n    let nonce_ga = Nonce::from_slice(\u0026nonce_bytes);\n    let ct = salsabox\n        .encrypt(nonce_ga, plaintext)\n        .map_err(|e| CryptoError::DerivationFailed(format!(\"crypto_box encrypt: {e}\")))?;\n\n    // 4. Output = epk || ct.\n    let mut out = Vec::with_capacity(EPHEMERAL_PK_BYTES + ct.len());\n    out.extend_from_slice(eph_public.as_bytes());\n    out.extend_from_slice(\u0026ct);\n    Ok(out)\n}\n\n/// Unseal a blob produced by [`seal`] (or libsodium `crypto_box_seal`) with the\n/// recipient's X25519 secret key.\n///\n/// Both the recipient's pk and sk are required: the sk decrypts, the pk is\n/// used to re-derive the nonce (which depends on `Blake2b(epk || pk)`).\n///\n/// # Errors\n/// Returns [`CryptoError::WrongPin`] on AEAD tag mismatch — the caller can't\n/// distinguish \"wrong recipient\" from \"tampered blob\", matching the Kotlin\n/// `SecurityException` behavior. (`WrongPin` is reused as a generic\n/// authentication failure — S8 may introduce a dedicated variant if the\n/// distinction becomes useful.)\npub fn seal_open(\n    blob: \u0026[u8],\n    recipient_pk: \u0026[u8; 32],\n    recipient_sk: \u0026[u8; 32],\n) -\u003e Result\u003cZeroizing\u003cVec\u003cu8\u003e\u003e, CryptoError\u003e {\n    if blob.len() \u003c SEAL_OVERHEAD {\n        return Err(CryptoError::InvalidBlob(format!(\n            \"sealed blob too short: {} (minimum {})\",\n            blob.len(),\n            SEAL_OVERHEAD\n        )));\n    }\n    let mut epk_bytes = [0u8; EPHEMERAL_PK_BYTES];\n    epk_bytes.copy_from_slice(\u0026blob[..EPHEMERAL_PK_BYTES]);\n    let ct = \u0026blob[EPHEMERAL_PK_BYTES..];\n\n    let eph_public = PublicKey::from(epk_bytes);\n    let my_secret = SecretKey::from(*recipient_sk);\n    let salsabox = SalsaBox::new(\u0026eph_public, \u0026my_secret);\n\n    let nonce_bytes = seal_nonce(\u0026epk_bytes, recipient_pk);\n    let nonce_ga = Nonce::from_slice(\u0026nonce_bytes);\n\n    let plaintext = salsabox\n        .decrypt(nonce_ga, ct)\n        .map_err(|_| CryptoError::WrongPin)?;\n    Ok(Zeroizing::new(plaintext))\n}\n\n/// Derive the seal nonce from `Blake2b(epk || pk, out=24)` — the exact shape\n/// of libsodium's internal `_crypto_box_seal_nonce` (keyless, 24-byte output).\nfn seal_nonce(epk: \u0026[u8; 32], pk: \u0026[u8; 32]) -\u003e [u8; 24] {\n    let mut hasher = Blake2bVar::new(24).expect(\"24 \u003c= Blake2b max output 64\");\n    Update::update(\u0026mut hasher, epk);\n    Update::update(\u0026mut hasher, pk);\n    let mut nonce = [0u8; 24];\n    hasher\n        .finalize_variable(\u0026mut nonce)\n        .expect(\"24-byte output matches the constructor size\");\n    nonce\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    /// Round-trip: seal then unseal must recover the plaintext.\n    #[test]\n    fn seal_open_roundtrip() {\n        let sk = SecretKey::generate(\u0026mut OsRng);\n        let pk = sk.public_key();\n        let pk_bytes: [u8; 32] = *pk.as_bytes();\n        let sk_bytes: [u8; 32] = sk.to_bytes();\n\n        let session_key = [0x42u8; 32];\n        let blob = seal(\u0026session_key, \u0026pk_bytes).unwrap();\n        assert_eq!(blob.len(), SEAL_OVERHEAD + session_key.len());\n\n        let opened = seal_open(\u0026blob, \u0026pk_bytes, \u0026sk_bytes).unwrap();\n        assert_eq!(\u0026opened[..], \u0026session_key[..]);\n    }\n\n    #[test]\n    fn seal_open_wrong_recipient_rejected() {\n        let victim = SecretKey::generate(\u0026mut OsRng);\n        let attacker = SecretKey::generate(\u0026mut OsRng);\n        let victim_pk: [u8; 32] = *victim.public_key().as_bytes();\n\n        let blob = seal(b\"secret\", \u0026victim_pk).unwrap();\n\n        // Try to open with the attacker's keys (wrong pk used for nonce derivation\n        // AND wrong sk for X25519 — both contribute to the failure).\n        let attacker_pk: [u8; 32] = *attacker.public_key().as_bytes();\n        let attacker_sk: [u8; 32] = attacker.to_bytes();\n        let err = seal_open(\u0026blob, \u0026attacker_pk, \u0026attacker_sk).unwrap_err();\n        assert!(matches!(err, CryptoError::WrongPin), \"got {err:?}\");\n    }\n\n    #[test]\n    fn seal_open_tampered_ciphertext_rejected() {\n        let sk = SecretKey::generate(\u0026mut OsRng);\n        let pk_bytes: [u8; 32] = *sk.public_key().as_bytes();\n        let sk_bytes: [u8; 32] = sk.to_bytes();\n        let mut blob = seal(b\"payload\", \u0026pk_bytes).unwrap();\n        blob[40] ^= 1;\n        assert!(matches!(\n            seal_open(\u0026blob, \u0026pk_bytes, \u0026sk_bytes),\n            Err(CryptoError::WrongPin)\n        ));\n    }\n\n    #[test]\n    fn seal_open_truncated_rejected() {\n        let err = seal_open(\u0026[0u8; 10], \u0026[0u8; 32], \u0026[0u8; 32]).unwrap_err();\n        assert!(matches!(err, CryptoError::InvalidBlob(_)));\n    }\n\n    /// The nonce is deterministic in (epk, pk) — two seals of different\n    /// plaintexts to the same recipient must produce different epks (and\n    /// therefore different nonces).\n    #[test]\n    fn seal_epk_rerandomizes_per_call() {\n        let sk = SecretKey::generate(\u0026mut OsRng);\n        let pk_bytes: [u8; 32] = *sk.public_key().as_bytes();\n        let blob_a = seal(b\"x\", \u0026pk_bytes).unwrap();\n        let blob_b = seal(b\"x\", \u0026pk_bytes).unwrap();\n        assert_ne!(\u0026blob_a[..32], \u0026blob_b[..32], \"epk must differ per call\");\n    }\n\n    #[test]\n    fn seal_nonce_is_deterministic_in_inputs() {\n        let epk = [1u8; 32];\n        let pk = [2u8; 32];\n        assert_eq!(seal_nonce(\u0026epk, \u0026pk), seal_nonce(\u0026epk, \u0026pk));\n    }\n}\n","traces":[{"line":56,"address":[1600019,1598896,1599981],"length":1,"stats":{"Line":4}},{"line":59,"address":[523114],"length":1,"stats":{"Line":4}},{"line":60,"address":[797416],"length":1,"stats":{"Line":4}},{"line":61,"address":[1599049],"length":1,"stats":{"Line":4}},{"line":64,"address":[15398443],"length":1,"stats":{"Line":4}},{"line":67,"address":[1664188],"length":1,"stats":{"Line":4}},{"line":68,"address":[15457340,15457428],"length":1,"stats":{"Line":8}},{"line":69,"address":[14386716,14386887],"le ype | Zero on drop | `mlock`ed | Debug redacted | Use for |\n//! |---|---|---|---|---|\n//! | [`SecretBytes`] | yes | no | yes | ephemeral secrets that live in regular heap |\n//! | [`LockedSecret`] | yes | yes | yes | long-lived keys that must not page to disk |\n//!\n//! Both types expose bytes only through `with_bytes(f)` / `with_bytes_mut(f)`\n//! — the reference cannot escape the closure, preventing accidental copies\n//! into longer-lived `Vec\u003cu8\u003e` through `.to_vec()`.\n//!\n//! `LockedSecret` uses [`memsec::mlock`] to pin pages in physical memory so\n//! they never swap to disk, and zeroizes + munlocks on drop. The operations\n//! are `unsafe` by nature (raw pointer arithmetic and syscalls); all such\n//! code is confined to this module with explicit `// SAFETY:` comments.\n\n#![allow(unsafe_code)] // mlock/munlock through raw pointers — isolated here\n\nuse crate::error::CryptoError;\nuse std::ptr::NonNull;\nuse zeroize::Zeroize;\n\n// ============================================================================\n// SecretBytes — heap-backed, zero-on-drop, no mlock.\n// ============================================================================\n\n/// A heap-allocated byte buffer that is zeroized when dropped.\n///\n/// Suitable for short-lived secret material that doesn't justify the overhead\n/// of pinning a page in memory. For long-lived keys, prefer [`LockedSecret`].\n///\n/// # Example\n/// ```\n/// # use frappuccino_crypto_core::secret::SecretBytes;\n/// let mut secret = SecretBytes::new_zeroed(32);\n/// secret.with_bytes_mut(|b| b[0] = 42);\n/// secret.with_bytes(|b| assert_eq!(b[0], 42));\n/// // `secret` wipes its buffer when dropped here.\n/// ```\n#[must_use]\npub struct SecretBytes {\n    inner: Vec\u003cu8\u003e,\n}\n\nimpl SecretBytes {\n    /// Allocate `size` zeroed bytes.\n    /// (struct is `#[must_use]` so callers can't silently drop the allocation.)\n    pub fn new_zeroed(size: usize) -\u003e Self {\n        Self {\n            inner: vec![0u8; size],\n        }\n    }\n\n    /// Copy `data` into a new `SecretBytes`. The source slice is *not* wiped;\n    /// the caller is responsible for zeroizing the original if it was secret.\n    pub fn from_slice(data: \u0026[u8]) -\u003e Self {\n        Self {\n            inner: data.to_vec(),\n        }\n    }\n\n    /// Number of bytes held.\n    #[must_use]\n    pub fn len(\u0026self) -\u003e usize {\n        self.inner.len()\n    }\n\n    /// True if the buffer is zero-length.\n    #[must_use]\n    pub fn is_empty(\u0026self) -\u003e bool {\n        self.inner.is_empty()\n    }\n\n    /// Grants read-only access to the bytes for the duration of the closure.\n    pub fn with_bytes\u003cR\u003e(\u0026self, f: impl FnOnce(\u0026[u8]) -\u003e R) -\u003e R {\n        f(\u0026self.inner)\n    }\n\n    /// Grants read-write access to the bytes for the duration of the closure.\n    pub fn with_bytes_mut\u003cR\u003e(\u0026mut self, f: impl FnOnce(\u0026mut [u8]) -\u003e R) -\u003e R {\n        f(\u0026mut self.inner)\n    }\n}\n\nimpl Drop for SecretBytes {\n    fn drop(\u0026mut self) {\n        self.inner.zeroize();\n    }\n}\n\n// Redact Debug so `println!(\"{secret:?}\")` / log crate integrations don't leak bytes.\nimpl std::fmt::Debug for SecretBytes {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        write!(f, \"SecretBytes(\u003c{}-byte redacted\u003e)\", self.inner.len())\n    }\n}\n\n// ============================================================================\n// LockedSecret — heap-backed, zero-on-drop, mlock'd, Debug redacted.\n// ============================================================================\n\n/// A byte buffer that is both zeroized *and* kept from swapping to disk.\n///\n/// On construction, calls `mlock` on the underlying buffer (`VirtualLock` on\n/// Windows). On drop, zeroizes then calls `munlock`. If the OS refuses mlock\n/// (e.g., process can't grow its working set), construction fails with\n/// [`CryptoError::DerivationFailed`] rather than silently degrading.\n///\n/// The size is fixed at construction — the backing `Box\u003c[u8]\u003e` never\n/// reallocates, so the locked region stays stable for the lifetime.\n#[must_use]\npub struct LockedSecret {\n    inner: Box\u003c[u8]\u003e,\n}\n\nimpl LockedSecret {\n    /// Allocate `size` zeroed bytes and pin them in RAM via `mlock`.\n    ///\n    /// # Errors\n    /// Returns [`CryptoError::DerivationFailed`] if `size == 0` or the OS\n    /// refuses the `mlock` syscall (rare; typically rlimit-related).\n    pub fn new_zeroed(size: usize) -\u003e Result\u003cSelf, CryptoError\u003e {\n        if size == 0 {\n            return Err(CryptoError::DerivationFailed(\n                \"LockedSecret size must be \u003e 0\".into(),\n            ));\n        }\n        let mut inner: Box\u003c[u8]\u003e = vec![0u8; size].into_boxed_slice();\n\n        // SAFETY:\n        //   * `inner.as_mut_ptr()` points to exactly `size` contiguous bytes\n        //     owned by this stack frame for the duration of this call.\n        //   * `NonNull::new` rejects null; `vec![0u8; size \u003e 0]` cannot be null.\n        //   * `memsec::mlock` reads and pins the range but does not free or\n        //     alias the memory; the Box remains the unique owner.\n        let ptr = NonNull::new(inner.as_mut_ptr())\n            .ok_or_else(|| CryptoError::DerivationFailed(\"null buffer\".into()))?;\n        let locked = unsafe { memsec::mlock(ptr.as_ptr(), size) };\n        if !locked {\n            return Err(CryptoError::DerivationFailed(\n                \"mlock failed — RLIMIT_MEMLOCK / working-set quota exhausted\".into(),\n            ));\n        }\n        Ok(Self { inner })\n    }\n\n    /// Number of bytes held (fixed at construction).\n    #[must_use]\n    pub fn len(\u0026self) -\u003e usize {\n        self.inner.len()\n    }\n\n    /// Always `false` — `new_zeroed(0)` returns `Err`.\n    #[must_use]\n    pub fn is_empty(\u0026self) -\u003e bool {\n        self.inner.is_empty()\n    }\n\n    /// Grants read-only access to the bytes for the duration of the closure.\n    pub fn with_bytes\u003cR\u003e(\u0026self, f: impl FnOnce(\u0026[u8]) -\u003e R) -\u003e R {\n        f(\u0026self.inner)\n    }\n\n    /// Grants read-write access to the bytes for the duration of the closure.\n    pub fn with_bytes_mut\u003cR\u003e(\u0026mut self, f: impl FnOnce(\u0026mut [u8]) -\u003e R) -\u003e R {\n        f(\u0026mut self.inner)\n    }\n\n    /// Copy `src` into the locked buffer and wipe the source in place.\n    /// Convenience for the common pattern of moving a non-locked secret into\n    /// a locked home.\n    ///\n    /// # Errors\n    /// Returns [`CryptoError::DerivationFailed`] if `src.len() != self.len()`.\n    pub fn write_and_wipe_source(\u0026mut self, src: \u0026mut [u8]) -\u003e Result\u003c(), CryptoError\u003e {\n        if src.len() != self.inner.len() {\n            return Err(CryptoError::DerivationFailed(format!(\n                \"size mismatch: locked={}, src={}\",\n                self.inner.len(),\n                src.len()\n            )));\n        }\n        self.inner.copy_from_slice(src);\n        src.zeroize();\n        Ok(())\n    }\n}\n\nimpl Drop for LockedSecret {\n    fn drop(\u0026mut self) {\n        // Step 1: zero the bytes so even if munlock fails the memory is wiped.\n        self.inner.zeroize();\n\n        // Step 2: release the mlock.\n        // SAFETY: see new_zeroed — the pointer / length remain valid until\n        // the Box is freed (which happens after this Drop returns).\n        if let Some(ptr) = NonNull::new(self.inner.as_mut_ptr()) {\n            let _ = unsafe { memsec::munlock(ptr.as_ptr(), self.inner.len()) };\n        }\n    }\n}\n\nimpl std::fmt::Debug for LockedSecret {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        write!(f, \"LockedSecret(\u003c{}-byte redacted\u003e)\", self.inner.len())\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn secret_bytes_new_zeroed_is_zero() {\n        let s = SecretBytes::new_zeroed(32);\n        s.with_bytes(|b| assert_eq!(b, \u0026[0u8; 32]));\n    }\n\n    #[test]\n    fn secret_bytes_from_slice_copies() {\n        let data = [1u8, 2, 3, 4];\n        let s = SecretBytes::from_slice(\u0026data);\n        s.with_bytes(|b| assert_eq!(b, \u0026[1, 2, 3, 4]));\n    }\n\n    #[test]\n    fn secret_bytes_mut_access_writes_through() {\n        let mut s = SecretBytes::new_zeroed(4);\n        s.with_bytes_mut(|b| b.copy_from_slice(\u0026[9, 8, 7, 6]));\n        s.with_bytes(|b| assert_eq!(b, \u0026[9, 8, 7, 6]));\n    }\n\n    #[test]\n    fn secret_bytes_debug_is_redacted() {\n        let s = SecretBytes::from_slice(\u0026[0xDEu8; 32]);\n        let dbg = format!(\"{s:?}\");\n        assert_eq!(dbg, \"SecretBytes(\u003c32-byte redacted\u003e)\");\n    }\n\n    #[test]\n    fn locked_secret_mlocks_and_mwipes() {\n        let mut ls = LockedSecret::new_zeroed(32).expect(\"mlock should succeed\");\n        ls.with_bytes_mut(|b| b.copy_from_slice(\u0026[0xAB; 32]));\n        ls.with_bytes(|b| assert_eq!(b, \u0026[0xAB; 32]));\n        // Drop is implicit at end of test; no asserting on post-drop memory\n        // (the Box is freed too).\n    }\n\n    #[test]\n    fn locked_secret_zero_size_rejected() {\n        let err = LockedSecret::new_zeroed(0).unwrap_err();\n        assert!(matches!(err, CryptoError::DerivationFailed(_)));\n    }\n\n    #[test]\n    fn locked_secret_write_and_wipe() {\n        let mut ls = LockedSecret::new_zeroed(4).unwrap();\n        let mut src = [1u8, 2, 3, 4];\n        ls.write_and_wipe_source(\u0026mut src).unwrap();\n        assert_eq!(src, [0, 0, 0, 0], \"source must be wiped\");\n        ls.with_bytes(|b| assert_eq!(b, \u0026[1, 2, 3, 4]));\n    }\n\n    #[test]\n    fn locked_secret_write_size_mismatch_rejected() {\n xpect(\"seed.json must be valid JSON\");\n\n    // Sanity: our constants agree with what the Kotlin dumper captured.\n    assert_eq!(file.iterations, 2048, \"PBKDF2 iteration count contract\");\n    assert_eq!(file.seed_bytes, 64, \"seed length contract\");\n\n    for (i, case) in file.cases.iter().enumerate() {\n        let actual = mnemonic_to_seed(\u0026case.mnemonic, \u0026case.passphrase, Language::French)\n            .unwrap_or_else(|e| panic!(\"case {i}: mnemonic_to_seed failed: {e:?}\"));\n        let expected = hex::decode(\u0026case.seed_hex).expect(\"seed_hex must be valid hex\");\n        assert_eq!(\n            \u0026actual.as_bytes()[..],\n            expected.as_slice(),\n            \"case {i}: mnemonic={:?} passphrase={:?}\\n  expected: {}\\n  actual:   {}\",\n            case.mnemonic,\n            case.passphrase,\n            case.seed_hex,\n            hex::encode(actual.as_bytes()),\n        );\n    }\n}\n\n#[test]\nfn bip39_normalize_phrase_matches_kotlin_fixtures() {\n    let path = vectors_dir().join(\"bip39\").join(\"normalize.json\");\n    let raw =\n        fs::read_to_string(\u0026path).unwrap_or_else(|e| panic!(\"Missing {}: {e}\", path.display()));\n    let file: NormalizeFile = serde_json::from_str(\u0026raw).unwrap();\n    for (i, case) in file.cases.iter().enumerate() {\n        let actual = normalize_phrase(\u0026case.input, Language::French).unwrap();\n        assert_eq!(\n            actual, case.canonical,\n            \"case {i}: input={:?}\\n  expected: {}\\n  actual:   {}\",\n            case.input, case.canonical, actual\n        );\n    }\n}\n\n#[test]\nfn bip39_normalize_word_rejects_invalid_matches_kotlin_fixtures() {\n    let path = vectors_dir().join(\"bip39\").join(\"normalize-invalid.json\");\n    let raw =\n        fs::read_to_string(\u0026path).unwrap_or_else(|e| panic!(\"Missing {}: {e}\", path.display()));\n    let file: InvalidFile = serde_json::from_str(\u0026raw).unwrap();\n    for case in file.invalid_words {\n        let err = normalize_word(\u0026case.word, Language::French).unwrap_err();\n        assert!(\n            matches!(err, CryptoError::InvalidMnemonicWord { .. }),\n            \"word={:?} expected InvalidMnemonicWord, got {err:?}\",\n            case.word\n        );\n    }\n}\n","traces":[{"line":20,"address":[359580,359424,359574],"length":1,"stats":{"Line":1}},{"line":22,"address":[359438],"length":1,"stats":{"Line":1}},{"line":23,"address":[359470],"length":1,"stats":{"Line":1}},{"line":24,"address":[359509],"length":1,"stats":{"Line":1}},{"line":25,"address":[359543],"length":1,"stats":{"Line":1}}],"covered":5,"coverable":5},{"path":["/","work","core","tests","parity_hkdf.rs"],"content":"//! Byte-exact parity test for HKDF-SHA256 against the Kotlin reference.\n//!\n//! Uses the `ratchet/init.json` fixture produced by `ParityVectorsDumper`:\n//! the Kotlin side computed `HKDF-SHA256(chain_0, null, CTX_NEXT_CHAIN, 32)`\n//! and recorded the result as `chain_1_hex`. Our Rust implementation must\n//! produce the same 32 bytes for the same inputs.\n//!\n//! If this fails, either:\n//!   1. Our HKDF signature does not match Kotlin's null-salt handling, OR\n//!   2. The domain-separation context string drifted (which would break every\n//!      enrolled ratchet — see `PLAN_RUST_EXEC.md` §1.3 for immutability).\n\nuse frappuccino_crypto_core::hkdf::sha256;\nuse serde::Deserialize;\nuse std::fs;\nuse std::path::PathBuf;\n\nfn vectors_dir() -\u003e PathBuf {\n    let mut p = PathBuf::from(env!(\"CARGO_MANIFEST_DIR\"));\n    p.pop();\n    p.push(\"parity-vectors\");\n    p\n}\n\n#[derive(Deserialize)]\nstruct RatchetInit {\n    hkdf_ctx_next_chain: String,\n    chain_0_hex: String,\n    chain_1_hex: String,\n}\n\n#[test]\nfn hkdf_sha256_next_chain_matches_kotlin() {\n    let path = vectors_dir().join(\"ratchet\").join(\"init.json\");\n    let raw =\n        fs::read_to_string(\u0026path).unwrap_or_else(|e| panic!(\"Missing {}: {e}\", path.display()));\n    let v: RatchetInit = serde_json::from_str(\u0026raw).unwrap();\n\n    // Guard the invariant — context string is load-bearing.\n    assert_eq!(\n        v.hkdf_ctx_next_chain, \"frappuccino-v2-ratchet-next-chain\",\n        \"CTX_NEXT_CHAIN must match PLAN_RUST_EXEC.md §1.3 verbatim\"\n    );\n\n    let ikm = hex::decode(\u0026v.chain_0_hex).unwrap();\n    let expected = hex::decode(\u0026v.chain_1_hex).unwrap();\n\n    // Kotlin call: Hkdf.sha256(ikm=chain_0, salt=null, info=CTX, length=32)\n    // Rust call : sha256(ikm, None, info, 32)\n    let actual = sha256(\u0026ikm, None, v.hkdf_ctx_next_chain.as_bytes(), 32).unwrap();\n\n    assert_eq!(\n        \u0026actual[..],\n        expected.as_slice(),\n        \"HKDF(chain_0, null, \\\"{}\\\", 32) divergence\\n  expected: {}\\n  actual:   {}\",\n        v.hkdf_ctx_next_chain,\n        v.chain_1_hex,\n        hex::encode(\u0026actual[..]),\n    );\n}\n\n#[test]\nfn hkdf_sha256_batch_seeds_length_matches_contract() {\n    // Sanity check that HKDF can produce 50*32 = 1600 bytes in one go — the\n    // batch-seeds derivation the ratchet will use in S5. This doesn't compare\n    // against a fixture (batch_0_public_keys are ed25519-derived, validated\n    // byte-exact in S3+), just that the length path works.\n    let path = vectors_dir().join(\"ratchet\").join(\"init.json\");\n    let raw = fs::read_to_string(\u0026path).unwrap();\n    let v: RatchetInit = serde_json::from_str(\u0026raw).unwrap();\n    let ikm = hex::decode(\u0026v.chain_0_hex).unwrap();\n\n    let seeds = sha256(\u0026ikm, None, b\"frappuccino-v2-ratchet-batch-seeds\", 50 * 32).unwrap();\n    assert_eq!(seeds.len(), 50 * 32);\n    assert!(seeds.iter().any(|\u0026b| b != 0), \"seeds must not be all-zero\");\n}\n","traces":[{"line":18,"address":[372128,372278,372284],"length":1,"stats":{"Line":1}},{"line":19,"address":[372142],"length":1,"stats":{"Line":1}},{"line":20,"address":[372174],"length":1,"stats":{"Line":1}},{"line":21,"address":[372213],"length":1,"stats":{"Line":1}},{"line":22,"address":[372247],"length":1,"stats":{"Line":1}}],"covered":5,"coverable":5},{"path":["/","work","core","tests","parity_identity.rs"],"content":"//! Byte-exact parity tests for identity derivation against the Kotlin reference.\n//!\n//! Loads `parity-vectors/identity/derive.json` and, for every captured case,\n//! reconstructs the `EnrollmentKit` + `ArchiveIdentity` paths and asserts that\n//! `ed25519_pk`, `x25519_pk`, `chain_0`, and `fingerprint` all match exactly.\n//!\n//! If any of these fail, either:\n//!   1. Kotlin changed an HKDF context string (invariant break — see\n//!      `PLAN_RUST_EXEC.md` §1.2), or\n//!   2. Rust diverged (bug — fix here, don't regenerate vectors).\n\nuse frappuccino_crypto_core::identity::{ArchiveIdentity, EnrollmentKit};\nuse serde::Deserialize;\nuse std::fs;\nuse std::path::PathBuf;\n\nfn vectors_dir() -\u003e PathBuf {\n    let mut p = PathBuf::from(env!(\"CARGO_MANIFEST_DIR\"));\n    p.pop();\n    p.push(\"parity-vectors\");\n    p\n}\n\n#[derive(Deserialize)]\nstruct DeriveFile {\n    hkdf_ctx_identity: String,\n    hkdf_ctx_encryption: String,\n    hkdf_ctx_chain0: String,\n    cases: Vec\u003cCase\u003e,\n}\n\n#[derive(Deserialize)]\nstruct Case {\n    mnemonic: String,\n    passphrase: String,\n    ed25519_pk_hex: String,\n    x25519_pk_hex: String,\n    chain_0_hex: String,\n    fingerprint: String,\n}\n\n#[test]\nfn identity_derivation_matches_kotlin_fixtures() {\n    let path = vectors_dir().join(\"identity\").join(\"derive.json\");\n    let raw =\n        fs::read_to_string(\u0026path).unwrap_or_else(|e| panic!(\"Missing {}: {e}\", path.display()));\n    let file: DeriveFile = serde_json::from_str(\u0026raw).unwrap();\n\n    // Guard the HKDF context strings — these are load-bearing invariants.\n    // Any drift breaks every enrolled identity on the production server.\n    assert_eq!(file.hkdf_ctx_identity, \"stream.identity.ed25519.v1\");\n    assert_eq!(file.hkdf_ctx_encryption, \"stream.encryption.x25519.v1\");\n    assert_eq!(file.hkdf_ctx_chain0, \"stream.ratchet.chain0.v2\");\n\n    for (i, case) in file.cases.iter().enumerate() {\n        // -- Enrollment path --\n        let mut kit = EnrollmentKit::from_mnemonic(\u0026case.mnemonic, \u0026case.passphrase)\n            .unwrap_or_else(|e| panic!(\"case {i}: EnrollmentKit failed: {e:?}\"));\n\n        assert_eq!(\n            kit.identity().ed25519_pk_hex(),\n            case.ed25519_pk_hex,\n            \"case {i}: ed25519_pk divergence for mnemonic={:?} pp={:?}\",\n            case.mnemonic,\n            case.passphrase,\n        );\n        let x_pk_actual = hex_encode(kit.identity().x25519_pk());\n        assert_eq!(x_pk_actual, case.x25519_pk_hex, \"case {i}: x25519_pk\");\n        assert_eq!(\n            kit.identity().readable_fingerprint(),\n            case.fingerprint,\n            \"case {i}: fingerprint\"\n        );\n\n        // Consume chain_0 and compare against the Kotlin-captured value.\n        let chain = kit.take_chain_zero().unwrap();\n        chain.with_bytes(|bytes| {\n            assert_eq!(hex_encode(bytes), case.chain_0_hex, \"case {i}: chain_0\");\n        });\n\n        // -- Archive path must produce identical public keys --\n        let archive = ArchiveIdentity::from_mnemonic(\u0026case.mnemonic, \u0026case.passphrase).unwrap();\n        assert_eq!(\n            hex_encode(archive.identity().ed25519_pk()),\n            case.ed25519_pk_hex,\n            \"case {i}: ArchiveIdentity.ed_pk diverges from EnrollmentKit\"\n        );\n        assert_eq!(\n            hex_encode(archive.identity().x25519_pk()),\n            case.x25519_pk_hex,\n            \"case {i}: ArchiveIdentity.x_pk diverges from EnrollmentKit\"\n        );\n    }\n}\n\nfn hex_encode(bytes: \u0026[u8]) -\u003e String {\n    use std::fmt::Write;\n    let mut s = String::with_capacity(bytes.len() * 2);\n    for b in bytes {\n        let _ = write!(s, \"{b:02x}\");\n    }\n    s\n}\n","traces":[{"line":17,"address":[394480,394630,394636],"length":1,"stats":{"Line":1}},{"line":18,"address":[394494],"length":1,"stats":{"Line":1}},{"line":19,"address":[394526],"length":1,"stats":{"Line":1}},{"line":20,"address":[394565],"length":1,"stats":{"Line":1}},{"line":21,"address":[394599],"length":1,"stats":{"Line":1}},{"line":96,"address":[395085,395091,394656],"length":1,"stats":{"Line":1}},{"line":98,"address":[394702,394766],"length":1,"stats":{"Line":1}},{"line":99,"address":[394745,394830],"length":1,"stats":{"Line":2}},{"line":100,"address":[394909,394977],"length":1,"stats":{"Line":2}},{"line":102,"address":[394943],"length":1,"stats":{"Line":1}}],"covered":10,"coverable":10},{"path":["/","work","core","tests","parity_pin_store.rs"],"content":"//! Byte-exact parity tests for `PinProtectedStore` against the Kotlin reference.\n//!\n//! Loads `parity-vectors/pin_store/seal.json`, parses salt + nonce out of the\n//! captured blob, and asserts that:\n//!   1. `seal_deterministic(pin, plaintext, salt, nonce)` reproduces the blob\n//!      byte-for-byte — proves our Argon2id + `XChaCha20-Poly1305` wiring is\n//!      identical to libsodium's.\n//!   2. `open(pin, blob)` recovers the plaintext — proves the decrypt path too.\n//!\n//! ## Cost note\n//!\n//! Each case runs Argon2id twice (seal + open) at the production\n//! `256 MiB × t=4` parameters ≈ 1.2 s per call on a dev laptop. Three cases\n//! → ~7 s total. This is why Argon2 RFC vectors live in the upstream crate\n//! rather than here; we only need round-trip parity against Kotlin fixtures.\n\nuse frappuccino_crypto_core::pin_store::{\n    open, seal_deterministic, HEADER_SIZE, NONCE_BYTES, SALT_BYTES, VERSION,\n};\nuse serde::Deserialize;\nuse std::fs;\nuse std::path::PathBuf;\n\nfn vectors_dir() -\u003e PathBuf {\n    let mut p = PathBuf::from(env!(\"CARGO_MANIFEST_DIR\"));\n    p.pop();\n    p.push(\"parity-vectors\");\n    p\n}\n\n#[derive(Deserialize)]\nstruct SealFile {\n    kdf: String,\n    kdf_ops_limit: u32,\n    kdf_mem_limit_bytes: u64,\n    cipher: String,\n    aad: String,\n    salt_bytes: usize,\n    nonce_bytes: usize,\n    tag_bytes: usize,\n    version_byte: u8,\n    cases: Vec\u003cCase\u003e,\n}\n\n#[derive(Deserialize)]\nstruct Case {\n    pin: String,\n    plaintext_hex: String,\n    blob_hex: String,\n}\n\n#[test]\nfn pin_store_matches_kotlin_fixtures() {\n    let path = vectors_dir().join(\"pin_store\").join(\"seal.json\");\n    let raw =\n        fs::read_to_string(\u0026path).unwrap_or_else(|e| panic!(\"Missing {}: {e}\", path.display()));\n    let file: SealFile = serde_json::from_str(\u0026raw).unwrap();\n\n    // Guard the format contract — these values are baked into every sealed\n    // blob already on disk. Any drift here means either Kotlin changed the\n    // spec (talk to the team first) or Rust picked wrong defaults.\n    assert_eq!(file.kdf, \"Argon2id\");\n    assert_eq!(file.kdf_ops_limit, 4);\n    assert_eq!(file.kdf_mem_limit_bytes, 256 * 1024 * 1024);\n    assert_eq!(file.cipher, \"XChaCha20-Poly1305-IETF\");\n    assert_eq!(file.aad, \"frappuccino-v2-pin-store-v1\");\n    assert_eq!(file.salt_bytes, SALT_BYTES);\n    assert_eq!(file.nonce_bytes, NONCE_BYTES);\n    assert_eq!(file.tag_bytes, 16);\n    assert_eq!(file.version_byte, VERSION);\n\n    for (i, case) in file.cases.iter().enumerate() {\n        let blob_expected = hex::decode(\u0026case.blob_hex).expect(\"blob_hex must be valid hex\");\n        let plaintext = hex::decode(\u0026case.plaintext_hex).expect(\"plaintext_hex\");\n\n        // --- Extract salt + nonce from the captured blob so we can reproduce it ---\n        assert_eq!(\n            blob_expected[0], VERSION,\n            \"case {i}: captured blob has unexpected version\"\n        );\n        let salt_end = 1 + SALT_BYTES;\n        let salt: [u8; SALT_BYTES] = blob_expected[1..salt_end].try_into().expect(\"salt slice\");\n        let nonce: [u8; NONCE_BYTES] = blob_expected[salt_end..HEADER_SIZE]\n            .tr
