<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 10px;
}
.code-line {
  margin: 0;
  padding: 0.3em;
  height: 1em;
  counter-increment: line;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

    <script>
        var data = {"files":[{"path":["/","work","cli","src","bin","generate_fuzz_seeds.rs"],"content":"//! Regenerate the seed corpus for each fuzz target in `crypto-rs/fuzz/`.\n//!\n//! Run from the workspace root:\n//!\n//! ```sh\n//! cargo run -p frappuccino-cli --release --bin generate_fuzz_seeds\n//! ```\n//!\n//! Produces exactly one valid blob per target under\n//! `crypto-rs/fuzz/corpus/\u003ctarget\u003e/0000_seed`. Overwrites existing seeds.\n//! The files are committed so fuzz runs start from a known-good input\n//! instead of pure random bytes — libfuzzer reaches meaningful coverage\n//! orders of magnitude faster that way.\n//!\n//! This is a plain binary: it does not link `libfuzzer-sys`, so it builds\n//! under stable Rust on Windows, macOS, and Linux. Lives here rather than\n//! in `crypto-rs/fuzz/` precisely to keep the fuzz crate single-purpose\n//! (libfuzzer targets only).\n\nuse std::fs;\nuse std::path::Path;\n\nuse frappuccino_crypto_core::identity::{ArchiveIdentity, EnrollmentKit};\nuse frappuccino_crypto_core::pin_store;\nuse frappuccino_crypto_core::ratchet::EphemeralRatchet;\nuse frappuccino_crypto_stream::encrypt::encrypt_single;\n\nconst FIXTURE_MN: \u0026str = \"abaisser abandon abdiquer abeille abolir aborder aboutir aboyer abrasif abreuver abriter abroger\";\n\nfn main() {\n    // CARGO_MANIFEST_DIR here is `crypto-rs/cli` — step up one level to\n    // reach the fuzz crate.\n    let repo_root = Path::new(env!(\"CARGO_MANIFEST_DIR\")).parent().unwrap();\n    let corpus = repo_root.join(\"fuzz\").join(\"corpus\");\n\n    // ---- decrypt_blob: a valid v2 SINGLE blob ------------------------------\n    let archive = ArchiveIdentity::from_mnemonic(FIXTURE_MN, \"\").unwrap();\n    let author = archive.identity().clone();\n    let blob = encrypt_single(b\"fuzz seed: the quick brown fox.\", \u0026author).unwrap();\n    write_seed(\u0026corpus.join(\"fuzz_decrypt_blob/0000_seed\"), \u0026blob);\n\n    // ---- parse_strm_header: same blob; parse_header only reads the prefix.\n    write_seed(\u0026corpus.join(\"fuzz_parse_strm_header/0000_seed\"), \u0026blob);\n\n    // ---- ratchet_deserialize: a freshly initialized V2 ratchet blob -------\n    let mut kit = EnrollmentKit::from_mnemonic(FIXTURE_MN, \"\").unwrap();\n    let chain0 = kit.take_chain_zero().unwrap();\n    let mut chain_bytes = [0u8; 32];\n    chain0.with_bytes(|b| chain_bytes.copy_from_slice(b));\n    let mut ratchet = EphemeralRatchet::new();\n    ratchet.initialize(\u0026mut chain_bytes).unwrap();\n    let ratchet_blob = ratchet.serialize().unwrap();\n    write_seed(\n        \u0026corpus.join(\"fuzz_ratchet_deserialize/0000_seed\"),\n        \u0026ratchet_blob,\n    );\n\n    // ---- pin_store_open: a real sealed blob under a throwaway pin ---------\n    let sealed = pin_store::seal(\"284193\", b\"fuzz seed plaintext\").unwrap();\n    write_seed(\u0026corpus.join(\"fuzz_pin_store_open/0000_seed\"), \u0026sealed);\n\n    println!(\"seeds regenerated under {}\", corpus.display());\n}\n\nfn write_seed(path: \u0026Path, data: \u0026[u8]) {\n    if let Some(parent) = path.parent() {\n        fs::create_dir_all(parent).unwrap();\n    }\n    fs::write(path, data).unwrap_or_else(|e| panic!(\"write {}: {e}\", path.display()));\n    println!(\"  {} ({} bytes)\", path.display(), data.len());\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","work","cli","src","commands","decrypt.rs"],"content":"//! `frappuccino-cli decrypt` — decrypt (or inspect) a STRM blob.\n//!\n//! Offline replacement for `server-tools/stream_decrypt.py`:\n//!   * `--inspect` : parse the header (magic, version, mode, `author_pk`,\n//!     `grant_count`, `plaintext_len`), print as human-readable or JSON. No\n//!     mnemonic required.\n//!   * default   : require a mnemonic + optional passphrase, decrypt the\n//!     blob, write the plaintext to `--output` or stdout.\n//!\n//! The blob path `-` reads from stdin.\n\nuse std::fs;\nuse std::io::{self, Write};\nuse std::path::PathBuf;\n\nuse anyhow::{bail, Context, Result};\nuse clap::Args as ClapArgs;\nuse frappuccino_crypto_core::identity::ArchiveIdentity;\nuse frappuccino_crypto_stream::decrypt::decrypt;\nuse frappuccino_crypto_stream::header::{\n    be_u16, ED25519_PK_BYTES, GRANT_ENTRY_SIZE, HEADER_SIZE_NO_GRANTS, MAGIC, OFF_AUTHOR_PK,\n    OFF_GRANT_COUNT, OFF_MAGIC, OFF_VERSION,\n};\n\n#[derive(Debug, ClapArgs)]\npub struct Args {\n    /// STRM blob path. Use `-` to read from stdin.\n    pub blob: PathBuf,\n\n    /// Parse the header and print metadata without decrypting.\n    /// When set, `--mnemonic` is ignored.\n    #[arg(long)]\n    pub inspect: bool,\n\n    /// BIP-39 mnemonic. Prompted on stderr if omitted (unless `--inspect`).\n    #[arg(long)]\n    pub mnemonic: Option\u003cString\u003e,\n\n    /// Optional passphrase.\n    #[arg(long)]\n    pub passphrase: Option\u003cString\u003e,\n\n    /// Write plaintext to this file instead of stdout.\n    #[arg(long, short = 'o')]\n    pub output: Option\u003cPathBuf\u003e,\n\n    /// Emit the `--inspect` output as one-line JSON. No effect outside of\n    /// `--inspect`.\n    #[arg(long)]\n    pub json: bool,\n}\n\npub fn run(args: \u0026Args) -\u003e Result\u003c()\u003e {\n    let blob = crate::read_blob(\u0026args.blob)?;\n    if args.inspect {\n        return inspect(\u0026blob, args.json);\n    }\n\n    let mnemonic = crate::resolve_mnemonic(args.mnemonic.as_deref())?;\n    let passphrase = crate::resolve_passphrase(args.passphrase.as_deref(), true)?;\n\n    let archive = ArchiveIdentity::from_mnemonic(\u0026mnemonic, \u0026passphrase)\n        .context(\"derive ArchiveIdentity from mnemonic\")?;\n\n    let (plaintext, meta) = decrypt(\u0026blob, \u0026archive).context(\"STRM decrypt\")?;\n\n    if let Some(path) = \u0026args.output {\n        fs::write(path, \u0026plaintext[..])\n            .with_context(|| format!(\"write plaintext to {}\", path.display()))?;\n        eprintln!(\n            \"decrypted {} bytes (mode={}, version={}) → {}\",\n            meta.plaintext_len,\n            mode_label(meta.mode),\n            meta.version,\n            path.display()\n        );\n    } else {\n        let mut stdout = io::stdout().lock();\n        stdout\n            .write_all(\u0026plaintext[..])\n            .context(\"write plaintext to stdout\")?;\n        stdout.flush().ok();\n        eprintln!(\n            \"decrypted {} bytes (mode={}, version={})\",\n            meta.plaintext_len,\n            mode_label(meta.mode),\n            meta.version\n        );\n    }\n    Ok(())\n}\n\nfn inspect(blob: \u0026[u8], as_json: bool) -\u003e Result\u003c()\u003e {\n    if blob.len() \u003c HEADER_SIZE_NO_GRANTS + 1 {\n        bail!(\n            \"blob too short: {} bytes (minimum {})\",\n            blob.len(),\n            HEADER_SIZE_NO_GRANTS + 1\n        );\n    }\n    if blob[OFF_MAGIC..OFF_MAGIC + 4] != MAGIC[..] {\n        bail!(\"invalid magic bytes (expected \\\"STRM\\\")\");\n    }\n    let version = blob[OFF_VERSION];\n    let mut author_pk = [0u8; ED25519_PK_BYTES];\n    author_pk.copy_from_slice(\u0026blob[OFF_AUTHOR_PK..OFF_AUTHOR_PK + ED25519_PK_BYTES]);\n    let grant_count = be_u16(blob[OFF_GRANT_COUNT], blob[OFF_GRANT_COUNT + 1]);\n    let grants_len = usize::from(grant_count) * GRANT_ENTRY_SIZE;\n    let header_end = HEADER_SIZE_NO_GRANTS + grants_len;\n    if blob.len() \u003c header_end + 1 {\n        bail!(\n            \"blob too short with {grant_count} grants: need ≥ {} bytes\",\n            header_end + 1\n        );\n    }\n    let mode = blob[header_end];\n    let body_len = blob.len() - header_end - 1;\n\n    if as_json {\n        let obj = serde_json::json!({\n            \"magic\": \"STRM\",\n            \"version\": version,\n            \"mode\": mode,\n            \"mode_label\": mode_label(mode),\n            \"author_ed25519_pk\": hex::encode(author_pk),\n            \"grant_count\": grant_count,\n            \"blob_size\": blob.len(),\n            \"header_size\": header_end,\n            \"body_size\": body_len,\n        });\n        println!(\"{obj}\");\n    } else {\n        println!(\"magic            STRM\");\n        println!(\"version          0x{version:02x}\");\n        println!(\"mode             0x{mode:02x} ({})\", mode_label(mode));\n        println!(\"author_pk        {}\", hex::encode(author_pk));\n        println!(\"grant_count      {grant_count}\");\n        println!(\"blob_size        {} bytes\", blob.len());\n        println!(\"header_size      {header_end} bytes\");\n        println!(\"body_size        {body_len} bytes\");\n    }\n    Ok(())\n}\n\nfn mode_label(mode: u8) -\u003e \u0026'static str {\n    match mode {\n        1 =\u003e \"SINGLE\",\n        2 =\u003e \"CHUNKED\",\n        _ =\u003e \"UNKNOWN\",\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","work","cli","src","commands","identity.rs"],"content":"//! `frappuccino-cli identity` — derive and print an archive identity.\n//!\n//! Non-networked, read-only. Useful to:\n//!   * verify a phrase matches the fingerprint printed at onboarding time,\n//!   * dump the public keys before handing a phrase to an archive tool,\n//!   * sanity-check a paper backup during drills.\n\nuse anyhow::{Context, Result};\nuse clap::Args as ClapArgs;\nuse frappuccino_crypto_core::identity::ArchiveIdentity;\n\n#[derive(Debug, ClapArgs)]\npub struct Args {\n    /// BIP-39 mnemonic (12 words, French wordlist). Prompted on stderr if\n    /// omitted. The CLI-flag form logs a warning — prefer the prompt.\n    #[arg(long)]\n    pub mnemonic: Option\u003cString\u003e,\n\n    /// Optional passphrase (plausible-deniability 13th word). Empty if\n    /// omitted on both the flag and the prompt.\n    #[arg(long)]\n    pub passphrase: Option\u003cString\u003e,\n\n    /// Emit a one-line JSON object instead of the human-readable block.\n    /// Stable shape: `{ed25519_pk, x25519_pk, fingerprint}`.\n    #[arg(long)]\n    pub json: bool,\n}\n\npub fn run(args: \u0026Args) -\u003e Result\u003c()\u003e {\n    let mnemonic = crate::resolve_mnemonic(args.mnemonic.as_deref())?;\n    let passphrase = crate::resolve_passphrase(args.passphrase.as_deref(), true)?;\n\n    let archive = ArchiveIdentity::from_mnemonic(\u0026mnemonic, \u0026passphrase)\n        .context(\"derive ArchiveIdentity from mnemonic\")?;\n    let id = archive.identity();\n\n    let ed25519_hex = hex::encode(id.ed25519_pk());\n    let x25519_hex = hex::encode(id.x25519_pk());\n    let fingerprint = id.readable_fingerprint();\n\n    if args.json {\n        let obj = serde_json::json!({\n            \"ed25519_pk\": ed25519_hex,\n            \"x25519_pk\": x25519_hex,\n            \"fingerprint\": fingerprint,\n        });\n        println!(\"{obj}\");\n    } else {\n        println!(\"ed25519_pk   {ed25519_hex}\");\n        println!(\"x25519_pk    {x25519_hex}\");\n        println!(\"fingerprint  {fingerprint}\");\n    }\n    Ok(())\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","work","cli","src","commands","mod.rs"],"content":"//! Subcommand implementations. One module per `clap` subcommand — each\n//! module owns its `Args` struct and its `run(\u0026Args)` entry point.\n\npub mod decrypt;\npub mod identity;\npub mod parity_test;\npub mod protocol_probe;\n","traces":[],"covered":0,"coverable":0},{"path":["/","work","cli","src","commands","parity_test.rs"],"content":"//! `frappuccino-cli parity-test` — replay every parity vector under a\n//! directory.\n//!\n//! Mirrors `crypto-rs/core/tests/parity_*.rs` and\n//! `crypto-rs/stream/tests/parity_strm.rs` but in a runner that works without\n//! `cargo test` — useful when shipping the CLI as a standalone binary for\n//! auditors or CI pipelines where the workspace source tree isn't available.\n//!\n//! Expected directory layout (the one produced by the Android dumper):\n//!\n//! ```text\n//! \u003croot\u003e/\n//!   bip39/seed.json\n//!   identity/derive.json\n//!   strm_blobs/vectors.json\n//!   strm_blobs/*.strm\n//!   strm_blobs/chunked_3mb.plaintext.bin     (optional, skipped if absent)\n//! ```\n//!\n//! Exits 0 on full pass, 1 on the first mismatch.\n\nuse std::fs;\nuse std::path::{Path, PathBuf};\n\nuse anyhow::{bail, Context, Result};\nuse clap::Args as ClapArgs;\nuse frappuccino_crypto_core::bip39::{self, Language};\nuse frappuccino_crypto_core::identity::{ArchiveIdentity, EnrollmentKit};\nuse frappuccino_crypto_stream::decrypt::decrypt;\nuse serde::Deserialize;\n\n#[derive(Debug, ClapArgs)]\npub struct Args {\n    /// Path to the parity-vectors root directory.\n    pub vectors_dir: PathBuf,\n\n    /// Only run a subset of suites. Defaults to all.\n    #[arg(long, value_delimiter = ',')]\n    pub only: Vec\u003cSuite\u003e,\n}\n\n#[derive(Debug, Clone, Copy, clap::ValueEnum)]\npub enum Suite {\n    Bip39,\n    Identity,\n    Strm,\n}\n\npub fn run(args: \u0026Args) -\u003e Result\u003c()\u003e {\n    let root = \u0026args.vectors_dir;\n    if !root.is_dir() {\n        bail!(\"vectors directory not found: {}\", root.display());\n    }\n\n    let suites = if args.only.is_empty() {\n        vec![Suite::Bip39, Suite::Identity, Suite::Strm]\n    } else {\n        args.only.clone()\n    };\n\n    let mut total = 0usize;\n    let mut passed = 0usize;\n\n    for s in suites {\n        match s {\n            Suite::Bip39 =\u003e {\n                let n = run_bip39_seed(\u0026root.join(\"bip39/seed.json\"))?;\n                total += n;\n                passed += n;\n                eprintln!(\"bip39/seed.json: {n}/{n} OK\");\n            }\n            Suite::Identity =\u003e {\n                let n = run_identity_derive(\u0026root.join(\"identity/derive.json\"))?;\n                total += n;\n                passed += n;\n                eprintln!(\"identity/derive.json: {n}/{n} OK\");\n            }\n            Suite::Strm =\u003e {\n                let (n, p) = run_strm(\u0026root.join(\"strm_blobs\"))?;\n                total += n;\n                passed += p;\n                eprintln!(\"strm_blobs: {p}/{n} OK\");\n            }\n        }\n    }\n\n    println!(\"TOTAL: {passed}/{total}\");\n    if passed != total {\n        bail!(\"{} parity case(s) failed\", total - passed);\n    }\n    Ok(())\n}\n\n// ----------------------------------------------------------------------------\n// bip39/seed.json\n// ----------------------------------------------------------------------------\n\n#[derive(Deserialize)]\nstruct Bip39File {\n    cases: Vec\u003cBip39Case\u003e,\n}\n\n#[derive(Deserialize)]\nstruct Bip39Case {\n    mnemonic: String,\n    passphrase: String,\n    seed_hex: String,\n}\n\nfn run_bip39_seed(path: \u0026Path) -\u003e Result\u003cusize\u003e {\n    let raw = fs::read_to_string(path).with_context(|| format!(\"read {}\", path.display()))?;\n    let file: Bip39File =\n        serde_json::from_str(\u0026raw).with_context(|| format!(\"parse {}\", path.display()))?;\n    for (i, c) in file.cases.iter().enumerate() {\n        let seed = bip39::mnemonic_to_seed(\u0026c.mnemonic, \u0026c.passphrase, Language::French)\n            .with_context(|| format!(\"seed case {i}\"))?;\n        let got = hex::encode(seed.as_bytes());\n        if got != c.seed_hex {\n            bail!(\n                \"bip39 seed case {i}: mismatch\\n  mnemonic   = {}\\n  passphrase = {:?}\\n  expected   = {}\\n  got        = {}\",\n                c.mnemonic, c.passphrase, c.seed_hex, got\n            );\n        }\n    }\n    Ok(file.cases.len())\n}\n\n// ----------------------------------------------------------------------------\n// identity/derive.json\n// ----------------------------------------------------------------------------\n\n#[derive(Deserialize)]\nstruct IdentityFile {\n    cases: Vec\u003cIdentityCase\u003e,\n}\n\n#[derive(Deserialize)]\nstruct IdentityCase {\n    mnemonic: String,\n    passphrase: String,\n    ed25519_pk_hex: String,\n    x25519_pk_hex: String,\n    fingerprint: String,\n}\n\nfn run_identity_derive(path: \u0026Path) -\u003e Result\u003cusize\u003e {\n    let raw = fs::read_to_string(path).with_context(|| format!(\"read {}\", path.display()))?;\n    let file: IdentityFile =\n        serde_json::from_str(\u0026raw).with_context(|| format!(\"parse {}\", path.display()))?;\n    for (i, c) in file.cases.iter().enumerate() {\n        let kit = EnrollmentKit::from_mnemonic(\u0026c.mnemonic, \u0026c.passphrase)\n            .with_context(|| format!(\"identity case {i}: enroll from mnemonic\"))?;\n        let id = kit.identity();\n        let got_ed = hex::encode(id.ed25519_pk());\n        let got_x = hex::encode(id.x25519_pk());\n        let got_fp = id.readable_fingerprint();\n\n        if got_ed != c.ed25519_pk_hex {\n            bail!(\n                \"identity case {i}: ed25519_pk mismatch\\n  expected {}\\n  got      {}\",\n                c.ed25519_pk_hex,\n                got_ed\n            );\n        }\n        if got_x != c.x25519_pk_hex {\n            bail!(\n                \"identity case {i}: x25519_pk mismatch\\n  expected {}\\n  got      {}\",\n                c.x25519_pk_hex,\n                got_x\n            );\n        }\n        if got_fp != c.fingerprint {\n            bail!(\n                \"identity case {i}: fingerprint mismatch\\n  expected {}\\n  got      {}\",\n                c.fingerprint,\n                got_fp\n            );\n        }\n    }\n    Ok(file.cases.len())\n}\n\n// ----------------------------------------------------------------------------\n// strm_blobs/vectors.json\n// ----------------------------------------------------------------------------\n\n#[derive(Deserialize)]\nstruct StrmFile {\n    mnemonic: String,\n    passphrase: String,\n    cases: Vec\u003cStrmCase\u003e,\n}\n\n#[derive(Deserialize)]\nstruct StrmCase {\n    filename: String,\n    plaintext_size: usize,\n    plaintext_sha256: String,\n    #[serde(default)]\n    plaintext_hex: Option\u003cString\u003e,\n    #[serde(default)]\n    plaintext_filename: Option\u003cString\u003e,\n}\n\nfn run_strm(dir: \u0026Path) -\u003e Result\u003c(usize, usize)\u003e {\n    let vec_path = dir.join(\"vectors.json\");\n    let raw =\n        fs::read_to_string(\u0026vec_path).with_context(|| format!(\"read {}\", vec_path.display()))?;\n    let file: StrmFile =\n        serde_json::from_str(\u0026raw).with_context(|| format!(\"parse {}\", vec_path.display()))?;\n\n    let archive = ArchiveIdentity::from_mnemonic(\u0026file.mnemonic, \u0026file.passphrase)\n        .context(\"derive archive for strm vectors\")?;\n\n    let mut total = 0usize;\n    let mut passed = 0usize;\n\n    for (i, c) in file.cases.iter().enumerate() {\n        total += 1;\n        let blob_path = dir.join(\u0026c.filename);\n        if !blob_path.exists() {\n            eprintln!(\"  skip: {} (missing fixture)\", c.filename);\n            total -= 1; // missing fixtures are skipped, not failed\n            continue;\n        }\n        let blob =\n            fs::read(\u0026blob_path).with_context(|| format!(\"read blob {}\", blob_path.display()))?;\n        let expected = load_expected_plaintext(c, dir)?;\n        if expected.len() != c.plaintext_size {\n            bail!(\n                \"strm case {i} ({}): plaintext_size mismatch fixture-vs-expected\",\n                c.filename\n            );\n        }\n        let (plaintext, _meta) = match decrypt(\u0026blob, \u0026archive) {\n            Ok(r) =\u003e r,\n            Err(e) =\u003e bail!(\"strm case {i} ({}): decrypt: {e:?}\", c.filename),\n        };\n        if plaintext[..] != expected[..] {\n            bail!(\n                \"strm case {i} ({}): plaintext mismatch (got {} bytes, expected {})\",\n                c.filename,\n                plaintext.len(),\n                expected.len()\n            );\n        }\n        // The sha256 fixture is redundant with the byte-exact equality above\n        // — if the fixture's sha ever drifts we'll see it in the build that\n        // regenerates vectors.json, not here. Not recomputing it keeps the\n        // CLI's dep tree off `sha2`.\n        let _ = \u0026c.plaintext_sha256;\n        passed += 1;\n    }\n    Ok((total, passed))\n}\n\nfn load_expected_plaintext(c: \u0026StrmCase, dir: \u0026Path) -\u003e Result\u003cVec\u003cu8\u003e\u003e {\n    if let Some(hex_str) = \u0026c.plaintext_hex {\n        return hex::decode(hex_str).context(\"decode plaintext_hex\");\n    }\n    if let Some(name) = \u0026c.plaintext_filename {\n        let p = dir.join(name);\n        return fs::read(\u0026p).with_context(|| format!(\"read plaintext file {}\", p.display()));\n    }\n    Ok(Vec::new())\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","work","cli","src","commands","protocol_probe.rs"],"content":"//! `frappuccino-cli protocol-probe` — live-probe a V2 relay endpoint.\n//!\n//! Uses the same pinned TLS stack as the mobile client (SPKI pin embedded in\n//! `frappuccino-crypto-stream`). Two actions:\n//!\n//! * default — hit `/auth/challenge`, print the returned `nonce` + `timestamp`.\n//!   Useful to confirm the server is reachable and speaks the post-S9-pre-audit\n//!   challenge shape.\n//! * `--pk \u003chex\u003e` — additionally query `GET /auth/v2/status/\u003cpk\u003e` and print\n//!   the server's view of that identity (batch, slots, `enrolled_at`, revoked).\n\nuse anyhow::{Context, Result};\nuse clap::Args as ClapArgs;\nuse frappuccino_crypto_stream::StreamServerClient;\n\n#[derive(Debug, ClapArgs)]\npub struct Args {\n    /// Relay URL (typically `https://136.244.101.236:8443`).\n    pub url: String,\n\n    /// Optional Ed25519 pubkey (hex) to also fetch `/auth/v2/status/\u003cpk\u003e`.\n    #[arg(long)]\n    pub pk: Option\u003cString\u003e,\n\n    /// Emit one-line JSON.\n    #[arg(long)]\n    pub json: bool,\n}\n\npub fn run(args: \u0026Args) -\u003e Result\u003c()\u003e {\n    let client = StreamServerClient::new(\u0026args.url)\n        .context(\"build StreamServerClient (TLS pin / reqwest config)\")?;\n\n    let challenge = client.challenge().context(\"POST /auth/challenge\")?;\n\n    let status = if let Some(pk) = \u0026args.pk {\n        client\n            .get_status(pk)\n            .with_context(|| format!(\"GET /auth/v2/status/{pk}\"))?\n    } else {\n        None\n    };\n\n    if args.json {\n        let status_json = status.as_ref().map(|s| {\n            serde_json::json!({\n                \"batch_number\": s.batch_number,\n                \"consumed_count\": s.consumed_count,\n                \"remaining_count\": s.remaining_count,\n                \"enrolled_at\": s.enrolled_at,\n                \"revoked\": s.revoked,\n            })\n        });\n        let obj = serde_json::json!({\n            \"url\": args.url,\n            \"challenge\": {\n                \"nonce\": hex::encode(challenge.nonce),\n                \"timestamp\": challenge.timestamp,\n            },\n            \"status\": status_json,\n        });\n        println!(\"{obj}\");\n    } else {\n        println!(\"url              {}\", args.url);\n        println!(\"challenge.nonce  {}\", hex::encode(challenge.nonce));\n        println!(\"challenge.ts     {}\", challenge.timestamp);\n        if let Some(pk) = \u0026args.pk {\n            match status {\n                Some(s) =\u003e {\n                    println!(\"status.pk        {pk}\");\n                    println!(\"status.batch     {}\", s.batch_number);\n                    println!(\"status.consumed  {}\", s.consumed_count);\n                    println!(\"status.remaining {}\", s.remaining_count);\n                    println!(\"status.enrolled  {}\", s.enrolled_at);\n                    println!(\"status.revoked   {}\", s.revoked);\n                }\n                None =\u003e println!(\"status           (unknown identity: {pk})\"),\n            }\n        }\n    }\n    Ok(())\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","work","cli","src","main.rs"],"content":"//! `frappuccino-cli` — desktop CLI wrapping the Rust crypto core.\n//!\n//! Replaces the legacy `server-tools/*.py` scripts (`stream_decrypt.py`,\n//! `stream_archive.py`) for the non-networked paths: everything a local\n//! inspector needs to verify an archive phrase or decrypt a captured STRM\n//! blob without trusting a Python interpreter's dependency surface.\n//!\n//! Subcommands:\n//! * `identity`        — derive pub keys + fingerprint from a mnemonic.\n//! * `decrypt`         — decrypt (or `--inspect`) a STRM blob.\n//! * `parity-test`     — replay every parity vector under a directory.\n//! * `protocol-probe`  — live-probe a V2 relay (challenge + status).\n//!\n//! Secrets handling: mnemonics and passphrases are taken from\n//! `/dev/stdin` by default (one per line). Explicit `--mnemonic`/`--passphrase`\n//! flags exist for automation but log a warning to stderr so nobody uses them\n//! in shell history by accident.\n\nuse std::fs;\nuse std::io::{self, Read, Write};\nuse std::path::PathBuf;\n\nuse anyhow::{anyhow, bail, Context, Result};\nuse clap::{Parser, Subcommand};\n\nmod commands;\n\n#[derive(Debug, Parser)]\n#[command(\n    name = \"frappuccino-cli\",\n    version,\n    about = \"Frappuccino CLI — offline crypto tooling (decrypt, archive identity, parity test, relay probe)\",\n    long_about = None,\n    propagate_version = true,\n)]\nstruct Cli {\n    #[command(subcommand)]\n    command: Command,\n}\n\n#[derive(Debug, Subcommand)]\nenum Command {\n    /// Derive and print an archive identity from a BIP-39 mnemonic.\n    Identity(commands::identity::Args),\n    /// Decrypt (or inspect) a STRM blob.\n    Decrypt(commands::decrypt::Args),\n    /// Replay every parity vector under a directory (hashes / JSON fixtures).\n    ParityTest(commands::parity_test::Args),\n    /// Live-probe a V2 relay endpoint (challenge + optional status lookup).\n    ProtocolProbe(commands::protocol_probe::Args),\n}\n\nfn main() {\n    // Propagate a non-zero exit code when a subcommand fails, while keeping\n    // panics reserved for actual logic bugs (never user-facing errors).\n    if let Err(e) = run() {\n        let mut stderr = io::stderr().lock();\n        let _ = writeln!(stderr, \"error: {e:#}\");\n        std::process::exit(1);\n    }\n}\n\nfn run() -\u003e Result\u003c()\u003e {\n    let cli = Cli::parse();\n    match cli.command {\n        Command::Identity(args) =\u003e commands::identity::run(\u0026args),\n        Command::Decrypt(args) =\u003e commands::decrypt::run(\u0026args),\n        Command::ParityTest(args) =\u003e commands::parity_test::run(\u0026args),\n        Command::ProtocolProbe(args) =\u003e commands::protocol_probe::run(\u0026args),\n    }\n}\n\n// ----------------------------------------------------------------------------\n// Shared helpers (exposed to command modules).\n// ----------------------------------------------------------------------------\n\n/// Read a single line from stdin, trimmed. Used to prompt for mnemonics and\n/// passphrases interactively without depending on a TTY crate.\n///\n/// Returns an empty string on EOF so callers can treat \"no passphrase\" as the\n/// empty-string case without extra branches.\npub(crate) fn read_stdin_line(prompt: \u0026str) -\u003e Result\u003cString\u003e {\n    let mut stderr = io::stderr().lock();\n    write!(stderr, \"{prompt}\").context(\"stderr write\")?;\n    stderr.flush().context(\"stderr flush\")?;\n    drop(stderr);\n\n    let mut buf = String::new();\n    let n = io::stdin()\n        .read_line(\u0026mut buf)\n        .context(\"read line from stdin\")?;\n    if n == 0 {\n        return Ok(String::new());\n    }\n    Ok(buf.trim().to_string())\n}\n\n/// Read the entire contents of `path`, or stdin when `path == \"-\"`.\npub(crate) fn read_blob(path: \u0026PathBuf) -\u003e Result\u003cVec\u003cu8\u003e\u003e {\n    if path.as_os_str() == \"-\" {\n        let mut buf = Vec::new();\n        io::stdin()\n            .read_to_end(\u0026mut buf)\n            .context(\"read blob from stdin\")?;\n        return Ok(buf);\n    }\n    fs::read(path).with_context(|| format!(\"read blob file {}\", path.display()))\n}\n\n/// Resolve a mnemonic either from the CLI flag or by prompting on stderr.\n///\n/// CLI flag path logs a warning — shell history and process listings leak\n/// arguments to other users on the same box.\npub(crate) fn resolve_mnemonic(flag: Option\u003c\u0026str\u003e) -\u003e Result\u003cString\u003e {\n    if let Some(m) = flag {\n        let mut stderr = io::stderr().lock();\n        let _ = writeln!(\n            stderr,\n            \"warning: --mnemonic on the command line leaks into shell history and `ps -aux`\"\n        );\n        return Ok(m.to_string());\n    }\n    let line = read_stdin_line(\"mnemonic (12 words FR, one line): \")?;\n    if line.is_empty() {\n        bail!(\"no mnemonic provided\");\n    }\n    Ok(line)\n}\n\n/// Resolve an optional passphrase from flag or stderr prompt. Returns the\n/// empty string when the user hits enter with no passphrase.\npub(crate) fn resolve_passphrase(flag: Option\u003c\u0026str\u003e, prompt_if_absent: bool) -\u003e Result\u003cString\u003e {\n    if let Some(p) = flag {\n        return Ok(p.to_string());\n    }\n    if !prompt_if_absent {\n        return Ok(String::new());\n    }\n    read_stdin_line(\"passphrase (press enter if none): \")\n        .map(|s| if s.is_empty() { String::new() } else { s })\n        .map_err(|e| anyhow!(\"read passphrase: {e}\"))\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","work","core","src","bip39.rs"],"content":"//! BIP-39 French wordlist support — byte-exact with the Kotlin reference impl.\n//!\n//! ## Invariants (must match `stream-crypto/.../Bip39.kt` verbatim)\n//!\n//! | Constant | Value |\n//! |---|---|\n//! | `WORD_COUNT` | 12 |\n//! | `ENTROPY_BITS` | 128 |\n//! | `ENTROPY_BYTES` | 16 |\n//! | `CHECKSUM_BITS` | 4 |\n//! | `PBKDF2_ITERATIONS` | 2048 |\n//! | `SEED_BYTES` | 64 |\n//! | Algorithm (seed) | PBKDF2-HMAC-SHA512 |\n//! | Salt prefix | `\"mnemonic\"` (UTF-8) |\n//! | Normalization | NFD → strip combining marks → lowercase → lookup in stripped→canonical map |\n//!\n//! ## BT-HIGH-10 remediation\n//!\n//! `normalize_word` **throws** on unknown words (returns `Err`), matching the\n//! Kotlin implementation post-remediation. No silent fallback to avoid typos\n//! producing a \"typo seed\" that's valid-looking but irrecoverable.\n\nuse crate::error::CryptoError;\nuse hmac::Hmac;\nuse sha2::{Digest, Sha256, Sha512};\nuse std::fmt;\nuse unicode_normalization::{char::is_combining_mark, UnicodeNormalization};\nuse zeroize::{Zeroize, ZeroizeOnDrop, Zeroizing};\n\n/// Number of words in a canonical BIP-39 mnemonic (Frappuccino uses 12).\npub const WORD_COUNT: usize = 12;\n/// Bits of entropy in a 12-word mnemonic.\npub const ENTROPY_BITS: usize = 128;\n/// Bytes of entropy = 16.\npub const ENTROPY_BYTES: usize = ENTROPY_BITS / 8;\n/// Checksum bits appended to the entropy (128 / 32 = 4).\npub const CHECKSUM_BITS: usize = ENTROPY_BITS / 32;\n/// PBKDF2 iteration count (BIP-39 standard).\npub const PBKDF2_ITERATIONS: u32 = 2048;\n/// Output seed size (bytes).\npub const SEED_BYTES: usize = 64;\n\n/// 64-byte BIP-39 seed, produced by [`mnemonic_to_seed`].\n///\n/// Newtype wrapper (per `Rust_guidelines.md`: \"typed wrappers for byte buffers,\n/// not raw `[u8; N]`\") that guarantees:\n///   * zero-on-drop — the inner array is wiped when the value goes out of scope,\n///   * redacted Debug — `println!(\"{seed:?}\")` prints `Seed(\u003c64-byte redacted\u003e)`\n///     rather than leaking seed bytes into logs or error messages,\n///   * `#[must_use]` — accidental `let _ = mnemonic_to_seed(...)` is flagged.\n///\n/// Expose inner bytes via [`Seed::as_bytes`] only when you actually need them\n/// (e.g., to feed HKDF). Never clone unless you own the new copy's lifecycle.\n#[derive(ZeroizeOnDrop)]\n#[must_use]\npub struct Seed([u8; SEED_BYTES]);\n\nimpl Seed {\n    /// Read-only view of the seed bytes. Caller must not copy out lightly.\n    #[must_use]\n    pub fn as_bytes(\u0026self) -\u003e \u0026[u8; SEED_BYTES] {\n        \u0026self.0\n    }\n\n    /// Length in bytes (always [`SEED_BYTES`]).\n    #[must_use]\n    pub const fn len(\u0026self) -\u003e usize {\n        SEED_BYTES\n    }\n\n    /// Always `false` — a `Seed` is a fixed 64-byte array.\n    #[must_use]\n    pub const fn is_empty(\u0026self) -\u003e bool {\n        false\n    }\n}\n\nimpl fmt::Debug for Seed {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        write!(f, \"Seed(\u003c{SEED_BYTES}-byte redacted\u003e)\")\n    }\n}\n\n/// BIP-39 language selector. French is the Frappuccino default — enrolled\n/// identities were generated in FR and can't migrate without losing archives.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum Language {\n    French,\n}\n\nimpl Language {\n    /// The name embedded in `CryptoError::InvalidMnemonicWord.language`.\n    pub const fn name(self) -\u003e \u0026'static str {\n        match self {\n            Language::French =\u003e \"fr\",\n        }\n    }\n\n    /// Returns the 2048-word BIP-39 wordlist for this language.\n    pub fn wordlist(self) -\u003e \u0026'static [\u0026'static str] {\n        match self {\n            Language::French =\u003e fr::wordlist_fr(),\n        }\n    }\n}\n\n/// Returns a stripped-accents lowercase form of `s` (NFD + remove combining marks).\n/// Not a constant-time operation — only used on public BIP-39 wordlist entries\n/// and user input (not on secret material).\n#[must_use]\npub fn strip_accents(s: \u0026str) -\u003e String {\n    s.nfd().filter(|c| !is_combining_mark(*c)).collect()\n}\n\n/// Normalize a single user-typed word to its canonical BIP-39 form.\n///\n/// Strips accents, lowercases, and looks up in the language's stripped→canonical\n/// map. Unknown words return `Err(InvalidMnemonicWord)` — **no silent fallback**\n/// (BT-HIGH-10).\n///\n/// # Errors\n/// - [`CryptoError::EmptyInput`] if `input` is empty or whitespace-only after trim.\n/// - [`CryptoError::InvalidMnemonicWord`] if the stripped lowercase form is not\n///   in the wordlist.\npub fn normalize_word(input: \u0026str, lang: Language) -\u003e Result\u003cString, CryptoError\u003e {\n    let trimmed = input.trim().to_lowercase();\n    if trimmed.is_empty() {\n        return Err(CryptoError::EmptyInput);\n    }\n    let stripped_input = strip_accents(\u0026trimmed);\n    for \u0026canonical in lang.wordlist() {\n        if strip_accents(\u0026canonical.to_lowercase()) == stripped_input {\n            return Ok(canonical.to_string());\n        }\n    }\n    Err(CryptoError::InvalidMnemonicWord {\n        word: trimmed,\n        language: lang.name(),\n    })\n}\n\n/// Normalize a full mnemonic phrase word-by-word.\n///\n/// Splits on any whitespace, normalizes each word, joins with a single space.\n///\n/// # Errors\n/// Any word-level [`CryptoError::InvalidMnemonicWord`] short-circuits.\npub fn normalize_phrase(input: \u0026str, lang: Language) -\u003e Result\u003cString, CryptoError\u003e {\n    let mut out: Vec\u003cString\u003e = Vec::new();\n    for w in input.split_whitespace() {\n        out.push(normalize_word(w, lang)?);\n    }\n    Ok(out.join(\" \"))\n}\n\n/// Derive a 64-byte BIP-39 seed from a mnemonic + optional passphrase.\n///\n/// - Normalizes the mnemonic first (so users can type without accents).\n/// - Salt = `\"mnemonic\" || passphrase` (UTF-8 bytes, per BIP-39 spec).\n/// - PBKDF2-HMAC-SHA512 with 2048 iterations.\n///\n/// Returns a [`Seed`] (zero-on-drop, redacted Debug) — the caller owns the\n/// lifecycle and must not clone the inner bytes except through [`Seed::as_bytes`].\n///\n/// # Errors\n/// If the mnemonic contains unknown words, returns [`CryptoError::InvalidMnemonicWord`].\npub fn mnemonic_to_seed(\n    mnemonic: \u0026str,\n    passphrase: \u0026str,\n    lang: Language,\n) -\u003e Result\u003cSeed, CryptoError\u003e {\n    let normalized = normalize_phrase(mnemonic, lang)?;\n\n    let mut salt: Vec\u003cu8\u003e = Vec::with_capacity(8 + passphrase.len());\n    salt.extend_from_slice(b\"mnemonic\");\n    salt.extend_from_slice(passphrase.as_bytes());\n\n    let mut seed_bytes = [0u8; SEED_BYTES];\n    pbkdf2::pbkdf2::\u003cHmac\u003cSha512\u003e\u003e(\n        normalized.as_bytes(),\n        \u0026salt,\n        PBKDF2_ITERATIONS,\n        \u0026mut seed_bytes,\n    )\n    .map_err(|e| CryptoError::DerivationFailed(e.to_string()))?;\n\n    // Zeroize salt bytes (contains passphrase which is secret material).\n    salt.zeroize();\n    Ok(Seed(seed_bytes))\n}\n\n/// Generate a 12-word mnemonic from 128 bits of cryptographic entropy.\n///\n/// Returns a [`Zeroizing\u003cString\u003e`] — the heap buffer is wiped when the\n/// wrapper drops. Callers should avoid `.to_string()` / `.clone()` on\n/// this value, which would bypass the zeroization guarantee.\n#[must_use]\npub fn from_entropy(entropy: \u0026[u8; ENTROPY_BYTES], lang: Language) -\u003e Zeroizing\u003cString\u003e {\n    let wordlist = lang.wordlist();\n    // Compute 4-bit checksum from SHA-256(entropy)[0..1] shifted to top 4 bits.\n    let hash = Sha256::digest(entropy);\n    let checksum_byte = hash[0];\n\n    // Build a 132-bit stream of (entropy || checksum_bits) as a vec of bool-like bits.\n    // BIP-39: entropy big-endian, checksum bits = top CHECKSUM_BITS of hash[0].\n    let mut bits: [bool; ENTROPY_BITS + CHECKSUM_BITS] = [false; ENTROPY_BITS + CHECKSUM_BITS];\n    for (byte_idx, \u0026b) in entropy.iter().enumerate() {\n        for bit_idx in 0..8 {\n            bits[byte_idx * 8 + bit_idx] = (b \u003e\u003e (7 - bit_idx)) \u0026 1 == 1;\n        }\n    }\n    for bit_idx in 0..CHECKSUM_BITS {\n        bits[ENTROPY_BITS + bit_idx] = (checksum_byte \u003e\u003e (7 - bit_idx)) \u0026 1 == 1;\n    }\n\n    // Encode 12 × 11-bit indices.\n    let mut out: Vec\u003c\u0026str\u003e = Vec::with_capacity(WORD_COUNT);\n    for word_idx in 0..WORD_COUNT {\n        let mut value: usize = 0;\n        for bit_idx in 0..11 {\n            value = (value \u003c\u003c 1) | usize::from(bits[word_idx * 11 + bit_idx]);\n        }\n        out.push(wordlist[value]);\n    }\n    Zeroizing::new(out.join(\" \"))\n}\n\n/// Fill `out` with fresh entropy from the OS CSPRNG.\n///\n/// Wrapper over `rand_core::OsRng` so callers don't need to thread the RNG type.\npub fn fresh_entropy(out: \u0026mut [u8; ENTROPY_BYTES]) {\n    use rand_core::RngCore;\n    rand_core::OsRng.fill_bytes(out);\n}\n\n/// Generate a fresh FR mnemonic from OS entropy.\n///\n/// Convenience wrapper over [`fresh_entropy`] + [`from_entropy`]. Returns a\n/// [`Zeroizing\u003cString\u003e`] that wipes its heap buffer on drop.\n#[must_use]\npub fn generate_fr() -\u003e Zeroizing\u003cString\u003e {\n    let mut entropy = [0u8; ENTROPY_BYTES];\n    fresh_entropy(\u0026mut entropy);\n    let mnemonic = from_entropy(\u0026entropy, Language::French);\n    entropy.zeroize();\n    mnemonic\n}\n\n/// Validate that a mnemonic string has the correct word count AND checksum.\n/// Used by the parity tests; not typically invoked in production paths that\n/// go straight to [`mnemonic_to_seed`].\n///\n/// # Errors\n/// Returns `Err` for: wrong word count, unknown word, checksum mismatch.\npub fn validate(mnemonic: \u0026str, lang: Language) -\u003e Result\u003c(), CryptoError\u003e {\n    let normalized = normalize_phrase(mnemonic, lang)?;\n    let words: Vec\u003c\u0026str\u003e = normalized.split_whitespace().collect();\n    if words.len() != WORD_COUNT {\n        return Err(CryptoError::InvalidMnemonic(format!(\n            \"expected {WORD_COUNT} words, got {}\",\n            words.len()\n        )));\n    }\n    let wordlist = lang.wordlist();\n\n    // Map each word → index in wordlist.\n    let mut indices: Vec\u003cusize\u003e = Vec::with_capacity(WORD_COUNT);\n    for w in \u0026words {\n        let idx = wordlist.iter().position(|cw| cw == w).ok_or_else(|| {\n            CryptoError::InvalidMnemonicWord {\n                word: (*w).to_string(),\n                language: lang.name(),\n            }\n        })?;\n        indices.push(idx);\n    }\n\n    // Reassemble bit stream.\n    let mut bits: [bool; ENTROPY_BITS + CHECKSUM_BITS] = [false; ENTROPY_BITS + CHECKSUM_BITS];\n    for (word_idx, \u0026i) in indices.iter().enumerate() {\n        for bit_idx in 0..11 {\n            bits[word_idx * 11 + bit_idx] = (i \u003e\u003e (10 - bit_idx)) \u0026 1 == 1;\n        }\n    }\n    let mut entropy = [0u8; ENTROPY_BYTES];\n    for byte_idx in 0..ENTROPY_BYTES {\n        let mut v: u8 = 0;\n        for bit_idx in 0..8 {\n            v = (v \u003c\u003c 1) | u8::from(bits[byte_idx * 8 + bit_idx]);\n        }\n        entropy[byte_idx] = v;\n    }\n    let checksum_byte = Sha256::digest(entropy)[0];\n    for bit_idx in 0..CHECKSUM_BITS {\n        let expected = (checksum_byte \u003e\u003e (7 - bit_idx)) \u0026 1 == 1;\n        if expected != bits[ENTROPY_BITS + bit_idx] {\n            return Err(CryptoError::InvalidMnemonic(\"checksum mismatch\".into()));\n        }\n    }\n    Ok(())\n}\n\n/// French BIP-39 wordlist (2048 words). Embedded verbatim from\n/// `stream-crypto/src/main/resources/bip39_fr.txt` — any diff breaks wire\n/// compatibility with the Kotlin impl.\nmod fr {\n    use std::sync::OnceLock;\n\n    static WORDS_FR: \u0026str = include_str!(\"bip39_fr.txt\");\n    static WORDLIST: OnceLock\u003cVec\u003c\u0026'static str\u003e\u003e = OnceLock::new();\n\n    pub fn wordlist_fr() -\u003e \u0026'static [\u0026'static str] {\n        WORDLIST.get_or_init(|| {\n            let words: Vec\u003c\u0026'static str\u003e =\n                WORDS_FR.lines().filter(|line| !line.is_empty()).collect();\n            assert_eq!(\n                words.len(),\n                2048,\n                \"BIP-39 FR wordlist must have exactly 2048 words, got {}\",\n                words.len()\n            );\n            words\n        })\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn wordlist_is_2048() {\n        assert_eq!(Language::French.wordlist().len(), 2048);\n        assert_eq!(Language::French.wordlist()[0], \"abaisser\");\n        assert_eq!(Language::French.wordlist()[1], \"abandon\");\n    }\n\n    #[test]\n    fn normalize_word_canonical_from_stripped() {\n        // The FR wordlist is stored in NFD (decomposed) form, so the canonical\n        // return is also NFD — \"acade\" + U+0301 COMBINING ACUTE + \"mie\" rather\n        // than \"académie\" as a single precomposed U+00E9 codepoint. This matches\n        // the Kotlin reference which reads the file verbatim.\n        let out = normalize_word(\"academie\", Language::French).unwrap();\n        assert_eq!(out, \"acade\\u{301}mie\");\n\n        assert_eq!(\n            normalize_word(\"ABANDON\", Language::French).unwrap(),\n            \"abandon\"\n        );\n    }\n\n    #[test]\n    fn normalize_word_unknown_throws() {\n        let err = normalize_word(\"xyz\", Language::French).unwrap_err();\n        assert!(matches!(err, CryptoError::InvalidMnemonicWord { .. }));\n    }\n\n    #[test]\n    fn normalize_phrase_whitespace_collapsed() {\n        let out = normalize_phrase(\n            \"  abaisser   abandon  abdiquer abeille abolir aborder aboutir aboyer abrasif abreuver abriter abroger  \",\n            Language::French,\n        )\n        .unwrap();\n        assert_eq!(\n            out,\n            \"abaisser abandon abdiquer abeille abolir aborder aboutir aboyer abrasif abreuver abriter abroger\"\n        );\n    }\n\n    #[test]\n    fn from_entropy_zero_entropy_matches_spec() {\n        // Entropy all-zero → sha256(0x00*16)[0] has its top 4 bits = 0x7.\n        let entropy = [0u8; 16];\n        let mn = from_entropy(\u0026entropy, Language::French);\n        // First 11 bits = 0 → first word = wordlist[0] = \"abaisser\".\n        assert!(mn.starts_with(\"abaisser \"), \"got: {}\", mn.as_str());\n    }\n\n    #[test]\n    fn generate_fr_roundtrips_through_validate() {\n        let mn = generate_fr();\n        validate(mn.as_str(), Language::French).expect(\"generated mnemonic must validate\");\n    }\n\n    #[test]\n    fn seed_debug_is_redacted() {\n        // Proves we don't leak seed bytes through println!(\"{seed:?}\") / log crates.\n        let seed = mnemonic_to_seed(\n            \"abaisser abandon abdiquer abeille abolir aborder aboutir aboyer abrasif abreuver abriter abroger\",\n            \"\",\n            Language::French,\n        )\n        .unwrap();\n        let dbg = format!(\"{seed:?}\");\n        assert_eq!(dbg, \"Seed(\u003c64-byte redacted\u003e)\");\n    }\n}\n","traces":[{"line":61,"address":[661376],"length":1,"stats":{"Line":8}},{"line":67,"address":[1550320],"length":1,"stats":{"Line":0}},{"line":73,"address":[15535232],"length":1,"stats":{"Line":0}},{"line":79,"address":[703232],"length":1,"stats":{"Line":2}},{"line":80,"address":[1507842],"length":1,"stats":{"Line":2}},{"line":100,"address":[661552],"length":1,"stats":{"Line":8}},{"line":102,"address":[15468737],"length":1,"stats":{"Line":8}},{"line":111,"address":[392368],"length":1,"stats":{"Line":8}},{"line":112,"address":[14456881],"length":1,"stats":{"Line":24}},{"line":125,"address":[1509246,1508064,1508865],"length":1,"stats":{"Line":8}},{"line":126,"address":[1490599],"length":1,"stats":{"Line":8}},{"line":127,"address":[703662,703600],"length":1,"stats":{"Line":16}},{"line":128,"address":[1550821],"length":1,"stats":{"Line":0}},{"line":130,"address":[703752,703676],"length":1,"stats":{"Line":16}},{"line":131,"address":[392759,392830],"length":1,"stats":{"Line":16}},{"line":132,"address":[15519042,15519327],"length":1,"stats":{"Line":16}},{"line":133,"address":[15519584],"length":1,"stats":{"Line":8}},{"line":136,"address":[1551267],"length":1,"stats":{"Line":4}},{"line":137,"address":[704024],"length":1,"stats":{"Line":4}},{"line d: '{word}' (language={language})\")]\n    InvalidMnemonicWord {\n        word: String,\n        language: \u0026'static str,\n    },\n\n    /// Mnemonic phrase did not have the expected number of words or failed checksum.\n    #[error(\"invalid mnemonic phrase: {0}\")]\n    InvalidMnemonic(String),\n\n    /// Internal derivation failure (should never happen barring bugs).\n    #[error(\"derivation failed: {0}\")]\n    DerivationFailed(String),\n\n    /// An input was empty when a non-empty value was required.\n    #[error(\"empty input\")]\n    EmptyInput,\n\n    /// A consume-once resource (long-term Ed25519 key, `chain_0`) has already\n    /// been used. Enforced at the Rust type level for `EnrollmentKit`.\n    #[error(\"resource '{0}' already consumed\")]\n    AlreadyConsumed(\u0026'static str),\n\n    /// A signature produced by `ed25519-dalek` did not verify under the given\n    /// public key. Distinct from `InvalidMnemonic*` so verify-path errors are\n    /// disambiguated from input-path errors.\n    #[error(\"ed25519 signature verification failed\")]\n    InvalidSignature,\n\n    /// `PinProtectedStore::open` failed to authenticate the blob under the\n    /// given PIN. Whether the blob was tampered or the PIN was wrong is\n    /// deliberately indistinguishable — the caller should treat both as\n    /// \"wrong PIN\" and count it toward the lockout tracker.\n    #[error(\"PIN verification failed\")]\n    WrongPin,\n\n    /// A blob (ratchet serialization, PIN store envelope, STRM frame) has\n    /// an unsupported header version byte or structural mismatch that is\n    /// not ambiguous with wrong-PIN.\n    #[error(\"invalid blob: {0}\")]\n    InvalidBlob(String),\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","work","core","src","hkdf.rs"],"content":"//! HKDF-SHA256 (RFC 5869) — byte-exact with the Kotlin reference impl.\n//!\n//! The Kotlin `Hkdf.sha256(ikm, salt, info, length)` helper accepts a nullable\n//! salt that defaults to 32 zero bytes when `null`. The `RustCrypto` `hkdf` crate\n//! matches this behavior: `Hkdf::new(None, ikm)` uses a zero-filled salt of\n//! `HashLen` (32 bytes for SHA-256) internally, so we preserve exact parity.\n//!\n//! Length bounds: HKDF's extract/expand allows up to 255 × `HashLen` output bytes\n//! = 255 × 32 = 8160 for SHA-256. We reject larger `length` with\n//! `CryptoError::DerivationFailed` to mirror the Kotlin guard.\n\nuse crate::error::CryptoError;\nuse hkdf::Hkdf;\nuse sha2::Sha256;\nuse zeroize::Zeroizing;\n\n/// Maximum output length for HKDF-SHA256 (RFC 5869 §2.3: L ≤ 255·HashLen).\npub const MAX_OUTPUT_BYTES: usize = 255 * 32;\n\n/// Compute HKDF-SHA256 (extract + expand) matching the Kotlin reference exactly.\n///\n/// - `ikm` — Input Key Material (secret — typically a chain key or BIP-39 seed).\n/// - `salt` — optional non-secret salt. `None` is treated as 32 zero bytes,\n///   preserving byte-exact compatibility with the Kotlin `salt: null` branch.\n/// - `info` — domain-separation context string. Never change a context string\n///   post-deployment — it's baked into identity / ratchet derivations.\n/// - `length` — output byte count (1..=8160).\n///\n/// Returns `Zeroizing\u003cVec\u003cu8\u003e\u003e` so the derived bytes are wiped when the caller\n/// drops the value. The caller should not `.to_vec()` away from the wrapper.\n///\n/// # Errors\n/// Returns [`CryptoError::DerivationFailed`] if `length` is 0 or \u003e 8160, or if\n/// the underlying HKDF expansion fails (never in practice with a valid length).\npub fn sha256(\n    ikm: \u0026[u8],\n    salt: Option\u003c\u0026[u8]\u003e,\n    info: \u0026[u8],\n    length: usize,\n) -\u003e Result\u003cZeroizing\u003cVec\u003cu8\u003e\u003e, CryptoError\u003e {\n    if length == 0 || length \u003e MAX_OUTPUT_BYTES {\n        return Err(CryptoError::DerivationFailed(format!(\n            \"HKDF output length must be in 1..={MAX_OUTPUT_BYTES}, got {length}\"\n        )));\n    }\n    let hk = Hkdf::\u003cSha256\u003e::new(salt, ikm);\n    let mut okm = vec![0u8; length];\n    hk.expand(info, \u0026mut okm)\n        .map_err(|e| CryptoError::DerivationFailed(e.to_string()))?;\n    Ok(Zeroizing::new(okm))\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    /// RFC 5869 test case 1 (Basic test case with SHA-256).\n    /// \u003chttps://www.rfc-editor.org/rfc/rfc5869#appendix-A.1\u003e\n    #[test]\n    fn rfc5869_test_case_1() {\n        let ikm = hex::decode(\"0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b\").unwrap();\n        let salt = hex::decode(\"000102030405060708090a0b0c\").unwrap();\n        let info = hex::decode(\"f0f1f2f3f4f5f6f7f8f9\").unwrap();\n        let expected = hex::decode(\n            \"3cb25f25faacd57a90434f64d0362f2a2d2d0a90cf1a5a4c5db02d56ecc4c5bf\\\n             34007208d5b887185865\",\n        )\n        .unwrap();\n        let out = sha256(\u0026ikm, Some(\u0026salt), \u0026info, 42).unwrap();\n        assert_eq!(\u0026out[..], expected.as_slice());\n    }\n\n    /// RFC 5869 test case 3 (no salt → `HashLen` zero bytes, no info).\n    #[test]\n    fn rfc5869_test_case_3_null_salt() {\n        let ikm = hex::decode(\"0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b0b\").unwrap();\n        let expected = hex::decode(\n            \"8da4e775a563c18f715f802a063c5a31b8a11f5c5ee1879ec3454e5f3c738d2d\\\n             9d201395faa4b61a96c8\",\n        )\n        .unwrap();\n        // Both None and Some(\u0026[0u8; 32]) must produce the same output.\n        let with_none = sha256(\u0026ikm, None, \u0026[], 42).unwrap();\n        let with_zeros = sha256(\u0026ikm, Some(\u0026[0u8; 32]), \u0026[], 42).unwrap();\n        assert_eq!(\u0026with_none[..], expected.as_slice());\n        assert_eq!(\u0026with_zeros[..], expected.as_slice());\n    }\n\n    #[test]\n    fn zero_length_rejected() {\n        let err = sha256(\u0026[1, 2, 3], None, b\"test\", 0).unwrap_err();\n        assert!(matches!(err, CryptoError::DerivationFailed(_)));\n    }\n\n    #[test]\n    fn over_max_length_rejected() {\n        let err = sha256(\u0026[1, 2, 3], None, b\"test\", MAX_OUTPUT_BYTES + 1).unwrap_err();\n        assert!(matches!(err, CryptoError::DerivationFailed(_)));\n    }\n\n    #[test]\n    fn max_length_accepted() {\n        let out = sha256(\u0026[1, 2, 3], None, b\"test\", MAX_OUTPUT_BYTES).unwrap();\n        assert_eq!(out.len(), MAX_OUTPUT_BYTES);\n    }\n}\n","traces":[{"line":35,"address":[14500001,14499024,14499969],"length":1,"stats":{"Line":9}},{"line":41,"address":[1530927,1531208],"length":1,"stats":{"Line":18}},{"line":42,"address":[1629318],"length":1,"stats":{"Line":2}},{"line":46,"address":[15561022],"length":1,"stats":{"Line":9}},{"line":47,"address":[15568847],"length":1,"stats":{"Line":9}},{"line":48,"address":[744670,744419,744501],"length":1,"stats":{"Line":18}},{"line":49,"address":[1554432,1554445],"length":1,"stats":{"Line":0}},{"line":50,"address":[1629963],"length":1,"stats":{"Line":9}}],"covered":7,"coverable":8},{"path":["/","work","core","src","identity.rs"],"content":"//! Identity derivation — byte-exact with Kotlin `EnrollmentKit` / `ArchiveIdentity`.\n//!\n//! ## Architecture (V2 asymmetry)\n//!\n//! Frappuccino's V2 design splits key material into three lifecycle roles:\n//!\n//! - **[`StreamIdentity`]** — public-only wrapper. Published as the user's\n//!   pseudonymous identity, used for self-addressed sealed-box encryption.\n//!   Safe to store on the device indefinitely.\n//! - **[`EnrollmentKit`]** — one-shot holder of the long-term Ed25519 secret.\n//!   Lives only during initial enrollment: sign the first batch of ratchet\n//!   keys, publish the identity, then `drop` (wipes the secret). After that,\n//!   the device *cannot* sign with the long-term key anymore.\n//! - **[`ArchiveIdentity`]** — derivable on demand from the BIP-39 phrase to\n//!   unseal session keys for archived streams. The X25519 secret lives in a\n//!   [`LockedSecret`] (mlock'd page) for the duration of archive-mode usage.\n//!\n//! ## Derivation pipeline\n//!\n//! ```text\n//! mnemonic + passphrase\n//!   └─▶ BIP-39 PBKDF2-HMAC-SHA512 (2048 iter) ──▶ seed (64 B)\n//!         ├─▶ HKDF(\"stream.identity.ed25519.v1\", 32) ──▶ Ed25519 seed ──▶ (ed_pk, ed_sk)\n//!         ├─▶ HKDF(\"stream.encryption.x25519.v1\", 32) ──▶ libsodium-shape ──▶ (x_pk, x_sk)\n//!         └─▶ HKDF(\"stream.ratchet.chain0.v2\",    32) ──▶ chain_0 (→ `EphemeralRatchet`)\n//! ```\n//!\n//! The X25519 key derivation matches `libsodium crypto_box_seed_keypair`:\n//! `sk = SHA-512(seed)[..32]` (no Ed25519→X25519 conversion), so the Kotlin\n//! wire format is preserved.\n//!\n//! ## Invariants (immutable — break = lose every enrolled identity)\n//!\n//! HKDF context strings hard-coded in this module:\n//! `\"stream.identity.ed25519.v1\"`, `\"stream.encryption.x25519.v1\"`,\n//! `\"stream.ratchet.chain0.v2\"`. See `PLAN_RUST_EXEC.md` §1.2.\n\nuse crate::bip39::{self, Language};\nuse crate::error::CryptoError;\nuse crate::hkdf;\nuse crate::secret::LockedSecret;\nuse ed25519_dalek::{Signature, Signer, SigningKey, Verifier, VerifyingKey};\nuse sha2::{Digest, Sha256, Sha512};\nuse x25519_dalek::{PublicKey as X25519PublicKey, StaticSecret as X25519StaticSecret};\n\n// ============================================================================\n// HKDF context strings — PLAN_RUST_EXEC.md §1.2\n// ============================================================================\n\nconst CTX_IDENTITY: \u0026[u8] = b\"stream.identity.ed25519.v1\";\nconst CTX_ENCRYPTION: \u0026[u8] = b\"stream.encryption.x25519.v1\";\nconst CTX_CHAIN0: \u0026[u8] = b\"stream.ratchet.chain0.v2\";\n\nconst ED25519_SEED_BYTES: usize = 32;\nconst ED25519_PK_BYTES: usize = 32;\nconst ED25519_SK_BYTES: usize = 64; // libsodium convention: seed || pk\nconst X25519_KEY_BYTES: usize = 32;\nconst CHAIN_KEY_BYTES: usize = 32;\n\n// ============================================================================\n// StreamIdentity — public-only, cheap to clone, safe to Debug-print partially.\n// ============================================================================\n\n/// Publicly identifying keypair pair (Ed25519 + X25519 public halves only).\n///\n/// Derived deterministically from a BIP-39 mnemonic; reproducing the same\n/// phrase reproduces the same identity. Contains no secret material, so\n/// `Clone` + `PartialEq` + non-redacted `Debug` are all safe.\n#[derive(Clone, PartialEq, Eq)]\npub struct StreamIdentity {\n    ed25519_pk: [u8; ED25519_PK_BYTES],\n    x25519_pk: [u8; X25519_KEY_BYTES],\n}\n\nimpl StreamIdentity {\n    /// Build an identity from already-published Ed25519 + X25519 public keys.\n    /// Used when re-hydrating a saved identity on device (both pubs persisted\n    /// during onboarding) without needing the BIP-39 phrase.\n    #[must_use]\n    pub fn from_public_keys(\n        ed25519_pk: [u8; ED25519_PK_BYTES],\n        x25519_pk: [u8; X25519_KEY_BYTES],\n    ) -\u003e Self {\n        Self {\n            ed25519_pk,\n            x25519_pk,\n        }\n    }\n\n    /// The 32-byte Ed25519 verification key.\n    #[must_use]\n    pub fn ed25519_pk(\u0026self) -\u003e \u0026[u8; ED25519_PK_BYTES] {\n        \u0026self.ed25519_pk\n    }\n\n    /// The 32-byte X25519 public key (target of `crypto_box_seal`).\n    #[must_use]\n    pub fn x25519_pk(\u0026self) -\u003e \u0026[u8; X25519_KEY_BYTES] {\n        \u0026self.x25519_pk\n    }\n\n    /// Ed25519 public key encoded as 64 lowercase hex characters.\n    #[must_use]\n    pub fn ed25519_pk_hex(\u0026self) -\u003e String {\n        hex_encode(\u0026self.ed25519_pk)\n    }\n\n    /// Human-readable fingerprint for the user to verify they typed the\n    /// correct phrase: `SHA-256(ed25519_pk)` truncated to 12 bytes, hex-encoded\n    /// (24 chars), then split into 6 groups of 4 chars separated by spaces.\n    /// Matches Kotlin `hash.take(12).hex().chunked(4).join(\" \")` verbatim.\n    #[must_use]\n    pub fn readable_fingerprint(\u0026self) -\u003e String {\n        use std::fmt::Write;\n        let hash = Sha256::digest(self.ed25519_pk);\n        let mut hex = String::with_capacity(24);\n        for b in \u0026hash.as_slice()[..12] {\n            // write! to a String cannot fail; `.expect` flagged by clippy\n            // otherwise.\n            let _ = write!(hex, \"{b:02x}\");\n        }\n        let mut out = String::with_capacity(29); // 6*4 + 5 separators\n        for (i, chunk) in hex.as_bytes().chunks(4).enumerate() {\n            if i \u003e 0 {\n                out.push(' ');\n            }\n            // `chunk` contains only ASCII hex digits produced two lines above.\n            // `from_utf8` on ASCII bytes is infallible, but we match safely\n            // rather than `.expect()` per Rust_guidelines.md.\n            if let Ok(s) = std::str::from_utf8(chunk) {\n                out.push_str(s);\n            }\n        }\n        out\n    }\n\n    /// Verify that `signature` is a valid Ed25519 signature of `message` under\n    /// this identity's public key.\n    ///\n    /// # Errors\n    /// Returns [`CryptoError::InvalidSignature`] on any verification failure.\n    pub fn verify(\u0026self, message: \u0026[u8], signature: \u0026[u8; 64]) -\u003e Result\u003c(), CryptoError\u003e {\n        let vk = VerifyingKey::from_bytes(\u0026self.ed25519_pk)\n            .map_err(|_| CryptoError::InvalidSignature)?;\n        let sig = Signature::from_bytes(signature);\n        vk.verify(message, \u0026sig)\n            .map_err(|_| CryptoError::InvalidSignature)\n    }\n}\n\nimpl std::fmt::Debug for StreamIdentity {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        write!(\n            f,\n            \"StreamIdentity(ed25519_pk={}, fingerprint={})\",\n            self.ed25519_pk_hex(),\n            self.readable_fingerprint()\n        )\n    }\n}\n\n// ============================================================================\n// EnrollmentKit — one-shot long-term Ed25519 + chain_0.\n// ============================================================================\n\n/// One-shot holder of the long-term Ed25519 secret and the initial ratchet\n/// chain key. After `sign_once` + `take_chain_zero` are called (or the kit\n/// drops), the long-term secret is wiped and unrecoverable without re-typing\n/// the BIP-39 phrase.\n///\n/// Both secrets live in [`LockedSecret`] (mlock'd pages, zero on drop).\n#[must_use]\npub struct EnrollmentKit {\n    identity: StreamIdentity,\n    // Wrapped in Option so the consume-once contract is enforced at the type\n    // level: post-consumption the field is None and re-use returns\n    // CryptoError::AlreadyConsumed.\n    signing_key: Option\u003cLockedSecret\u003e,\n    chain_0: Option\u003cLockedSecret\u003e,\n}\n\nimpl EnrollmentKit {\n    /// Derive a fresh kit from a BIP-39 mnemonic + passphrase.\n    ///\n    /// # Errors\n    /// * [`CryptoError::InvalidMnemonicWord`] if the phrase contains unknown words.\n    /// * [`CryptoError::DerivationFailed`] on HKDF / mlock failures.\n    pub fn from_mnemonic(mnemonic: \u0026str, passphrase: \u0026str) -\u003e Result\u003cSelf, CryptoError\u003e {\n        let seed = bip39::mnemonic_to_seed(mnemonic, passphrase, Language::French)?;\n\n        let ed_seed = hkdf::sha256(seed.as_bytes(), None, CTX_IDENTITY, ED25519_SEED_BYTES)?;\n        let x_seed = hkdf::sha256(seed.as_bytes(), None, CTX_ENCRYPTION, X25519_KEY_BYTES)?;\n        let chain_bytes = hkdf::sha256(seed.as_bytes(), None, CTX_CHAIN0, CHAIN_KEY_BYTES)?;\n\n        // Ed25519: ed25519-dalek's SigningKey::from_bytes uses the seed directly per RFC 8032.\n        let ed_seed_arr: [u8; ED25519_SEED_BYTES] = ed_seed[..]\n            .try_into()\n            .map_err(|_| CryptoError::DerivationFailed(\"ed seed length\".into()))?;\n        let signing = SigningKey::from_bytes(\u0026ed_seed_arr);\n        let ed_pk = signing.verifying_key().to_bytes();\n\n        // X25519 libsodium seed_keypair: sk = SHA-512(seed)[..32], pk = sk * basepoint.\n        let x_sk_bytes = {\n            let full = Sha512::digest(\u0026x_seed[..]);\n            let mut out = [0u8; X25519_KEY_BYTES];\n            out.copy_from_slice(\u0026full[..X25519_KEY_BYTES]);\n            out\n        };\n        let x_static = X25519StaticSecret::from(x_sk_bytes);\n        let x_pk = X25519PublicKey::from(\u0026x_static).to_bytes();\n        // x_sk is not needed for enrollment — archive path re-derives it.\n\n        // Move ed_sk into a locked page (libsodium format: seed || pk = 64 bytes).\n        let mut ed_sk_full = [0u8; ED25519_SK_BYTES];\n        ed_sk_full[..ED25519_SEED_BYTES].copy_from_slice(\u0026ed_seed_arr);\n        ed_sk_full[ED25519_SEED_BYTES..].copy_from_slice(\u0026ed_pk);\n        let mut ed_sk_locked = LockedSecret::new_zeroed(ED25519_SK_BYTES)?;\n        ed_sk_locked.write_and_wipe_source(\u0026mut ed_sk_full)?;\n\n        let mut chain_locked = LockedSecret::new_zeroed(CHAIN_KEY_BYTES)?;\n        // chain_bytes is Zeroizing\u003cVec\u003cu8\u003e\u003e, clone into fixed buffer then wipe.\n        let mut chain_arr = [0u8; CHAIN_KEY_BYTES];\n        chain_arr.copy_from_slice(\u0026chain_bytes[..]);\n        chain_locked.write_and_wipe_source(\u0026mut chain_arr)?;\n\n        let identity = StreamIdentity {\n            ed25519_pk: ed_pk,\n            x25519_pk: x_pk,\n        };\n        Ok(Self {\n            identity,\n            signing_key: Some(ed_sk_locked),\n            chain_0: Some(chain_locked),\n        })\n    }\n\n    /// The public identity, safe to clone and publish.\n    #[must_use]\n    pub fn identity(\u0026self) -\u003e \u0026StreamIdentity {\n        \u0026self.identity\n    }\n\n    /// Sign `message` with the long-term Ed25519 key.\n    ///\n    /// Designed for the enrollment-time signing of `concat(batch_0_public_keys)`.\n    /// Kotlin allows multiple calls before close; we keep the same relaxed\n    /// contract — the consume-once enforcement is on [`Self::take_chain_zero`]\n    /// and is effectively enforced by the kit dropping shortly after enroll.\n    ///\n    /// # Errors\n    /// Returns [`CryptoError::AlreadyConsumed`] if called after `close()`, or\n    /// [`CryptoError::DerivationFailed`] if the locked buffer is not the\n    /// expected 64-byte size (should never happen — the kit constructor\n    /// guarantees the layout).\n    pub fn sign_once(\u0026self, message: \u0026[u8]) -\u003e Result\u003c[u8; 64], CryptoError\u003e {\n        let sk = self\n            .signing_key\n            .as_ref()\n            .ok_or(CryptoError::AlreadyConsumed(\"ed25519_signing_key\"))?;\n        sk.with_bytes(|bytes| {\n            let seed: [u8; ED25519_SEED_BYTES] = bytes[..ED25519_SEED_BYTES]\n                .try_into()\n                .map_err(|_| CryptoError::DerivationFailed(\"ed25519 seed slice size\".into()))?;\n            let signing = SigningKey::from_bytes(\u0026seed);\n            Ok(signing.sign(message).to_bytes())\n        })\n    }\n\n    /// Consume the `chain_0` key, handing ownership to the ratchet.\n    ///\n    /// Single-shot: after this call the kit's internal `chain_0` slot is\n    /// `None` and subsequent calls return [`CryptoError::AlreadyConsumed`].\n    ///\n    /// # Errors\n    /// [`CryptoError::AlreadyConsumed`] on second call.\n    pub fn take_chain_zero(\u0026mut self) -\u003e Result\u003cLockedSecret, CryptoError\u003e {\n        self.chain_0\n            .take()\n            .ok_or(CryptoError::AlreadyConsumed(\"chain_0\"))\n    }\n\n    /// Proactively wipe both secrets before drop. Rare in practice — letting\n    /// the kit go out of scope has the same effect via `Drop`.\n    pub fn close(\u0026mut self) {\n        self.signing_key = None;\n        self.chain_0 = None;\n    }\n}\n\nimpl Drop for EnrollmentKit {\n    fn drop(\u0026mut self) {\n        // Fields implement Drop themselves (LockedSecret wipes + munlocks);\n        // setting them to None triggers the Drop chain deterministically.\n        self.signing_key = None;\n        self.chain_0 = None;\n    }\n}\n\nimpl std::fmt::Debug for EnrollmentKit {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        write!(\n            f,\n            \"EnrollmentKit(identity={:?}, signing_key=\u003credacted\u003e, chain_0=\u003credacted\u003e)\",\n            self.identity\n        )\n    }\n}\n\n// ============================================================================\n// ArchiveIdentity — re-derivable on demand for unsealing archived streams.\n// ============================================================================\n\n/// Holder of the X25519 private half, for unsealing archived session keys.\n///\n/// Derived on demand from the BIP-39 phrase (not stored on disk). The X25519\n/// secret lives in a [`LockedSecret`] (mlock'd). Callers should drop this\n/// instance as soon as the archive-mode session ends.\n#[must_use]\npub struct ArchiveIdentity {\n    identity: StreamIdentity,\n    x25519_sk: LockedSecret,\n}\n\nimpl ArchiveIdentity {\n    /// Re-derive the archive identity from a BIP-39 mnemonic + passphrase.\n    ///\n    /// # Errors\n    /// * [`CryptoError::InvalidMnemonicWord`] if the phrase contains unknown words.\n    /// * [`CryptoError::DerivationFailed`] on HKDF / mlock failures.\n    pub fn from_mnemonic(mnemonic: \u0026str, passphrase: \u0026str) -\u003e Result\u003cSelf, CryptoError\u003e {\n        let seed = bip39::mnemonic_to_seed(mnemonic, passphrase, Language::French)?;\n\n        let ed_seed = hkdf::sha256(seed.as_bytes(), None, CTX_IDENTITY, ED25519_SEED_BYTES)?;\n        let x_seed = hkdf::sha256(seed.as_bytes(), None, CTX_ENCRYPTION, X25519_KEY_BYTES)?;\n\n        // Ed25519 public key (we don't keep its secret — only used for fingerprint display).\n        let ed_seed_arr: [u8; ED25519_SEED_BYTES] = ed_seed[..]\n            .try_into()\n            .map_err(|_| CryptoError::DerivationFailed(\"ed seed length\".into()))?;\n        let ed_pk = SigningKey::from_bytes(\u0026ed_seed_arr)\n            .verifying_key()\n            .to_bytes();\n\n        // X25519 libsodium seed_keypair derivation.\n        let mut x_sk_bytes = [0u8; X25519_KEY_BYTES];\n        x_sk_bytes.copy_from_slice(\u0026Sha512::digest(\u0026x_seed[..])[..X25519_KEY_BYTES]);\n        let x_pk = X25519PublicKey::from(\u0026X25519StaticSecret::from(x_sk_bytes)).to_bytes();\n\n        // Move x_sk into a locked page.\n        let mut x_sk_locked = LockedSecret::new_zeroed(X25519_KEY_BYTES)?;\n        x_sk_locked.write_and_wipe_source(\u0026mut x_sk_bytes)?;\n\n        let identity = StreamIdentity {\n            ed25519_pk: ed_pk,\n            x25519_pk: x_pk,\n        };\n        Ok(Self {\n            identity,\n            x25519_sk: x_sk_locked,\n        })\n    }\n\n    /// The public identity — same fingerprint as [`EnrollmentKit::identity`].\n    #[must_use]\n    pub fn identity(\u0026self) -\u003e \u0026StreamIdentity {\n        \u0026self.identity\n    }\n\n    /// Read-only scoped access to the 32-byte X25519 secret scalar. Used by\n    /// S6's `crypto_box_seal_open` to unseal archived session keys.\n    pub fn with_x25519_sk\u003cR\u003e(\u0026self, f: impl FnOnce(\u0026[u8]) -\u003e R) -\u003e R {\n        self.x25519_sk.with_bytes(f)\n    }\n\n    /// Unseal a session key that was produced by `crypto_box_seal(K_s, x25519_pk)`\n    /// (either by our [`crate::seal::seal`] or libsodium on the Android side).\n    ///\n    /// The 80-byte `sealed_envelope` layout is `epk(32) || tag(16) || ct(32)`.\n    /// The returned 32-byte session key wipes on drop.\n    ///\n    /// # Errors\n    /// * [`CryptoError::InvalidBlob`] if the envelope is the wrong size.\n    /// * [`CryptoError::WrongPin`] if the AEAD tag fails verification, i.e.\n    ///   the envelope was not sealed *for this identity* (or is tampered).\n    pub fn decrypt_session_key(\n        \u0026self,\n        sealed_envelope: \u0026[u8],\n    ) -\u003e Result\u003czeroize::Zeroizing\u003cVec\u003cu8\u003e\u003e, CryptoError\u003e {\n        let expected = crate::seal::SEAL_OVERHEAD + 32;\n        if sealed_envelope.len() != expected {\n            return Err(CryptoError::InvalidBlob(format!(\n                \"sealed envelope must be {expected} bytes, got {}\",\n                sealed_envelope.len()\n            )));\n        }\n        self.x25519_sk.with_bytes(|sk_bytes| {\n            let sk: [u8; 32] = sk_bytes\n                .try_into()\n                .map_err(|_| CryptoError::DerivationFailed(\"x25519 sk slice\".into()))?;\n            crate::seal::seal_open(sealed_envelope, \u0026self.identity.x25519_pk, \u0026sk)\n        })\n    }\n}\n\nimpl std::fmt::Debug for ArchiveIdentity {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        write!(\n            f,\n            \"ArchiveIdentity(identity={:?}, x25519_sk=\u003credacted\u003e)\",\n            self.identity\n        )\n    }\n}\n\n// ============================================================================\n// Helpers\n// ============================================================================\n\nfn hex_encode(bytes: \u0026[u8]) -\u003e String {\n    use std::fmt::Write;\n    let mut s = String::with_capacity(bytes.len() * 2);\n    for b in bytes {\n        // write! to String cannot fail; explicit `let _ =` silences the\n        // unused Result while avoiding .unwrap().\n        let _ = write!(s, \"{b:02x}\");\n    }\n    s\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    const MN_FIXED: \u0026str = \"abaisser abandon abdiquer abeille abolir aborder aboutir aboyer abrasif abreuver abriter abroger\";\n\n    #[test]\n    fn enrollment_kit_identity_matches_archive_identity() {\n        // Same mnemonic/passphrase must produce identical public keys via\n        // the enrollment path and the archive path.\n        let kit = EnrollmentKit::from_mnemonic(MN_FIXED, \"\").unwrap();\n        let archive = ArchiveIdentity::from_mnemonic(MN_FIXED, \"\").unwrap();\n        assert_eq!(kit.identity().ed25519_pk(), archive.identity().ed25519_pk());\n        assert_eq!(kit.identity().x25519_pk(), archive.identity().x25519_pk());\n    }\n\n    #[test]\n    fn sign_once_then_verify_roundtrip() {\n        let kit = EnrollmentKit::from_mnemonic(MN_FIXED, \"\").unwrap();\n        let msg = b\"enrollment payload\";\n        let sig = kit.sign_once(msg).unwrap();\n        kit.identity()\n            .verify(msg, \u0026sig)\n            .expect(\"freshly-produced signature must verify\");\n    }\n\n    #[test]\n    fn verify_rejects_tampered_message() {\n        let kit = EnrollmentKit::from_mnemonic(MN_FIXED, \"\").unwrap();\n        let msg = b\"enrollment payload\";\n        let sig = kit.sign_once(msg).unwrap();\n        let err = kit.identity().verify(b\"tampered\", \u0026sig).unwrap_err();\n        assert!(matches!(err, CryptoError::InvalidSignature));\n    }\n\n    #[test]\n    fn take_chain_zero_is_consume_once() {\n        let mut kit = EnrollmentKit::from_mnemonic(MN_FIXED, \"\").unwrap();\n        let chain = kit.take_chain_zero().unwrap();\n        assert_eq!(chain.len(), CHAIN_KEY_BYTES);\n        let err = kit.take_chain_zero().unwrap_err();\n        assert!(matches!(err, CryptoError::AlreadyConsumed(\"chain_0\")));\n    }\n\n    #[test]\n    fn close_then_sign_returns_already_consumed() {\n        let mut kit = EnrollmentKit::from_mnemonic(MN_FIXED, \"\").unwrap();\n        kit.close();\n        let err = kit.sign_once(b\"msg\").unwrap_err();\n        assert!(matches!(\n            err,\n            CryptoError::AlreadyConsumed(\"ed25519_signing_key\")\n        ));\n    }\n\n    #[test]\n    fn fingerprint_format_is_six_groups_of_four_hex() {\n        let kit = EnrollmentKit::from_mnemonic(MN_FIXED, \"\").unwrap();\n        let fp = kit.identity().readable_fingerprint();\n        let groups: Vec\u003c\u0026str\u003e = fp.split(' ').collect();\n        assert_eq!(groups.len(), 6, \"expected 6 groups, got {fp:?}\");\n        for g in groups {\n            assert_eq!(g.len(), 4);\n            assert!(g.chars().all(|c| c.is_ascii_hexdigit()));\n        }\n    }\n\n    #[test]\n    fn debug_redacts_secrets() {\n        let kit = EnrollmentKit::from_mnemonic(MN_FIXED, \"\").unwrap();\n        let dbg = format!(\"{kit:?}\");\n        assert!(dbg.contains(\"\u003credacted\u003e\"));\n        assert!(!dbg.contains(\"ed25519_sk=\"));\n\n        let archive = ArchiveIdentity::from_mnemonic(MN_FIXED, \"\").unwrap();\n        let dbg = format!(\"{archive:?}\");\n        assert!(dbg.contains(\"\u003credacted\u003e\"));\n    }\n}\n","traces":[{"line":80,"address":[15434864],"length":1,"stats":{"Line":0}},{"line":92,"address":[1566928],"length":1,"stats":{"Line":6}},{"line":98,"address":[15446208],"length":1,"stats":{"Line":5}},{"line":99,"address":[1566952],"length":1,"stats":{"Line":5}},{"line":104,"address":[1554640],"length":1,"stats":{"Line":3}},{"line":105,"address":[15437089],"length":1,"stats":{"Line":3}},{"line":113,"address":[1555628,1555745,1554688],"length":1,"stats":{"Line":3}},{"line":115,"address":[15446297],"length":1,"stats":{"Line":3}},{"line":116,"address":[322583],"length":1,"stats":{"Line":3}},{"line":117,"address":[1567109,1567184],"length":1,"stats":{"Line":6}},{"line":120,"address":[15437470,15438066],"length":1,"stats":{"Line":6}},{"line":122,"address":[632777],"length":1,"stats":{"Line":3}},{"line":123,"address":[708696,708767],"length":1,"stats":{"Line":6}},{"line":124,"address":[15388200],"length":1,"stats":{"Line":3}},{"line":125,"address":[14376413],"length":1,"stats":{"Line":3}},{"line":130,"address":[1505638,1505597],"length":1,"stats":{"Line":6}},{"line":131,"address":[14376480],"length":1,"stats":{"Line":3}},{"line":134,"address":[15374005],"length":1,"stats":{"Line":3}},{"line":142,"address":[15438192],"length":1,"stats":{"Line":2
