305::aead::{Aead, KeyInit, Payload};\nuse chacha20poly1305::{XChaCha20Poly1305, XNonce};\nuse frappuccino_crypto_core::identity::ArchiveIdentity;\nuse frappuccino_crypto_core::CryptoError;\nuse zeroize::Zeroizing;\n\n/// Error type specific to STRM decoding paths. Mostly a thin wrapper over\n/// [`CryptoError`] so the caller can pattern-match on structural problems\n/// without parsing error strings.\n#[derive(Debug, thiserror::Error)]\npub enum DecryptError {\n    /// Wraps any error bubbling up from the crypto core.\n    #[error(transparent)]\n    Core(#[from] CryptoError),\n    /// The blob was not well-formed (bad magic, wrong version, truncated, …).\n    #[error(\"malformed STRM blob: {0}\")]\n    Malformed(String),\n}\n\n/// Non-secret metadata about a decrypted blob, useful for the caller's UI /\n/// audit log. Returned alongside the plaintext.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct BlobMetadata {\n    /// STRM format version — `VERSION_V1` (legacy Kotlin) or `VERSION_V2`\n    /// (current Rust encoder, adds `chunk_count` to the CHUNKED AAD).\n    pub version: u8,\n    /// `MODE_SINGLE` or `MODE_CHUNKED`.\n    pub mode: u8,\n    /// The Ed25519 public key of the author who produced the blob.\n    pub author_ed25519_pk: [u8; ED25519_PK_BYTES],\n    /// Number of additional grants in the header (always 0 in V2).\n    pub grant_count: u16,\n    /// Total plaintext bytes recovered.\n    pub plaintext_len: usize,\n}\n\n/// Decrypt `blob` under `archive` and return `(plaintext, metadata)`.\n///\n/// The plaintext is wrapped in `Zeroizing` so it wipes on drop when the\n/// caller's binding goes out of scope.\n///\n/// # Errors\n/// * [`DecryptError::Malformed`] for structural errors (wrong magic, wrong\n///   version, truncated blob, invalid chunk count).\n/// * [`DecryptError::Core`] wrapping [`CryptoError::WrongPin`] if the sealed\n///   envelope wasn't for this archive identity, or any AEAD tag fails.\npub fn decrypt(\n    blob: \u0026[u8],\n    archive: \u0026ArchiveIdentity,\n) -\u003e Result\u003c(Zeroizing\u003cVec\u003cu8\u003e\u003e, BlobMetadata), DecryptError\u003e {\n    let parsed = header::parse_header(blob).map_err(|e| DecryptError::Malformed(e.to_string()))?;\n    let version = parsed.version;\n    let mode = parsed.mode;\n    let author_pk = parsed.author_ed25519_pk;\n    let grant_count = parsed.grant_count;\n\n    let sealed = \u0026blob[OFF_SEALED..OFF_SEALED + SEALED_ENVELOPE_SIZE];\n\n    // AAD is the literal header bytes (including grants), matching the Kotlin\n    // `SovereignEncryptor.writeBoth` semantics.\n    let header_aad: \u0026[u8] = \u0026blob[..parsed.header_end];\n\n    // Unseal session key. The 32-byte `K_s` wipes on drop of this Zeroizing.\n    let session_key = archive.decrypt_session_key(sealed)?;\n    if session_key.len() != 32 {\n        return Err(DecryptError::Malformed(\"session key wrong size\".into()));\n    }\n    let key_arr: [u8; 32] = session_key[..]\n        .try_into()\n        .map_err(|_| DecryptError::Malformed(\"session key slice\".into()))?;\n\n    let body = \u0026blob[parsed.body_start..];\n    let (plaintext, _sessionkey_lives_until_here) = match mode {\n        MODE_SINGLE =\u003e decrypt_single(body, \u0026key_arr, header_aad)?,\n        MODE_CHUNKED =\u003e decrypt_chunked(body, \u0026key_arr, header_aad, version)?,\n        other =\u003e {\n            return Err(DecryptError::Malformed(format!(\n                \"unknown mode byte {other:#x}\"\n            )))\n        }\n    };\n\n    let plen = plaintext.len();\n    Ok((\n        plaintext,\n        BlobMetadata {\n            version,\n            mode,\n            author_ed25519_pk: author_pk,\n            grant_count,\n            plaintext_len: plen,\n        },\n    ))\n}\n\n// ============================================================================\n// Mode SINGLE\n// ============================================================================\n\nfn decrypt_single(\n    body: \u0026[u8],\n    key: \u0026[u8; 32],\n    aad: \u0026[u8],\n) -\u003e Result\u003c(Zeroizing\u003cVec\u003cu8\u003e\u003e, ()), DecryptError\u003e {\n    if body.len() \u003c NONCE_BYTES + AEAD_TAG_BYTES {\n        return Err(DecryptError::Malformed(format!(\n            \"SINGLE body too short: {}\",\n            body.len()\n        )));\n    }\n    let nonce = \u0026body[..NONCE_BYTES];\n    let ct = \u0026body[NONCE_BYTES..];\n    let cipher = XChaCha20Poly1305::new(key.as_slice().into());\n    let plaintext = cipher\n        .decrypt(XNonce::from_slice(nonce), Payload { msg: ct, aad })\n        .map_err(|_| DecryptError::Core(CryptoError::WrongPin))?;\n    Ok((Zeroizing::new(plaintext), ()))\n}\n\n// ============================================================================\n// Mode CHUNKED\n// ============================================================================\n\nfn decrypt_chunked(\n    body: \u0026[u8],\n    key: \u0026[u8; 32],\n    header_aad: \u0026[u8],\n    version: u8,\n) -\u003e Result\u003c(Zeroizing\u003cVec\u003cu8\u003e\u003e, ()), DecryptError\u003e {\n    if body.len() \u003c NONCE_PREFIX_BYTES + 4 {\n        return Err(DecryptError::Malformed(\"CHUNKED body too short\".into()));\n    }\n    let mut nonce_prefix = [0u8; NONCE_PREFIX_BYTES];\n    nonce_prefix.copy_from_slice(\u0026body[..NONCE_PREFIX_BYTES]);\n    let chunk_count_bytes: [u8; 4] = body[NONCE_PREFIX_BYTES..NONCE_PREFIX_BYTES + 4]\n        .try_into()\n        .map_err(|_| DecryptError::Malformed(\"chunk_count slice\".into()))?;\n    let chunk_count = u32::from_be_bytes(chunk_count_bytes);\n    if chunk_count \u003e MAX_CHUNK_COUNT {\n        return Err(DecryptError::Malformed(format!(\n            \"chunk_count {chunk_count} exceeds cap {MAX_CHUNK_COUNT}\"\n        )));\n    }\n\n    // V1 = AAD is the header bytes only (Kotlin legacy). V2 = AAD binds\n    // MODE ‖ nonce_prefix ‖ chunk_count → truncation attack rejected.\n    let owned_aad_v2: Vec\u003cu8\u003e;\n    let aad: \u0026[u8] = match version {\n        VERSION_V1 =\u003e header_aad,\n        VERSION_V2 =\u003e {\n            owned_aad_v2 = build_chunked_aad_v2(header_aad, \u0026nonce_prefix, chunk_count);\n            \u0026owned_aad_v2\n        }\n        _ =\u003e {\n            return Err(DecryptError::Malformed(format!(\n                \"unsupported version {version:#x} for CHUNKED\"\n            )))\n        }\n    };\n\n    let cipher = XChaCha20Poly1305::new(key.as_slice().into());\n    let mut out = Vec::new();\n    let mut cursor = NONCE_PREFIX_BYTES + 4;\n\n    for i in 0..chunk_count {\n        if body.len() \u003c cursor + 4 {\n            return Err(DecryptError::Malformed(format!(\"chunk {i}: missing len\")));\n        }\n        let chunk_len_bytes: [u8; 4] = body[cursor..cursor + 4]\n            .try_into()\n            .map_err(|_| DecryptError::Malformed(\"chunk_len slice\".into()))?;\n        let chunk_len = u32::from_be_bytes(chunk_len_bytes);\n        cursor += 4;\n        let nonce_plus_tag =\n            u32::try_from(NONCE_BYTES + AEAD_TAG_BYTES).expect(\"24 + 16 = 40 fits in u32\");\n        if !(nonce_plus_tag..=MAX_CHUNK_LEN).contains(\u0026chunk_len) {\n            return Err(DecryptError::Malformed(format!(\n                \"chunk {i}: total_len {chunk_len} out of range\"\n            )));\n        }\n        let total = chunk_len as usize;\n        if body.len() \u003c cursor + total {\n            return Err(DecryptError::Malformed(format!(\n                \"chunk {i}: truncated body\"\n            )));\n        }\n        let chunk_nonce = \u0026body[cursor..cursor + NONCE_BYTES];\n        let chunk_ct = \u0026body[cursor + NONCE_BYTES..cursor + total];\n        cursor += total;\n\n        let plain = cipher\n            .decrypt(\n                XNonce::from_slice(chunk_nonce),\n                Payload { msg: chunk_ct, aad },\n            )\n            .map_err(|_| DecryptError::Core(CryptoError::WrongPin))?;\n        out.extend_from_slice(\u0026plain);\n    }\n    Ok((Zeroizing::new(out), ()))\n}\n","traces":[{"line":61,"address":[1947888,1950345,1950734],"length":1,"stats":{"Line":2}},{"line":65,"address":[1658727],"length":1,"stats":{"Line":4}},{"line":66,"address":[1948125],"length":1,"stats":{"Line":2}},{"line":67,"address":[1658910],"length":1,"stats":{"Line":2}},{"line":68,"address":[1666775],"length":1,"stats":{"Line":2}},{"line":69,"address":[1948231],"length":1,"stats":{"Line":2}},{"line":71,"address":[1659019,1659278],"length":1,"stats":{"Line":2}},{"line":75,"address":[1925757],"length":1,"stats":{"Line":2}},{"line":78,"address":[1925831,1925919],"length":1,"stats":{"Line":2}},{"line":79,"address":[1948651,1948724],"length":1,"stats":{"Line":4}},{"line":80,"address":[1661355,1659538],"length":1,"stats":{"Line":0}},{"line":82,"address":[1667429,1667633,1667359,1669215],"length":1,"stats":{"Line":4}},{"line":84,"address":[1948977],"length":1,"stats":{"Line":0}},{"line":86,"address":[1837310],"length":1,"stats":{"Line":2}},{"line":87,"address":[1660380,1659970],"length":1,"stats":{"Line":3}},{"line":88,"address":[1949321,1949696,1949392],"length":1,"stats":{"Line":5}},{"line":89,"address":[1660476,1661086,1660109],"length":1,"stats":{"Line":6}},{"line":90,"address":[1926637],"length":1,"stats":{"Line":1}},{"line":91,"address":[1668964,1667860],"length":1,"stats":{"Line":2}},{"line":97,"address":[1950016,1949669],"length":1,"stats":{"Line":2}},{"line":98,"address":[1927603],"length":1,"stats":{"Line":1}},{"line":99,"address":[1927460],"length":1,"stats":{"Line":1}},{"line":100,"address":[1838292],"length":1,"stats":{"Line":1}},{"line":114,"address":[1662735,1662705,1661488],"length":1,"stats":{"Line":2}},{"line":119,"address":[1839010],"length":1,"stats":{"Line":2}},{"line":120,"address":[1928514],"length":1,"stats":{"Line":1}},{"line":122,"address":[1669722],"length":1,"stats":{"Line":1}},{"line":125,"address":[1669513],"length":1,"stats":{"Line":2}},{"line":126,"address":[1669584],"length":1, TES, VERSION_CURRENT,\n};\nuse chacha20poly1305::aead::{Aead, KeyInit, Payload};\nuse chacha20poly1305::{XChaCha20Poly1305, XNonce};\nuse frappuccino_crypto_core::identity::StreamIdentity;\nuse frappuccino_crypto_core::seal;\nuse frappuccino_crypto_core::CryptoError;\nuse rand_core::{OsRng, RngCore};\nuse zeroize::Zeroize;\n\n/// Specific error type for the encrypt path. Mirrors `DecryptError`'s layout.\n#[derive(Debug, thiserror::Error)]\npub enum EncryptError {\n    #[error(transparent)]\n    Core(#[from] CryptoError),\n    #[error(\"AEAD encryption failed: {0}\")]\n    Aead(String),\n    #[error(\"plaintext too large: {chunks} chunks exceeds MAX_CHUNK_COUNT = {max}\")]\n    TooLarge { chunks: u64, max: u32 },\n}\n\n/// Encrypt `plaintext` in mode SINGLE for the given `author` identity.\n///\n/// The author is also the only recipient (`grant_count` = 0). Use\n/// [`encrypt_chunked`] for payloads that should be streamed chunk-by-chunk\n/// (video capture, large files).\n///\n/// # Errors\n/// Returns an [`EncryptError::Core`] if the sealed envelope can't be built,\n/// or [`EncryptError::Aead`] if XChaCha20-Poly1305 encryption fails (never\n/// in practice).\npub fn encrypt_single(plaintext: \u0026[u8], author: \u0026StreamIdentity) -\u003e Result\u003cVec\u003cu8\u003e, EncryptError\u003e {\n    // 1. Fresh 32-byte session key (wipe on function exit via Zeroize).\n    let mut session_key = [0u8; SESSION_KEY_BYTES];\n    OsRng.fill_bytes(\u0026mut session_key);\n\n    // 2. Header (author pk + sealed session key + grant_count=0).\n    let mut header = Vec::with_capacity(HEADER_SIZE_NO_GRANTS);\n    write_header_prefix(\u0026mut header, author, \u0026session_key)?;\n\n    // 3. Body: mode byte + nonce + ct. AAD is the header bytes verbatim.\n    let mut nonce = [0u8; NONCE_BYTES];\n    OsRng.fill_bytes(\u0026mut nonce);\n    let cipher = XChaCha20Poly1305::new(session_key.as_slice().into());\n    let ct = cipher\n        .encrypt(\n            XNonce::from_slice(\u0026nonce),\n            Payload {\n                msg: plaintext,\n                aad: \u0026header,\n            },\n        )\n        .map_err(|e| EncryptError::Aead(e.to_string()))?;\n\n    session_key.zeroize();\n\n    let mut blob = header;\n    blob.push(MODE_SINGLE);\n    blob.extend_from_slice(\u0026nonce);\n    blob.extend_from_slice(\u0026ct);\n    Ok(blob)\n}\n\n/// Encrypt `plaintext` in mode CHUNKED with [`CHUNK_SIZE`] chunks.\n///\n/// Emits a `VERSION_V2` blob — the AAD of every chunk binds\n/// `chunk_count` explicitly so a truncation attack (dropping trailing chunks)\n/// is rejected by the decoder.\n///\n/// # Errors\n/// * [`EncryptError::Core`] if the sealed envelope can't be built.\n/// * [`EncryptError::Aead`] if `XChaCha20-Poly1305` encryption fails.\n/// * [`EncryptError::TooLarge`] if the plaintext would need more than\n///   [`MAX_CHUNK_COUNT`] chunks (≥ 1 TiB in practice).\n///\n/// # Panics\n/// Cannot panic in practice: `NONCE_BYTES + ct.len()` is bounded by\n/// `MAX_CHUNK_LEN = 2 MiB`, which fits in `u32`.\npub fn encrypt_chunked(plaintext: \u0026[u8], author: \u0026StreamIdentity) -\u003e Result\u003cVec\u003cu8\u003e, EncryptError\u003e {\n    // chunk_count is part of the AAD, so it must be known before encrypting\n    // the first chunk. ceil(len / CHUNK_SIZE) — zero for empty plaintext.\n    let chunks_u64 = (plaintext.len() as u64).div_ceil(CHUNK_SIZE as u64);\n    let chunk_count = u32::try_from(chunks_u64).map_err(|_| EncryptError::TooLarge {\n        chunks: chunks_u64,\n        max: MAX_CHUNK_COUNT,\n    })?;\n    if chunk_count \u003e MAX_CHUNK_COUNT {\n        return Err(EncryptError::TooLarge {\n            chunks: chunks_u64,\n            max: MAX_CHUNK_COUNT,\n        });\n    }\n\n    let mut session_key = [0u8; SESSION_KEY_BYTES];\n    OsRng.fill_bytes(\u0026mut session_key);\n\n    let mut header = Vec::with_capacity(HEADER_SIZE_NO_GRANTS);\n    write_header_prefix(\u0026mut header, author, \u0026session_key)?;\n\n    // Shared random prefix for all chunks of this stream.\n    let mut nonce_prefix = [0u8; NONCE_PREFIX_BYTES];\n    OsRng.fill_bytes(\u0026mut nonce_prefix);\n\n    // V2 AAD = header ‖ MODE_CHUNKED ‖ nonce_prefix ‖ chunk_count (BE u32).\n    let aad = build_chunked_aad_v2(\u0026header, \u0026nonce_prefix, chunk_count);\n\n    let cipher = XChaCha20Poly1305::new(session_key.as_slice().into());\n    let mut chunks_bytes = Vec::new();\n    let mut chunk_index: u32 = 0;\n    let mut offset = 0;\n    while offset \u003c plaintext.len() {\n        let end = (offset + CHUNK_SIZE).min(plaintext.len());\n        let plain = \u0026plaintext[offset..end];\n\n        // nonce = prefix || chunk_index_BE(4).\n        let mut nonce = [0u8; NONCE_BYTES];\n        nonce[..NONCE_PREFIX_BYTES].copy_from_slice(\u0026nonce_prefix);\n        nonce[NONCE_PREFIX_BYTES..].copy_from_slice(\u0026chunk_index.to_be_bytes());\n\n        let ct = cipher\n            .encrypt(\n                XNonce::from_slice(\u0026nonce),\n                Payload {\n                    msg: plain,\n                    aad: \u0026aad,\n                },\n            )\n            .map_err(|e| EncryptError::Aead(e.to_string()))?;\n\n        // Chunk frame = total_len(u32 BE = nonce+ct) || nonce || ct.\n        let total_len = u32::try_from(NONCE_BYTES + ct.len())\n            .expect(\"chunk len fits in u32 (ct \u003c= MAX_CHUNK_LEN)\");\n        chunks_bytes.extend_from_slice(\u0026total_len.to_be_bytes());\n        chunks_bytes.extend_from_slice(\u0026nonce);\n        chunks_bytes.extend_from_slice(\u0026ct);\n\n        chunk_index += 1;\n        offset = end;\n    }\n    debug_assert_eq!(chunk_index, chunk_count);\n    session_key.zeroize();\n\n    let mut blob = header;\n    blob.push(MODE_CHUNKED);\n    blob.extend_from_slice(\u0026nonce_prefix);\n    blob.extend_from_slice(\u0026chunk_count.to_be_bytes());\n    blob.extend_from_slice(\u0026chunks_bytes);\n    Ok(blob)\n}\n\n/// Pick SINGLE or CHUNKED based on the Kotlin threshold (`\u003c= 10 MiB = SINGLE`).\n/// Convenience wrapper when the caller doesn't want to think about modes.\n///\n/// # Errors\n/// Forwards from [`encrypt_single`] / [`encrypt_chunked`].\npub fn encrypt(plaintext: \u0026[u8], author: \u0026StreamIdentity) -\u003e Result\u003cVec\u003cu8\u003e, EncryptError\u003e {\n    if plaintext.len() as u64 \u003c= CHUNK_THRESHOLD {\n        encrypt_single(plaintext, author)\n    } else {\n        encrypt_chunked(plaintext, author)\n    }\n}\n\n// ============================================================================\n// Helpers\n// ============================================================================\n\nfn write_header_prefix(\n    out: \u0026mut Vec\u003cu8\u003e,\n    author: \u0026StreamIdentity,\n    session_key: \u0026[u8; 32],\n) -\u003e Result\u003c(), EncryptError\u003e {\n    debug_assert_eq!(out.len(), OFF_MAGIC);\n    out.extend_from_slice(\u0026MAGIC);\n    debug_assert_eq!(out.len(), OFF_VERSION);\n    out.push(VERSION_CURRENT);\n    debug_assert_eq!(out.len(), OFF_AUTHOR_PK);\n    out.extend_from_slice(author.ed25519_pk());\n    assert_eq!(author.ed25519_pk().len(), ED25519_PK_BYTES);\n\n    // Sealed envelope via crypto_box_seal(session_key, x25519_pk).\n    debug_assert_eq!(out.len(), OFF_SEALED);\n    let sealed = seal::seal(session_key, author.x25519_pk())?;\n    assert_eq!(sealed.len(), SEALED_ENVELOPE_SIZE);\n    out.extend_from_slice(\u0026sealed);\n\n    // grant_count = 0 (V2 never adds grants in-blob).\n    debug_assert_eq!(out.len(), OFF_GRANT_COUNT);\n    out.extend_from_slice(\u0026[0u8; 2]);\n    debug_assert_eq!(out.len(), HEADER_SIZE_NO_GRANTS);\n    Ok(())\n}\n\n/// Build the extended AAD used by `VERSION_V2` chunked blobs. Shared between\n/// [`encrypt_chunked`] and [`crate::decrypt::decrypt`] so any drift would show\n/// up as AEAD failures in tests immediately.\n///\n/// Layout: `header_bytes ‖ MODE_CHUNKED ‖ nonce_prefix ‖ chunk_count_BE_u32`.\npub(crate) fn build_chunked_aad_v2(\n    header: \u0026[u8],\n    nonce_prefix: \u0026[u8; NONCE_PREFIX_BYTES],\n    chunk_count: u32,\n) -\u003e Vec\u003cu8\u003e {\n    let mut aad = Vec::with_capacity(header.len() + 1 + NONCE_PREFIX_BYTES + 4);\n    aad.extend_from_slice(header);\n    aad.push(MODE_CHUNKED);\n    aad.extend_from_slice(nonce_prefix);\n    aad.extend_from_slice(\u0026chunk_count.to_be_bytes());\n    aad\n}\n","traces":[{"line":45,"address":[1646487,1645072,1646436],"length":1,"stats":{"Line":2}},{"line":47,"address":[1928152],"length":1,"stats":{"Line":2}},{"line":48,"address":[1826483],"length":1,"stats":{"Line":2}},{"line":51,"address":[1645190],"length":1,"stats":{"Line":2}},{"line":52,"address":[1826583,1827813,1826631],"length":1,"stats":{"Line":4}},{"line":55,"address":[1905481],"length":1,"stats":{"Line":2}},{"line":56,"address":[1905504],"length":1,"stats":{"Line":2}},{"line":57,"address":[1826832],"length":1,"stats":{"Line":2}},{"line":58,"address":[1592829,1593000],"length":1,"stats":{"Line":2}},{"line":60,"address":[1592670],"length":1,"stats":{"Line":2}},{"line":61,"address":[1905749],"length":1,"stats":{"Line":2}},{"line":63,"address":[1592743],"length":1,"stats":{"Line":2}},{"line":66,"address":[1928904],"length":1,"stats":{"Line":0}},{"line":68,"address":[1593089],"length":1,"stats":{"Line":2}},{"line":70,"address":[1646084],"length":1,"stats":{"Line":2}},{"line":71,"address":[1646124],"length":1,"stats":{"Line":2}},{"line":72,"address":[1929223],"length":1,"stats":{"Line":2}},{"line":73,"address":[1906270],"length":1,"stats":{"Line":2}},{"line":74,"address":[1646308],"length":1,"stats":{"Line":2}},{"line":92,"address":[1908411,1906560,1909794],"length":1,"stats":{"Line":2}},{"line":95,"address":[1827938],"length":1,"stats":{"Line":2}},{"line":96,"address":[1910000,1910016],"length":1,"stats":{"Line":2}},{"line":97,"address":[1937992],"length":1,"stats":{"Line":0}},{"line":100,"address":[1906859],"length":1,"stats":{"Line":2}},{"line":101," ll nonce computed for\n/// each chunk in mode CHUNKED.\npub const NONCE_BYTES: usize = 24;\n/// Length of the shared `nonce_prefix` written once at the start of a\n/// CHUNKED body. Each chunk appends a 4-byte chunk index to form its nonce.\npub const NONCE_PREFIX_BYTES: usize = NONCE_BYTES - 4;\n/// Poly1305 tag length (always appended in XChaCha20-Poly1305-IETF).\npub const AEAD_TAG_BYTES: usize = 16;\n\n/// Ed25519 public key length.\npub const ED25519_PK_BYTES: usize = 32;\n/// X25519 public key length (target of the sealed envelope).\npub const X25519_PK_BYTES: usize = 32;\n\n/// Default chunk size used by the encoder for mode CHUNKED payloads.\npub const CHUNK_SIZE: usize = 1024 * 1024;\n/// Size threshold below which the encoder picks mode SINGLE over CHUNKED.\npub const CHUNK_THRESHOLD: u64 = 10 * 1024 * 1024;\n\n/// Hard caps applied by the decoder (prevents memory `DoS` on crafted blobs).\npub const MAX_CHUNK_COUNT: u32 = 1_000_000;\n/// Max size of a single chunk's full `total_len` field.\npub const MAX_CHUNK_LEN: u32 = 2 * 1024 * 1024;\n\n/// Byte offsets inside the pre-body header. These are constant because V1\n/// never has recipient grants (`grant_count = 0`).\npub const OFF_MAGIC: usize = 0;\npub const OFF_VERSION: usize = 4;\npub const OFF_AUTHOR_PK: usize = 5;\npub const OFF_SEALED: usize = OFF_AUTHOR_PK + ED25519_PK_BYTES;\npub const OFF_GRANT_COUNT: usize = OFF_SEALED + SEALED_ENVELOPE_SIZE;\npub const HEADER_SIZE_NO_GRANTS: usize = OFF_GRANT_COUNT + 2;\n\n/// Size in bytes of one grant entry: recipient X25519 pk + sealed session key.\npub const GRANT_ENTRY_SIZE: usize = X25519_PK_BYTES + SEALED_ENVELOPE_SIZE;\n\n/// Assemble an unsigned 16-bit big-endian value from its two bytes.\n#[must_use]\npub const fn be_u16(hi: u8, lo: u8) -\u003e u16 {\n    ((hi as u16) \u003c\u003c 8) | (lo as u16)\n}\n\n/// Byte-layout summary of a well-formed STRM header. Produced by\n/// [`parse_header`] so callers (the decoder, the CLI `--inspect`, and the\n/// fuzz c min {\n        return Err(HeaderError::TooShort {\n            got: blob.len(),\n            min,\n        });\n    }\n    if blob[OFF_MAGIC..OFF_MAGIC + 4] != MAGIC[..] {\n        return Err(HeaderError::BadMagic);\n    }\n    let version = blob[OFF_VERSION];\n    // The decoder accepts both V1 (Kotlin legacy) and V2 (current Rust\n    // encoder). Any other value is invalid.\n    if version != crate::header::VERSION_V1 \u0026\u0026 version != crate::header::VERSION_V2 {\n        return Err(HeaderError::BadVersion { version });\n    }\n    let mut author_pk = [0u8; ED25519_PK_BYTES];\n    author_pk.copy_from_slice(\u0026blob[OFF_AUTHOR_PK..OFF_AUTHOR_PK + ED25519_PK_BYTES]);\n    let grant_count = be_u16(blob[OFF_GRANT_COUNT], blob[OFF_GRANT_COUNT + 1]);\n    let grants_len = usize::from(grant_count) * GRANT_ENTRY_SIZE;\n    let header_end = HEADER_SIZE_NO_GRANTS + grants_len;\n    if blob.len() \u003c header_end + 1 {\n        return Err(HeaderError::TruncatedWithGrants {\n            grant_count,\n            need: header_end + 1,\n        });\n    }\n    let mode = blob[header_end];\n    Ok(ParsedHeader {\n        version,\n        mode,\n        author_ed25519_pk: author_pk,\n        grant_count,\n        header_end,\n        body_start: header_end + 1,\n    })\n}\n","traces":[{"line":76,"address":[1956560],"length":1,"stats":{"Line":2}},{"line":77,"address":[1530830],"length":1,"stats":{"Line":2}},{"line":125,"address":[1684080],"length":1,"stats":{"Line":2}},{"line":126,"address":[1684135,1684188],"length":1,"stats":{"Line":2}},{"line":127,"address":[1852101],"length":1,"stats":{"Line":2}},{"line":128,"address":[1852167],"length":1,"stats":{"Line":0}},{"line":133,"address":[1684201,1684340],"length":1,"stats":{"Line":4}},{"line":134,"address":[1531231],"length":1,"stats":{"Line":1}},{"line":136,"address":[1979583,1979611,1979499],"length":1,"stats":{"Line":4}},{"line":139,"address":[1684622,1684541],"length":1,"stats":{"Line":4}},{"line":140,"address":[1684  V1 — `aad = header_bytes` (Kotlin legacy — read-only).\n//! * CHUNKED V2 — `aad = header_bytes ‖ MODE ‖ nonce_prefix ‖ chunk_count_BE_u32`.\n//!   The binding of `chunk_count` in the AAD is what rejects a truncation\n//!   attack (dropping trailing chunks + patching `chunk_count`) that V1\n//!   accepted silently.\n//!\n//! The decoder accepts both versions. The encoder emits V2 exclusively.\n\npub use frappuccino_crypto_core as core;\n\npub mod decrypt;\npub mod encrypt;\npub mod header;\n\n// The V2 relay client and its TLS-pinning glue live behind the `protocol`\n// feature (on by default). Fuzz builds disable it to keep `cargo fuzz build`\n// from dragging reqwest + rustls + hyper through the sanitizer toolchain\n// (~3 GiB of RAM).\n#[cfg(feature = \"protocol\")]\npub mod pin;\n#[cfg(feature = \"protocol\")]\npub mod protocol;\n\npub use decrypt::{decrypt, BlobMetadata, DecryptError};\npub use encrypt::{encrypt_chunked, encrypt_single, EncryptError};\n#[cfg(feature = \"protocol\")]\npub use protocol::{\n    ChallengeValue, EnrollResult, IdentityStatus, ProtocolError, StreamServerClient,\n};\n","traces":[],"covered":0,"coverable":0},{"path":["/","work","stream","src","pin.rs"],"content":"//! Pinned-cert TLS verifier — CRIT-01 defense-in-depth.\n//!\n//! `rustls`'s normal verifier walks a trust store; we intentionally bypass it\n//! because the Vultr relay uses a self-signed cert that no real CA signed.\n//! Instead, we:\n//!\n//! 1. Accept **only** the exact DER we were given at build time\n//!    ([`EMBEDDED_CERT_DER`]), matching the same cert bundled in the Android\n//!    APK (`mobile/src/main/res/raw/frappuccino_ca.crt`).\n//! 2. Verify the live peer cert's `SubjectPublicKeyInfo` (SPKI) SHA-256 matches\n//!    the hard-coded pin [`PIN_SHA256_B64`] — this is belt-and-braces next to\n//!    the exact-cert match, and survives a legitimate cert rotation as long\n//!    as the same key is re-used.\n//!\n//! This replicates the Kotlin `CertificatePinner`+`network_security_config`\n//! pair used in `StreamServerClient.kt`. Swap for proper CA validation when\n//! the relay migrates to Let's Encrypt post-démo.\n\nuse base64::engine::general_purpose::STANDARD as B64;\nuse base64::Engine as _;\nuse rustls::client::danger::{HandshakeSignatureValid, ServerCertVerified, ServerCertVerifier};\nuse rustls::pki_types::{CertificateDer, ServerName, UnixTime};\nuse rustls::{DigitallySignedStruct, Error, SignatureScheme};\nuse sha2::{Digest, Sha256};\nuse subtle::ConstantTimeEq;\nuse x509_parser::prelude::FromDer;\nuse x509_parser::prelude::X509Certificate;\n\n/// SPKI SHA-256 pin (base64) — lifted verbatim from `StreamServerClient.kt`.\n///\n/// Corresponds to the public key embedded in the test-server cert at\n/// `136.244.101.236:8443`. Any attacker rotating the cert would need access\n/// to the same EC private key to reproduce this hash.\npub const PIN_SHA256_B64: \u0026str = \"mGGCWQNvYxXBlHTDUzRgdB1GSJQnnwP0gw5gUmokBOA=\";\n\n/// Host we expect inside the TLS SNI / URL. Must match the pin above.\npub const PINNED_HOST: \u0026str = \"136.244.101.236\";\n\n/// DER bytes of the one cert we will trust (decoded from the embedded PEM).\n/// The build-time `include_bytes!` ensures this ships inside the binary, not\n/// fetched from disk at runtime.\nconst EMBEDDED_CERT_PEM: \u0026str = include_str!(\"../assets/frappuccino_ca.crt\");\n\n/// `ServerCertVerifier` that trusts exactly one embedded DER cert and, as an\n/// additional gate, compares the peer cert's SPKI SHA-256 against a hard-coded\n/// pin.\n///\n/// Construct via [`PinnedCertVerifier::new`].\n#[derive(Debug)]\npub struct PinnedCertVerifier {\n    embedded_cert_der: Vec\u003cu8\u003e,\n    pin_sha256: [u8; 32],\n    expected_host: String,\n}\n\nimpl PinnedCertVerifier {\n    /// Build a verifier from the embedded PEM + base64 SPKI pin.\n    ///\n    /// # Errors\n    /// Returns [`Error::General`] if the embedded PEM can't be parsed or the\n    /// base64 pin has wrong length.\n    pub fn new() -\u003e Result\u003cSelf, Error\u003e {\n        Self::with_pin_b64(PIN_SHA256_B64)\n    }\n\n    /// Build a verifier with a caller-chosen SPKI pin, for defense-in-depth\n    /// negative tests (feed a wrong pin → observe the handshake fail).\n    ///\n    /// Production code should use [`Self::new`] which hard-codes the real pin.\n    ///\n    /// # Errors\n    /// See [`Self::new`].\n    pub fn with_pin_b64(pin_b64: \u0026str) -\u003e Result\u003cSelf, Error\u003e {\n        let embedded_cert_der = pem_to_der(EMBEDDED_CERT_PEM).map_err(Error::General)?;\n        let pin_bytes = B64\n            .decode(pin_b64)\n            .map_err(|e| Error::General(format!(\"pin base64 decode: {e}\")))?;\n        let pin_sha256: [u8; 32] = pin_bytes\n            .try_into()\n            .map_err(|_| Error::General(\"pin SHA-256 must be 32 bytes\".into()))?;\n        Ok(Self {\n            embedded_cert_der,\n            pin_sha256,\n            expected_host: PINNED_HOST.to_string(),\n        })\n    }\n\n    /// Extract SPKI DER bytes from a full X.509 DER cert.\n    fn extract_spki_der(cert_der: \u0026[u8]) -\u003e Result\u003c\u0026[u8], Error\u003e {\n        let (_, parsed) = X509Certificate::from_der(cert_der)\n            .map_err(|e| Error::General(format!(\"x509 parse: {e}\")))?;\n        Ok(parsed.tbs_certificate.subject_pki.raw)\n    }\n}\n\nimpl ServerCertVerifier for PinnedCertVerifier {\n    fn verify_server_cert(\n        \u0026self,\n        end_entity: \u0026CertificateDer\u003c'_\u003e,\n        _intermediates: \u0026[CertificateDer\u003c'_\u003e],\n        server_name: \u0026ServerName\u003c'_\u003e,\n        _ocsp_response: \u0026[u8],\n        _now: UnixTime,\n    ) -\u003e Result\u003cServerCertVerified, Error\u003e {\n        // 1. Host check — belt alongside the pin. `ServerName` is an enum, so\n        //    we stringify for a stable comparison.\n        let sni = match server_name {\n            ServerName::DnsName(d) =\u003e d.as_ref().to_string(),\n            ServerName::IpAddress(ip) =\u003e ip_to_string(ip),\n            _ =\u003e {\n                return Err(Error::General(format!(\n                    \"unsupported ServerName variant: {server_name:?}\"\n                )))\n            }\n        };\n        if sni != self.expected_host {\n            return Err(Error::General(format!(\n                \"SNI {sni:?} != pinned host {:?}\",\n                self.expected_host\n            )));\n        }\n\n        // 2. Exact-DER comparison (constant time — pin and cert are both public,\n        //    but there's no downside to ct_eq here).\n        if bool::from(end_entity.as_ref().ct_eq(\u0026self.embedded_cert_der)) {\n            // Still check the pin; if the embedded cert is stale vs the pin\n            // constant, we want to fail loudly here rather than silently trust.\n        } else {\n            // Peer cert ≠ embedded cert — fall through to SPKI-pin check so a\n            // legitimate cert rotation (new expiry, same key) still works.\n        }\n\n        // 3. SPKI SHA-256 pin — the authoritative defense-in-depth check.\n        let spki = Self::extract_spki_der(end_entity.as_ref())?;\n        let got = Sha256::digest(spki);\n        if !bool::from(got.as_slice().ct_eq(\u0026self.pin_sha256)) {\n            return Err(Error::General(format!(\n                \"SPKI pin mismatch: peer SHA-256 {} != expected {}\",\n                hex::encode(got),\n                hex::encode(self.pin_sha256),\n            )));\n        }\n        Ok(ServerCertVerified::assertion())\n    }\n\n    fn verify_tls12_signature(\n        \u0026self,\n        _message: \u0026[u8],\n        _cert: \u0026CertificateDer\u003c'_\u003e,\n        _dss: \u0026DigitallySignedStruct,\n    ) -\u003e Result\u003cHandshakeSignatureValid, Error\u003e {\n        // We've already authenticated the cert via the pin; per rustls docs,\n        // returning `assertion()` here is the correct idiom for a custom\n        // verifier that doesn't want to re-implement TLS 1.2 signature checks.\n        // The handshake itself will still fail if the signature doesn't bind\n        // to the same key whose SPKI we verified.\n        Ok(HandshakeSignatureValid::assertion())\n    }\n\n    fn verify_tls13_signature(\n        \u0026self,\n        _message: \u0026[u8],\n        _cert: \u0026CertificateDer\u003c'_\u003e,\n        _dss: \u0026DigitallySignedStruct,\n    ) -\u003e Result\u003cHandshakeSignatureValid, Error\u003e {\n        Ok(HandshakeSignatureValid::assertion())\n    }\n\n    fn supported_verify_schemes(\u0026self) -\u003e Vec\u003cSignatureScheme\u003e {\n        // ECDSA P-256 (what the relay uses) + the common RSA schemes for\n        // future-proofing.\n        vec![\n            SignatureScheme::ECDSA_NISTP256_SHA256,\n            SignatureScheme::ECDSA_NISTP384_SHA384,\n            SignatureScheme::RSA_PSS_SHA256,\n            SignatureScheme::RSA_PSS_SHA384,\n            SignatureScheme::RSA_PSS_SHA512,\n            SignatureScheme::RSA_PKCS1_SHA256,\n            SignatureScheme::RSA_PKCS1_SHA384,\n            SignatureScheme::RSA_PKCS1_SHA512,\n            SignatureScheme::ED25519,\n        ]\n    }\n}\n\n// ============================================================================\n// Helpers\n// ============================================================================\n\n/// Minimal PEM → DER decoder. Accepts a single `-----BEGIN CERTIFICATE-----`\n/// block; anything more elaborate (multi-cert bundles, encrypted blocks) is\n/// rejected on purpose.\nfn pem_to_der(pem: \u0026str) -\u003e Result\u003cVec\u003cu8\u003e, String\u003e {\n    let mut body = String::with_capacity(pem.len());\n    let mut in_block = false;\n    for line in pem.lines() {\n        let l = line.trim();\n        if l == \"-----BEGIN CERTIFICATE-----\" {\n            in_block = true;\n            continue;\n        }\n        if l == \"-----END CERTIFICATE-----\" {\n            in_block = false;\n            continue;\n        }\n        if in_block {\n            body.push_str(l);\n        }\n    }\n    if body.is_empty() {\n        return Err(\"PEM did not contain a CERTIFICATE block\".into());\n    }\n    B64.decode(body.as_bytes())\n        .map_err(|e| format!(\"PEM body base64 decode: {e}\"))\n}\n\nfn ip_to_string(ip: \u0026rustls::pki_types::IpAddr) -\u003e String {\n    match ip {\n        rustls::pki_types::IpAddr::V4(v4) =\u003e {\n            let [a, b, c, d] = v4.as_ref();\n            format!(\"{a}.{b}.{c}.{d}\")\n        }\n        rustls::pki_types::IpAddr::V6(v6) =\u003e {\n            let bytes: \u0026[u8; 16] = v6.as_ref();\n            // Lossy but enough to compare against an IPv6-literal string — the\n            // project only ever pins an IPv4, so this branch is effectively dead.\n            let groups: [u16; 8] = [\n                u16::from_be_bytes([bytes[0], bytes[1]]),\n                u16::from_be_bytes([bytes[2], bytes[3]]),\n                u16::from_be_bytes([bytes[4], bytes[5]]),\n                u16::from_be_bytes([bytes[6], bytes[7]]),\n                u16::from_be_bytes([bytes[8], bytes[9]]),\n                u16::from_be_bytes([bytes[10], bytes[11]]),\n                u16::from_be_bytes([bytes[12], bytes[13]]),\n                u16::from_be_bytes([bytes[14], bytes[15]]),\n            ];\n            groups\n                .iter()\n                .map(|g| format!(\"{g:x}\"))\n                .collect::\u003cVec\u003c_\u003e\u003e()\n                .join(\":\")\n        }\n    }\n}\n\n// ============================================================================\n// Tests\n// ============================================================================\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn embedded_cert_decodes() {\n        let der = pem_to_der(EMBEDDED_CERT_PEM).expect(\"pem decode\");\n        assert!(\n            der.len() \u003e 100,\n            \"DER cert suspiciously short: {}\",\n            der.len()\n        );\n        // First two bytes of a DER cert are 0x30 0x82 (SEQUENCE, long form length).\n        assert_eq!(der[0], 0x30, \"DER must start with SEQUENCE tag\");\n    }\n\n    #[test]\n    fn embedded_cert_spki_matches_pin() {\n        // This is the whole point of the module — if this ever fails, the\n        // cert and the pin have diverged and the relay will be unreachable.\n        let der = pem_to_der(EMBEDDED_CERT_PEM).unwrap();\n        let spki = PinnedCertVerifier::extract_spki_der(\u0026der).unwrap();\n        let got = Sha256::digest(spki);\n        let pin = B64.decode(PIN_SHA256_B64).unwrap();\n        assert_eq!(\n            got.as_slice(),\n            pin.as_slice(),\n            \"embedded cert's SPKI SHA-256 does not match PIN_SHA256_B64\"\n        );\n    }\n\n    #[test]\n    fn verifier_new_succeeds() {\n        let v = PinnedCertVerifier::new().expect(\"verifier build\");\n        assert_eq!(v.expected_host, PINNED_HOST);\n        assert_eq!(v.pin_sha256.len(), 32);\n    }\n\n    #[test]\n    fn pem_rejects_empty_input() {\n        let err = pem_to_der(\"\").unwrap_err();\n        assert!(err.contains(\"CERTIFICATE block\"));\n    }\n\n    #[test]\n    fn pem_rejects_garbage() {\n        let err =\n            pem_to_der(\"-----BEGIN CERTIFICATE-----\\nnot-base64!!\\n-----END CERTIFICATE-----\")\n                .unwrap_err();\n        assert!(err.contains(\"base64\"));\n    }\n}\n","traces":[{"line":62,"address":[1844128],"length":1,"stats":{"Line":3}},{"line":63,"address":[1510248],"length":1,"stats":{"Line":3}},{"line":73,"address":[1510272,1511471,1511534],"length":1,"stats":{"Line":3}},{"line":74,"address":[1510314],"length":1,"stats":{"Line":3}},{"line":75,"address":[1510541,1510620,1511522,1510750],"length":1,"stats":{"Line":6}},{"line":77,"address":[1844584],"length":1,"stats":{"Line":0}},{"line":78,"address":[1511477,1510967,1511093,1510847],"length":1,"stats":{"Line":6}},{"line":80,"addr },{"line":229,"address":[1514946],"length":1,"stats":{"Line":0}},{"line":230,"address":[1848943],"length":1,"stats":{"Line":0}},{"line":231,"address":[1849004],"length":1,"stats":{"Line":0}},{"line":232,"address":[1515129],"length":1,"stats":{"Line":0}},{"line":233,"address":[1515190],"length":1,"stats":{"Line":0}},{"line":234,"address":[1515251],"length":1,"stats":{"Line":0}},{"line":235,"address":[1515312],"length":1,"stats":{"Line":0}},{"line":237,"address":[1515466,1515946],"length":1,"stats":{"Line":0}},{"line":239,"address":[1640800,1640829],"length":1,"stats":{"Line":0}}],"covered":57,"coverable":77},{"path":["/","work","stream","src","protocol.rs"],"content":"//! V2 relay protocol — Rust port of `StreamServerClient.kt`.\n//!\n//! Blocking HTTP client (tokio-less at the caller's level — reqwest still uses\n//! an internal tokio runtime, but consumers see a synchronous API). All\n//! network calls go through a [`PinnedCertVerifier`][crate::pin::PinnedCertVerifier]\n//! so MITM requires breaking ECDSA P-256 for the pinned SPKI.\n//!\n//! Endpoint contract:\n//! * `POST /auth/v2/enroll`           → 200 / 409 / Failed\n//! * `POST /auth/challenge`           → `ChallengeValue { nonce, timestamp }`\n//! * `POST /auth/v2/verify`           → `Option\u003cBearer \u003cjwt\u003e\u003e`\n//! * `POST /auth/v2/rotate-batch`     → bool\n//! * `GET  /auth/v2/status/{pk_hex}`  → `Option\u003cIdentityStatus\u003e`\n//!\n//! Post-S9-pre-audit: every challenge carries a server-emitted Unix timestamp\n//! and the client signs `nonce ‖ timestamp_BE_u64` rather than the raw nonce.\n//! The server enforces `abs(now - ts) ≤ 30 s` on `/auth/v2/verify`, closing\n//! the replay window that was previously only bounded by the 60 s nonce TTL.\n//!\n//! Timeouts match Kotlin exactly: connect 10 s, read 15 s.\n\nuse crate::pin::PinnedCertVerifier;\nuse frappuccino_crypto_core::identity::StreamIdentity;\nuse frappuccino_crypto_core::ratchet::{RatchetSignature, RotationProof, BATCH_SIZE};\nuse rustls::crypto::ring::default_provider;\nuse rustls::ClientConfig;\nuse serde::{Deserialize, Serialize};\nuse std::sync::Arc;\nuse std::time::Duration;\n\n/// Errors bubbling up from a [`StreamServerClient`] call.\n#[derive(Debug, thiserror::Error)]\npub enum ProtocolError {\n    /// Network / HTTP layer failure (DNS, connect, TLS, timeout, malformed\n    /// response framing, …).\n    #[error(\"HTTP error: {0}\")]\n    Http(#[from] reqwest::Error),\n    /// JSON decode failure of a response the server sent.\n    #[error(\"JSON error: {0}\")]\n    Json(#[from] serde_json::Error),\n    /// rustls configuration rejected our custom verifier / provider.\n    #[error(\"TLS config error: {0}\")]\n    Tls(String),\n    /// Server returned success but the payload was incoherent (missing field,\n    /// unparseable hex, wrong length).\n    #[error(\"invalid server response: {0}\")]\n    Invalid(String),\n}\n\n/// Outcome of an enrollment attempt.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum EnrollResult {\n    /// HTTP 200 — the identity was newly registered.\n    Success,\n    /// HTTP 409 — this `ed25519_pk` was already on record. Idempotent retries\n    /// hit this path.\n    AlreadyEnrolled,\n    /// Any other status. `body` is the response body verbatim for logging —\n    /// never logged automatically to avoid leaking server internals.\n    Failed {\n        /// HTTP status code.\n        code: u16,\n        /// Response body.\n        body: String,\n    },\n}\n\n/// Fresh challenge emitted by `/auth/challenge`. The caller MUST sign\n/// `nonce ‖ timestamp_BE_u64` (40 bytes) — signing the raw nonce alone is\n/// rejected by the server starting at S9-pre-audit.\n///\n/// `timestamp` is Unix seconds as seen by the server at the time the nonce\n/// was minted. The server keeps a ±30 s tolerance window on verify so a\n/// reasonable client clock skew (NTP drift, phone sleep) still authenticates.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct ChallengeValue {\n    /// 32-byte server-generated nonce.\n    pub nonce: [u8; 32],\n    /// Unix seconds when the server minted the nonce.\n    pub timestamp: u64,\n}\n\nimpl ChallengeValue {\n    /// The 40-byte message the client must sign via the ratchet. Keeps the\n    /// composition in one place so the client and the server can't drift.\n    #[must_use]\n    pub fn message_bytes(\u0026self) -\u003e [u8; 40] {\n        let mut buf = [0u8; 40];\n        buf[..32].copy_from_slice(\u0026self.nonce);\n        buf[32..].copy_from_slice(\u0026self.timestamp.to_be_bytes());\n        buf\n    }\n}\n\n/// Non-secret view of the server's knowledge about an identity. Fetched via\n/// `GET /auth/v2/status/{pk}` — useful to confirm an enrollment landed or to\n/// display remaining slot count in the UI.\n#[derive(Debug, Clone, PartialEq, Eq, Deserialize)]\npub struct IdentityStatus {\n    /// Current active batch number (`0` right after enrollment).\n    pub batch_number: u32,\n    /// How many ephemeral keys of the active batch have been consumed.\n    pub consumed_count: u32,\n    /// Remaining slots in the active batch (= `BATCH_SIZE - consumed_count`).\n    pub remaining_count: u32,\n    /// Unix seconds of the initial enrollment.\n    pub enrolled_at: i64,\n    /// Whether the server has marked this identity revoked.\n    pub revoked: bool,\n}\n\n/// Blocking client for the V2 relay.\n///\n/// Cheap to clone once built — `reqwest::blocking::Client` internally shares a\n/// connection pool via `Arc`.\n#[derive(Debug, Clone)]\npub struct StreamServerClient {\n    base_url: String,\n    http: reqwest::blocking::Client,\n}\n\nimpl StreamServerClient {\n    /// Build a pinned client against `base_url`. Typical input:\n    /// `\"https://136.244.101.236:8443\"`.\n    ///\n    /// # Errors\n    /// Returns [`ProtocolError::Tls`] if the embedded cert / pin can't be\n    /// parsed, or [`ProtocolError::Http`] if reqwest can't assemble the\n    /// underlying TLS stack (missing crypto provider, etc.).\n    pub fn new(base_url: impl Into\u003cString\u003e) -\u003e Result\u003cSelf, ProtocolError\u003e {\n        let verifier = PinnedCertVerifier::new().map_err(|e| ProtocolError::Tls(e.to_string()))?;\n\n        // Explicit ring provider — avoids relying on `install_default()` global\n        // state which other crates may have poisoned.\n        let config = ClientConfig::builder_with_provider(Arc::new(default_provider()))\n            .with_protocol_versions(\u0026[\u0026rustls::version::TLS13, \u0026rustls::version::TLS12])\n            .map_err(|e| ProtocolError::Tls(format!(\"protocol version: {e}\")))?\n            .dangerous()\n            .with_custom_certificate_verifier(Arc::new(verifier))\n            .with_no_client_auth();\n\n        let http = reqwest::blocking::Client::builder()\n            .use_preconfigured_tls(config)\n            .connect_timeout(Duration::from_secs(10))\n            .timeout(Duration::from_secs(15))\n            .build()?;\n\n        Ok(Self {\n            base_url: base_url.into(),\n            http,\n        })\n    }\n\n    // =========================================================================\n    // Enrollment\n    // =========================================================================\n\n    /// `POST /auth/v2/enroll` — register an identity with its `batch_0` keys.\n    ///\n    /// `batch0_signature` must be the Ed25519 signature of\n    /// `concat(batch0_public_keys)` by the enrollment key owned by the caller.\n    ///\n    /// # Errors\n    /// See [`ProtocolError`].\n    pub fn enroll(\n        \u0026self,\n        identity_pk_hex: \u0026str,\n        batch0_public_keys: \u0026[[u8; 32]; BATCH_SIZE],\n        batch0_signature: \u0026[u8; 64],\n    ) -\u003e Result\u003cEnrollResult, ProtocolError\u003e {\n        let body = EnrollBody {\n            ed25519_pk: identity_pk_hex.to_string(),\n            batch_0_public_keys: batch0_public_keys.iter().map(hex::encode).collect(),\n            batch_0_signature: hex::encode(batch0_signature),\n        };\n        let resp = self\n            .http\n            .post(format!(\"{}/auth/v2/enroll\", self.base_url))\n            .json(\u0026body)\n            .send()?;\n        let code = resp.status().as_u16();\n        match code {\n            200 =\u003e Ok(EnrollResult::Success),\n            409 =\u003e Ok(EnrollResult::AlreadyEnrolled),\n            _ =\u003e {\n                let body_text = resp.text().unwrap_or_default();\n                Ok(EnrollResult::Failed {\n                    code,\n                    body: body_text,\n                })\n            }\n        }\n    }\n\n    // =========================================================================\n    // Challenge + Verify (auth flow)\n    // =========================================================================\n\n    /// `POST /auth/challenge` — fetch a fresh 32-byte server nonce + the\n    /// timestamp the server stamped it with.\n    ///\n    /// The client must sign `nonce ‖ timestamp_BE_u64` (see\n    /// [`ChallengeValue::message_bytes`]). Signing the raw nonce is rejected\n    /// by the server.\n    ///\n    /// # Errors\n    /// [`ProtocolError::Http`] on network failure, [`ProtocolError::Invalid`]\n    /// if the server's `nonce` is missing or isn't 64 hex chars, or the\n    /// `timestamp` field is missing.\n    pub fn challenge(\u0026self) -\u003e Result\u003cChallengeValue, ProtocolError\u003e {\n        let resp = self\n            .http\n            .post(format!(\"{}/auth/challenge\", self.base_url))\n            .header(\"Content-Type\", \"application/json\")\n            .body(\"\")\n            .send()?\n            .error_for_status()?;\n        let body: ChallengeResponse = resp.json()?;\n        let nonce_vec = hex::decode(\u0026body.nonce)\n            .map_err(|e| ProtocolError::Invalid(format!(\"challenge nonce hex: {e}\")))?;\n        let nonce: [u8; 32] = nonce_vec\n            .try_into()\n            .map_err(|v: Vec\u003cu8\u003e| ProtocolError::Invalid(format!(\"nonce length {}\", v.len())))?;\n        Ok(ChallengeValue {\n            nonce,\n            timestamp: body.timestamp,\n        })\n    }\n\n    /// `POST /auth/v2/verify` — exchange a ratchet signature for a JWT bearer.\n    ///\n    /// `sig` must cover `nonce ‖ timestamp_BE_u64` (= [`ChallengeValue::message_bytes`]).\n    /// `nonce_hex` and `timestamp` must be the ones returned by [`challenge`].\n    ///\n    /// Returns `Some(\"Bearer \u003cjwt\u003e\")` on success, `None` if the server refused\n    /// (bad signature, consumed slot, wrong batch, skew beyond ±30 s, etc.).\n    ///\n    /// # Errors\n    /// Network / decode errors; a rejected signature is `Ok(None)`, *not* an\n    /// error — mirrors the Kotlin client's `null`-on-non-2xx semantics.\n    pub fn verify(\n        \u0026self,\n        identity: \u0026StreamIdentity,\n        sig: \u0026RatchetSignature,\n        nonce_hex: \u0026str,\n        timestamp: u64,\n    ) -\u003e Result\u003cOption\u003cString\u003e, ProtocolError\u003e {\n        let body = VerifyBody {\n            ed25519_pk: hex::encode(identity.ed25519_pk()),\n            ephemeral_pk: hex::encode(sig.ephemeral_public_key),\n            batch_number: sig.batch_number,\n            key_index: sig.key_index,\n            nonce: nonce_hex.to_string(),\n            timestamp,\n            signature: hex::encode(sig.signature),\n        };\n        let resp = self\n            .http\n            .post(format!(\"{}/auth/v2/verify\", self.base_url))\n            .json(\u0026body)\n            .send()?;\n        if !resp.status().is_success() {\n            return Ok(None);\n        }\n        let json: VerifyResponse = resp.json()?;\n        if json.access_token.is_empty() {\n            Ok(None)\n        } else {\n            Ok(Some(format!(\"Bearer {}\", json.access_token)))\n        }\n    }\n\n    // =========================================================================\n    // Rotation\n    // =========================================================================\n\n    /// `POST /auth/v2/rotate-batch` — advance from `signer_batch_number` to\n    /// `signer_batch_number + 1` using the 50 fresh keys in `proof`.\n    ///\n    /// Returns `true` iff the server accepted; `false` if it refused (which\n    /// includes stale signer, mismatched batch, revoked identity).\n    ///\n    /// # Errors\n    /// Only the network / TLS / framing kind — server refusals are `Ok(false)`.\n    pub fn rotate_batch(\n        \u0026self,\n        identity_pk_hex: \u0026str,\n        proof: \u0026RotationProof,\n    ) -\u003e Result\u003cbool, ProtocolError\u003e {\n        let body = RotateBody {\n            ed25519_pk: identity_pk_hex.to_string(),\n            signer_batch_number: proof.signer_batch_number,\n            signer_key_index: proof.signer_key_index,\n            signer_public_key: hex::encode(proof.signer_public_key),\n            new_batch_public_keys: proof\n                .new_batch_public_keys\n                .iter()\n                .map(hex::encode)\n                .collect(),\n            new_batch_signature: hex::encode(proof.signature),\n        };\n        let resp = self\n            .http\n            .post(format!(\"{}/auth/v2/rotate-batch\", self.base_url))\n            .json(\u0026body)\n            .send()?;\n        Ok(resp.status().is_success())\n    }\n\n    // =========================================================================\n    // Status\n    // =========================================================================\n\n    /// `GET /auth/v2/status/{pk_hex}` — server-side view of the identity.\n    ///\n    /// Returns `None` on HTTP 404 (identity not enrolled) *and* on any other\n    /// non-2xx (mirrors Kotlin `null` semantics).\n    ///\n    /// # Errors\n    /// See [`ProtocolError`].\n    pub fn get_status(\n        \u0026self,\n        identity_pk_hex: \u0026str,\n    ) -\u003e Result\u003cOption\u003cIdentityStatus\u003e, ProtocolError\u003e {\n        let resp = self\n            .http\n            .get(format!(\n                \"{}/auth/v2/status/{identity_pk_hex}\",\n                self.base_url\n            ))\n            .send()?;\n        if !resp.status().is_success() {\n            return Ok(None);\n        }\n        let status: IdentityStatus = resp.json()?;\n        Ok(Some(status))\n    }\n}\n\n// ============================================================================\n// Wire types — Serialize only (we don't decode our own request bodies).\n// Field order matches Kotlin's `JSONObject.put` order for byte-exact parity\n// with `parity-vectors/protocol/*.json` under `serde_json`'s default\n// struct-ordered emission.\n// ============================================================================\n\n#[derive(Debug, Serialize)]\nstruct EnrollBody {\n    ed25519_pk: String,\n    batch_0_public_keys: Vec\u003cString\u003e,\n    batch_0_signature: String,\n}\n\n#[derive(Debug, Serialize)]\nstruct VerifyBody {\n    ed25519_pk: String,\n    ephemeral_pk: String,\n    batch_number: u32,\n    key_index: u32,\n    nonce: String,\n    timestamp: u64,\n    signature: String,\n}\n\n#[derive(Debug, Serialize)]\nstruct RotateBody {\n    ed25519_pk: String,\n    signer_batch_number: u32,\n    signer_key_index: u32,\n    signer_public_key: String,\n    new_batch_public_keys: Vec\u003cString\u003e,\n    new_batch_signature: String,\n}\n\n#[derive(Debug, Deserialize)]\nstruct ChallengeResponse {\n    nonce: String,\n    timestamp: u64,\n}\n\n#[derive(Debug, Deserialize)]\nstruct VerifyResponse {\n    #[serde(default)]\n    access_token: String,\n}\n\n// ============================================================================\n// Unit tests — byte-exact parity of request bodies against captured fixtures.\n// E2E tests live in `tests/e2e_protocol.rs` and are `#[ignore]`d by default.\n// ============================================================================\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn enroll_body_matches_kotlin_fixture() {\n        // Fixture: crypto-rs/parity-vectors/protocol/enroll_req.json\n        let identity_hex = \"f373b6de310a66e4b4f0e1ab355c89446762b59b47895d2d42ecfa5ed8d36920\";\n        let batch_keys_hex = [\n            \"7e8650d32c0d2797e22f8070711abdc6ddeb4e98ea1e0848f250ba845f3a17f5\",\n            \"17e0116700e346955a96e84617c70662ecef062105d427c6ebff6f319636430a\",\n        ];\n        let mut keys = [[0u8; 32]; BATCH_SIZE];\n        keys[0].copy_from_slice(\u0026hex::decode(batch_keys_hex[0]).unwrap());\n        keys[1].copy_from_slice(\u0026hex::decode(batch_keys_hex[1]).unwrap());\n        // Slots 2..50 remain zero for this shape-only test.\n        let sig = [0u8; 64];\n\n        let body = EnrollBody {\n            ed25519_pk: identity_hex.to_string(),\n            batch_0_public_keys: keys.iter().map(hex::encode).collect(),\n            batch_0_signature: hex::encode(sig),\n        };\n        let json = serde_json::to_string(\u0026body).unwrap();\n        let parsed: serde_json::Value = serde_json::from_str(\u0026json).unwrap();\n        assert_eq!(parsed[\"ed25519_pk\"], identity_hex);\n        assert_eq!(parsed[\"batch_0_public_keys\"][0], batch_keys_hex[0]);\n        assert_eq!(parsed[\"batch_0_public_keys\"][1], batch_keys_hex[1]);\n        assert_eq!(parsed[\"batch_0_signature\"], hex::encode([0u8; 64]));\n        // 50 entries total, even zeroed tail slots included.\n        assert_eq!(parsed[\"batch_0_public_keys\"].as_array().unwrap().len(), 50);\n    }\n\n    #[test]\n    fn verify_body_shape_matches_fixture() {\n        // Shape-only test post-S9: the Kotlin fixture verify_req.json predates\n        // the timestamp field, so we no longer byte-compare — we just make\n        // sure every expected field is present on the wire.\n        let body = VerifyBody {\n            ed25519_pk: \"f373b6de310a66e4b4f0e1ab355c89446762b59b47895d2d42ecfa5ed8d36920\".into(),\n            ephemeral_pk: \"7e8650d32c0d2797e22f8070711abdc6ddeb4e98ea1e0848f250ba845f3a17f5\"\n                .into(),\n            batch_number: 0,\n            key_index: 0,\n            nonce: \"0\".repeat(64),\n            timestamp: 1_744_567_890,\n            signature: \"d3e87bfdaf807a39e7f3d824b76d38589899a73ccc50adf73884c535cfc626aee22f8cc31fa1032e3d7733c8aa20fe9cf96db1f292b86512280b8d7cebf0f207\".into(),\n        };\n        let json = serde_json::to_value(\u0026body).unwrap();\n        for key in [\n            \"ed25519_pk\",\n            \"ephemeral_pk\",\n            \"batch_number\",\n            \"key_index\",\n            \"nonce\",\n            \"timestamp\",\n            \"signature\",\n        ] {\n            assert!(json.get(key).is_some(), \"missing field {key}\");\n        }\n        assert_eq!(json[\"batch_number\"], 0);\n        assert_eq!(json[\"key_index\"], 0);\n        assert_eq!(json[\"timestamp\"], 1_744_567_890u64);\n    }\n\n    #[test]\n    fn challenge_value_message_bytes_is_nonce_concat_ts_be() {\n        let nonce = [0x11u8; 32];\n        let ts: u64 = 0x0102_0304_0506_0708;\n        let cv = ChallengeValue {\n            nonce,\n            timestamp: ts,\n        };\n        let bytes = cv.message_bytes();\n        assert_eq!(\u0026bytes[..32], \u0026nonce);\n        assert_eq!(\u0026bytes[32..], \u0026ts.to_be_bytes());\n    }\n\n    #[test]\n    fn rotate_body_shape_matches_fixture() {\n        // Fixture: crypto-rs/parity-vectors/protocol/rotate_req.json\n        let keys: Vec\u003cString\u003e = (0..BATCH_SIZE)\n            .map(|i| hex::encode([u8::try_from(i).unwrap_or(0); 32]))\n            .collect();\n        let body = RotateBody {\n            ed25519_pk: \"f373b6de310a66e4b4f0e1ab355c89446762b59b47895d2d42ecfa5ed8d36920\".into(),\n            signer_batch_number: 0,\n            signer_key_index: 1,\n            signer_public_key: \"17e0116700e346955a96e84617c70662ecef062105d427c6ebff6f319636430a\"\n                .into(),\n            new_batch_public_keys: keys,\n            new_batch_signature: hex::encode([0u8; 64]),\n        };\n        let json = serde_json::to_value(\u0026body).unwrap();\n        for key in [\n            \"ed25519_pk\",\n            \"signer_batch_number\",\n            \"signer_key_index\",\n            \"signer_public_key\",\n            \"new_batch_public_keys\",\n            \"new_batch_signature\",\n        ] {\n            assert!(json.get(key).is_some(), \"missing field {key}\");\n        }\n        assert_eq!(json[\"new_batch_public_keys\"].as_array().unwrap().len(), 50);\n    }\n\n    #[test]\n    fn identity_status_deserializes() {\n        let raw = r#\"{\n            \"batch_number\": 3,\n            \"consumed_count\": 7,\n            \"remaining_count\": 43,\n            \"enrolled_at\": 1744567890,\n            \"revoked\": false\n        }\"#;\n        let parsed: IdentityStatus = serde_json::from_str(raw).unwrap();\n        assert_eq!(parsed.batch_number, 3);\n        assert_eq!(parsed.consumed_count, 7);\n        assert_eq!(parsed.remaining_count, 43);\n        assert_eq!(parsed.enrolled_at, 1_744_567_890);\n        assert!(!parsed.revoked);\n    }\n\n    #[test]\n    fn challenge_response_deserializes() {\n        let raw = r#\"{\"nonce\":\"deadbeef\",\"timestamp\":1744567890}\"#;\n        let parsed: ChallengeResponse = serde_json::from_str(raw).unwrap();\n        assert_eq!(parsed.nonce, \"deadbeef\");\n        assert_eq!(parsed.timestamp, 1_744_567_890);\n    }\n\n    #[test]\n    fn verify_response_missing_token_defaults_empty() {\n        let raw = \"{}\";\n        let parsed: VerifyResponse = serde_json::from_str(raw).unwrap();\n        assert!(parsed.access_token.is_empty());\n    }\n}\n","traces":[{"line":87,"address":[1888192],"length":1,"stats":{"Line":3}},{"line":88,"address":[1672407],"length":1,"stats":{"Line":3}},{"line":89,"address":[1672424],"length":1,"stats":{"Line":3}},{"line":90,"addr
