# Frappuccino relay: UDP buffers for the QUIC front (Caddy/quic-go) and the
# Salamander de-obfuscation proxy. Installed at /etc/sysctl.d/ on the relay
# and applied with `sysctl -p /etc/sysctl.d/90-frappuccino-udp.conf`.
#
# With Ubuntu's defaults (about 208 KiB), quic-go warns at startup that it
# cannot get the receive buffer it asks for, and the kernel counted UDP
# datagrams dropped for a full receive buffer (RcvbufErrors in
# /proc/net/snmp). The maximums follow quic-go's recommendation; the defaults
# matter for the de-obfuscation proxy, which receives the phones' packets
# first and does not ask for a size of its own.
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000
net.core.rmem_default = 2500000
net.core.wmem_default = 2500000
