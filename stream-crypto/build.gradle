plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'org.stream.crypto'
    compileSdk versions.compileSdk

    defaultConfig {
        minSdkVersion versions.minSdk
        targetSdkVersion versions.targetSdk
        consumerProguardFiles "consumer-rules.pro"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    // S8c.1 — UniFFI Kotlin bindings (generated by crypto-rs/build-android.sh
    // → stream-crypto/build/generated/source/uniffi/debug/java/). Compiled as
    // part of the library and re-exported to downstream consumers.
    sourceSets {
        main.java.srcDirs += layout.buildDirectory.dir("generated/source/uniffi/debug/java").get().asFile
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$versions.kotlin"
    // S8c.5 — `com.goterl:lazysodium-android` retiré : plus aucun consommateur
    // Kotlin. Toute la crypto passe par UniFFI (Rust pur via JNA 5.14).
    // S8c.1 — UniFFI bindings need JNA at runtime (Pointer, Structure).
    // `api` (not `implementation`) so the transitive consumer (`mobile`) sees
    // the same JNA classpath without having to re-declare.
    api 'net.java.dev.jna:jna:5.14.0@aar'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation "com.jakewharton.timber:timber:$versions.timber"
    // Phase 5 — :tella-vault retire de la dep. Plus aucun import
    // tella_vault dans le code stream-crypto (les commentaires historiques
    // mentionnant VaultFile concernent du code supprime en S8c.3).

    // CameraX for StreamChunkCapture
    implementation "androidx.camera:camera-video:$versions.camerax"
    implementation "androidx.camera:camera-view:$versions.camerax"

    // Phase 3 — JVM unit tests for AdaptiveQualityManager + StreamQuality
    // (pure-Kotlin, no Android dependency on the test classpath).
    testImplementation "junit:junit:$versions.junit"

    // Instrumented tests (lazysodium needs JNI → androidTest, not test)
    androidTestImplementation "junit:junit:$versions.junit"
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
